category: llm
level: 2
short: "2017 年 Google 提出、以注意力機制為核心的神經網路架構，是 GPT、Claude 等 LLM 的共同基礎。"
definition: "Transformer 是 Google 研究人員在 2017 年論文《Attention Is All You Need》提出的神經網路架構，完全以注意力機制取代過去主流的循環神經網路（RNN）與卷積結構，讓整段序列可以平行計算。論文中的模型在 8 顆 GPU 上訓練 3.5 天，就在 WMT 2014 英法翻譯創下單一模型最佳成績（BLEU 41.8）。可平行化的特性讓 Transformer 能充分利用 GPU 的大量運算單元，也讓「投入更多資料與算力就更強」的規模化路線成為可能；GPT 中的 T 即指 Transformer。它的矩陣乘法與注意力運算，正是 GPU、TPU 等 AI 加速器最佳化的主要對象。"
example: "舊式 RNN 像一個字一個字依序朗讀的人；Transformer 像一眼掃過整頁、同時看出每個字之間關係的讀者，而且可以多人分工一起讀。"
