  - "AI 代理人"
  - "代理人"
  - "智慧代理"
  - "Agentic AI"
  - "代理式 AI"
category: llm
level: 1
short: "能自行規劃步驟、呼叫工具並反覆執行直到完成目標的 AI 系統，而不只是一問一答。"
definition: "AI Agent（AI 代理人）是以語言模型為核心，能根據目標自行決定下一步、呼叫外部工具（搜尋、程式執行、資料庫、瀏覽器），並依結果調整計畫的系統。Anthropic 在 2024 年 12 月的工程文章中區分兩種設計：「工作流程」是由預先寫好的程式路徑串接模型與工具；「Agent」則由模型動態主導自己的流程與工具使用。由於一次任務往往需要多輪呼叫模型，Agent 的 Token 消耗遠高於單次問答：Anthropic 在 2025 年 6 月的文章指出，依其資料，Agent 使用的 Token 通常約為一般聊天的 4 倍，多 Agent 系統約為 15 倍。Agent 因此被視為推升推論算力需求的重要力量，也帶動 MCP、A2A 等連接標準與 Agent 開發框架。"
example: "請 AI 安排出差行程時，Agent 會自己查航班、比價、核對行事曆，遇到客滿就換班次，最後只把結果交給你確認。"
