term: "機櫃"
zh: "伺服器機櫃"
en: "Rack"
aliases:
  - "機架"
  - "伺服器機架"
  - "19 吋機櫃"
  - "Server Rack"
  - "Cabinet"
  - "Open Rack"
category: datacenter
level: 1
short: >-
  放置伺服器、交換器與電源的標準化金屬架，高度以「U」計算，是資料中心規劃的基本單位。
definition: >-
  機櫃是資料中心裡用來安裝伺服器、網路交換器、電源與配電設備的標準化框架。最常見的是 19 吋機櫃（依 EIA-310 與 IEC 60297 規範），高度以「U」計算，1U 等於 44.45 公釐，業界常見的整櫃高度是 42U；開放運算計畫（OCP）的 Open Rack 則把內部可用寬度加大到約 21 吋。到了 AI 時代，機櫃已從「放設備的架子」變成一台完整的系統：例如 NVIDIA GB200 NVL72 把 72 顆 GPU 與 36 顆 Grace CPU 整合在同一個採液冷設計的機櫃中，通常由伺服器代工廠在出貨前完成整櫃組裝與測試。機櫃級整合因此成為伺服器供應鏈的重要價值所在，也讓機房的電力與散熱規劃改以「每櫃多少 kW」來思考。
example: >-
  機櫃就像圖書館的書架：每一格的高度都有固定規格（1U），伺服器像一本本厚薄不同的書，依需要佔用 1U、2U 或更多格。
