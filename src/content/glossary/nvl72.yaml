term: "NVL72"
zh: "機櫃級 GPU 系統"
en: "NVL72 Rack-scale System"
aliases:
  - "GB200 NVL72"
  - "GB300 NVL72"
  - "Vera Rubin NVL72"
  - "機櫃級系統"
  - "整櫃式 AI 伺服器"
  - "Rack-scale System"
category: hardware
level: 2
short: "輝達把 72 顆 GPU 與 36 顆 CPU 裝進同一個液冷機櫃、以 NVLink 連成「一顆超大 GPU」的整櫃系統。"
definition: "NVL72 是輝達機櫃級 AI 系統的名稱，數字代表同一個 NVLink 網域內的 GPU 數量。以 GB200 NVL72 為例，一櫃包含 36 顆 Grace CPU 與 72 顆 Blackwell GPU，GPU 之間透過 NVLink 交換器全互連，總頻寬 130 TB/s，合計 13.4 TB HBM3E，採液冷設計，NVFP4 算力達 1,440 PFLOPS（計入稀疏加速；密集為 720 PFLOPS）。由於 72 顆 GPU 能像一顆超大 GPU 般共享資料，輝達主打它適合兆級參數模型的即時推論。後續的 GB300 NVL72 與 Vera Rubin NVL72（72 顆 Rubin GPU、36 顆 Vera CPU）沿用相同概念；輝達在 2026 年 8 月表示，Vera Rubin 平台已進入全面量產爬坡。NVL72 讓 AI 伺服器從「賣一台機器」變成「賣一整櫃」，帶動液冷、電源、銅纜與 L11 整櫃組裝的需求，台灣伺服器廠是主要的製造夥伴。"
example: "過去買 AI 算力像買一台台獨立的冷氣機，各自運轉；NVL72 則像整棟大樓的中央空調，所有管線在出廠前就配好，整套運進機房、接上水電就能使用。"
