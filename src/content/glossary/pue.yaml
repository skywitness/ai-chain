term: "PUE"
zh: "電力使用效率"
en: "Power Usage Effectiveness"
aliases:
  - "電力使用效率"
  - "電能使用效率"
  - "電源使用效率"
  - "Power Usage Effectiveness"
  - "PUE 值"
category: datacenter
level: 2
short: >-
  資料中心總用電除以 IT 設備用電的比值，越接近 1，代表花在散熱與配電上的電越少。
definition: >-
  PUE 由綠色網格（The Green Grid）於 2007 年推廣，2016 年納入 ISO/IEC 30134-2 標準，計算方式是「資料中心總耗電 ÷ IT 設備耗電」。理想值為 1.0，代表所有電力都用在運算；PUE 2.0 則表示每 1 瓦 IT 用電，還要另外花 1 瓦在冷卻與配電上。Google 引述 Uptime Institute 2025 年調查，受訪資料中心的平均 PUE 約為 1.54；Google 自家全球機群 2025 年的全年平均 PUE 則為 1.09。對 AI 產業來說，在電力取得受限的情況下，PUE 越低，同樣的電網容量就能分給越多 GPU。不過 PUE 只衡量設施的「額外負擔」，不反映 IT 設備本身是否有效率，也會受氣候與負載率影響，不適合單獨拿來比較不同地區的機房。
example: >-
  一座 IT 負載 100 MW、PUE 1.5 的資料中心，總用電約 150 MW；若 PUE 改善到 1.2，同樣 150 MW 的電力就能支撐約 125 MW 的 IT 設備。
