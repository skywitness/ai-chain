term: "XPU"
zh: "客製化 AI 加速器"
en: "Custom Accelerator (XPU)"
aliases:
  - "客製化加速器"
  - "客製 AI 晶片"
  - "自研 AI 晶片"
  - "Custom XPU"
  - "Custom AI Accelerator"
category: hardware
level: 2
short: "業界對「為單一大客戶量身打造的 AI 加速器」的泛稱，例如 Google TPU、Meta MTIA 與 OpenAI 自研晶片。"
definition: "XPU 是半導體業界（尤其是博通）用來泛稱各種客製化加速器的說法：X 可代表任何一種處理器，重點在於晶片是為單一大客戶的工作負載量身設計，而不是公開販售的通用 GPU（英特爾也曾用 XPU 泛指 CPU、GPU、FPGA 等多種處理器，意思不同）。典型分工是雲端或 AI 公司定義架構與需求，博通、邁威爾或世芯、創意等設計夥伴負責實體設計、SerDes 等矽智財與封裝整合，再交由台積電製造。例子包括 Google TPU、Meta MTIA 與 AWS Trainium；2025 年 10 月，OpenAI 也宣布與博通合作部署 10 GW 由 OpenAI 自行設計的加速器，預計 2026 年下半年開始部署、2029 年底前完成。XPU 的吸引力在於降低每個 Token 的成本並分散對輝達的依賴。博通 FY2026 第三季（截至 2026 年 8 月 2 日）AI 半導體營收 167 億美元、年增 221%，並預估第四季達 217 億美元。"
example: "買現成的通用 GPU 像租用連鎖健身房，器材齊全、誰都能用；XPU 像替自己的訓練菜單量身打造私人健身房，前期投資大，但每一次使用都更有效率。"
