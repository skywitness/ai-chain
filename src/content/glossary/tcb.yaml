term: "TCB"
zh: "熱壓鍵合"
en: "Thermo-Compression Bonding"
aliases:
  - "熱壓接合"
  - "Thermo-Compression Bonding"
  - "TC Bonding"
  - "TC Bonder"
  - "熱壓合"
category: "packaging"
level: 3
short: "一邊加熱、一邊加壓，把帶有微凸塊的晶粒逐顆精準壓合的接合技術，是目前 HBM 堆疊的主力。"
definition: "TCB 用可快速升降溫的接合頭把晶粒對準後壓到下層晶粒或基板上，同時施加溫度與壓力讓金屬凸塊接合。它逐顆局部加熱加壓，比整批送進回焊爐的傳統覆晶製程更能控制翹曲與對位，因此成為 HBM 多層 DRAM 堆疊的主流方法，也用於小晶片與中介層封裝的晶粒接合；SK 海力士的技術專文將 TCB 依做法分為 TC-NCF、MR-MUF 等類型。設備精度要求極高，以荷蘭 Besi 的 TC 接合機為例，接合頭溫度可達 450°C、XY 對位精度 0.5 微米（3σ）。TCB 的極限在於間距約 7 微米以下時，熱膨脹差異造成的變形與應力難以控制，業界正以無助焊劑（flux-free）TCB 延長其壽命，更細的間距則預期交棒給混合鍵合。韓國韓美半導體（Hanmi）等業者則供應 HBM 生產用的 TC 接合機。"
example: "像在衣服上燙貼布：對準位置後，一塊一塊加熱加壓壓牢，比整件丟進烘乾機（回焊爐）更不容易起皺變形。"
