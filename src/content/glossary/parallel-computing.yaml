term: "平行運算"
zh: "平行運算"
en: "Parallel Computing"
aliases:
  - "平行計算"
  - "並行運算"
  - "平行處理"
  - "Parallel Computing"
  - "Parallel Processing"
category: hardware
level: 1
short: "把一個大工作拆成許多小份，交給很多運算單元同時處理，以縮短完成時間的運算方式。"
definition: "平行運算是把問題拆解成可以同時進行的子任務，分配給多個處理器或核心一起計算。它有幾個層次：單顆晶片內的成千上萬個核心（例如輝達 H100 SXM 版 GPU 有 16,896 個 FP32 核心）、一台伺服器內的多顆 GPU，以及資料中心裡由數萬顆 GPU 組成的叢集。深度學習特別適合平行運算，因為大部分工作是矩陣乘法，各元素的計算彼此獨立。AI 產業鏈中許多環節都在解決平行化的瓶頸：晶片內靠更多核心與更高的 HBM 頻寬，晶片之間靠 NVLink、乙太網路與 InfiniBand 等互連，軟體則靠資料平行、張量平行等切分方法，讓成千上萬顆晶片能協同訓練同一個模型。"
example: "批改 1,000 份考卷，一位老師要改好幾天；分給 100 位老師同時改，一個下午就能完成。但如果每份考卷都得等上一份的結果才能改，人再多也沒用，這就是有些工作難以平行化的原因。"
