term: "晶粒"
zh: "晶粒"
en: "Die"
aliases:
  - "Die"
  - "Dies"
  - "裸晶"
  - "裸晶片"
category: "semiconductor"
level: 1
short: "晶圓切割後的一小塊矩形電路，也就是封裝前的「裸晶片」；一片晶圓可切出數十到上千顆。"
definition: "晶粒是晶圓完成製造後，沿著切割道切下的一小塊矩形電路，也就是尚未封裝的「裸晶片」。一片晶圓能切出多少晶粒，取決於晶粒面積：物聯網等小型晶片只有幾十平方毫米，一片 12 吋晶圓可切出上千顆；AI GPU 的晶粒則逼近單次曝光的上限，若以 800 平方毫米代入常見的晶粒數估算公式（已扣除晶圓邊緣損失）粗估，一片晶圓只能切出約 60 多顆，扣掉有瑕疵的就更少。因此大晶粒的成本與良率壓力特別大，也促使業界把一顆大晶片拆成多顆晶粒，再用先進封裝接在一起；例如輝達資料中心用的 Blackwell GPU 就由兩顆晶粒組成，以每秒 10 TB 的晶片間連結合為一顆 GPU。"
example: "晶圓像一整盤剛烤好的方格鬆餅，切開後的每一小塊就是一顆晶粒；每塊切得越大，一盤能分到的塊數就越少。"
