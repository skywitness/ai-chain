term: "人工智慧基本法"
zh: "台灣人工智慧基本法"
en: "Taiwan AI Basic Act"
aliases:
  - "人工智慧基本法"
  - "AI 基本法"
  - "台灣 AI 基本法"
  - "Taiwan AI Basic Act"
  - "Artificial Intelligence Basic Act"
category: "policy"
level: 2
short: "台灣 2026 年 1 月公布施行的 AI 框架性法律，訂出七項原則，主管機關為國科會。"
definition: "《人工智慧基本法》在 2025 年 12 月 23 日經立法院三讀通過，2026 年 1 月 14 日公布，全文 20 條，自公布日施行，中央主管機關為國家科學及技術委員會（國科會）。它是框架性法律，揭示永續發展與福祉、人類自主、隱私保護與資料治理、資安與安全、透明與可解釋、公平與不歧視、問責七項原則；要求行政院成立由院長召集的國家人工智慧戰略特別委員會，並由數位發展部參考國際標準，推動與國際接軌的 AI 風險分類框架。各機關須在施行後兩年內，完成相關法規的制定、修正或廢止。基本法本身沒有罰則，對產業的實際影響主要來自後續各部會依風險訂定的管理規範，以及政府對 AI 研發、算力與資料開放的預算與政策承諾。"
example: "基本法像是一份「AI 政策的總綱」：它不直接規定某個聊天機器人該怎麼做，而是要求各部會依照原則，在兩年內檢討並修訂主管法規，再由金融、醫療、交通等主管機關訂定以風險為基礎的管理規範。"
