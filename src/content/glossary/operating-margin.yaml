term: "營業利益率"
zh: "營業利益率"
en: "Operating Margin"
aliases:
  - "營益率"
  - "營業利潤率"
  - "Operating Margin"
  - "Operating Profit Margin"
  - "OPM"
category: "cloud-business"
level: 1
short: "營收扣掉生產成本，再扣研發、行銷與管理費用後的獲利比例，反映本業的經營效率。"
definition: "營業利益率 = 營業利益 ÷ 營收。營業利益是毛利再扣除研發、銷售與管理等營業費用後的本業獲利，不含業外收支與所得稅。毛利率和營業利益率之間的差距，大致就是營業費用佔營收的比重。例如台積電 2026 年第二季毛利率 67.7%、營業利益率 60.3%，兩者相差 7.4 個百分點；Amazon 的 AWS 部門同季營收 422 億美元、營業利益 166 億美元，營業利益率約 39%。AI 公司研發支出龐大，加上資本支出帶來的折舊逐年增加，都可能壓縮營業利益率，因此它是觀察 AI 投資能否回收的重要指標。"
example: "手搖飲店每杯毛利 40 元，再扣掉店租、店員薪水與廣告，每杯剩 12 元，營業利益率就是 20%。"
