term: "FP8"
zh: "8 位元浮點數"
en: "8-bit Floating Point"
aliases:
  - "8 位元浮點數"
  - "FP8 精度"
  - "E4M3"
  - "E5M2"
  - "8-bit Floating Point"
category: hardware
level: 2
short: "只用 8 個位元表示一個數字的浮點格式，比 16 位元省一半記憶體與頻寬，廣泛用於 AI 訓練與推論。"
definition: "FP8 是以 8 個位元存放一個浮點數的格式。相較主流的 16 位元格式（FP16、BF16），它的記憶體用量與資料搬運量都減半，晶片的運算吞吐量也隨之提高。2022 年輝達、Arm、英特爾的研究者共同提出兩種編碼：E4M3（4 位元指數、3 位元尾數，最大值 448，建議用於權重與激勵值）與 E5M2（5 位元指數、2 位元尾數，最大值 57,344，範圍較大，建議用於梯度），實驗顯示訓練結果可與 16 位元相當。2024 年底發表的 DeepSeek-V3 技術報告則表示，團隊首度在超大規模模型上驗證 FP8 混合精度訓練的可行性；其對照實驗中，FP8 訓練相對 BF16 基準的損失相對誤差始終低於 0.25%。新一代 AI 晶片普遍在硬體上支援 FP8，它已成為衡量晶片算力時最常引用的精度之一。"
example: "就像把照片從無損格式改存成壓縮格式：檔案小一半、傳得更快，只要壓縮方法得當，肉眼幾乎看不出差別。"
