term: "SST"
zh: "固態變壓器"
en: "Solid-State Transformer"
aliases:
  - "固態變壓器"
  - "電力電子變壓器"
  - "PET"
  - "Power Electronic Transformer"
  - "Solid State Transformer"
  - "MVSST"
category: energy
level: 3
short: "以功率半導體搭配高頻變壓器取代傳統鐵心變壓器的電力轉換設備，可把中壓交流電直接轉成 800 V 直流。"
definition: "傳統變壓器在 50／60 Hz 的電網頻率下工作，體積大、重量重，而且只能改變交流電壓。固態變壓器（SST，又稱電力電子變壓器）先用功率半導體把電整流、切換到高頻，再經過小型高頻變壓器隔離與變壓，因此體積更小，還能主動調節電壓與電流，並直接輸出直流電。這正好符合 AI 機房轉向 800 V 直流的需求：輝達（NVIDIA）的 800 VDC 架構規劃在資料中心邊界把 13.8 kV 中壓交流直接轉成 800 V 直流，並與合作夥伴評估傳統變壓器與 SST 兩種路線的成本與安全性。2026 年 9 月，英飛凌（Infineon）與伊頓（Eaton）宣布合作：伊頓的中壓固態變壓器平台 MVSST 2.0 將採用英飛凌的碳化矽（SiC）功率元件，鎖定 800 V 直流資料中心配電架構。SST 目前仍屬新興技術，可靠度、絕緣與突波耐受能力，以及成本，是普及前的主要挑戰。"
example: "傳統變壓器像一台沉重的機械式變速箱，只能固定換檔；固態變壓器則像電子控制的變速系統，體積小、能即時調整，還能直接輸出直流電。"
