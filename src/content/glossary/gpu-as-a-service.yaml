term: "GPUaaS"
zh: "GPU 即服務"
en: "GPU as a Service"
aliases:
  - "GPU 即服務"
  - "GPU 租賃"
  - "算力租賃"
  - "GPU as a Service"
category: "cloud-business"
level: 2
short: "按小時或以長約出租 GPU 算力，客戶不必自己買晶片、蓋機房，就能訓練或部署 AI 模型。"
definition: "GPU 即服務（GPUaaS）是雲端業者把 GPU 伺服器與高速網路打包出租的商業模式，常見方案有隨需（按 GPU 小時計費）、預留（簽訂多年期合約）與競價型。以 Lambda 官網公開價格為例，8 卡 NVIDIA H100 SXM 執行個體每顆 GPU 每小時 3.99 美元，8 卡 B200 為 6.69 美元（未稅）；一台 8 卡 H100 伺服器用滿一天約 766 美元。對業者來說，獲利取決於 GPU 使用率、租金能否在設備耐用年限內回收購置成本，以及借款利息高低；對客戶來說，則是用營運費用取代一次投入的龐大資本支出。超大規模業者與新雲都提供這類服務。"
example: "像租車而不是買車：短程叫計程車（隨需），長期通勤就簽長期租賃（預留），都不必自己負擔保養與折舊。"
