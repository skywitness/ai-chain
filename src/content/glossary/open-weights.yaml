term: "開放權重"
zh: "開放權重模型"
en: "Open-weight Model"
aliases:
  - "開放權重"
  - "開放權重模型"
  - "Open-weight Model"
  - "Open Weights"
  - "開源模型"
category: llm
level: 1
short: "公開訓練完成的模型權重，任何人可下載、自行部署與微調；但不一定公開訓練資料與程式碼。"
definition: "開放權重模型是指開發者公開模型參數（權重），讓使用者下載後在自己的伺服器或電腦上執行與微調，例如 Meta 的 Llama、DeepSeek-R1 與 OpenAI 的 gpt-oss。它不等於「開源」：開放原始碼促進會（OSI）的開源 AI 定義 1.0 要求同時提供訓練資料的詳細資訊（足以讓專業人士建構實質相當的系統）、完整的訓練與執行程式碼，以及模型參數；授權條件也各有不同，例如 Llama 3.1 授權規定，月活躍用戶超過 7 億的企業須另向 Meta 申請授權。開放權重降低了企業與主權 AI 的導入門檻，也讓推論需求分散到更多雲端、新雲與地端硬體。"
example: "封閉模型像只能在餐廳吃的招牌菜；開放權重像公開了成品配方，你可以在自家廚房照做、調整口味，但不一定知道食材從哪裡採購。"
