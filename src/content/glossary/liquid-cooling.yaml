term: "液冷"
zh: "液體冷卻"
en: "Liquid Cooling"
aliases:
  - "液體冷卻"
  - "水冷"
  - "液冷散熱"
  - "Liquid Cooling"
category: datacenter
level: 1
short: >-
  用水或特殊液體把晶片的熱帶走，散熱能力遠勝風扇吹氣，是高功耗 AI 伺服器的必備技術。
definition: >-
  液冷是以液體取代空氣來帶走熱量。Google 指出，在相同溫差下，水單位體積可帶走的熱量約為空氣的 4,000 倍，熱傳導率約為空氣的 30 倍。當 AI 加速器的單顆功耗從約 100 W 增加到超過 1,000 W，傳統氣冷的風扇與散熱鰭片已難以應付，液冷因此從超級電腦的利基技術變成 AI 資料中心的主流。主要做法有兩類：冷板式直接液冷（冷卻液流過貼在晶片上的金屬冷板）與浸沒式冷卻（整台伺服器泡在不導電液體中）。Google 自 2018 年的 TPU v3 起就採用液冷，NVIDIA GB200 NVL72 也是採液冷設計的機櫃。液冷帶動冷板、快接頭、分歧管、CDU 與冷卻水塔等設備的需求，成為散熱供應鏈的成長重點。
example: >-
  就像電腦玩家「水冷散熱」的放大版：熱先傳到貼在晶片上的冷板，再由循環的冷卻液帶到機房外散掉，比用電風扇猛吹有效率得多。
