# 名詞：AGI（agi）· 分類 ai-basics · 資料基準日 2026-10-06
term: "AGI"
zh: "通用人工智慧"
en: "Artificial General Intelligence"
aliases:
  - "通用人工智慧"
  - "Artificial General Intelligence"
  - "通用 AI"
category: "ai-basics"
level: 1
short: "能像人一樣處理各種任務、而不只擅長單一工作的 AI。目前沒有公認定義，也尚未被公認實現。"
definition: "AGI（通用人工智慧）指在廣泛任務上達到或超越人類水準、並能學習新事物的 AI，相對於只擅長特定任務的「狹義 AI」。它沒有統一定義：OpenAI 在 2018 年的章程中將其定義為「在多數具經濟價值的工作上勝過人類的高度自主系統」；Google DeepMind 在 2023 年的論文中，則提出依能力的「表現深度」與「通用廣度」分級的框架。AGI 不只是學術概念，也被寫進商業合約：微軟與 OpenAI 在 2025 年 10 月公布的新協議規定，OpenAI 宣布達成 AGI 後須經獨立專家小組驗證，並連動微軟部分智慧財產權的期限。AGI 是多家前沿實驗室公開宣示的目標，也常被用來說明超大規模算力投資的理由。"
example: "一個 AGI 系統理論上可以今天幫你整理報稅資料、明天學會一門新語言、後天設計實驗，而不必為每件事另外訓練一個模型。"
