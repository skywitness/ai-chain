term: "頻寬"
zh: "頻寬"
en: "Bandwidth"
aliases:
  - "Bandwidth"
  - "帶寬"
  - "傳輸頻寬"
  - "資料傳輸率"
  - "Data Rate"
category: networking
level: 1
short: "單位時間內能傳送的資料量，就像水管的粗細；AI 叢集裡晶片之間的頻寬常決定整體速度。"
definition: "頻寬指一條連線在單位時間內最多能傳送多少資料。網路設備通常以每秒位元（Gb/s、Tb/s）標示，晶片互連則常以每秒位元組（GB/s、TB/s）標示，1 位元組等於 8 位元，閱讀規格時要先分清楚。AI 訓練與推論需要成千上萬顆 GPU 不斷交換資料，頻寬不足時 GPU 只能閒置等待，因此頻寬是網通與光通訊環節最核心的規格之一。以輝達（NVIDIA）為例，Blackwell 世代每顆 GPU 的 NVLink 頻寬為 1,800 GB/s，Vera Rubin 世代提升到 3,000 GB/s；相比之下，一張 800 Gb/s 的 ConnectX-8 網卡換算約為 100 GB/s。頻寬和延遲是兩回事：頻寬像道路有幾線道，延遲像單趟要開多久。"
example: "家用網路方案寫的「500M」通常指 500 Mb/s，約等於每秒 62.5 MB；下載一部 5 GB 的影片，理論上約需 80 秒。"
