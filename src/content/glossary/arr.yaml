term: "ARR"
zh: "年化經常性營收"
en: "Annual Recurring Revenue"
aliases:
  - "年化經常性營收"
  - "年度經常性收入"
  - "年化營收"
  - "Run-rate Revenue"
  - "Annual Recurring Revenue"
  - "Run Rate"
category: "cloud-business"
level: 2
short: "把目前固定的月收入乘以 12 換算成一年的金額，用來衡量軟體與 AI 公司的營收規模與成長速度。"
definition: "ARR 原本是 SaaS 業界的指標，指訂閱合約在一年內可帶來的經常性收入。AI 公司常改用「年化營收」（run-rate revenue），也就是把最近一段期間的收入換算成全年，其中包含依 Token 用量計費、波動較大的 API 收入。這些數字不是經會計師查核的財報營收，各公司定義也不同，但能即時反映成長速度。例如 Anthropic 在 2025 年 9 月表示，年化營收從 2025 年初約 10 億美元增至 8 月逾 50 億美元；2026 年 2 月再宣布年化營收達 140 億美元，其中 Claude Code 逾 25 億美元。解讀時要記得：ARR 不等於已經入帳的年度營收。"
example: "健身房有 1,000 位會員、每人月費 1,500 元，ARR 就是 1,800 萬元；但若會員下個月大量退會，這個數字就會跟著下修。"
