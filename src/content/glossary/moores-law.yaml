term: "摩爾定律"
zh: "摩爾定律"
en: "Moore's Law"
aliases:
  - "Moore's Law"
  - "摩爾法則"
  - "超越摩爾"
  - "More than Moore"
category: "semiconductor"
level: 1
short: "晶片上電晶體數量大約每兩年翻倍的經驗法則，是半導體產業數十年來的進步節奏。"
definition: "摩爾定律源自 Gordon Moore 的觀察。他在 1965 年 4 月（當時擔任快捷半導體研發主管）於《Electronics》雜誌的文章中指出，單一晶片上的元件數量大約每年翻倍；1975 年（當時已共同創辦英特爾）再修正為「約每兩年翻倍」。它不是物理定律，而是整個產業共同追逐的目標，推動了數十年的微縮與成本下降。近年單靠縮小電晶體愈來愈貴、愈來愈難，AI 晶片的效能成長更依賴新電晶體結構（GAA）、EUV 微影、把多顆晶粒接在一起的先進封裝，以及系統層級的設計，業界常以「延續摩爾定律」或「超越摩爾」（More than Moore）來形容這些方向。"
example: "像是城市每兩年就要在同一塊地上多住一倍的人：早期靠把房子蓋得更小，現在則改蓋高樓（立體堆疊），或用空橋把幾棟樓連起來（先進封裝）。"
