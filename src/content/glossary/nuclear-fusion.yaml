term: "核融合"
zh: "核融合發電"
en: "Nuclear Fusion"
aliases:
  - "核融合發電"
  - "核聚變"
  - "融合能"
  - "Fusion Power"
  - "Fusion Energy"
category: energy
level: 2
short: "讓輕原子核在上億度高溫下結合並釋放能量，原理和太陽相同；尚未商轉，但科技大廠已預簽購電合約。"
definition: "核融合是把氫的同位素（氘與氚）加熱到約 1 億度以上，使其成為電漿，讓原子核結合並放出巨大能量；它和核電廠使用的核分裂（把重原子核分裂）正好相反。最大難題是「產出的能量必須超過投入」。美國勞倫斯利佛摩國家實驗室（LLNL）的國家點火設施（NIF）在 2022 年 12 月首度達成點火：以 2.05 MJ 的雷射能量產生 3.15 MJ 融合能量；2025 年 4 月更以 2.08 MJ 雷射能量創下 8.6 MJ 的紀錄。但這裡只計算打到靶上的雷射能量，沒有計入驅動雷射所耗用的電力，距離整座電廠淨輸出電力還很遠。即使如此，科技業已提前押注：Google 在 2025 年 6 月宣布，將向 Commonwealth Fusion Systems 規劃於維吉尼亞州興建的首座商用電廠 ARC 購買 200 MW 電力。對 AI 產業而言，核融合是長期選項，短期內無法解決用電缺口。"
example: "太陽每天照到地球的光和熱，都來自核融合；核融合發電等於想在地面上造一顆迷你太陽，並用強力磁場或雷射把它關在「籠子」裡。"
