term: "浸沒式冷卻"
zh: "浸沒式冷卻"
en: "Immersion Cooling"
aliases:
  - "浸沒式液冷"
  - "浸泡式冷卻"
  - "單相浸沒"
  - "兩相浸沒"
  - "Immersion Cooling"
  - "Single-phase Immersion"
  - "Two-phase Immersion"
category: datacenter
level: 2
short: >-
  把整台伺服器泡進不導電的冷卻液裡散熱，可以拿掉風扇，但維修與冷卻液成本較高。
definition: >-
  浸沒式冷卻是把伺服器或整片電路板直接泡在不導電（介電）液體中，讓液體接觸所有元件吸熱。單相浸沒使用合成碳氫化合物或酯類等液體，液體始終維持液態，由泵浦送到熱交換器降溫；兩相浸沒則使用沸點較低的氟化液，液體在晶片表面沸騰汽化，蒸氣在上方冷凝後再滴回槽內，散熱效率更高。浸沒式可以拿掉伺服器風扇、支撐很高的密度，但需要特製的槽體與伺服器，維修時要把設備從液體中吊出，液體成本與重量也較高。兩相方案還面臨環保壓力：這類氟化液多屬 PFAS（全氟與多氟烷基物質），而主要供應商之一 3M 於 2022 年 12 月宣布，將在 2025 年底前退出所有 PFAS 製造。目前大型 AI 機櫃多採冷板式液冷，浸沒式仍屬較小眾的路線。
example: >-
  就像把手機丟進一缸不導電的油裡：熱直接被周圍的液體吸走，完全不需要風扇。
