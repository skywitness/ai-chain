term: "DRAM"
zh: "動態隨機存取記憶體"
en: "Dynamic Random-Access Memory"
aliases:
  - "動態記憶體"
  - "Dynamic RAM"
  - "DDR5"
  - "DDR SDRAM"
category: "memory"
level: 1
short: "電腦與伺服器最常用的主記憶體，用電容存資料、需定期刷新，斷電即消失；HBM 也是由 DRAM 晶粒堆疊而成。"
definition: "DRAM 以「一個電晶體加一個電容」儲存一個位元，結構簡單、密度高、每位元成本低，因此成為電腦、手機與伺服器的主記憶體，常見規格如 DDR5、LPDDR5X。電容會慢慢漏電，資料必須定期刷新，每一列通常要在幾十毫秒內（常見為 64 毫秒）刷新一次；斷電後資料即消失。AI 伺服器除了 GPU 旁由多層 DRAM 晶粒堆疊而成的 HBM，CPU 端也需要大量 DRAM。根據 TrendForce，2026 年第二季全球 DRAM 產業營收約 1,547 億美元，季增 59.5%，三星（39.4%）、SK 海力士（24.9%）與美光（23.3%）合計約佔 88%。"
example: "DRAM 像一排會慢慢漏水的小水桶，必須不停補水（刷新）才能保住內容；但每個水桶構造簡單，可以做得又多又便宜。"
