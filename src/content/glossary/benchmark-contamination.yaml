term: "評測汙染"
zh: "評測資料汙染"
en: "Benchmark Contamination"
aliases:
  - "評測汙染"
  - "評測資料汙染"
  - "資料汙染"
  - "Benchmark Contamination"
  - "Data Contamination"
  - "Test Set Contamination"
category: llm
level: 3
short: "評測題目或答案混進了模型的訓練資料，使分數高估真實能力，就像考生事先看過考卷。"
definition: "評測汙染是指 Benchmark 的題目、答案或高度相似的內容，在網路爬取或資料整理過程中混入模型的訓練資料，導致模型靠「記憶」而非真正的推理拿到高分。2024 年一項研究仿照 GSM8K 小學數學題庫，另外出了一份風格與難度相當的新題庫 GSM1k，發現部分模型的正確率最多下降 8%，且多個模型系列有系統性過度擬合的跡象。為了降低汙染，業界改用定期更新題目的評測（如 LiveBench）、不公開的保留測試集，或由人類即時投票的競技場排名。汙染使單一評測分數難以直接比較，解讀模型宣傳數字時要特別留意。"
example: "如果學測考題在考前流出，背過答案的考生就能拿高分；換一份同難度的新考卷，真實程度才會現形。"
