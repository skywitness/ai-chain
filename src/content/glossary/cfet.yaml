term: "CFET"
zh: "互補式場效電晶體"
en: "Complementary FET"
aliases:
  - "Complementary FET"
  - "堆疊式電晶體"
  - "3D 堆疊電晶體"
  - "Stacked transistor"
category: "semiconductor"
level: 3
short: "把 N 型與 P 型電晶體上下疊在一起的未來電晶體結構，可望讓密度接近翻倍，是 GAA 之後的候選。"
definition: "CMOS 邏輯電路需要成對的 N 型與 P 型電晶體，過去兩者在晶片上並排擺放。CFET（互補式場效電晶體）把它們垂直堆疊：取一疊較高的奈米片，下半部做成一種電晶體、上半部做成另一種，在相同面積內放進更多電路。英特爾、三星與台積電都已在國際電子元件會議（IEDM）上展示 CFET 原型；IEEE Spectrum 於 2023 年 12 月報導，這種結構可望讓電晶體密度接近翻倍，但專家當時估計還要 7 到 10 年（約 2030 年代初）才會商用。主要挑戰在於上下兩層之間的連線會吃掉部分面積優勢，製程也更加複雜。CFET 被視為 GAA 之後延續邏輯微縮的主要路線之一，將影響未來 AI 晶片的運算密度。"
example: "如果 GAA 是把房子蓋得更精緻，CFET 就是把兩戶人家疊成上下樓層，讓同一塊地住進兩倍的人。"
