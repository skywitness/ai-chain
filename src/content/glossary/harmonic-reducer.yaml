term: "諧波減速機"
zh: "諧波減速機"
en: "Harmonic Reducer"
aliases:
  - "Harmonic Drive"
  - "Strain Wave Gear"
  - "應變波齒輪"
  - "諧波齒輪"
  - "諧波減速器"
category: robotics
level: 3
short: "靠可彈性變形的薄壁齒輪達成高減速比、幾乎零背隙的精密減速機，常用於機器人關節。"
definition: "諧波減速機（又稱應變波齒輪）由三個零件組成：橢圓形的波產生器（輸入端）、可彈性變形的薄壁外齒輪「柔輪」（輸出端），以及固定的內齒輪「鋼輪」，鋼輪通常比柔輪多兩齒。波產生器每轉一圈，柔輪就相對鋼輪朝反方向移動兩齒，因此單級就能達到約 30:1 到 320:1 的減速比；而且齒輪沿長軸方向始終嚙合，幾乎沒有背隙。它在 1950 年代由美國發明家 C. Walton Musser 發明並取得專利；「Harmonic Drive」是同名公司的註冊商標，也常被用來泛稱這類減速機。由於體積小、重量輕、定位精準，它被廣泛用於工業機器人、協作機器人與人形機器人的手臂關節，也用於航太設備。一台人形機器人需要多個精密減速機，因此諧波減速機被視為實體 AI 硬體供應鏈中的關鍵零組件之一。"
example: "馬達轉得很快但力氣小，就像腳踏車用最輕的檔位踩得飛快卻爬不上坡；諧波減速機把轉速降下來、換成扭力，讓機器手臂能穩穩舉起東西並精準停在定位。"
