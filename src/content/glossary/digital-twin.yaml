term: "數位孿生"
zh: "數位孿生"
en: "Digital Twin"
aliases:
  - "Digital Twin"
  - "數位分身"
  - "數位雙生"
  - "數字孿生"
category: robotics
level: 2
short: "在電腦中建立與實體工廠、產品或設備同步的虛擬複本，用來先模擬、測試再上線。"
definition: "數位孿生是實體產品、流程或設施的虛擬複本，會接收真實世界的感測資料保持同步，讓企業先在電腦裡設計、模擬與測試，再套用到實體場域。在 AI 產業鏈中，它有兩大用途：一是工廠與資料中心的規劃和營運，根據輝達（NVIDIA）列舉的案例，緯創（Wistron）用數位孿生把氣流模擬時間從 15 小時縮短到 3.6 秒，BMW 在新廠規劃上效率提升最多 30%，鴻海（Foxconn）也以工廠數位孿生最佳化產線與設備配置；二是作為機器人與自駕車的虛擬訓練場，在其中產生合成資料、驗證機器人車隊的動作，再部署到真實工廠。數位孿生仰賴 3D 模擬軟體、物理引擎與 GPU 算力，是實體 AI「先模擬、再上線」流程的基礎。"
example: "就像在電玩裡先蓋好一座一模一樣的工廠，把機器人、輸送帶和人員動線全部跑過一遍，確定不會塞車或撞到，才在真實世界動工。"
