term: "DPO"
zh: "直接偏好最佳化"
en: "Direct Preference Optimization"
aliases:
  - "直接偏好最佳化"
  - "直接偏好優化"
  - "Direct Preference Optimisation"
category: training
level: 3
short: "不必另外訓練獎勵模型、也不必跑強化學習，直接用「哪個回答比較好」的偏好資料調整模型。"
definition: "DPO 是史丹佛大學研究者在 2023 年提出的偏好對齊方法。傳統 RLHF 要先訓練獎勵模型，再用 PPO 等強化學習反覆取樣、更新，流程複雜且常不穩定；DPO 透過數學推導證明，同樣的最佳化目標可以改寫成只需「較受偏好的回答」與「較不受偏好的回答」配對的簡單分類損失，直接更新語言模型。論文實驗顯示，它的效果與 PPO 式 RLHF 相當或更好，且訓練更輕量。由於省下獎勵模型與線上取樣的運算，DPO 被許多開放權重模型採用，例如 Meta 的 Llama 3 後訓練就以 SFT 搭配 DPO 反覆進行多輪。"
example: "與其先培養一位評審、再讓廚師去討好評審，不如直接把「顧客比較喜歡 A 而不是 B」的紀錄拿給廚師研究。"
