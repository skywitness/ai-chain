term: "邊緣 AI"
zh: "邊緣人工智慧"
en: "Edge AI"
aliases:
  - "Edge AI"
  - "端側 AI"
  - "終端 AI"
  - "裝置端 AI"
  - "On-device AI"
category: robotics
level: 1
short: "讓 AI 模型直接在手機、汽車、機器人等終端裝置上執行，不必把資料傳回雲端。"
definition: "邊緣 AI 指把 AI 模型部署在資料產生的地方執行推論，例如手機、筆電、監視器、工廠設備、汽車與機器人，而不是把每一筆資料送回遠端的資料中心。好處是延遲低、隱私較好、節省網路頻寬，斷線時也能運作；限制是裝置的電力、散熱與記憶體都有限，所以模型通常要先經過量化或蒸餾等壓縮。機器人與自駕車特別需要邊緣 AI，因為緊急煞車或抓取物品等動作，等不及資料往返雲端。以輝達（NVIDIA）在 2025 年 8 月上市的機器人運算模組 Jetson AGX Thor 為例，它在 130 瓦的功耗範圍內提供最高 2,070 TFLOPS（FP4）的 AI 算力與 128 GB 記憶體，開發套件售價 3,499 美元起。邊緣 AI 讓 NPU、車用與機器人晶片成為資料中心 GPU 以外的另一個 AI 晶片市場。"
example: "手機相簿不用上網就能搜尋「海邊的照片」，或掃地機器人在家裡即時避開襪子，都是在裝置本身完成判斷的邊緣 AI。"
