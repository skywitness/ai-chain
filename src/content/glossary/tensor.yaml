# 名詞：張量（tensor）· 分類 ai-basics · 資料基準日 2026-10-06
term: "張量"
zh: "張量"
en: "Tensor"
aliases:
  - "Tensor"
  - "多維陣列"
category: "ai-basics"
level: 2
short: "AI 程式裡存放資料的多維數字陣列：可以是一個數字、一列數字、一張表，或更高維度的數字方塊。"
definition: "在 AI 領域，張量指多維的數字陣列：0 維是單一數字（純量）、1 維是向量、2 維是矩陣，再往上就是更高維的資料方塊。PyTorch 文件將張量定義為「包含單一資料型別元素的多維矩陣」，TensorFlow 更直接以它命名。一張彩色照片可表示成「高 × 寬 × 3 個色彩通道」的 3 維張量，一批照片再多一維；語言模型的中間資料則常是「批次 × 序列長度 × 隱藏維度」。模型的權重、輸入與中間結果全都是張量，因此硬體也圍繞它設計：Google 的 AI 晶片就叫 TPU（張量處理器），輝達（NVIDIA）GPU 內則有專門加速矩陣運算的 Tensor Core。"
example: "Excel 的一個儲存格是純量、一欄是向量、一整張工作表是矩陣；把好幾張工作表疊成一本活頁簿，就是 3 維張量。"
