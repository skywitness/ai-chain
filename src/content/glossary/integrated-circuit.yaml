term: "IC"
zh: "積體電路"
en: "Integrated Circuit"
aliases:
  - "積體電路"
  - "Integrated Circuit"
  - "晶片"
  - "Chip"
  - "Microchip"
  - "微晶片"
category: "semiconductor"
level: 1
short: "把大量電晶體與連接線路做在同一小片半導體上的電路，也就是俗稱的「晶片」。"
definition: "積體電路（IC）是在一小片半導體（通常是矽）上，同時製作出電晶體、電阻、電容以及連接它們的金屬導線，形成具備完整功能的電路。1958 年 9 月德州儀器（TI）的 Jack Kilby 展示了第一個可運作的積體電路，1959 年快捷半導體（Fairchild）的 Robert Noyce 發明單片式（monolithic）積體電路，奠定今日晶片的製造方式。GPU、CPU、記憶體與各種 AI 加速器都是積體電路，規模也愈來愈驚人：輝達（NVIDIA）資料中心用的 Blackwell GPU 由兩顆晶粒組成，合計有 2,080 億個電晶體。台灣常說的「IC 設計」「IC 製造」「IC 封測」，指的就是這條產業鏈的不同分工。"
example: "早期電路像用電線把一顆顆零件焊在板子上的手工組裝；積體電路則像把整座城市的道路與建築，一次印在一張郵票大小的矽片上。"
