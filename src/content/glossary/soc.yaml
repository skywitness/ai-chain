term: "SoC"
zh: "系統單晶片"
en: "System on Chip"
aliases:
  - "系統單晶片"
  - "系統晶片"
  - "SoC 晶片"
  - "System on a Chip"
category: hardware
level: 2
short: "把 CPU、GPU、AI 引擎與記憶體控制器等功能整合在同一顆晶片上，手機與筆電的處理器多屬此類。"
definition: "SoC 是把原本分散在多顆晶片上的功能，包括 CPU、GPU、NPU（AI 引擎）、影像處理、記憶體控制器與各種輸入輸出介面，整合到同一顆晶片上的設計。好處是體積小、省電、元件之間傳遞資料更快，因此手機、平板、筆電、車用與機器人晶片大多採用 SoC。例如蘋果（Apple）2024 年發表的 M4 以第二代 3 奈米製程製造，含 280 億個電晶體，CPU 最多 10 核、GPU 10 核，神經網路引擎每秒可達 38 兆次運算。對 AI 產業鏈而言，SoC 是邊緣 AI 的核心載體：模型能不能在裝置端順暢執行，很大程度取決於 SoC 的 NPU 算力與記憶體頻寬，這也讓聯發科、高通、蘋果等手機晶片商站上 AI 舞台。"
example: "傳統電腦像各部門分散在不同大樓的公司，SoC 則像把所有部門搬進同一層開放式辦公室：溝通更快、更省電，也更省空間。"
