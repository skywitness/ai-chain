# 名詞：機器學習（machine-learning）· 分類 ai-basics · 資料基準日 2026-10-06
term: "機器學習"
zh: "機器學習"
en: "Machine Learning"
aliases:
  - "Machine Learning"
  - "ML"
category: "ai-basics"
level: 1
short: "不靠人寫死規則，而是讓電腦從大量資料中自己找出規律，再用來預測或判斷新情況。"
definition: "機器學習是 AI 的一個分支：工程師不逐條寫出規則，而是準備資料與一個帶有可調參數的模型，讓程式透過「訓練」自動調整參數、找出資料中的規律；訓練好的模型再對沒看過的新資料做出預測，這一步稱為推論。依學習訊號不同，常分為監督式學習（有標準答案）、非監督式學習（沒有答案，自行找出結構）與強化學習（依獎勵試錯）。近年主流 AI 系統幾乎都建立在機器學習之上，也形成「訓練需要大量集中算力、推論需要持續分散算力」的需求結構，這也是 GPU、記憶體與資料中心投資的主要來源。"
example: "垃圾郵件過濾器：給它看幾萬封標好「垃圾／正常」的信，它會自己學出哪些字詞與寄件模式代表垃圾信，不必由工程師逐條列出規則。"
