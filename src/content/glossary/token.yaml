term: "Token"
zh: "詞元"
en: "Token"
aliases:
  - "詞元"
  - "標記"
  - "Tokens"
category: llm
level: 1
short: "模型讀寫文字的最小單位，可能是一個字、半個詞或標點；API 計價與上下文長度都以 Token 計算。"
definition: "Token（詞元）是語言模型處理文字的基本單位。文字進入模型前，會先由分詞器切成 Token，再轉成數字編號；一個 Token 可能是完整的英文單字、字根、一到數個中文字或標點，罕用的中文字也可能被拆成好幾個 Token。依 Google 的 Gemini 官方文件，Gemini 模型的 1 個 Token 約等於 4 個字元，100 個 Token 約為 60–80 個英文單字。Token 是 AI 產業的「計量單位」：模型 API 以每百萬 Token 計價，上下文視窗以 Token 數表示上限，推論服務的用量與營收也常以處理的 Token 數衡量。"
example: "同一句話在不同模型的分詞器下，切出的 Token 數可能不同；就像計程車跳表，API 費用依模型讀進（輸入）與寫出（輸出）的 Token 數分別計價。"
