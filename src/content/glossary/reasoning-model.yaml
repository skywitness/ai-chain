category: llm
level: 1
short: "回答前會先產生一段「思考過程」再作答的語言模型，擅長數學、程式與多步驟問題。"
definition: "推理模型是在作答前先生成較長的推理過程（思維鏈），再給出最終答案的語言模型，通常以強化學習訓練，讓模型學會拆解問題、自我檢查與修正。OpenAI 於 2024 年 9 月 12 日推出的 o1-preview 是這類模型第一個廣為人知的代表；DeepSeek 在 2025 年 1 月發表的 DeepSeek-R1 以強化學習提升推理能力，在 AIME 2024 數學測驗達 79.8%（pass@1），與 OpenAI o1-1217 的 79.2% 相當。推理模型把運算從訓練延伸到推論階段（測試時運算），每個問題消耗的 Token 更多，因而推高推論算力需求。"
example: "一般模型像搶答，聽完題目立刻開口；推理模型像寫數學考卷，先在草稿紙上演算、檢查，再寫下答案。"
