term: "月營收"
zh: "月營收"
en: "Monthly Revenue"
aliases:
  - "每月營收"
  - "月營收公告"
  - "月營收年增率"
  - "Monthly Revenue"
  - "Monthly Sales"
category: "cloud-business"
level: 1
short: "台灣上市櫃公司每月 10 日前公布上個月營收，是追蹤 AI 供應鏈景氣最即時的數字。"
definition: "依《證券交易法》第 36 條，已依法發行有價證券的公司應於每月 10 日以前公告並申報上月份營運情形，投資人可在公開資訊觀測站查詢。美國上市公司通常只按季公布財報，台灣的月營收因此成為追蹤 AI 供應鏈最即時的資料，伺服器代工、散熱、PCB 等台廠的出貨變化，往往先反映在月營收上。例如台積電 2026 年 8 月營收新台幣 5,148.1 億元，月增 10.1%、年增 53.3%；1–8 月累計 3 兆 3,868.7 億元，年增 39.3%。月營收是公司自結、未經會計師查核，且容易受出貨時點與匯率影響，解讀時宜搭配年增率與累計數字。"
example: "像每個月的小考成績：比期末總成績更早看出進步或退步，但單次分數容易受偶發因素影響。"
