term: "CoWoS"
zh: "基板上晶圓上晶片封裝"
en: "Chip on Wafer on Substrate"
aliases:
  - "Chip-on-Wafer-on-Substrate"
  - "CoWoS 封裝"
  - "CoWoS-S"
  - "CoWoS-R"
category: "packaging"
level: 1
short: "台積電的 2.5D 先進封裝：把 GPU 與 HBM 並排放在中介層上再接到載板，是高階 AI 晶片的主流封裝。"
definition: "CoWoS 是台積電（TSMC）的 2.5D 先進封裝技術，名稱就是它的三層結構：晶片（Chip）先接合到中介層晶圓（Wafer）上，再整體接到封裝載板（Substrate）。中介層上的高密度線路讓 GPU 等邏輯晶粒與多組 HBM 以極短距離交換資料，提供 AI 運算所需的記憶體頻寬。CoWoS 自 2012 年量產，目前分為使用矽中介層的 CoWoS-S（最大約 3.3 倍光罩、約 2,700 平方毫米）、使用重布線層中介層的 CoWoS-R（2023 年量產），以及嵌入局部矽互連的 CoWoS-L（2024 年量產）。台積電表示 2022 年底生成式 AI 興起後 CoWoS 需求大增、持續擴產；2026 年 4 月時已在生產 5.5 倍光罩尺寸的 CoWoS，並規劃 2028 年量產 14 倍光罩版本。也因此，CoWoS 產能常被視為 AI 晶片供給的觀察指標。"
example: "像先在一塊布滿細密管線的「地基」（中介層）上，把 GPU 和好幾疊 HBM 緊緊並排蓋好，再把整塊地基放到更大的載板上，接上主機板。"
