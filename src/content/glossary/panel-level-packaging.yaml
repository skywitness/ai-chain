term: "面板級封裝"
zh: "面板級封裝"
en: "Panel-Level Packaging"
aliases:
  - "PLP"
  - "Panel-Level Packaging"
  - "FOPLP"
  - "扇出型面板級封裝"
  - "CoPoS"
category: "packaging"
level: 3
short: "把封裝製程從圓形 12 吋晶圓搬到更大的方形面板上進行，一次能處理更多大尺寸晶片封裝。"
definition: "目前 CoWoS 等先進封裝多在 12 吋（300 毫米）圓形晶圓上進行，但 AI 晶片封裝越做越大，圓形晶圓邊緣放不下完整的方形封裝，浪費也越多。面板級封裝改用方形面板當載體：310 × 310 毫米的面板面積約 9.6 萬平方毫米，約為 12 吋晶圓（約 7.1 萬平方毫米）的 1.36 倍，而且方形排列幾乎沒有邊角浪費，面板越大效益越明顯。扇出型面板級封裝（FOPLP）已用於電源管理、射頻等晶片，據 TrendForce 指出，已有面板廠以 620 × 750 毫米尺寸量產。台積電則聚焦 CoPoS（Chip-on-Panel-on-Substrate）並鎖定 310 × 310 毫米，TrendForce 預估 2027 年試產、2028 年下半年量產。主要挑戰是大面板的翹曲、線路精度，以及需要建立全新的設備與材料供應鏈。"
example: "用圓形烤盤烤方形餅乾，邊緣總會空出一圈；換成方形大烤盤，同樣的麵團一次能多烤好幾片，也不浪費邊角。"
