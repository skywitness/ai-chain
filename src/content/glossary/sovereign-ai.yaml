term: "主權 AI"
zh: "主權 AI"
en: "Sovereign AI"
aliases:
  - "主權人工智慧"
  - "Sovereign AI"
  - "主權 AI 算力"
  - "國家級 AI"
category: "policy"
level: 1
short: "國家用自己的算力、資料與人才發展 AI，讓關鍵模型與基礎設施不受制於他國。"
definition: "主權 AI 指一個國家用本國的基礎設施、資料、人才與產業網路來建置與運行 AI，讓模型符合自己的語言、文化與法規，並降低對外國雲端或模型的依賴。常見做法包括由政府或國家支持的機構投資 GPU 運算中心、用本地資料訓練或微調語言模型，以及要求敏感資料留在國內。台灣的例子是國科會啟動的 TAIDE（推動臺灣可信任生成式 AI 發展計畫）：以開放權重模型為基礎，再用台灣資料加強訓練，2026 年 2 月釋出的 Gemma-3-TAIDE-12b-Chat-2602 就強化了對台灣文化與日常用語的理解。對產業鏈而言，主權 AI 讓 AI 基礎設施的買家從少數美國雲端巨頭，擴大到各國政府、電信商與新雲業者，為 GPU、伺服器與資料中心帶來新的需求來源。"
example: "就像國家會建立自己的電網與糧食儲備，避免關鍵時刻被別人卡脖子，主權 AI 是把 AI 算力與模型也當成國家級基礎建設。"
