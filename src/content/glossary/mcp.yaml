term: "MCP"
zh: "模型上下文協定"
en: "Model Context Protocol"
aliases:
  - "模型上下文協定"
  - "Model Context Protocol"
  - "MCP 伺服器"
  - "MCP Server"
category: llm
level: 2
short: "Anthropic 於 2024 年推出的開放標準，讓 AI 應用用同一種方式連接各種工具與資料來源。"
definition: "MCP（模型上下文協定）是 Anthropic 於 2024 年 11 月 25 日開源的開放標準，用來連接 AI 應用與外部資料及工具。開發者可以把資料或功能包裝成 MCP 伺服器，或開發連接這些伺服器的 AI 應用（MCP 用戶端）；過去每接一個資料源都要客製整合，MCP 讓工具只需實作一次，就能被不同 AI 產品使用。2025 年 12 月，Anthropic 將 MCP 捐贈給 Linux 基金會旗下的 Agentic AI Foundation（AAIF）；當時公開運作的 MCP 伺服器已超過 1 萬個，ChatGPT、Gemini、Microsoft Copilot、Cursor 等產品皆已支援。"
example: "可以把 MCP 想成 AI 應用的 USB-C 接頭：各種周邊只要做成同一種接頭，任何電腦都能直接插上使用。"
