term: "PSU"
zh: "電源供應器"
en: "Power Supply Unit"
aliases:
  - "電源供應器"
  - "電源供應單元"
  - "伺服器電源"
  - "電源架"
  - "Power Supply Unit"
  - "Power Shelf"
category: hardware
level: 2
short: "把電網的交流電轉成伺服器可用直流電的設備；AI 機櫃耗電大增，讓 PSU 的功率與效率要求不斷提高。"
definition: "PSU 負責把電網送來的交流電轉換成伺服器內部使用的低壓直流電，並維持電壓穩定。每一次轉換都會損失一部分電力並變成熱，因此轉換效率直接影響電費與散熱負擔。現行 AI 機櫃多在櫃內配置「電源架」（power shelf），由多顆 PSU 輸出 54 V 直流電，再經銅匯流排送到各運算托盤。輝達指出，當單櫃功率達到 1 MW 時，54 V 架構需要多達 200 公斤的銅匯流排，電源架也會擠掉多達 64U 的機櫃空間，因此計畫自 2027 年起配合 Kyber 機櫃改用 800 V 直流供電，宣稱端到端效率比 54 V 系統最多可提升 5%。台達電、光寶科等台廠是伺服器電源的重要供應商，也都名列 800 V 架構的合作夥伴。"
example: "PSU 就像手機充電器，只是功率大得多：把牆上的交流電變成電子設備用的直流電。轉換時損失的每一點電力都會變成熱，資料中心還得再花電把這些熱排掉。"
