term: "SaaS"
zh: "軟體即服務"
en: "Software as a Service"
aliases:
  - "軟體即服務"
  - "訂閱制軟體"
  - "雲端軟體"
  - "Software-as-a-Service"
category: "cloud-business"
level: 1
short: "透過網路直接使用、按月或按年訂閱的軟體，例如 Microsoft 365，不必自己安裝與維護。"
definition: "依 NIST 的定義，SaaS 是讓使用者透過瀏覽器或程式介面，使用供應商在雲端基礎設施上執行的應用程式；網路、伺服器、作業系統與儲存都由供應商管理。SaaS 公司多採訂閱制，收入穩定、可預測，常以 ARR 衡量規模。傳統 SaaS 每多服務一位用戶的邊際成本很低，毛利率普遍偏高；但加入生成式 AI 功能後，每次呼叫模型都要消耗 GPU 算力或支付 Token 費用，成本會隨用量上升，定價也開始從「按人頭」轉向「按用量」或「按成果」計費。SaaS 位於 AI 產業鏈的最末端，直接面對企業與個人用戶。"
example: "像在串流平台看影片，而不是買光碟回家：每月付費、隨時取用，更新與維護都由平台負責。"
