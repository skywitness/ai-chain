term: "Scale-up"
zh: "垂直擴展"
en: "Scale-up"
aliases:
  - "垂直擴展"
  - "向上擴展"
  - "縱向擴展"
  - "Scale Up"
  - "Scale-up 網路"
  - "Scale-up Network"
category: networking
level: 2
short: "用超高頻寬互連把多顆 GPU 緊密連成一台「超大 GPU」，通常限於同一機櫃內，例如 NVLink。"
definition: "Scale-up 指在單一節點或機櫃內，用專屬的高速互連把多顆加速器緊密相連，讓它們能直接讀寫彼此的記憶體，像一顆巨大的 GPU 一樣運作。代表技術是輝達（NVIDIA）的 NVLink：Vera Rubin NVL72 機櫃以 NVLink 6 交換器連接 72 顆 GPU，每顆 GPU 3 TB/s，整櫃總頻寬達 216 TB/s。Scale-up 網路的頻寬遠高於機櫃之間的 Scale-out 網路，適合張量平行，以及 MoE 模型的專家平行這類通訊極度頻繁的工作。它的限制是範圍較小，通常受限於機櫃內的銅纜距離與交換器規模。開放陣營則推動 UALink（1.0 規格支援單一 Pod 最多 1,024 顆加速器），博通（Broadcom）也提出 Scale-up 乙太網路（SUE）架構，希望打破 NVLink 的封閉生態。"
example: "Scale-up 像把 72 位廚師集中在同一間大廚房，鍋碗瓢盆伸手就能傳；Scale-out 則是很多間廚房之間，要靠外送員來回運送食材。"
