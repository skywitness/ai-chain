term: "AI 加速器"
zh: "AI 加速器"
en: "AI Accelerator"
aliases:
  - "AI 晶片"
  - "AI 加速晶片"
  - "加速器"
  - "AI Chip"
  - "Accelerator"
category: hardware
level: 1
short: "專門為 AI 運算加速而設計的晶片總稱，包括 GPU、TPU、各種客製 ASIC 與手機、筆電裡的 NPU。"
definition: "AI 加速器泛指為神經網路運算特別最佳化的晶片。它們的共同點是把大量晶片面積用在矩陣乘法單元與高速記憶體介面，並支援 FP8、FP4 等低精度格式，以換取更高的每瓦效能。主要路線有三種：一是可程式化程度高、軟體生態最完整的 GPU（輝達、超微）；二是雲端業者為自家工作負載量身打造的 ASIC，例如 Google TPU、AWS Trainium、Meta MTIA；三是新創公司的特殊架構，例如 Groq LPU 與 Cerebras 晶圓級晶片。用在手機與筆電上的則多稱為 NPU。客製加速器的需求正快速成長：博通（Broadcom）FY2026 第三季 AI 半導體營收（含客製加速器與網通晶片）達 167 億美元、年增 221%。"
example: "通用 CPU 像瑞士刀，什麼都能做；AI 加速器像專業的電動切菜機，只擅長幾件事，但做這幾件事的速度與省電程度遠勝瑞士刀。"
