term: "記憶體階層"
zh: "記憶體階層"
en: "Memory Hierarchy"
aliases:
  - "Memory Hierarchy"
  - "儲存階層"
  - "記憶體層級"
  - "Tiered Memory"
  - "分層記憶體"
category: "memory"
level: 2
short: "把暫存器、快取、主記憶體到硬碟依速度與容量排成金字塔，越上層越快、越小也越貴。"
definition: "記憶體階層是電腦架構把各種儲存元件依速度、容量與每位元成本分層的設計：最上層是處理器內的暫存器與 SRAM 快取，接著是 DRAM 主記憶體，再往下是 SSD、HDD 等大容量儲存。越上層越快、越小、越貴，系統靠著把常用資料放在上層來兼顧效能與成本。AI 系統讓這座金字塔變得更多層：GPU 晶片內的 SRAM、緊鄰 GPU 的 HBM、CPU 端的 LPDDR 與 DDR5、可擴充的 CXL 記憶體，再到企業級 SSD；SK 海力士與 Sandisk 更在 HBM 與 SSD 之間提出 HBF 新層級。模型權重與 KV Cache 放在哪一層，是決定推論速度與成本的關鍵。"
example: "就像書桌、書架、地下室倉庫：常用的書放桌上隨手可得，偶爾查的放書架，很少用的才收進倉庫。"
