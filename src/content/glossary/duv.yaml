term: "DUV"
zh: "深紫外光微影"
en: "Deep Ultraviolet Lithography"
aliases:
  - "深紫外光"
  - "DUV 微影"
  - "DUV lithography"
  - "浸潤式微影"
  - "Immersion lithography"
  - "ArF"
  - "KrF"
category: "semiconductor"
level: 2
short: "以 248 或 193 奈米深紫外光雷射印製電路的微影技術，至今仍負責晶片上大多數圖層。"
definition: "DUV 微影使用準分子雷射產生的深紫外光，主要波長為 248 奈米（KrF）與 193 奈米（ArF）。在鏡頭與晶圓之間加入一層超純水的「浸潤式」技術，可進一步提高解析度；台積電表示，它是第一家以浸潤式微影做出功能完整 90 奈米晶片的半導體公司，並於 2004 年 12 月發表這項成果。即使在使用 EUV 的先進製程中，晶片上多數圖層仍以 DUV 印製，只有最精細的幾層才用 EUV，因為 DUV 機台較便宜、產能高：ASML 表示其最新 NXT 機台已展現每天處理超過 6,000 片晶圓的能力。無法取得 EUV 時，DUV 搭配多重曝光仍可推進到 7 奈米級，但步驟與成本大幅增加。"
example: "DUV 像主力的標準印刷機，速度快、成本低，負責大部分版面；EUV 則是昂貴的精密印刷機，只印最細的部分。"
