term: "SSD"
zh: "固態硬碟"
en: "Solid-State Drive"
aliases:
  - "固態硬碟"
  - "Solid-State Disk"
  - "企業級 SSD"
  - "eSSD"
category: "memory"
level: 1
short: "用 NAND Flash 晶片存資料的硬碟，沒有機械零件，比傳統硬碟更快、更省電也更耐震。"
definition: "SSD 由 NAND Flash 晶片、控制晶片與韌體組成，沒有旋轉碟片與讀寫頭等機械零件，因此存取延遲遠低於 HDD，也更耐震、安靜，缺點是每 GB 價格較高、可寫入次數有上限。資料中心使用的企業級 SSD（eSSD）多透過 PCIe／NVMe 介面連接。AI 讓 SSD 從單純的存檔角色變成推論系統的一環：TrendForce 指出，Agent 應用需要大量即時檢索與快取，向量資料庫也越來越常採用高容量 SSD，部分架構更把 KV Cache 從記憶體卸載到 SSD 以降低成本。SK 海力士在 2026 年 9 月的台積電 OIP 論壇上預估，PCIe 企業級 SSD 市場將從 2026 年的 509 EB 成長到 2030 年的 1,933 EB，約 3.8 倍。"
example: "HDD 像要等唱針就位的黑膠唱盤，SSD 則像隨點隨播的串流，想聽哪一段立刻就有。"
