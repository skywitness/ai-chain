  - "晶片產業"
  - "Chip industry"
category: "semiconductor"
level: 1
short: "導電能力介於導體與絕緣體之間的材料，最常見的是矽，也是所有晶片的基礎。"
definition: "半導體是導電能力介於金屬（導體）與玻璃、塑膠（絕緣體）之間的材料，最常用的是矽。透過摻入微量雜質並施加電壓，就能精準控制電流「通」或「不通」，因此可以做成電晶體，再組成各種晶片。日常所說的「半導體產業」則泛指晶片的設計、製造、封裝測試以及設備與材料。AI 的運算全部在半導體晶片上進行。產業規模方面，美國半導體產業協會（SIA）引用世界半導體貿易統計組織（WSTS）的資料（三個月移動平均）指出，2026 年 8 月全球半導體銷售額達 1,597 億美元，比 2025 年同月的 654 億美元成長 144.3%；前 8 個月累計首度突破 1 兆美元，SIA 執行長並預期 2026 全年將超過 1.6 兆美元。"
example: "矽本身像一條平常不太通車的道路，摻雜與電壓就像裝上紅綠燈，可以精準決定電流何時通過；上千億個這樣的「紅綠燈」組合起來，就是一顆 AI 晶片。"
