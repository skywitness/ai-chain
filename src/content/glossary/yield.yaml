term: "良率"
zh: "良率"
en: "Yield"
aliases:
  - "Yield"
  - "良品率"
  - "晶圓良率"
  - "Die yield"
category: "semiconductor"
level: 1
short: "一片晶圓上能正常運作的晶片所佔比例；良率越高，每顆晶片的成本越低。"
definition: "良率是一片晶圓上通過測試、能正常運作的晶粒佔全部晶粒的比例。晶圓是整片計價，良率越高，分攤到每顆好晶片的成本就越低，因此良率是晶圓廠獲利與新製程能否量產的關鍵指標，業者通常不公開確切數字。晶粒面積越大，碰到隨機缺陷的機率越高：以常見的泊松模型（良率約為 e 的負「缺陷密度 × 面積」次方）舉例，假設每平方公分有 0.1 個缺陷，1 平方公分的晶粒良率約 90%，8 平方公分（接近大型 AI GPU）的晶粒則只剩約 45%；實務上業界還會用其他良率模型修正，這裡的數字只是示意。這也是 AI 晶片改採多顆較小晶粒搭配先進封裝的重要原因之一。"
example: "就像烤一大盤餅乾時隨機掉了幾粒焦渣：餅乾做得越大，每塊沾到焦渣的機會越高，能賣的比例就越低。"
