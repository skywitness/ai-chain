term: "PPA"
zh: "購售電合約"
en: "Power Purchase Agreement"
aliases:
  - "購電合約"
  - "購電協議"
  - "購售電契約"
  - "企業購電合約"
  - "Corporate PPA"
  - "CPPA"
  - "VPPA"
category: energy
level: 2
short: "用電大戶與發電業者簽訂的長期購電合約，事先鎖定電價與電量；科技大廠藉此確保 AI 資料中心的電源。"
definition: "PPA 是用電大戶（或售電業者）與發電業者簽下的長期合約，約定電價、電量，以及綠電憑證等環境屬性的歸屬。發電業者可以拿合約向銀行融資興建新電廠，買方則鎖定未來用電成本並取得低碳電力。實體 PPA 是把電經由電網轉供給買方；虛擬 PPA（VPPA）則不直接送電，而是以約定價與市場電價的差額結算，買方取得憑證。科技大廠是企業 PPA 的主要買家之一：微軟（Microsoft）2024 年 5 月與布魯克菲爾德（Brookfield）簽下框架協議，規劃 2026–2030 年開發超過 10.5 GW 再生能源，規模約是先前最大單一企業 PPA 的 8 倍；同年 9 月又與星座能源（Constellation）簽下 20 年 PPA，為約 835 MW 的三哩島 1 號機重啟鋪路。台灣企業透過「綠電轉供」向再生能源業者購電，也是類似的機制。"
example: "PPA 像餐廳跟農場簽「未來十年包菜」的合約：農場拿著合約向銀行借錢擴建菜園，餐廳則確保菜價與供應穩定，不怕市場突然缺貨漲價。"
