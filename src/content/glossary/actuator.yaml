term: "致動器"
zh: "致動器"
en: "Actuator"
aliases:
  - "Actuator"
  - "執行器"
  - "驅動器"
  - "關節模組"
  - "Joint Actuator"
category: robotics
level: 2
short: "把電能、液壓或氣壓轉換成力與動作的元件，相當於機器人的「肌肉」。"
definition: "致動器是把電能、液壓或氣壓轉換成力、扭矩或位移的機械元件，相當於機器人與自動化設備的「肌肉」。機器人關節最常用電動旋轉致動器，由伺服馬達、減速機（例如諧波減速機或行星減速機）、編碼器與驅動電路組成；需要直線推拉的部位則多用螺桿式線性致動器。人形機器人的每個自由度通常對應一顆關節馬達，例如宇樹（Unitree）G1 依版本配備 23 到 43 個關節馬達，標準版膝關節最大扭矩為 90 牛頓米。致動器的扭矩密度、精度與散熱，直接決定機器人能搬多重、動作多靈巧。由於一台人形機器人就需要二十個以上的致動器，它成為精密機械、馬達與減速機業者切入實體 AI 供應鏈的主要入口。"
example: "人舉起手臂靠的是肌肉收縮；機器人舉起手臂，則是肩膀裡的馬達轉動，再經減速機把轉速換成足夠的力量。"
