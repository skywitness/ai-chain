term: "AI 眼鏡"
zh: "AI 智慧眼鏡"
en: "AI Smart Glasses"
aliases:
  - "AI Glasses"
  - "Smart Glasses"
  - "智慧眼鏡"
  - "AI 智慧型眼鏡"
category: robotics
level: 1
short: "內建相機、麥克風與喇叭的眼鏡，能用語音呼叫 AI 助理，幫你看、聽並回答問題。"
definition: "AI 眼鏡是把相機、麥克風、喇叭（部分機種還有顯示器）與 AI 助理整合進一般眼鏡外型的穿戴裝置，使用者可以用語音詢問眼前看到的東西、即時翻譯、拍照或查看導航。Meta 與 Ray-Ban 合作的 Ray-Ban Meta 系列是代表產品；2025 年 9 月發表的 Meta Ray-Ban Display 在鏡片中加入全彩顯示，並搭配能讀取手腕肌肉電訊號（EMG）的 Meta Neural Band 腕帶操作，美國售價 799 美元起（含腕帶），混合使用續航最長約 6 小時。AI 眼鏡受限於重量、電池與散熱，較重的運算多半交給手機與雲端完成，因此是低功耗晶片、邊緣 AI 與多模態模型的交會點，也被不少科技公司視為手機之後可能的新 AI 入口。"
example: "在國外超市拿起一罐看不懂的醬料，問一句「這是什麼？」眼鏡就透過相機辨識包裝，在耳邊用中文告訴你。"
