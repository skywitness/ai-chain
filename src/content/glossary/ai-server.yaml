term: "AI 伺服器"
zh: "AI 伺服器"
en: "AI Server"
aliases:
  - "GPU 伺服器"
  - "加速運算伺服器"
  - "AI 機櫃"
  - "AI-Optimized Server"
  - "GPU Server"
category: hardware
level: 1
short: "搭載多顆 GPU 或 AI 加速器、專門用來訓練與執行 AI 模型的伺服器，耗電與散熱需求遠高於一般伺服器。"
definition: "AI 伺服器是以 GPU 或其他 AI 加速器為運算主體的伺服器，一台機器內裝有多顆加速器，再配上 CPU、高速網卡、大容量記憶體與電源、散熱模組。更高階的設計則以整個機櫃為單位，例如輝達 GB200 NVL72 把 72 顆 GPU 以 NVLink 連成一體並採液冷。和一般伺服器相比，AI 伺服器的功耗、散熱與電路板規格要求都高出許多，因此帶動電源、液冷、PCB、CCL 等零組件全面升級。這門生意規模急速擴大：戴爾（Dell）FY2027 第二季（截至 2026 年 7 月 31 日）AI 伺服器營收 164 億美元、年增 100%，季末未出貨訂單（backlog）達 950 億美元。台灣的鴻海、廣達、緯創、英業達等 ODM 是主要的組裝與整櫃整合廠。"
example: "一般伺服器像家用轎車，AI 伺服器像重型卡車：都在路上跑，但載重、油耗與保養需求完全不在同一個等級。"
