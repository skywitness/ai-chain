term: "Sim-to-Real"
zh: "模擬到真實轉移"
en: "Sim-to-Real Transfer"
aliases:
  - "Sim2Real"
  - "Sim-to-Real Transfer"
  - "模擬到現實"
  - "虛實轉移"
category: robotics
level: 3
short: "把在模擬器中訓練好的機器人或自駕模型，轉移到真實世界後仍能正常運作的技術。"
definition: "Sim-to-Real 指先在電腦模擬環境中訓練機器人或自駕模型，再部署到真實世界的過程與技術。模擬的好處是便宜、安全，又能大量平行加速，讓機器人在虛擬環境中反覆嘗試；難題是「現實落差」（reality gap）：模擬中的摩擦、光線、材質與感測器雜訊和真實世界不同，模型上線後可能失效。常見解法是「領域隨機化」（domain randomization），在模擬中隨機改變顏色、光照、物體位置與物理參數，迫使模型學會不依賴這些細節。2017 年 Tobin 等人的研究只用隨機紋理的模擬影像訓練物體偵測器，在真實世界的定位誤差就能控制在 1.5 公分內。如今輝達（NVIDIA）Isaac Sim 等模擬平台、世界模型與數位孿生，都是為了縮小這道落差，也讓 GPU 模擬算力成為機器人訓練的重要投入。"
example: "就像飛行員先在模擬艙練習上百次起降再上真飛機；模擬艙做得愈逼真、情境愈多變，真正上場時愈不容易手忙腳亂。"
