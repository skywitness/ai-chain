term: "合約價"
zh: "記憶體合約價"
en: "Contract Price"
aliases:
  - "Contract Price"
  - "合約價格"
  - "DRAM 合約價"
  - "NAND 合約價"
category: "memory"
level: 2
short: "記憶體原廠與大客戶按月或按季議定的成交價，比零星交易的現貨價更能代表主流行情。"
definition: "記憶體價格分為「合約價」與「現貨價」。合約價是三星、SK 海力士、美光等原廠與伺服器、手機、PC 品牌等大客戶按月或按季協商的成交價格，多用於長期、大量的採購，變動較平緩，部分採購也改以事先約定計價機制的長期協議（LTA）進行；現貨價則是通路商之間零星交易的價格，反應快但量小，常被用來觀察短期供需。研究機構 TrendForce（集邦科技）定期調查並預測合約價，是追蹤記憶體景氣與廠商營收的重要指標。例如 TrendForce 預估 2026 年第三季一般型 DRAM 合約價季增 13–18%，第四季再季增 10–15%，漲幅逐季收斂；NAND Flash 第四季合約價則預估季增 15–20%。"
example: "合約價像餐廳和農場簽的長期供菜價，現貨價則像傳統市場當天的菜價：前者穩定、量大，後者波動快、量小。"
