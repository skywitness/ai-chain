# 名詞：梯度下降（gradient-descent）· 分類 ai-basics · 資料基準日 2026-10-06
term: "梯度下降"
zh: "梯度下降法"
en: "Gradient Descent"
aliases:
  - "Gradient Descent"
  - "梯度下降法"
  - "GD"
category: "ai-basics"
level: 2
short: "讓模型逐步變好的方法：算出「參數往哪個方向調能讓錯誤變少」，然後每次朝那裡走一小步。"
definition: "梯度下降是最小化損失函數的數學方法：先計算損失對每個參數的梯度（也就是往哪個方向調整，損失增加最快），再把參數朝反方向移動一小步，反覆進行直到損失夠低。每一步的大小由「學習率」控制，太大會來回震盪，太小則學得很慢。實務上每次只用一小批資料估計梯度（小批次隨機梯度下降），並搭配 Adam、AdamW 等改良版最佳化器。大型模型的訓練就是大量這種步驟的累積：DeepSeek-V3 的完整訓練共耗用約 278.8 萬個 H800 GPU 小時。以資料平行方式在多顆 GPU 上訓練時，每一步都要彙整、同步各 GPU 算出的梯度，因此也帶動了高速網路的需求。"
example: "在濃霧中下山：看不到山腳，只能用腳感覺哪個方向最陡往下，往那裡走一步、再重新感覺，直到走到谷底。"
