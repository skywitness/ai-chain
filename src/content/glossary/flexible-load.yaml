term: "彈性負載"
zh: "需量反應彈性負載"
en: "Flexible Load"
aliases:
  - "需量反應"
  - "需量反應負載"
  - "可調節負載"
  - "負載彈性"
  - "Demand Response"
  - "Load Flexibility"
  - "DR"
category: energy
level: 3
short: "在電網吃緊時能暫緩、轉移或降低用電的負載；資料中心若願意配合，有機會更快獲准接上電網。"
definition: "彈性負載指能依電網狀況調整用電時間或功率的用電設備；在尖峰時段配合電力公司降載的機制稱為需量反應（DR）。資料中心過去被視為必須 24 小時全額供電的「硬負載」，但 AI 工作中有一部分可以延後或移到其他地區執行。Google 在 2025 年 8 月宣布與美國 Indiana Michigan Power、田納西河谷管理局（TVA）簽約，首度針對機器學習工作負載提供需量反應，在電網吃緊時延後非緊急運算；Google 也表示在台灣與台電合作需量反應，於用電高峰協助維持供電穩定。Google 認為，這種彈性能讓大型負載更快併網，並減少新建輸電線路與電廠的需求。輝達（NVIDIA）則把電池儲能（BESS）納入 AI 工廠架構，讓資料中心以更平順、可控的用電曲線面對電網，也能參與需量反應。限制在於搜尋、醫療雲端等高可靠服務能降載的空間有限。"
example: "像夏天用電尖峰時，電力公司請工廠「錯峰生產」換取電費優惠；資料中心也可以把不急的訓練工作挪到半夜，或移到其他地區的機房執行。"
