  notes: "查核：Google 2025-08-04 與 I&M、TVA 的機器學習需量反應協議、與台電的需量反應合作，以及輝達 BESS 可讓資料中心成為更可控負載並參與需量反應，皆對照原文。「更快併網、減少新建輸電與電廠」是 Google 的說法，已改為明確歸屬。"
