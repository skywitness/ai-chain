term: "超大規模業者"
zh: "超大規模雲端業者"
en: "Hyperscaler"
aliases:
  - "超大型雲端業者"
  - "雲端巨頭"
  - "雲端服務供應商"
  - "CSP"
  - "Hyperscalers"
category: "cloud-business"
level: 1
short: "在全球擁有大量大型資料中心的雲端巨頭，如 AWS、Microsoft Azure、Google Cloud，是 AI 晶片的主要買家。"
definition: "Hyperscaler 指能在全球快速擴充大量運算資源的超大型雲端業者，通常指 Amazon（AWS）、Microsoft（Azure）與 Alphabet（Google Cloud），廣義也包含自建大量資料中心的 Meta 與 Oracle 等；這個詞沒有官方定義。它們同時是雲端服務的賣方，也是 AI 晶片、HBM、伺服器與電力設備的最大買方，還自行設計 TPU、Trainium 等晶片。因此它們的資本支出被視為整條 AI 供應鏈的需求指標：Meta 在 2026 年 7 月把全年資本支出（含融資租賃本金）展望收斂為 1,300–1,450 億美元；AWS 2026 年第二季營收 422 億美元、營業利益 166 億美元。"
example: "可以想成擁有全國連鎖倉庫與車隊的超大型物流公司：小商家不必自建倉庫，直接租用它們的空間與運力。"
