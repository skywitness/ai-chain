term: "晶片法案"
zh: "晶片法案"
en: "CHIPS Act"
aliases:
  - "美國晶片法案"
  - "晶片與科學法案"
  - "CHIPS and Science Act"
  - "CHIPS Act"
  - "晶片法"
category: "policy"
level: 2
short: "美國 2022 年通過的法律，用補助與租稅抵減吸引晶片廠回到美國設廠。"
definition: "美國《晶片與科學法案》（CHIPS and Science Act）於 2022 年 8 月 9 日簽署，為半導體撥款 527 億美元，其中 390 億美元用於製造補助、132 億美元用於研發與人才培育，另提供 25% 的先進製造投資租稅抵減。受補助企業 10 年內不得在中國等受關注國家擴充先進製程（大致指比 28 奈米更先進）的產能。主要補助包括台積電亞利桑那廠 66 億美元（2024 年 11 月定案）與 Intel 78.6 億美元。2025 年 8 月，美國政府把 Intel 尚未撥付的 57 億美元晶片法案補助與 32 億美元安全飛地（Secure Enclave）計畫款項，轉為以每股 20.47 美元認購 4.333 億股、相當於 9.9% 的股權，顯示補助政策正走向更直接的產業參與。對台灣而言，晶片法案是台積電赴美設廠的重要背景，也牽動美台之間的產能分工。"
example: "好比政府為了讓大型工廠回到本地，提供補助與減稅，但要求拿了補助的企業，不能把最先進的產能移往競爭對手的國家。"
