term: "UPS"
zh: "不斷電系統"
en: "Uninterruptible Power Supply"
aliases:
  - "不斷電系統"
  - "不斷電電源"
  - "Uninterruptible Power Supply"
  - "雙轉換 UPS"
  - "Online UPS"
category: datacenter
level: 1
short: >-
  市電中斷時立刻改由電池供電的設備，撐到備用發電機啟動，避免伺服器突然斷電當機。
definition: >-
  UPS（不斷電系統）是在市電中斷或電壓異常時，立即改由電池（或飛輪、超級電容）供電的設備。資料中心最常用線上式（雙轉換）UPS：電力先由整流器轉成直流、再由逆變器轉回交流，負載隨時與市電隔離，停電時沒有切換空檔；較便宜的離線式則可能有長達 25 毫秒的切換時間。UPS 電池的續航時間通常只有約 5 至 15 分鐘，目的不是長時間供電，而是撐到柴油發電機啟動，或讓設備安全關機。在傳統架構中，電力經 UPS 調節後，再透過 PDU 與匯流排送進機櫃。AI 叢集一次意外斷電就可能打斷長時間的訓練工作，因此 UPS 是機房電力鏈的關鍵環節，也是 Vertiv、施耐德電機（Schneider Electric）與伊頓（Eaton）等電力設備商的主力產品。
example: >-
  就像筆電的電池：拔掉插頭螢幕也不會黑掉。差別在於資料中心的 UPS 要撐起 MW 等級的負載，而且通常只需要撐到發電機接手的那幾分鐘。
