term: "CDU"
zh: "冷卻液分配裝置"
en: "Coolant Distribution Unit"
aliases:
  - "冷卻液分配裝置"
  - "冷卻液分配單元"
  - "冷卻分配單元"
  - "Coolant Distribution Unit"
  - "Cooling Distribution Unit"
  - "In-row CDU"
category: datacenter
level: 2
short: >-
  液冷系統的「心臟」：用泵浦把冷卻液送進機櫃，再透過熱交換器把熱轉給機房的冷卻水。
definition: >-
  CDU 是液冷系統中連接伺服器與機房設施的中繼設備，內含泵浦、熱交換器、過濾器與控制系統。它把流經機櫃冷板的冷卻迴路與機房的設施水迴路隔開：冷卻液在 CDU 內把熱交給設施水，再以穩定的溫度、壓力與流量送回機櫃，避免設施水的雜質與壓力波動直接進入伺服器。CDU 有裝在機櫃內的小型機種，也有放在機櫃列之間、供應整排機櫃的列間型（in-row）。Google 自研的 Project Deschutes CDU 採泵浦與熱交換器備援設計，2020 年以來全機群可用度約 99.999%，並宣布將第五代設計貢獻給開放運算計畫（OCP）；日本 Nidec 於 2025 年 12 月發表依此規格開發的原型機，冷卻能力達 2 MW 等級、供液壓力 80 PSI。CDU 一旦停擺，整排 GPU 都可能過熱降頻，因此可靠度與備援是選購重點。
example: >-
  就像汽車引擎的水泵加水箱：水泵推動冷卻液在引擎裡循環，水箱再把熱散到外面。CDU 扮演的就是資料中心裡「水泵加熱交換器」的角色。
