term: "實體 AI"
zh: "實體 AI"
en: "Physical AI"
aliases:
  - "Physical AI"
  - "物理 AI"
  - "實體人工智慧"
  - "具身 AI"
  - "Embodied AI"
category: robotics
level: 1
short: "讓 AI 走出螢幕、擁有「身體」：能感知真實世界，並透過機器人、車輛等機器做出動作。"
definition: "實體 AI 指能在真實物理世界中感知、理解、推理並採取行動的 AI 系統，載體包括機器人、自駕車、無人機與智慧攝影機。和只在螢幕上產生文字或圖片的生成式 AI 不同，它必須處理重力、摩擦與碰撞等物理限制，動作出錯還可能造成實際損害，因此特別依賴感測器、即時推論晶片，以及用模擬與合成資料來訓練。它把 AI 的需求從資料中心延伸到馬達、減速機、光達與邊緣運算晶片等硬體供應鏈。國際機器人聯合會（IFR）統計，2025 年全球工廠中運作的工業機器人達 500 萬台、當年新裝機超過 60 萬台；這些機器人多數仍依固定程式運作，正是實體 AI 想要升級的對象。"
example: "聊天機器人像是只會在紙上寫答案的顧問；實體 AI 則像能親自走進倉庫、看清貨架、把箱子搬到正確位置的員工，看、想、做都要一次完成。"
