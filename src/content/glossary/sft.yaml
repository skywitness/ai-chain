term: "SFT"
zh: "監督式微調"
en: "Supervised Fine-Tuning"
aliases:
  - "監督式微調"
  - "指令微調"
  - "Supervised Fine-tuning"
  - "Instruction Tuning"
category: training
level: 2
short: "給模型看大量「問題＋標準答案」範例，讓它模仿著學會遵循指令與回答格式。"
definition: "SFT（監督式微調）通常是後訓練的第一步：準備大量由人撰寫、或由較強模型生成再經篩選的「提示＋理想回答」配對，以一般監督式學習的方式訓練模型模仿這些示範。它能快速教會模型對話格式、遵循指令與特定風格，但只會模仿、不懂得比較好壞，所以通常還要接著做 RLHF 或 DPO。在 OpenAI 的 InstructGPT 研究中，SFT 資料集約有 1.3 萬筆提示；經 SFT 與 RLHF 後，13 億參數的 InstructGPT 在人工評估中，比 1,750 億參數的 GPT-3 更受偏好。"
example: "像新進客服先背熟一本「標準問答範本」，照著範本回覆客人；之後再靠主管的評分回饋，把回答修得更好。"
