# 名詞：Softmax（softmax）· 分類 ai-basics · 資料基準日 2026-10-06
term: "Softmax"
zh: "歸一化指數函數"
en: "Softmax Function"
aliases:
  - "Softmax Function"
  - "Softmax 函數"
  - "歸一化指數函數"
category: "ai-basics"
level: 3
short: "把一串任意分數轉換成總和為 1 的機率分布，分數愈高的選項分到愈大的機率。"
definition: "Softmax 把一組任意實數（常稱 logits）各自取指數、再除以全部的總和，轉成每項介於 0 到 1、總和恰為 1 的機率分布；原本分數愈高，機率放大得愈明顯。它出現在 AI 的兩個關鍵位置。一是輸出層：大型語言模型要對整個詞彙表計算下一個 Token 的機率，Llama 3 的詞彙表就有 12.8 萬個 Token。二是 Transformer 的注意力機制：用 softmax 把查詢（Q）與鍵（K）的相似度轉成權重，公式為 softmax(QKᵀ / √dₖ)·V。注意力中的 softmax 需要讀寫大量中間結果、容易受記憶體頻寬限制，FlashAttention 等技術因此專門重排這段運算，以減少對 HBM 的存取。"
example: "班級投票選班長：三位候選人的原始支持分數是 3、1、0.2，經過 softmax 後會變成約 84%、11%、5%，加起來剛好 100%。"
