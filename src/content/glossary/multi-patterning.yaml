term: "多重曝光"
zh: "多重圖形化曝光"
en: "Multi-patterning"
aliases:
  - "Multiple patterning"
  - "Multi-patterning"
  - "雙重曝光"
  - "Double patterning"
  - "SADP"
  - "SAQP"
  - "LELE"
category: "semiconductor"
level: 3
short: "把太密的電路圖形拆成多次曝光與蝕刻完成，讓微影機做出超越單次解析度的細線。"
definition: "多重曝光是當電路圖形的間距小於微影機單次曝光的解析度時，把圖形拆成兩次以上完成的技術。常見做法包括 LELE（微影—蝕刻—微影—蝕刻，把圖形分到兩張光罩），以及 SADP 與 SAQP（自對準雙重／四重圖形化，利用側壁間隔層把線距縮小為二分之一或四分之一）。台積電第一代 7 奈米（N7）仍以 DUV 浸潤式微影搭配多重曝光為主，2019 年量產的 N7+ 才成為台積電所稱業界第一個商用 EUV 製程。多重曝光的代價是光罩數、製程步驟、生產週期與疊對誤差風險都會增加，因此 EUV 與 High-NA EUV 的價值之一，就是減少多重曝光的步驟；反過來說，無法取得 EUV 的晶圓廠，只能更倚賴多重曝光推進製程。"
example: "就像用一支粗筆畫不出很密的格線時，先畫奇數線、再畫偶數線，兩次合起來就達到原本畫不出的密度，但花的時間更多，也更容易對不齊。"
