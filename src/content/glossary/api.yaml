category: "cloud-business"
level: 1
short: "讓程式彼此溝通的標準窗口；開發者透過模型 API，把 AI 能力接進自己的產品。"
definition: "API 定義了一個軟體可以怎麼向另一個軟體提出請求，以及會收到什麼格式的回應。在 AI 產業中，模型公司除了自家聊天產品，也透過 API 把模型賣給開發者：程式把提示詞送到雲端端點，模型生成結果後回傳，並依處理的 Token 數量計費。例如 Anthropic 的 Claude API 是位於 api.anthropic.com 的 RESTful API，以 API 金鑰驗證身分，另有批次處理 API，費用比一般請求低 50%。同一個模型也常透過 Amazon Bedrock、Google Cloud 等雲端平台提供，因此 API 是模型實驗室與雲端業者共同的重要營收管道。"
example: "像餐廳的菜單與點餐窗口：客人不必知道廚房怎麼煮，只要照菜單點餐，就會拿到餐點。"
