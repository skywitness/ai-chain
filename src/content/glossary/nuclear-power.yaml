term: "核能發電"
zh: "核能發電"
en: "Nuclear Power"
aliases:
  - "核電"
  - "核能"
  - "核分裂發電"
  - "Nuclear Energy"
  - "Nuclear Fission"
category: energy
level: 1
short: "利用鈾原子核分裂產生的熱來發電，幾乎不排碳又能全天候穩定供電，成為 AI 資料中心搶簽的電源。"
definition: "核能發電利用鈾燃料在反應爐內進行核分裂，產生的熱把水變成蒸汽，再推動汽輪機發電。它發電時幾乎不排放二氧化碳，又能 24 小時穩定運轉，正好符合 AI 資料中心「全天候、低碳」的用電需求，因此科技大廠近年密集簽約。微軟（Microsoft）2024 年 9 月與星座能源（Constellation）簽下 20 年購電合約，為 2019 年停機的三哩島 1 號機以「Crane 清潔能源中心」之名重啟鋪路，預計可為電網增加約 835 MW；Meta 2026 年 1 月宣布與 Vistra、泰拉能源（TerraPower）、Oklo 合作，到 2035 年支持最多 6.6 GW 的既有與新建核電。主要挑戰是新建成本高、工期長，以及核廢料處置與社會接受度。"
example: "核電廠可以想成一個超大的燒開水壺：差別在於「爐火」不是燃燒瓦斯，而是鈾原子分裂時放出的熱。"
