term: "機櫃功率密度"
zh: "機櫃功率密度"
en: "Rack Power Density"
aliases:
  - "機櫃密度"
  - "機架功率密度"
  - "每櫃功率"
  - "Rack Density"
  - "kW per rack"
category: datacenter
level: 2
short: >-
  單一機櫃消耗的電力（kW）。傳統機櫃約數 kW，AI 機櫃已超過 100 kW，正朝 1 MW 前進。
definition: >-
  機櫃功率密度指單一機櫃內所有設備的總耗電，通常以 kW 表示，它決定了機房的配電、散熱與樓板設計。Uptime Institute 2020 年的調查顯示，受訪樣本的平均密度約每櫃 8.4 kW，約 71% 的受訪者表示其最常見的機櫃密度低於 10 kW。AI 讓這個數字急速攀升：NVIDIA 指出，現行 AI 機櫃以 54V 直流在櫃內配電，GB200 與 GB300 NVL72 需要多達 8 個電源架；當單櫃超過 200 kW，這種做法開始碰到空間與銅材的物理極限；NVIDIA 因此規劃改用 800V 直流來支援 MW 等級機櫃，預計在 2027 年隨 Kyber 機櫃系統全面量產。密度越高，氣冷越難應付，必須改用液冷，配電也要改成更高電壓，因此帶動 800V 直流、CDU 與新型電源架的需求。對既有機房而言，電力與散熱容量往往比樓地板面積更早成為容納 AI 伺服器的限制。
example: >-
  傳統機櫃平均約 8 kW，一個 100 kW 以上的 AI 機櫃，等於把十幾個傳統機櫃的用電與發熱擠進同一個櫃子裡。
