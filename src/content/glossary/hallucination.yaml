term: "幻覺"
zh: "AI 幻覺"
en: "Hallucination"
aliases:
  - "AI 幻覺"
  - "模型幻覺"
  - "Hallucination"
  - "Confabulation"
category: llm
level: 1
short: "AI 用自信的語氣說出看似合理、其實錯誤或捏造的內容，例如不存在的論文或判例。"
definition: "幻覺是指語言模型產生流暢、看似可信，但與事實不符或無中生有的內容。成因在於模型是依機率預測下一個 Token，而不是查核事實；OpenAI 研究者在 2025 年的論文指出，現行訓練與評測方式常獎勵「猜答案」而非承認不確定，是幻覺持續存在的原因之一。2023 年美國紐約南區聯邦地院的 Mata v. Avianca 案中，律師提交 ChatGPT 捏造的判例，被處以 5,000 美元罰款。幻覺是企業導入 AI 的主要障礙之一，也帶動 RAG、引用來源、事實查核與評測工具等產品需求。"
example: "就像考試遇到不會的題目，學生硬寫一個看似合理的答案碰運氣；模型沒有被鼓勵說「我不知道」時，也會這樣「猜」。"
