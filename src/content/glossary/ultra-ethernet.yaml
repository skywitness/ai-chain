term: "Ultra Ethernet"
zh: "超乙太網路"
en: "Ultra Ethernet"
aliases:
  - "超乙太網路"
  - "UEC"
  - "Ultra Ethernet Consortium"
  - "超乙太網路聯盟"
  - "UEC 1.0"
category: networking
level: 2
short: "由超微、博通、Meta、微軟等推動，專為 AI 與高效能運算強化的開放乙太網路規格。"
definition: "超乙太網路是超乙太網路聯盟（UEC）制定的一整套通訊規格，目標是在保留乙太網路開放、低成本與多供應商優勢的同時，補上 AI 與高效能運算需要的低延遲與高可靠度。聯盟於 2023 年 7 月成立，隸屬 Linux 基金會體系，創始成員包括超微（AMD）、Arista、博通（Broadcom）、思科（Cisco）、Eviden、HPE、英特爾（Intel）、Meta 與微軟。UEC 1.0 規格於 2025 年 6 月 11 日發布，重點包括為乙太網路與 IP 網路設計的現代化 RDMA、低延遲傳輸層與壅塞控制，並宣稱可擴展到數百萬個端點。它常被視為 InfiniBand 的開放替代方案；博通 Tomahawk 6 交換器晶片已宣布符合 UEC 規格。對 AI 產業鏈而言，它是乙太網路陣營在 AI 後端網路與 InfiniBand 競爭的關鍵之一。"
example: "超乙太網路像把一般公路升級成有智慧號誌與專用車道的快速道路：路還是同一套標準，但塞車與封包遺失都大幅減少。"
