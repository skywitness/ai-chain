term: "表後供電"
zh: "電表後自建電源"
en: "Behind-the-Meter Generation"
aliases:
  - "表後發電"
  - "電表後供電"
  - "自建電源"
  - "現場發電"
  - "BTM"
  - "Behind the Meter"
  - "On-site Power"
category: energy
level: 2
short: "把發電設備直接設在用戶電表內側就地供電，不必等電網擴建；AI 園區常用燃機或燃料電池自建電源。"
definition: "這裡的「表」指電力公司的電表。表後供電是把燃氣渦輪機、燃料電池、電池儲能，甚至核電廠的電力直接接到用戶端，電不經過公用電網就送進資料中心；反之，經電網輸送再計量的則稱為「表前」。由於美國電網併網排隊動輒數年，AI 業者開始自建電源，或把資料中心蓋在電廠旁「共址」以加快上線。美國勞倫斯柏克萊國家實驗室（LBNL）指出，部分資料中心可能完全不接電網、自建發電，且備援與使用率的設計都和併網機房不同。燃料電池業者 Bloom Energy 2026 年 1 月發布的調查則顯示，超大規模雲端與託管業者預期 2030 年約有三分之一的資料中心會 100% 使用現場電源。代價是業者必須自行承擔備援、燃料與維運責任。"
example: "就像大樓等不到自來水公司擴管，乾脆在地下室自己打井、裝水塔；這些水不經過自來水公司的水表，就是「表後」。"
