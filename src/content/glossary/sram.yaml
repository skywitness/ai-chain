term: "SRAM"
zh: "靜態隨機存取記憶體"
en: "Static Random-Access Memory"
aliases:
  - "靜態記憶體"
  - "Static RAM"
  - "快取記憶體"
  - "On-chip SRAM"
category: "memory"
level: 2
short: "不需刷新、速度最快的記憶體，多做在處理器內當快取；每位元常用 6 個電晶體，容量小又昂貴。"
definition: "SRAM 以閂鎖電路儲存位元，最常見的是由 6 個電晶體儲存一個位元的 6T 單元。只要通電就能保存資料，不必像 DRAM 那樣定期刷新，速度最快，因此用作 CPU 與 GPU 內部的快取和暫存區；代價是每位元佔用的晶片面積大、成本高，容量遠小於 DRAM。處理器內的 SRAM 與邏輯電路一起在晶圓代工廠以先進製程生產，不需由記憶體廠供應。部分 AI 晶片主打以大量晶片內 SRAM 緩解記憶體牆，例如 Cerebras 的晶圓級晶片 WSE-3 內含 44 GB SRAM，讓資料不必頻繁進出外部記憶體。"
example: "SRAM 像廚師圍裙口袋裡的調味料，伸手就拿到、最快，但口袋只放得下幾樣東西。"
