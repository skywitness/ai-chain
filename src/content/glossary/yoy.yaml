term: "YoY"
zh: "年增率"
en: "Year-over-Year Growth"
aliases:
  - "年增率"
  - "年成長率"
  - "較去年同期"
  - "Year over Year"
  - "y/y"
category: "cloud-business"
level: 1
short: "本期數字與去年同期相比的成長幅度，可排除季節性因素，是看營收與獲利成長的基本指標。"
definition: "年增率（YoY）的計算方式是：（本期數字 − 去年同期數字）÷ 去年同期數字 × 100%。和上月或上季相比的月增率（MoM）、季增率（QoQ）容易受季節性與出貨時點影響，年增率則拿同一個季節比較，較能看出趨勢。例如台積電 2026 年 8 月營收年增 53.3%，同月的月增率則是 10.1%；2026 年第二季營收年增 36.0%。解讀時要注意基期：去年同期若特別低，年增率會被放大。比率本身的變化要用「個百分點」描述，例如毛利率由 60% 升到 65% 是增加 5 個百分點，而不是增加 5%。"
example: "今年 8 月賣出 153 碗麵、去年 8 月賣出 100 碗，年增率就是 53%；不和 7 月比，是為了避開暑假等季節因素。"
