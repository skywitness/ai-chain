term: "AI 浮水印"
zh: "AI 生成內容浮水印"
en: "AI Watermarking"
aliases:
  - "AI 生成內容浮水印"
  - "數位浮水印"
  - "AI Watermarking"
  - "AI Watermark"
  - "SynthID"
  - "AI 內容標記"
category: "policy"
level: 2
short: "在 AI 生成的文字、圖片、聲音或影片中嵌入難以察覺的標記，方便事後辨識來源。"
definition: "AI 浮水印是在生成內容中嵌入人眼或耳朵難以察覺、但演算法可以偵測的訊號，用來辨識內容是否由 AI 產生。代表例子是 Google DeepMind 的 SynthID，可為圖片、影片、音訊與文字加上浮水印；文字版則是在模型挑選下一個 Token 的取樣過程中做細微調整來嵌入訊號。2024 年 10 月 23 日刊登於《Nature》的論文指出，在近 2,000 萬則 Gemini 回應的線上實驗中，文字品質沒有受到影響。不過浮水印並非萬能，大幅編輯或用其他模型改寫都會削弱訊號。法規也帶動需求：歐盟 AI 法第 50 條要求生成式 AI 的輸出以機器可讀格式標記，並可被偵測為人工生成，自 2026 年 8 月 2 日起適用，此前已上市的系統可延到 2026 年 12 月 2 日；台灣《人工智慧基本法》也把「AI 產出應做適當資訊揭露或標記」列入透明原則。"
example: "就像鈔票上的隱形防偽線，平常看不出來，用專用機器一照就知道真假；AI 浮水印則讓偵測工具判斷一張圖或一段文字是否出自某個 AI 模型。"
