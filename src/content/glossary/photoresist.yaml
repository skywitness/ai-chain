term: "光阻"
zh: "光阻劑"
en: "Photoresist"
aliases:
  - "Photoresist"
  - "Resist"
  - "光阻劑"
  - "光刻膠"
category: "semiconductor"
level: 2
short: "塗在晶圓表面的感光材料，曝光後性質改變，顯影後留下電路圖形，是微影不可缺的化學品。"
definition: "光阻是旋轉塗佈在晶圓表面的感光高分子材料。曝光後，正型光阻被光照到的區域會溶於顯影液而被洗掉；負型光阻則相反，被照到的區域會變硬留下。顯影後留下的圖形，就成為後續蝕刻或離子植入的遮罩。先進製程普遍使用 1982 年由 Ito、Willson 與 Fréchet 提出的化學放大型光阻，利用曝光產生的酸催化反應來提高感光度。EUV 的光子數量少、能量高，對光阻的感光度、解析度與線邊粗糙度要求更嚴苛，光阻配方成為 EUV 製程能否提高產能與良率的關鍵之一。光阻屬於高度專業的化學材料，供應商集中在少數廠商，是半導體供應鏈中容易被忽略的關鍵環節。"
example: "光阻像相紙上的感光乳劑：照到光的地方起化學變化，泡進顯影液後，圖案就顯現出來。"
