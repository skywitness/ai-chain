term: "OEM"
zh: "原廠委託製造"
en: "Original Equipment Manufacturer"
aliases:
  - "原廠委託製造"
  - "代工生產"
  - "伺服器品牌廠"
  - "Original Equipment Manufacturer"
category: hardware
level: 1
short: "原意是照客戶規格代工生產；在伺服器產業則常指戴爾、HPE、美超微等自有品牌的系統廠。"
definition: "OEM 是一個容易混淆的詞。台灣製造業的傳統用法中，OEM 指「照客戶的設計圖代工生產」，設計與品牌都屬於客戶，代工廠主要賺取製造費用。但在伺服器與 PC 產業，OEM 通常反過來指擁有品牌、直接賣給企業客戶的系統廠，例如戴爾、HPE、聯想與美超微（Supermicro）：它們負責部分設計，生產可能外包給 ODM 或自行組裝，並提供銷售、保固、維修與軟體整合服務。AI 伺服器市場中，品牌 OEM 的客戶以企業、政府與新雲業者為主，大型雲端業者則多直接向 ODM 採購。以規模來看，戴爾 FY2027 第二季（截至 2026 年 7 月 31 日）AI 伺服器接單 609 億美元、營收 164 億美元。"
example: "同一台 AI 伺服器，可能由台灣 ODM 設計與組裝，再掛上美國品牌 OEM 的商標賣給銀行；銀行買到的不只是硬體，還有品牌商的保固、維修與整合服務。"
