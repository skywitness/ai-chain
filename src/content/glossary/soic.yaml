term: "SoIC"
zh: "系統整合晶片"
en: "System on Integrated Chips"
aliases:
  - "TSMC-SoIC"
  - "SoIC-X"
  - "System on Integrated Chips"
  - "3D 晶片堆疊"
category: "packaging"
level: 3
short: "台積電的 3D 晶片堆疊技術：把晶粒直接上下疊合、以極密的接點相連，外觀就像一顆單晶片。"
definition: "SoIC 是台積電（TSMC）3DFabric 平台中的晶圓級 3D 堆疊技術，把不同功能、甚至不同製程節點的已知良好晶粒（KGD）上下直接接合，接合間距從 10 微米以下起跳，連線比 2.5D 封裝的微凸塊更短更密，因此頻寬、功耗、供電與訊號品質都更好。SoIC-X 分為晶片對晶圓（chip-on-wafer）與晶圓對晶圓（wafer-on-wafer）兩種，後者用極細的矽穿孔降低寄生效應，適合良率高、晶粒尺寸相同的設計。堆疊完成的晶片從外觀看就像一顆普通 SoC，可再放進 CoWoS 或 InFO 封裝，例如先把運算與快取晶粒疊在一起，再與 HBM 做 2.5D 整合。台積電表示其 3 奈米晶片堆疊技術已於 2025 年量產，並規劃 2029 年提供 A14 對 A14 的 SoIC。在晶粒平面面積受限下，SoIC 是 AI 晶片繼續增加電晶體與頻寬的關鍵路線。"
example: "2.5D 像把房間並排蓋在同一層樓，SoIC 則是直接往上加蓋樓層，而且樓層之間用密密麻麻的電梯直通，上下移動幾乎不花時間。"
