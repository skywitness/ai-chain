# 名詞：AI（ai）· 分類 ai-basics · 資料基準日 2026-10-06
term: "AI"
zh: "人工智慧"
en: "Artificial Intelligence"
aliases:
  - "人工智慧"
  - "Artificial Intelligence"
  - "A.I."
category: "ai-basics"
level: 1
short: "讓電腦完成原本需要人類智慧的工作，例如看懂圖片、理解語言、下棋與寫程式。"
definition: "人工智慧（AI）泛指讓機器執行感知、理解、推理、學習與生成等「需要智慧」任務的技術總稱。1956 年美國達特茅斯學院的夏季研究計畫被視為 AI 成為獨立研究領域的起點，「人工智慧」一名也由此而來；發起人 John McCarthy 在提案中主張：學習與智慧的各個面向，原則上都能被精確描述到讓機器加以模擬。今天的 AI 以機器學習、特別是深度學習為主流，大型語言模型是最具代表性的成果。對產業鏈而言，AI 是需求源頭：近年電力、晶片、記憶體、伺服器、資料中心與雲端的新一波大規模投資，多半由 AI 需求帶動。史丹佛大學人本 AI 研究院（HAI）的《2026 AI Index》統計，美國 2025 年民間 AI 投資達 2,859 億美元；報告也指出，組織層面的 AI 採用率已達 88%。"
example: "手機相簿自動把照片分成「人物」「美食」「風景」，背後就是影像辨識 AI；導航預測塞車、和聊天機器人對話，也都是 AI 的應用。"
