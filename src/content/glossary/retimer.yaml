term: "Retimer"
zh: "訊號重定時器"
en: "Retimer"
aliases:
  - "重定時器"
  - "訊號重定時器"
  - "PCIe Retimer"
  - "Smart DSP Retimer"
  - "重定時晶片"
category: networking
level: 3
short: "接收衰減的高速訊號、還原資料與時脈後再重新送出的晶片，用來延長 PCIe 等高速連線的傳輸距離。"
definition: "Retimer 是放在高速連線中途的訊號調理晶片。訊號速度越快，在電路板與線材上的衰減就越嚴重，能傳的距離也越短；Retimer 會先完整接收已變形的訊號，還原出原始資料並取出內嵌時脈，再用乾淨的時脈重新送出一份全新的訊號。它和只負責放大訊號的 Redriver 不同：Redriver 的功耗與延遲較低，但不會重置累積的抖動，雜訊也會跟著被放大。在 AI 伺服器中，CPU、GPU、網卡與 SSD 之間的 PCIe 走線很長，PCIe 6 速度達 64 GT/s，常需加裝 Retimer；Astera Labs 表示其 Aries Retimer 可額外補償 40 dB 以上的通道損耗。乙太網路的 AEC 線材也在接頭內建類似晶片。主要供應商包括 Astera Labs、博通（Broadcom）與 Credo 等。"
example: "像長途接力賽：與其讓同一位跑者越跑越累（訊號衰減），不如在中途換一位體力充沛的跑者，以標準速度跑完下一段。"
