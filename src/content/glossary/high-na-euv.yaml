term: "High-NA EUV"
zh: "高數值孔徑極紫外光微影"
en: "High Numerical Aperture EUV"
aliases:
  - "High NA EUV"
  - "高 NA EUV"
  - "EXE:5000"
  - "EXE:5200B"
  - "0.55 NA EUV"
category: "semiconductor"
level: 3
short: "把 EUV 數值孔徑從 0.33 提高到 0.55 的新一代微影，單次曝光可印出更細圖形，瞄準 2 奈米以下。"
definition: "High-NA EUV 是 ASML 的新一代 EUV 平台（EXE 系列），把光學系統的數值孔徑從 0.33 提高到 0.55，解析度由 13 奈米提升到 8 奈米。ASML 表示，EXE:5200B 單次曝光可印出的圖形尺寸比 NXE 系統縮小 1.7 倍、電晶體密度提高 2.9 倍，每小時產能至少 175 片晶圓（曝光劑量 50 mJ/cm² 時），可減少多重曝光步驟。代價是採用變形（anamorphic）光學設計，單次曝光範圍只有標準 26 × 33 毫米的一半，大晶粒需要拼接；機台價格據報導約 3.6 億美元。英特爾於 2024 年 4 月完成首台商用 EXE:5000 的組裝，2025 年底再安裝 EXE:5200B 準備用於 14A 製程；據報導台積電規劃中的 A13、A12 仍不需 High-NA。各晶圓廠的導入時程不一，是 2 奈米之後 AI 晶片能否持續微縮的關鍵變數。"
example: "如果把 EUV 比作相機，High-NA 就是換上口徑更大的鏡頭：拍得更清楚，但一張照片能涵蓋的畫面只剩一半。"
