term: "NIC"
zh: "網路介面卡"
en: "Network Interface Card"
aliases:
  - "網卡"
  - "網路卡"
  - "網路介面卡"
  - "Network Interface Card"
  - "SuperNIC"
  - "SmartNIC"
  - "智慧網卡"
category: networking
level: 2
short: "伺服器連上網路的介面卡；AI 伺服器常是一顆 GPU 配一張高速網卡，速度已達 800 Gb/s 以上。"
definition: "網路介面卡（NIC）是伺服器與網路之間的出入口，負責把主機記憶體裡的資料打包成網路封包送出，並接收外部傳來的資料。一般伺服器只需要一兩張網卡，但 AI 伺服器的後端網路通常讓每顆 GPU 搭配一張專屬高速網卡，並支援 RDMA，讓資料不必經過 CPU 就能在 GPU 記憶體與網路之間直接搬運。輝達（NVIDIA）把這類產品稱為 SuperNIC：BlueField-3 為 400 Gb/s、ConnectX-8 為 800 Gb/s 並支援 PCIe Gen6，ConnectX-9 更達 1.6 Tb/s。若網卡再整合 CPU 核心，負責儲存、資安與虛擬化等基礎設施工作，就稱為 DPU（資料處理器）。網卡速度通常與交換器、光模組同步升級，主要業者包括輝達與博通（Thor 系列）等。"
example: "網卡像大樓的收發室：信件（資料）出門前先在這裡封裝、貼上地址，外面寄來的包裹也在這裡簽收，再送到各樓層的 GPU 或 CPU。"
