term: "電網"
zh: "電網"
en: "Power Grid"
aliases:
  - "電力網"
  - "輸配電網"
  - "電力系統"
  - "Grid"
  - "Electric Grid"
  - "Electrical Grid"
category: energy
level: 1
short: "把發電廠的電經由高壓輸電線、變電所與配電線送到用戶的整套網路，是資料中心取得電力的主要管道。"
definition: "電網由發電、輸電（高壓長距離輸送）、變電（升壓與降壓）與配電（送到用戶）幾個環節組成，而且必須隨時維持發電與用電平衡，否則頻率失穩可能引發大停電。AI 資料中心動輒數百 MW 甚至 GW 等級，要接上電網往往得新建變電所與輸電線，花的時間常比蓋機房還久。美國勞倫斯柏克萊國家實驗室（LBNL）2026 年 6 月的報告估計，美國資料中心 2024 年用電 192 TWh，佔全國用電 4.7%；基準情境下 2030 年將達 649 TWh、約佔 11.8%（各情境區間 9.5%–15.3%）。若假設併網容量的平均使用率為 50%，2030 年約需 148 GW 的併網容量。電網擴建能否跟上，已成為 AI 算力擴張速度的關鍵限制之一。"
example: "電網像城市的自來水系統：發電廠是水庫，高壓輸電線是主幹水管，變電所是調壓站，配電線是接到每棟大樓的支管。新蓋一座 AI 資料中心，就像突然多出一座用水量等於整個城鎮的工廠，主幹水管不夠粗就接不上。"
