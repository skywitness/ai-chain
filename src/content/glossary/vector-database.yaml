term: "向量資料庫"
zh: "向量資料庫"
en: "Vector Database"
aliases:
  - "向量資料庫"
  - "Vector Database"
  - "Vector DB"
  - "向量搜尋"
  - "向量索引"
category: llm
level: 2
short: "專門儲存嵌入向量，並能快速找出「意思最相近」資料的資料庫，是 RAG 與語意搜尋的基礎。"
definition: "向量資料庫用來儲存大量嵌入向量，並支援「近似最近鄰搜尋」（ANN），在大量資料中快速找出與查詢向量最相似的項目，而不必逐筆比對。常見的索引技術包括 2016 年提出的 HNSW（分層可導航小世界圖），其搜尋複雜度可隨資料量呈對數成長。產品形態有專用的向量資料庫，也有在既有資料庫加上向量功能者，例如 PostgreSQL 的開源擴充套件 pgvector，同時支援精確與近似最近鄰搜尋。向量資料庫是 RAG 與 AI Agent 記憶功能的基礎設施，屬於產業鏈中的開發工具與資料平台環節。"
example: "傳統資料庫像依書名查書；向量資料庫則像告訴館員「我想找跟這本書感覺很像的書」，館員能依內容相似度推薦。"
