category: "semiconductor"
level: 1
short: "晶圓廠替每一代製造技術取的代號，例如 3 奈米、2 奈米；新一代通常更密、更快、更省電。"
definition: "製程節點是晶圓廠替每一代製造技術取的名稱，例如 7 奈米、3 奈米、2 奈米，台積電寫作 N7、N3、N2，更新的 A16 則以「埃」（Å）命名。早年這個數字大致對應電晶體閘極長度，如今已成為代表「新一代」的商業名稱，與實際尺寸沒有直接關係：國際元件與系統路線圖（IRDS）2021 年的表格中，「3 奈米」節點的閘極間距約 48 奈米、金屬間距約 24 奈米。新節點通常能在相同功耗下提升效能，或在相同效能下降低功耗，並提高電晶體密度。台積電表示 N2 已於 2025 年第四季量產，並在 2025 年年報中表示 N2P 排定 2026 年下半年量產；2 奈米家族被視為新一代 AI 加速器的重要製程。"
example: "製程節點像手機的型號代數：iPhone 16 不代表任何零件有 16 公分，「3 奈米」也不代表電晶體真的只有 3 奈米寬，而是比上一代更密、更省電的意思。"
