term: "RAG"
zh: "檢索增強生成"
en: "Retrieval-Augmented Generation"
aliases:
  - "檢索增強生成"
  - "Retrieval-Augmented Generation"
  - "檢索增強"
  - "知識庫問答"
category: llm
level: 2
short: "先從資料庫或文件中檢索相關內容，再交給模型參考作答的技術，可減少幻覺並使用最新資料。"
definition: "RAG（檢索增強生成）是在模型作答前，先用關鍵字搜尋或向量檢索，從外部資料（企業文件、網頁、資料庫）找出相關段落，連同問題一起放進 Prompt，讓模型「看著資料回答」。這個名稱來自 2020 年 Facebook AI Research 等團隊的論文，當時結合預訓練語言模型與維基百科的向量索引，在三項開放領域問答任務創下最佳成績。RAG 不必重新訓練模型就能接上私有或最新資料，還能附上引用來源，是企業導入生成式 AI 最常見的架構之一，也帶動嵌入模型、向量資料庫與搜尋服務的需求。"
example: "像開書考試：學生不必背下所有內容，而是先翻到相關章節，再根據課本寫答案，答錯的機率就低很多。"
