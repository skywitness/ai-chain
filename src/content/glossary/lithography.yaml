term: "微影"
zh: "微影製程"
en: "Lithography"
aliases:
  - "Lithography"
  - "Photolithography"
  - "曝光"
  - "黃光"
  - "光刻"
  - "光學微影"
category: "semiconductor"
level: 1
short: "用光把光罩上的電路圖形「印」到晶圓上的步驟，決定晶片能做得多細，是製程的核心。"
definition: "微影是晶片製造中把電路圖形轉印到晶圓上的步驟：先在晶圓塗上感光的光阻，再讓光線經過刻有電路圖形的光罩，透過鏡頭縮小後照射到晶圓上，顯影後留下圖形，接著才進行蝕刻或沉積。一顆先進晶片需要重複數十次微影。能印出的最小尺寸取決於光的波長與鏡頭的數值孔徑（NA），因此業界從 248 奈米、193 奈米的深紫外光（DUV），一路推進到 13.5 奈米的極紫外光（EUV）。微影機以艾司摩爾（ASML）為主導，EUV 機台更是 ASML 獨家供應，是 AI 晶片製造中最關鍵、也最受出口管制關注的設備之一。"
example: "微影就像沖洗照片或網版印刷：光罩是底片，光阻是相紙，曝光、顯影之後，圖案就留在晶圓上。"
