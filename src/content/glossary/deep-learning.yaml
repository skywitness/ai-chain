# 名詞：深度學習（deep-learning）· 分類 ai-basics · 資料基準日 2026-10-06
term: "深度學習"
zh: "深度學習"
en: "Deep Learning"
aliases:
  - "Deep Learning"
  - "DL"
  - "深層學習"
category: "ai-basics"
level: 1
short: "用很多層神經網路，從原始資料中一層層自動學出特徵的機器學習方法，是當今 AI 的主流。"
definition: "深度學習是使用多層（也就是「深」）神經網路的機器學習方法。LeCun、Bengio 與 Hinton 在 2015 年《Nature》的回顧文章中指出，它讓由多個處理層組成的模型自動學出多層次的資料表示，不必再由人工設計特徵。轉捩點是 2012 年的 AlexNet：這個擁有 6,000 萬個參數的卷積神經網路，用 GPU 訓練 ImageNet 約 130 萬張圖片、分辨 1,000 個類別，成績明顯超越當時最佳方法。此後語音辨識、機器翻譯到大型語言模型都轉向深度學習。它的運算以大量矩陣乘法為主，正適合 GPU 平行處理，這是 GPU 從遊戲顯示卡走向資料中心核心零件的技術背景。"
example: "辨識貓的照片時，網路前幾層只學會邊緣與色塊，中間幾層組合出耳朵、眼睛，最後幾層才判斷「這是一隻貓」，全程不需要人告訴它貓耳長什麼樣子。"
