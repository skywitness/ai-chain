term: "Tokenizer"
zh: "分詞器"
en: "Tokenizer"
aliases:
  - "分詞器"
  - "斷詞器"
  - "Tokenization"
  - "分詞"
  - "BPE"
  - "位元組對編碼"
category: llm
level: 2
short: "把文字切成 Token 並轉成編號的工具，決定模型如何「斷字」，也影響費用與多語言效率。"
definition: "分詞器負責把原始文字切成 Token，並對應到詞彙表中的編號；模型輸出時再反向轉回文字。主流做法是子詞（subword）分詞，例如 2015 年被引入神經機器翻譯的位元組對編碼（BPE）：從字元（或位元組）開始，反覆合併最常一起出現的片段。詞彙表規模持續擴大，OpenAI 的 GPT-2 編碼約有 5 萬個 Token，GPT-4o 等模型使用的 o200k_base 則約 20 萬個。同一段文字在不同分詞器下的 Token 數不同，會直接影響 API 費用、上下文能容納的內容量與推論速度，也是多語言模型設計的重要考量。"
example: "像把一篇文章剪成拼圖片：常見的詞剪成一大片，罕見的詞拆成好幾小片；片數越多，模型要處理的量就越大。"
