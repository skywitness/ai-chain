term: "矽盾"
zh: "矽盾"
en: "Silicon Shield"
aliases:
  - "矽之盾"
  - "Silicon Shield"
  - "矽盾理論"
category: "policy"
level: 2
short: "認為台灣在先進晶片製造的關鍵地位，能嚇阻武力衝突並換取國際支持的論點。"
definition: "矽盾是一種地緣政治論點：全球經濟高度依賴台灣製造的半導體，任何對台灣的軍事行動都會重創中國、美國與全世界的經濟，因此台灣的晶片產業本身就是一種嚇阻力量。這個說法在 2000 年前後開始流行，例如《紐約時報》2000 年 9 月的評論〈A 'Silicon Shield' Protects Taiwan From China〉。據維基百科彙整，2020 年代初台積電生產了全球 90% 以上最先進世代的晶片。反對者認為，北京未必依照西方眼中的經濟理性行事；而台積電在 2025 年 3 月宣布把在美國的總投資擴大到 1,650 億美元，也讓外界討論先進產能外移是否會削弱矽盾。對 AI 產業鏈而言，矽盾一詞濃縮了「最先進 AI 晶片高度集中在台灣」帶來的風險與議價力。"
example: "就像一座全村都離不開的水廠，誰都不希望它被破壞；台灣的先進晶片廠在全球供應鏈中扮演類似的角色。"
