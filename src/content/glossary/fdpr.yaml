term: "FDPR"
zh: "外國直接產品規則"
en: "Foreign Direct Product Rule"
aliases:
  - "外國直接產品規則"
  - "外國生產直接產品規則"
  - "Foreign Direct Product Rule"
  - "FDP Rule"
  - "長臂管轄"
category: "policy"
level: 3
short: "美國出口管制的延伸規則：外國工廠用美國技術或設備做出的產品，也可能受美國管轄。"
definition: "外國直接產品規則（FDPR）是美國《出口管理條例》（EAR）中的規定：產品即使在美國境外製造，只要是特定美國技術或軟體的「直接產品」，或是由本身屬於這類直接產品的工廠或主要設備所生產，就可能受美國出口管制。由於先進晶片製造高度依賴美國的設備、EDA 軟體與技術，FDPR 讓美國能把管制延伸到台灣、日本、韓國等地的工廠。2020 年 5 月與 8 月，BIS 兩度針對華為修訂 FDPR，使使用美國技術的晶圓代工廠必須取得許可，才能替華為生產晶片。2024 年 12 月 2 日起，BIS 又新增多項 FDP 規則，限制外國製造的部分半導體設備流向受關注的國家與實體，以削弱其生產先進製程晶片的能力；同一批規則也新增對部分 HBM（高頻寬記憶體）的管制。FDPR 是美國科技管制的「長臂」，對台灣的晶圓代工、封測與設備材料供應鏈影響最直接。"
example: "就像用某家公司的專利模具做出的零件，即使在別國工廠生產，專利方仍能決定這些零件可以賣給誰。"
