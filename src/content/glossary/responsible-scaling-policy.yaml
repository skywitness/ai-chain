term: "RSP"
zh: "負責任擴展政策"
en: "Responsible Scaling Policy"
aliases:
  - "負責任擴展政策"
  - "負責任擴充政策"
  - "Responsible Scaling Policy"
  - "AI 安全等級"
  - "ASL"
  - "AI Safety Level"
category: "policy"
level: 3
short: "Anthropic 提出的自律框架：模型能力越強，就必須先具備越嚴格的安全防護。"
definition: "負責任擴展政策（RSP）是 Anthropic 在 2023 年 9 月 19 日首度發布的自律框架，核心概念是「能力門檻對應防護標準」：當模型在協助製作化學、生物、放射與核子（CBRN）武器，或自動化 AI 研發等危險能力上達到預設門檻，就必須採取對應 AI 安全等級（ASL）的部署與資安標準。2025 年 5 月 22 日，Anthropic 隨 Claude Opus 4 預防性地啟用 ASL-3 防護，包括針對 CBRN 濫用的部署措施，以及超過 100 項防止模型權重被竊的資安控制。RSP 3.0 在 2026 年 2 月 24 日全面改寫，把公司自身承諾與給整個產業的建議分開，並新增前沿安全路線圖與每 3 到 6 個月發布的風險報告（Risk Report），在特定情況下須接受外部審查；目前的 3.4 版自 2026 年 7 月 8 日生效。OpenAI 的 Preparedness Framework、Google DeepMind 的 Frontier Safety Framework 也採類似概念。這類框架直接影響前沿模型的發布節奏、資安投資與營運成本。"
example: "就像實驗室依病原體的危險程度分成 BSL-1 到 BSL-4，研究越危險的病毒就需要越嚴密的設施；RSP 的 ASL 等級也是同樣的思路。"
