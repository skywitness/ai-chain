term: "RLVR"
zh: "可驗證獎勵強化學習"
en: "Reinforcement Learning with Verifiable Rewards"
aliases:
  - "可驗證獎勵強化學習"
  - "基於可驗證獎勵的強化學習"
  - "RL with Verifiable Rewards"
category: training
level: 3
short: "用程式自動判斷答案對錯（例如核對數學解答、執行程式測試）當作獎勵，以強化學習訓練模型推理。"
definition: "RLVR 以「可自動驗證的結果」取代人類偏好或獎勵模型，作為強化學習的獎勵：數學題比對標準答案、程式碼執行單元測試、指令格式用規則檢查，答對才給分。這個名稱由 Ai2（艾倫人工智慧研究所）在 2024 年的 Tülu 3 論文提出；DeepSeek-R1-Zero 也以規則式獎勵進行純強化學習，AIME 2024 數學測驗的 pass@1 由 15.6% 提升到 71.0%。因為獎勵規則明確、可大量自動產生，RLVR 成為推理模型的核心訓練方法之一；不過訓練過程需要模型大量生成答案再逐一驗證，運算負擔有很大一部分落在推論上，而且只適用於答案能客觀判定的任務。"
example: "像用自動閱卷機批改數學考卷：答案對就得分、錯就不得分，學生（模型）自己摸索出能穩定答對的解題方法。"
