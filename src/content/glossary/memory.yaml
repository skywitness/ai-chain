term: "記憶體"
zh: "記憶體"
en: "Memory"
aliases:
  - "主記憶體"
  - "RAM"
  - "Computer Memory"
  - "Main Memory"
category: "memory"
level: 1
short: "電腦存放正在處理的程式與資料的地方；速度快但容量有限，AI 晶片的效能常被它卡住。"
definition: "記憶體是電腦存放「正在處理」的程式與資料的元件，處理器運算時必須不斷從記憶體讀寫資料。半導體記憶體分兩大類：斷電後資料消失的揮發性記憶體（如 DRAM、SRAM），以及斷電後仍能保存資料的非揮發性記憶體（如 NAND Flash，多做成 SSD 等「儲存」裝置）。在 AI 產業鏈中，模型權重、訓練過程的中間結果與推論時的 KV Cache 都要放在記憶體裡，容量與頻寬常比算力更早成為瓶頸，因此 HBM、DRAM 與 NAND 成為這波 AI 投資中需求最強的零組件之一。以美光（Micron）為例，2026 財年（截至 2026 年 9 月 3 日）營收達 1,331.9 億美元，約為前一年 373.8 億美元的 3.6 倍。"
example: "把處理器想成廚師，記憶體就是手邊的料理台：台面越大、拿取越快，廚師就越不必一直跑去倉庫（硬碟）找材料。"
