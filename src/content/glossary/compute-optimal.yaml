term: "運算最適化"
zh: "運算最適訓練"
en: "Compute-optimal Training"
aliases:
  - "Chinchilla 定律"
  - "算力最佳配置"
  - "Compute-optimal"
  - "Chinchilla Scaling"
category: training
level: 3
short: "在固定算力預算下，找出模型大小與訓練資料量的最佳搭配，讓表現最好。"
definition: "運算最適訓練是指在固定的訓練算力預算下，選擇能讓模型損失最低的參數量與訓練 Token 數組合。DeepMind 在 2022 年的 Chinchilla 研究訓練了超過 400 個模型，發現參數量與資料量應等比例成長，並以 700 億參數、1.4 兆個 Token 訓練出的 Chinchilla，在相同算力下勝過 2,800 億參數的 Gopher，大約相當於每個參數配 20 個 Token。不過「訓練最劃算」不等於「部署最劃算」：Meta 的 Llama 3 旗艦模型大致符合運算最適，較小的模型則刻意訓練得遠超最適點，以換取在相同推論成本下更好的表現。這個取捨直接影響訓練與推論算力的分配。"
example: "同一筆裝潢預算，要買大房子配簡單裝潢，還是小一點的房子配精緻裝潢？Chinchilla 的答案是兩者要等比例搭配，才住得最舒服。"
