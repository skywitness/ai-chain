term: "AI 安全"
zh: "AI 安全"
en: "AI Safety"
aliases:
  - "人工智慧安全"
  - "AI 安全性"
  - "AI 安全研究"
  - "AI Safety"
category: "policy"
level: 1
short: "研究如何讓 AI 系統不出意外、不被濫用，行為也符合人類意圖的領域。"
definition: "AI 安全是一門跨領域研究，目標是避免 AI 系統因意外、誤用或失控造成傷害。常見子題包括對齊（讓模型的目標符合人類意圖）、穩健性（抵抗攻擊與異常輸入）、監測，以及理解模型內部運作的可解釋性。隨著模型能力提升，各國政府也投入其中：英國在 2023 年 11 月舉辦首屆 AI 安全峰會；由圖靈獎得主 Yoshua Bengio 主持的《國際 AI 安全報告》2026 年版於 2026 年 2 月 3 日發布，由逾 100 位專家撰寫，獲 30 多個國家與國際組織支持。對產業鏈而言，危險能力評估、紅隊演練與防護措施已成為前沿模型發布前的固定流程，直接影響模型公司的研發成本、上市時程與法規遵循。"
example: "就像新車上市前要做撞擊測試，前沿模型公開前也會先接受危險能力評估，例如確認它不會輕易教人製作生化武器。"
