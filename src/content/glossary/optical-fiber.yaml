term: "光纖"
zh: "光纖"
en: "Optical Fiber"
aliases:
  - "Optical Fiber"
  - "Optical Fibre"
  - "Fiber Optic"
  - "光纖纜線"
  - "單模光纖"
  - "多模光纖"
category: networking
level: 1
short: "用和頭髮差不多粗的玻璃細絲傳送光訊號，損耗極低，是資料中心與長途網路的主要傳輸介質。"
definition: "光纖是用高純度石英玻璃拉成的細絲，光在核心裡靠全反射一路前進。常見的單模光纖核心直徑約 8 至 10 微米，外層包層約 125 微米，和頭髮粗細相近。它的訊號衰減極低，在 1.55 微米波長附近約每公里 0.2 dB，而且頻寬大、不受電磁干擾，所以長途電信與資料中心都仰賴它。單模光纖適合長距離；多模光纖核心較粗，適合短距離。1970 年康寧（Corning）的研究人員首次做出衰減低於每公里 20 dB 的實用光纖，開啟光通訊時代。AI 叢集的 GPU 與交換器之間動輒數萬條連線，距離一超過數公尺，銅線就難以承載高速訊號，必須改用光纖，因此 AI 建置也帶動光纖、連接器與佈線工程的需求。"
example: "光纖像一條內壁全是鏡子的細管，光在裡面不斷反彈前進；超低損耗光纖走完 10 公里，仍能保留將近 71% 的光能量。"
