term: "燃氣渦輪機"
zh: "燃氣渦輪機"
en: "Gas Turbine"
aliases:
  - "燃氣輪機"
  - "燃機"
  - "氣渦輪機"
  - "Combustion Turbine"
  - "Gas Turbine"
category: energy
level: 2
short: "燃燒天然氣推動渦輪發電的設備，啟動快、建置相對快，是 AI 資料中心自建電源的主要選項之一。"
definition: "燃氣渦輪機先把空氣壓縮，與天然氣混合燃燒，再讓高溫高壓氣體推動渦輪、帶動發電機。若再利用排氣餘熱產生蒸汽、推動第二部汽輪機，就是效率更高的「複循環」機組。以奇異維諾瓦（GE Vernova）的 7HA 機型為例，官方規格為單機簡單循環出力 290–430 MW、複循環淨效率 63%–64%，燃機從啟動到滿載約 10–21 分鐘。由於電網擴建趕不上 AI 用電，許多業者轉向自建燃氣電廠，帶動燃機需求大幅成長：GE Vernova 2026 年第二季的燃氣發電設備在手訂單加產能預留協議由 100 GW 增至 116 GW，預期年底至少 125 GW，並計畫把燃機年產能從 2026 年第三季的 20 GW 提高到 2028 年 24 GW、2030 年 30 GW。缺點是仍會排碳，且成本受天然氣價格影響。"
example: "燃氣渦輪機的原理和噴射客機的引擎很像：吸進空氣、加壓、噴油燃燒，只是它把轉動的力量拿來發電，而不是推動飛機前進。"
