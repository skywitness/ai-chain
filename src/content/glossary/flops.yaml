term: "FLOPS"
zh: "每秒浮點運算次數"
en: "Floating-point Operations per Second"
aliases:
  - "FLOP/s"
  - "每秒浮點運算"
  - "浮點運算次數"
  - "TFLOPS"
  - "PFLOPS"
  - "EFLOPS"
category: hardware
level: 2
short: "衡量晶片每秒能做多少次浮點數計算的單位，是比較 AI 晶片算力最常用的指標。"
definition: "FLOPS 表示每秒可完成的浮點運算次數，常加上 T（10¹²）、P（10¹⁵）、E（10¹⁸）等字首。比較 AI 晶片的 FLOPS 時要注意三件事：一是精度，同一顆晶片在 FP4、FP8 等低精度下的數字遠高於 FP16；二是規格表是否計入「稀疏」加速，計入後的數字會比較高；三是峰值不等於實際可用的算力，訓練時真正用上的比例另以 MFU 衡量。例如輝達 GB200 NVL72 整櫃的 NVFP4 算力，計入稀疏加速時標為 1,440 PFLOPS，不計入時為 720 PFLOPS；FP8 標示的 720 PFLOPS 也是稀疏規格，密集運算約為一半。另一個相近的詞 FLOP（沒有 S）指運算「總量」，常用來衡量訓練一個模型共花了多少算力；歐盟 AI 法就以訓練運算量超過 10²⁵ 次浮點運算，作為推定通用 AI 模型具「高影響能力」的門檻。"
example: "一台峰值 720 PFLOPS 的機櫃，每秒最多可完成 7.2 × 10¹⁷ 次運算。就算讓 80 億人每人每秒算一題，也要連續算約 2.9 年，才抵得上它 1 秒的運算量。"
