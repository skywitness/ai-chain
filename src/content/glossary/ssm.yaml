term: "SSM"
zh: "狀態空間模型"
en: "State Space Model"
aliases:
  - "狀態空間模型"
  - "State Space Model"
  - "State Space Models"
  - "Mamba"
  - "選擇性狀態空間模型"
category: llm
level: 3
short: "以固定大小的「狀態」逐步記住前文的序列模型，運算量隨長度線性成長，是 Transformer 的替代架構之一。"
definition: "狀態空間模型（SSM）源自控制理論，用一組隨時間更新的隱藏狀態來壓縮並傳遞前文資訊。不同於標準注意力要比對所有 Token、運算量隨長度平方成長，SSM 的運算量與序列長度呈線性關係，生成時也不必保存隨長度增加的 KV Cache。2023 年 12 月發表的 Mamba 加入「選擇性」機制，論文指出其推論吞吐量可達 Transformer 的 5 倍，3B 規模即可媲美兩倍大的 Transformer。實務上多以混合架構落地，例如 AI21 Labs 的 Jamba 交錯使用 Transformer 與 Mamba 層，可處理長達 25.6 萬 Token 的上下文。若這類架構普及，長上下文推論對記憶體的需求結構可能隨之改變。"
example: "Transformer 像每寫一個字都要把整本筆記從頭翻一遍；SSM 像只帶一張隨時更新的摘要卡，邊讀邊改，卡片大小固定不變。"
