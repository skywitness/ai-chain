# 名詞：神經網路（neural-network）· 分類 ai-basics · 資料基準日 2026-10-06
term: "神經網路"
zh: "神經網路"
en: "Neural Network"
aliases:
  - "Neural Network"
  - "類神經網路"
  - "人工神經網路"
  - "ANN"
  - "NN"
category: "ai-basics"
level: 1
short: "受大腦神經元啟發的數學模型，由多層「神經元」以權重相連，透過調整權重來學習。"
definition: "神經網路是由大量簡單運算單元（神經元）分層連接而成的模型。每個神經元把輸入乘上權重、加總後，經過激勵函數再輸出給下一層；網路學到的「知識」就存在這些權重（參數）裡，訓練就是不斷調整權重，讓輸出更接近正確答案。Google 的機器學習詞彙表把它定義為至少含一個隱藏層的模型，隱藏層超過一層即稱為深度神經網路。2024 年諾貝爾物理學獎頒給 John Hopfield 與 Geoffrey Hinton，表彰他們讓人工神經網路機器學習成為可能的基礎發現與發明。今天的大型語言模型本質上就是超大型神經網路，其運算主體是矩陣乘法，直接決定了 AI 晶片的設計方向。"
example: "像一間層層分工的工廠：第一層工人只看邊緣與顏色，下一層把它們組成形狀，再下一層判斷「這是一隻貓」；每位工人該聽誰的意見、聽多少，就是權重。"
