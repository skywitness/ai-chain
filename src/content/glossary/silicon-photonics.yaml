term: "矽光子"
zh: "矽光子"
en: "Silicon Photonics"
aliases:
  - "Silicon Photonics"
  - "SiPh"
  - "矽光"
  - "矽光子學"
  - "光子積體電路"
  - "Photonic Integrated Circuit"
category: networking
level: 2
short: "用製造晶片的矽製程來做光學元件，讓光通訊零件能像晶片一樣量產，並更貼近運算晶片。"
definition: "矽光子是以矽為材料、沿用半導體 CMOS 製程，在晶片上製作光波導、調變器、光偵測器等光學元件的技術。矽對波長大於約 1.1 微米的紅外光是透明的，因此能在光纖通訊常用的 1.55 微米波段導光。它的好處是可以在晶圓廠大量生產、體積小，還能與電子晶片緊密整合；限制是矽本身很難發光，雷射通常仍需磷化銦等其他材料另外提供。AI 叢集對頻寬與省電的需求，讓矽光子從光收發模組走向共同封裝光學（CPO）：輝達（NVIDIA）2025 年 3 月發表的矽光子交換器，就採用台積電的矽光子方案與 SoIC 3D 晶片堆疊技術。台積電、博通與英特爾（Intel）等都是這個領域的重要參與者。"
example: "傳統光模組像手工組裝的精密鐘錶，矽光子則像把鐘錶零件直接「印」在晶圓上，一次就能大量生產。"
