term: "演算法偏誤"
zh: "演算法偏誤"
en: "Algorithmic Bias"
aliases:
  - "演算法偏見"
  - "AI 偏見"
  - "AI 偏誤"
  - "Algorithmic Bias"
  - "AI Bias"
category: "policy"
level: 1
short: "AI 因訓練資料或設計不均，對特定族群做出系統性不公平判斷的現象。"
definition: "演算法偏誤是指 AI 系統對特定性別、膚色、年齡、語言或地區的人，系統性地判斷得比較不準確或不公平。來源通常是訓練資料的代表性不足、標註者的主觀判斷，或目標設計本身。經典案例是 2018 年的 Gender Shades 研究：受測的商用人臉性別辨識系統，對深膚色女性的錯誤率最高達 34.7%，對淺膚色男性最高只有 0.8%；研究也指出，兩個常用基準資料集中，淺膚色受試者的比例分別高達 79.6% 與 86.2%。偏誤會帶來法律與商譽風險，因此歐盟 AI 法把招募、教育等用途列為高風險領域，台灣《人工智慧基本法》也把「公平與不歧視」列為基本原則。對模型與應用公司而言，這代表需要更多元的資料，以及更多評測與稽核成本。"
example: "如果一套履歷篩選 AI 主要用過去男性工程師的錄取紀錄訓練，它可能學到「男性比較適合」的捷徑，把條件相同的女性應徵者排在後面。"
