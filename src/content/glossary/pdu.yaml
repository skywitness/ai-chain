term: "PDU"
zh: "電源分配單元"
en: "Power Distribution Unit"
aliases:
  - "電源分配單元"
  - "配電單元"
  - "機櫃 PDU"
  - "智慧型 PDU"
  - "Rack PDU"
  - "iPDU"
  - "Power Distribution Unit"
category: datacenter
level: 3
short: >-
  把前端送來的電力分配給機櫃內各台設備的配電裝置，智慧型機種還能逐一插座量測用電、遠端開關。
definition: >-
  PDU 是資料中心配電鏈末端的設備，負責把前一級（UPS、配電盤或匯流排）送來的電力分配給機櫃中的伺服器與交換器。常見有兩種：放在機房地板上的落地式 PDU，內含斷路器與監控面板，可供應一整排機櫃；以及安裝在機櫃內的機櫃 PDU，外觀像加強版延長線，資料中心等級的輸入容量可達 22 kVA 以上，多半採三相輸入。智慧型 PDU 可在輸入端、分路或單一插座層級量測用電，並支援遠端開關與溫度、濕度感測，是計算 PUE 與管理機櫃容量的重要資料來源。在現行 AI 機櫃中，電力經 UPS 調節後透過 PDU 與匯流排送到機櫃，再由櫃內電源架把 415V 交流電轉成 54V 直流；當機櫃功率走向 MW 等級，800V 直流架構可望簡化這段多次轉換的配電鏈。
example: >-
  機櫃 PDU 就像家裡的智慧延長線：每個插孔接一台設備，還能從遠端看每個插孔用了多少電，必要時把某台設備斷電重開。
