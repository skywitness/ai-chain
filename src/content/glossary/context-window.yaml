term: "上下文視窗"
zh: "上下文視窗"
en: "Context Window"
aliases:
  - "上下文長度"
  - "長上下文"
  - "Context Window"
  - "Context Length"
category: llm
level: 1
short: "模型單次能「看見」的 Token 上限，包含輸入的對話、文件與模型自己的輸出。"
definition: "上下文視窗是語言模型單次請求能處理的最大 Token 數，對話歷史、上傳文件、系統提示詞與模型輸出都要放在這個範圍內；超出的部分必須刪減、摘要，或改用 RAG 只檢索相關段落。這個上限近年快速擴大：2020 年的 GPT-3 只有 2,048 個 Token，2024 年 Meta 的 Llama 3.1 405B 已支援 12.8 萬 Token；截至 2026 年 10 月，Anthropic 文件列出多款 Claude 模型具備 100 萬 Token 的視窗，單次最多可輸出 12.8 萬 Token。視窗越長，推論時要暫存的 KV Cache 越大，對 GPU 記憶體與 HBM 容量的需求也越高，因此長上下文是推升記憶體需求的因素之一。"
example: "像考試時能帶進考場的「小抄」頁數：頁數越多，能參考的資料越多，但翻找也越花時間、成本越高。"
