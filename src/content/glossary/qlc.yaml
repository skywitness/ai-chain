term: "QLC"
zh: "四階儲存單元"
en: "Quad-Level Cell"
aliases:
  - "QLC NAND"
  - "QLC SSD"
  - "四位元單元"
  - "Quad-Level Cell NAND"
category: "memory"
level: 3
short: "每個 NAND 記憶單元存 4 個位元的技術，容量大、成本低，但寫入速度與耐用度較差。"
definition: "NAND Flash 依每個記憶單元存放的位元數分為 SLC（1 位元）、MLC（2 位元）、TLC（3 位元）與 QLC（4 位元）。QLC 要在一個單元內分辨 16 種電荷狀態，相同數量的單元可比 TLC 多存約三分之一資料，代價是寫入較慢、讀取更依賴錯誤更正，可抹寫次數也較低，約在 1,000 次等級。AI 讓 QLC 在資料中心的用途快速擴大：讀多寫少的工作，例如存放向量資料庫、模型與資料集，或把 KV Cache 卸載到 SSD，都很適合高容量、低成本的 QLC 企業級 SSD。TrendForce 指出，QLC 產品已成為 2026 年企業級 SSD 需求的重要成長動能。"
example: "像在同一個停車位裡用立體機械車架多塞進車子：停得更多、更省地，但每次停車取車都比較費工。"
