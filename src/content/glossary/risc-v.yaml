term: "RISC-V"
zh: "開放指令集架構"
en: "RISC-V Instruction Set Architecture"
aliases:
  - "RISC-V 架構"
  - "RISC-V ISA"
  - "開放指令集"
  - "開源指令集"
category: hardware
level: 2
short: "免權利金、任何人都能使用與擴充的開放處理器指令集，是 x86 與 Arm 之外的第三條路線。"
definition: "指令集架構（ISA）是處理器與軟體之間的「共同語言」。x86 由英特爾與超微掌握，Arm 需要支付授權費與權利金；RISC-V 則在 2010 年起源於美國加州大學柏克萊分校，規格以開放授權釋出，任何人都能免權利金實作，也可自由加入自訂指令。管理組織的前身是 2015 年成立的 RISC-V 基金會，現以 RISC-V International 名義在瑞士登記。RISC-V 最早普及於微控制器與嵌入式晶片，近年也進入 AI 晶片：例如 Meta 第一代 MTIA 推論加速器（台積電 7 奈米）的處理器核心就是以 RISC-V 為基礎並大幅客製。對 AI 晶片設計公司而言，RISC-V 能降低授權成本，也減少對單一授權方的依賴；台灣的晶心科（Andes）即是 RISC-V 處理器矽智財的供應商。"
example: "x86 和 Arm 像需要付費授權的私人語言，要用就得簽約繳費；RISC-V 像一套公開的語言規範，誰都能免費學、免費用，還能自創專業術語（自訂指令）。"
