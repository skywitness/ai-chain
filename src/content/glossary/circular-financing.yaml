term: "循環交易"
zh: "循環投資交易"
en: "Circular Financing"
aliases:
  - "循環投資交易"
  - "循環融資"
  - "循環投資"
  - "Circular Financing"
  - "Circular Deals"
  - "Vendor Financing"
  - "供應商融資"
category: "cloud-business"
level: 3
short: "供應商投資客戶、客戶再用這筆錢向供應商採購，資金在少數公司間繞圈，可能放大帳面需求與營收。"
definition: "循環交易泛指 AI 產業中晶片供應商、雲端業者與模型公司彼此投資、又互為客戶的安排。例如 2026 年 1 月，輝達以每股 87.20 美元認購 CoreWeave 的 A 類普通股、投資 20 億美元，CoreWeave 則規劃在 2030 年前建置超過 5GW 的 AI 工廠，並採用多代輝達平台；2025 年 10 月，AMD 與 OpenAI 簽約部署 6GW 的 AMD GPU，並發給 OpenAI 最多 1.6 億股 AMD 股票的認股權證，依部署進度與 AMD 股價目標分批生效。支持者認為這能綁定長期需求、確保供貨；批評者則擔心訂單與營收被資金循環墊高，一旦終端 AI 收入不如預期，風險會在少數公司之間連鎖擴散，因此常拿它和 2000 年前後電信設備商的供應商融資相比。"
example: "像麵粉廠出錢入股麵包店，麵包店再用這筆錢向麵粉廠大量訂貨：麵粉廠的營收增加了，但最終還是要看消費者買不買麵包。"
