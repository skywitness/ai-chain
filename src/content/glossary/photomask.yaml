term: "光罩"
zh: "光罩"
en: "Photomask"
aliases:
  - "Photomask"
  - "Mask"
  - "Reticle"
  - "倍縮光罩"
  - "光罩組"
  - "Mask set"
category: "semiconductor"
level: 2
short: "刻有晶片電路圖形的「底片」，微影時光線經過它，把圖案縮小印到晶圓上。"
definition: "光罩是承載晶片某一層電路圖形的母版，微影時光線照射光罩，再把圖形縮小投影到晶圓上；在步進掃描式曝光機中也常稱為 reticle（倍縮光罩）。一顆先進晶片有數十層圖形，需要一整套光罩，在 tape-out 之後依設計資料以電子束或雷射寫製。光罩上的任何瑕疵都會複製到每一顆晶粒上，因此必須嚴格檢測，並加上保護膜（pellicle）防塵。DUV 使用透光的光罩；EUV 光罩則改用鉬與矽交錯的多層膜來反射光線。曝光機通常把光罩圖形縮小為四分之一再投影到晶圓上，單次曝光能涵蓋的最大範圍，就是所謂的「光罩尺寸極限」。"
example: "光罩就像網版印刷的網版或沖洗照片的底片：先做好一張精準的母版，就能一再把同樣的圖案印到每片晶圓上。"
