term: "併網排隊"
zh: "併網申請排隊"
en: "Interconnection Queue"
aliases:
  - "併網佇列"
  - "併網申請佇列"
  - "併網等待"
  - "Interconnection Queue"
  - "Grid Interconnection Queue"
category: energy
level: 3
short: "新電廠要接上輸電網前須排隊等衝擊研究；美國 2025 年完工的案場中位數等了約 5 年，拖慢 AI 擴張。"
definition: "發電或儲能案場要接上輸電網前，必須向電網業者（ISO／RTO 或電力公司）提出併網申請，經過一連串衝擊研究，確認需要新增哪些線路與變電設備、費用由誰負擔，最後簽訂併網協議；排在這份名單上的案件就構成併網佇列。美國勞倫斯柏克萊國家實驗室（LBNL）《Queued Up 2026》統計，2025 年底約有 2,061 GW 容量仍在排隊（發電 1,312 GW、儲能 749 GW），其中天然氣容量年增 86%；在有資料的地區，2025 年完工的案場從申請到商轉的中位數長達 61 個月，2015 年只要 36 個月。2000–2020 年提出申請的容量中，到 2025 年底只有約 13% 真正商轉，約 75% 已撤案。資料中心等大型用電戶另有獨立的負載併網流程，不在這份統計內；但電源端遲遲接不上，正是 AI 業者轉向表後自建電源的重要原因之一。"
example: "像熱門餐廳排隊：每組客人（新電廠）都要先等店家確認座位和餐具（電網容量與設備）夠不夠，很多人等太久乾脆離開，最後真正入座的只是一小部分。"
