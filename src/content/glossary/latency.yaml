term: "延遲"
zh: "延遲"
en: "Latency"
aliases:
  - "回應延遲"
  - "端到端延遲"
  - "反應時間"
  - "Response Time"
  - "End-to-End Latency"
category: inference
level: 1
short: >-
  從送出問題到收到回應所花的時間；延遲越低，使用者就覺得 AI 回得越快。
definition: >-
  在 AI 推論中，延遲指一個請求從送出到完成所經過的時間。NVIDIA 的推論評測文件把端到端延遲拆成兩部分：等待第一個 token 出現的 TTFT（包含排隊、Prefill 計算與網路傳輸），加上之後逐字產生答案的時間；後者可用平均 token 間隔（ITL）來衡量。延遲與吞吐量常互相拉扯：把更多請求併成一批可以提高總產出，但每位使用者可能等得更久。聊天、語音助理、程式補全與 Agent 的多步驟工作都對延遲很敏感，這也是低延遲推論晶片、推測解碼與分離式推論等技術受到重視的原因，並影響雲端業者如何配置 GPU 與設定價格。
example: >-
  像在餐廳點餐：從點完到第一道菜上桌的時間是 TTFT，整桌菜全部上齊的時間則是端到端延遲。
related: [ttft, throughput, batching, inference, speculative-decoding]
learnMore: [training-vs-inference-economics, inference-optimization]
