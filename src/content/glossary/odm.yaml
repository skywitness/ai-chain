term: "ODM"
zh: "原廠委託設計製造"
en: "Original Design Manufacturer"
aliases:
  - "原廠委託設計"
  - "設計代工"
  - "白牌伺服器"
  - "ODM Direct"
  - "Original Design Manufacturer"
category: hardware
level: 1
short: "替品牌或雲端業者「設計加製造」產品的代工廠；台灣的鴻海、廣達、緯創是 AI 伺服器 ODM 主力。"
definition: "ODM 是同時負責產品設計與製造的代工廠：客戶提出需求，ODM 自行完成電路板、機構、散熱與測試設計並量產，產品再以客戶的品牌出售或直接交給客戶使用。和只照客戶藍圖生產的代工相比，ODM 握有更多設計能力與智慧財產。伺服器產業中，大型雲端業者常繞過品牌商，直接向 ODM 採購客製機種，業界稱為「ODM Direct」。台灣是全球 ODM 重鎮：輝達在 2017 年 Computex 推出 HGX 合作夥伴計畫時，首批 ODM 夥伴就是鴻海、英業達、廣達與緯創。這類代工廠營收規模大但毛利率低，例如鴻海 2026 年第二季營收新台幣 2.53 兆元、年增 41%，毛利率僅 6.12%。"
example: "想開一家手搖飲店：只照你配方煮茶的工廠是代工；ODM 則會幫你研發配方、設計杯子、找好原料再量產，你只要貼上自己的品牌販售。"
