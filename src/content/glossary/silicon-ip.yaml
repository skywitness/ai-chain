term: "矽智財"
zh: "矽智財"
en: "Semiconductor Intellectual Property"
aliases:
  - "IP"
  - "Silicon IP"
  - "SIP"
  - "半導體 IP"
  - "IP core"
  - "矽智財核心"
category: "semiconductor"
level: 2
short: "預先設計並驗證好的電路模組（如 CPU 核心、高速介面），授權給晶片公司直接放進設計中。"
definition: "矽智財（IP）是預先設計並驗證完成、可重複使用的電路區塊，例如 CPU 核心、記憶體控制器、PCIe 與 HBM 介面、SerDes 高速傳輸等。晶片公司向 IP 供應商取得授權，常見收費方式是授權金加上依出貨量計算的權利金；例如安謀（Arm）的 Flexible Access 方案讓客戶以零或低成本先取用 IP 進行設計，需付費的 IP 等到 tape-out 時才收取授權費，產品出貨後再依數量支付權利金。使用 IP 可以不必每個模組都從零開發，縮短上市時間並降低風險。代表業者有安謀、新思科技、益華電腦，台灣則有力旺、晶心科等。AI 晶片大量使用 IP：例如輝達 Grace CPU Superchip 採用 144 個 Arm Neoverse V2 核心。"
example: "矽智財像樂高的標準零件或建築的預鑄模組：不必自己從燒磚開始，直接買來組裝，把心力放在最有特色的部分。"
