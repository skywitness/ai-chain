term: "CUDA"
zh: "CUDA 平行運算平台"
en: "Compute Unified Device Architecture"
aliases:
  - "CUDA 平台"
  - "CUDA Toolkit"
  - "統一計算架構"
  - "Compute Unified Device Architecture"
category: hardware
level: 1
short: "輝達推出的 GPU 程式開發平台與函式庫，讓 GPU 能做通用運算，被視為輝達最重要的軟體護城河。"
definition: "CUDA 是輝達在 2006 年發表、2007 年正式釋出的平行運算平台與程式介面，讓工程師能用 C++、Python 等語言直接驅動 GPU 做通用運算，而不只是繪圖；名稱原是 Compute Unified Device Architecture 的縮寫，但輝達後來已很少使用全名。它包含編譯器、驅動程式與大量最佳化函式庫，例如 cuBLAS（線性代數）與 cuDNN（深度學習），PyTorch 等主流框架都建立在其上。CUDA 是專有技術，官方只支援輝達 GPU；近二十年累積的程式碼、工具與工程師習慣，讓客戶轉換到其他晶片的成本很高，這被普遍視為輝達在 AI 晶片市場長期領先的關鍵原因。競爭者則以超微 ROCm／HIP、英特爾 oneAPI 等開放方案追趕。"
example: "GPU 像一台馬力強大的跑車，CUDA 則是它的方向盤、儀表板加上整套駕訓教材。大家都學會開這台車之後，就算別家推出規格相近的車，也很難說換就換。"
