term: "儲能"
zh: "儲能系統"
en: "Energy Storage System"
aliases:
  - "儲能系統"
  - "電池儲能"
  - "電池儲能系統"
  - "BESS"
  - "ESS"
  - "Battery Energy Storage System"
category: energy
level: 1
short: "把電先存起來、需要時再放出的系統，最常見的是大型電池；可平滑 AI 訓練造成的劇烈用電波動。"
definition: "儲能系統（ESS）把電能以電池、抽蓄水力等形式存起來，需要時再釋放。資料中心最常見的是電池儲能系統（BESS），由電池、功率轉換系統（PCS）與控制軟體組成，不只是被動的電池，而是能即時吸收或補充電力的可控設備。AI 訓練時大量 GPU 同步運算、同步暫停，用電會在瞬間大幅擺盪，對電網與現場發電機造成壓力。輝達（NVIDIA）在 GB300 NVL72 的電源供應器內加入電解電容儲能，每顆 GPU 約 65 焦耳，在 Megatron 大型語言模型訓練的實測中，讓電網看到的尖峰需求降低 30%；2026 年輝達也把 BESS 納入 AI 工廠的電力架構，用來平滑負載、協助穿越電網擾動並加快併網。儲能同時是太陽能、風力能否全天候供電的關鍵搭檔。"
example: "儲能像大樓頂樓的水塔：用水少時先把水存起來，大家同時開水龍頭時由水塔補上，自來水管就不會瞬間失壓。"
