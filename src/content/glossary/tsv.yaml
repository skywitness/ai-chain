term: "TSV"
zh: "矽穿孔"
en: "Through-Silicon Via"
aliases:
  - "矽穿孔"
  - "矽通孔"
  - "Through-Silicon Via"
  - "Through-Chip Via"
  - "TSVs"
category: "packaging"
level: 3
short: "在矽晶粒上做出貫穿上下的微小孔洞並填入銅，讓堆疊的晶片可以直接垂直導通。"
definition: "TSV 是垂直貫穿整片矽晶圓或晶粒的導電通道，通常先蝕刻出深孔、再填入銅製成。過去晶片之間多靠打線或在平面上繞線連接，TSV 讓上下堆疊的晶粒直接垂直相連，路徑更短、連線密度更高，是 3D IC 與 HBM 的基礎：HBM 就是把多層 DRAM 晶粒用 TSV 加上微凸塊（未來可能改用混合鍵合）串成一疊，SK 海力士指出，從 HBM4 起 I/O 數量由 HBM3E 的 1,024 個倍增為 2,048 個，對 TSV 的密度要求更高。矽中介層同樣靠 TSV 把上方晶粒的訊號導到下方載板。依製作時機，TSV 分為先鑽孔（via-first）、中段（via-middle）與後鑽孔（via-last），中段做法是目前 3D IC 與中介層的常見選擇；挑戰包括孔洞造成的熱機械應力會影響周邊電晶體特性，以及晶圓薄化後的搬運與良率。"
example: "像在多層停車場的每層樓板上鑿出垂直管道並裝上電梯，車子（訊號）不必繞外面的坡道，直接上下樓。"
