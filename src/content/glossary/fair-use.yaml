term: "合理使用"
zh: "著作權合理使用"
en: "Fair Use"
aliases:
  - "著作權合理使用"
  - "合理使用原則"
  - "Fair Use"
  - "AI 訓練資料版權"
category: "policy"
level: 2
short: "在特定條件下，不經著作權人同意也能利用作品的法律例外，是 AI 訓練資料爭議的核心。"
definition: "合理使用是著作權法的例外規定：利用他人作品若符合一定條件，即使未經授權也不構成侵權。台灣著作權法第 65 條以四項因素判斷：利用的目的及性質（是否為商業用途）、著作的性質、所利用的質與量及其在整部著作中所占的比例，以及對著作潛在市場與現在價值的影響；美國法的合理使用原則也採類似的四項因素。生成式 AI 需要大量文字與圖像來訓練，因此「用受著作權保護的作品訓練模型，是否屬於合理使用」成為產業焦點。美國 Bartz v. Anthropic 案中，法官在 2025 年 6 月 23 日認定用書籍訓練模型屬合理使用，但下載並保存逾 700 萬份盜版書籍不屬合理使用，須另行審理；雙方在 2025 年 9 月以 15 億美元和解，約每本書 3,000 美元，2026 年 7 月獲法院最終核准。這類判決與和解，正在改變模型公司取得資料的成本與授權策略。"
example: "老師在課堂上引用一小段小說做分析，通常屬於合理使用；但把整本小說影印賣給學生就不是。AI 訓練的爭議在於：模型「讀」了上百萬本書，但輸出的是新內容，該算哪一種？"
