term: "Elo 分數"
zh: "Elo 等級分"
en: "Elo Rating"
aliases:
  - "Elo 分數"
  - "Elo 等級分"
  - "Elo Rating"
  - "Elo"
  - "Arena 分數"
  - "Bradley-Terry"
category: llm
level: 2
short: "源自西洋棋的相對實力評分；AI 領域用來依大量「兩兩對戰」投票結果替模型排名。"
definition: "Elo 等級分原本是西洋棋的評分系統：每場對局後，勝方從敗方取得分數，分差越大代表強弱越明顯；分數高 100 分的一方預期得分率約 64%，高 200 分約 76%。AI 領域最知名的應用是 Chatbot Arena（先後更名為 LMArena 與 Arena）：使用者在不知道模型名稱的情況下比較兩個回答並投票，平台再以 Bradley-Terry 等統計模型換算成類似 Elo 的分數；2024 年 3 月的論文發表時已累積超過 24 萬票。這類分數反映人類偏好，常被模型公司用於宣傳，但也會受回答風格、長度與投票者組成影響，只代表相對排名。"
example: "像線上遊戲的天梯積分：贏了強敵加很多分、輸給弱者扣很多分；Arena 則是讓使用者當裁判，替模型打天梯。"
