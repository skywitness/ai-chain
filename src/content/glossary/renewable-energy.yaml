term: "再生能源"
zh: "再生能源"
en: "Renewable Energy"
aliases:
  - "可再生能源"
  - "綠電"
  - "綠能"
  - "Renewables"
  - "Renewable Power"
category: energy
level: 1
short: "太陽光、風力、水力、地熱等可自然補充的能源；科技大廠大量採購，但需搭配儲能補足發電不穩定的缺點。"
definition: "再生能源指太陽能、風力、水力、地熱、生質能等能自然補充、不會用盡的能源；其中太陽能、風力與水力發電時幾乎不排放二氧化碳。為了達成減碳承諾，科技大廠是企業綠電採購的重要買家：微軟（Microsoft）與布魯克菲爾德（Brookfield）在 2024 年 5 月簽下框架協議，規劃 2026–2030 年在美國與歐洲開發超過 10.5 GW 的新再生能源；Google 則表示自 2010 年以來已採購超過 22 GW 的潔淨能源。主要限制是太陽能與風力受天候與日夜影響，發電量起伏大，而 AI 資料中心需要全天候穩定供電，因此通常要搭配儲能、電網調度，或核能、燃氣等穩定電源一起規劃。"
example: "太陽能像只在白天營業的商店，風力像不定時營業的攤販；資料中心要 24 小時有電，就得另外準備「倉庫」（儲能）或全天候營業的電源。"
