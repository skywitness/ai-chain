term: "VLA"
zh: "視覺語言動作模型"
en: "Vision-Language-Action Model"
aliases:
  - "Vision-Language-Action"
  - "VLA 模型"
  - "機器人基礎模型"
  - "Robot Foundation Model"
category: robotics
level: 2
short: "同時看懂影像與語言指令，並直接輸出機器人動作的 AI 模型，常被稱為機器人的「大腦」。"
definition: "VLA（視覺語言動作模型）以預訓練的視覺語言模型為基礎，輸入相機影像與自然語言指令，直接輸出機器手臂或機器人關節的動作。這個名稱與研究範式由 Google DeepMind 在 2023 年 7 月發表的 RT-2 確立：它把機器人動作編碼成和文字一樣的 Token，與網路圖文資料一起訓練，讓機器人能借用網路知識，理解沒看過的物品與指令。在超過 6,000 次實機測試中，RT-2 面對未見過情境的成功率為 62%，前一代 RT-1 只有 32%。之後的 OpenVLA、Physical Intelligence 的 π0、輝達（NVIDIA）GR00T N1 與 Google DeepMind 的 Gemini Robotics 等也都屬於這類模型。VLA 的訓練仰賴大量機器人示範資料與 GPU 算力，部署時則需要機器人身上的邊緣 AI 晶片即時推論。"
example: "對機器人說「把桌上那瓶快喝完的飲料丟進回收桶」，VLA 要自己看懂哪一瓶、回收桶在哪，再一步步算出手臂該怎麼移動。"
