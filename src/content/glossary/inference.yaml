term: "推論"
zh: "推論"
en: "Inference"
aliases:
  - "模型推論"
  - "AI 推論"
  - "推理"
  - "Model Inference"
  - "Model Serving"
category: inference
level: 1
short: >-
  訓練好的模型實際「上工」：接收你的輸入、算出答案的過程，例如每次向聊天機器人提問。
definition: >-
  推論是把訓練完成的模型拿來回答問題、產生文字或圖片的階段。訓練通常只做一次或少數幾次，推論則隨每一次使用者請求反覆發生，因此用的人越多，推論消耗的算力與電力就越多。大型語言模型的推論又分成一次讀完提示的 Prefill（預填），與逐字產生答案的 Decode（解碼）兩段：前者主要受運算能力限制，後者主要受記憶體頻寬限制，這正是 GPU、HBM 與專用推論晶片競爭的焦點。以規模來看，Google 母公司 Alphabet 的執行長在 2026 年 7 月的法說會上表示，其模型 API 每分鐘處理約 220 億個 token，一季前為 160 億個。隨著使用量快速成長，推論已成為雲端與新雲業者算力需求的重要來源。
example: >-
  訓練像學生花好幾年讀書準備考試；推論則像畢業後每天上班解決實際問題。訓練是一次性的大投資，推論則是天天發生的營運成本。
related: [training, token, latency, throughput, test-time-compute]
