term: "折舊"
zh: "折舊"
en: "Depreciation"
aliases:
  - "折舊費用"
  - "折舊攤銷"
  - "折舊與攤銷"
  - "Depreciation"
  - "D&A"
  - "耐用年限"
category: "cloud-business"
level: 2
short: "把機器、伺服器等長期資產的購買成本，依耐用年限分攤到各年度變成費用的會計方法。"
definition: "企業花大錢買伺服器或蓋機房時，這筆資本支出不會一次認列為費用，而是依估計的耐用年限逐年分攤，這就是折舊（無形資產則稱攤銷）。耐用年限的估計會直接影響獲利：Amazon 自 2025 年 1 月起把部分伺服器與網路設備的耐用年限由 6 年縮短為 5 年，理由是 AI 與機器學習技術進步加快，使 2025 年折舊費用增加 14 億美元、淨利減少 10 億美元；Meta 則把部分伺服器與網路設備延長為 5.5 年，預估使 2025 年折舊減少約 29 億美元。AI 資本支出暴增後，折舊會在未來幾年持續墊高成本，GPU 的實際經濟壽命有多長，也成為市場爭論的焦點。"
example: "花 30 萬元買一台預計用 5 年的機器，每年就記 6 萬元的折舊費用，而不是第一年一次扣掉 30 萬元。"
