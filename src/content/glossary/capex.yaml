term: "CapEx"
zh: "資本支出"
en: "Capital Expenditure"
aliases:
  - "資本支出"
  - "Capex"
  - "Capital Expenditure"
  - "資本開支"
  - "購置不動產、廠房及設備"
category: "cloud-business"
level: 1
short: "公司花在興建或購買長期資產的錢，例如機房、伺服器與晶圓廠設備，是 AI 基礎建設投資的核心指標。"
definition: "資本支出（CapEx）是企業購買或興建可使用多年的資產，例如土地、廠房、資料中心、伺服器與網路設備。這筆錢不會在當年全部列為費用，而是先記為資產，再依耐用年限逐年折舊（土地不提折舊）。雲端與網路巨頭的資本支出是 GPU、HBM、伺服器與電力設備等硬體需求的源頭，也是本站最重視的領先指標之一。例如 Meta 在 2026 年 7 月將全年資本支出（含融資租賃本金）展望收斂為 1,300–1,450 億美元；Amazon 截至 2026 年第二季的近四季購置不動產與設備淨額達 1,690 億美元，年增 64%，主要用於 AI。資本支出成長若快於營業現金流，自由現金流就會轉弱。"
example: "開麵店時買的爐具、冰箱與裝潢就是資本支出；它們能用好幾年，所以每年只把一部分成本攤成費用。"
