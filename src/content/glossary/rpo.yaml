term: "RPO"
zh: "剩餘履約義務"
en: "Remaining Performance Obligations"
aliases:
  - "剩餘履約義務"
  - "已簽約未認列營收"
  - "Remaining Performance Obligations"
  - "cRPO"
  - "Backlog"
category: "cloud-business"
level: 3
short: "已簽約但尚未交付、還沒認列為營收的合約金額，可以看成公司未來營收的「訂單存量」。"
definition: "剩餘履約義務（RPO）是美國會計準則 ASC 606 要求揭露的項目（國際準則 IFRS 15 也有類似規定）：客戶已簽約承諾、但公司尚未履行義務，因此還不能認列為營收的合約總額；其中預計 12 個月內認列的部分稱為 cRPO。AI 算力長約讓 RPO 成為雲端業者最受注目的數字：Oracle 截至 2026 年 8 月底的 RPO 達 6,640 億美元，一年內增加 2,090 億美元；新雲 CoreWeave 6 月底的在手訂單（revenue backlog）約 1,040 億美元。不過這些合約往往長達數年、集中在少數 AI 實驗室，業者還得先投入龐大資本支出蓋好機房才能交付，客戶付款能力與建置進度都是風險。"
example: "像蛋糕店接到 3 年份的婚禮蛋糕訂單：錢還沒全部入帳，也要先買烤箱、請師傅，但未來營收已有一定的能見度。"
