  - "AI 雲"
  - "新興雲端業者"
  - "Neoclouds"
  - "GPU Cloud"
category: "cloud-business"
level: 1
short: "專門出租 GPU 算力給 AI 公司的新興雲端業者，例如 CoreWeave、Nebius、Lambda。"
definition: "新雲（Neocloud）是相對於傳統超大規模業者的新興雲端公司，不提供數百種通用服務，而是專注於建置與出租大型 GPU 叢集，供 AI 實驗室與企業訓練和推論模型。它們通常能較快導入輝達（NVIDIA）最新一代系統，以多年期合約鎖定客戶，再用合約與 GPU 作擔保借錢擴產。代表業者 CoreWeave 2026 年第二季營收 25.75 億美元、年增 112%，6 月底在手訂單（revenue backlog）約 1,040 億美元，啟用電力 1.5GW、合約電力約 3.7GW；但同季淨損 6.26 億美元。高槓桿、客戶集中與 GPU 折舊速度，是觀察新雲的三大重點。"
example: "像專門出租高階攝影棚的業者：不像綜合型片場什麼都有，但設備最新，檔期多半以長約預訂。"
