# 名詞：生成式 AI（generative-ai）· 分類 ai-basics · 資料基準日 2026-10-06
term: "生成式 AI"
zh: "生成式人工智慧"
en: "Generative AI"
aliases:
  - "GenAI"
  - "Generative AI"
  - "生成 AI"
  - "生成式人工智慧"
category: "ai-basics"
level: 1
short: "能創造新內容的 AI，例如寫文章、畫圖、作曲、產生影片或程式碼，ChatGPT 就是代表。"
definition: "生成式 AI 指能產生新內容（文字、圖像、音訊、影片、程式碼）的 AI 模型，而不只是做分類或預測。Google 的機器學習詞彙表指出它尚無正式定義，但多數專家同意其產出應同時具備複雜、連貫與原創的特性。代表技術包括生成文字的大型語言模型與生成影像的擴散模型。它的普及速度極快：史丹佛大學《2026 AI Index》指出，生成式 AI 在三年內達到 53% 的人口採用率，快於個人電腦與網際網路。與只做分類或預測的傳統 AI 相比，它的推論算力需求高得多：大型語言模型每次回應都要逐一產生大量 Token，擴散模型則要反覆多次去噪；這是 2023 年以後 GPU、HBM 與資料中心需求快速擴張的主要驅動力。"
example: "輸入「幫我寫一封請假信」得到一封完整信件，或輸入「夕陽下的台北 101 水彩畫」得到一張全新的圖，都是生成式 AI。"
