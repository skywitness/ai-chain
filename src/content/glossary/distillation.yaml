term: "蒸餾"
zh: "知識蒸餾"
en: "Knowledge Distillation"
aliases:
  - "知識蒸餾"
  - "模型蒸餾"
  - "Distillation"
  - "Model Distillation"
category: training
level: 2
short: "讓大模型（老師）教小模型（學生），把能力濃縮進更便宜、更快的小模型。"
definition: "「蒸餾」的說法來自 Hinton 等人 2015 年的論文，延續了更早把多個模型壓縮成單一模型的研究：讓小型「學生模型」學習大型「老師模型」輸出的機率分布，而不只是原始的標準答案，藉此把大模型的能力壓縮進部署成本更低的小模型。在大型語言模型時代，常見做法是用老師模型生成大量回答，再拿來微調學生。DeepSeek 用 DeepSeek-R1 整理出約 80 萬筆樣本，蒸餾出 15 億到 700 億參數的 6 個小模型，其中 70 億參數版本在 AIME 2024 數學測驗達到 55.5%。蒸餾讓推論更便宜、更快，也讓手機、PC 等終端裝置有機會執行實用的模型。"
example: "像資深主廚把多年手藝整理成詳細食譜與示範影片，讓年輕廚師在短時間內做出八成水準的菜。"
