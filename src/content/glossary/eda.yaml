term: "EDA"
zh: "電子設計自動化"
en: "Electronic Design Automation"
aliases:
  - "電子設計自動化"
  - "Electronic Design Automation"
  - "EDA 工具"
  - "晶片設計軟體"
category: "semiconductor"
level: 2
short: "用來設計、模擬與驗證晶片的專業軟體工具；沒有它，就無法設計上百億個電晶體的晶片。"
definition: "EDA 是協助工程師設計電子系統（特別是晶片）的軟體與硬體工具，涵蓋電路描述與邏輯合成、模擬與驗證、實體布局與繞線、時序與功耗分析，以及送交製造前的各項檢查。現代 AI 晶片動輒數百億個電晶體，不可能靠人工設計，必須依賴 EDA 自動化完成，並在功耗、效能與面積（PPA）之間反覆最佳化。市場主要由新思科技（Synopsys）、益華電腦（Cadence）與西門子 EDA（Siemens EDA）主導，它們與台積電等晶圓廠合作，把每一代製程的設計規則做進工具中，台積電的開放創新平台（OIP）也設有 EDA 聯盟。近年 EDA 業者也把 AI 導入工具本身，例如 Synopsys.ai，用機器學習加速設計最佳化。"
example: "EDA 之於晶片設計，就像建築師使用的 CAD 與結構分析軟體：先在電腦裡把整棟大樓畫好、算好、模擬好，確認沒問題才開工。"
