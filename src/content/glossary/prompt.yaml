category: llm
level: 1
short: "使用者輸入給 AI 模型的指令、問題與參考資料；寫法不同，回答品質可能差很多。"
definition: "Prompt（提示詞）是送進語言模型的輸入內容，包含使用者的問題、任務說明、範例與附上的資料；開發者通常還會加上「系統提示詞」來設定角色、語氣與規則。由於模型是根據輸入內容接續生成，同一個問題換種問法，結果可能差很多，因此發展出「提示工程」：清楚描述目標、提供範例、要求逐步思考、指定輸出格式等。在產業上，Prompt 長度直接決定輸入 Token 數與費用；企業應用常把大量文件放進 Prompt，也推動了長上下文與提示快取等技術。"
example: "請同事幫忙時，只說「幫我寫報告」通常不如「幫我寫 500 字的季報摘要，給主管看，列出三個重點」有效；對 AI 下 Prompt 也是同樣道理。"
