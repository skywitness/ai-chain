term: "ADAS"
zh: "先進駕駛輔助系統"
en: "Advanced Driver Assistance Systems"
aliases:
  - "Advanced Driver Assistance Systems"
  - "駕駛輔助系統"
  - "輔助駕駛"
  - "Driver Assistance"
category: robotics
level: 2
short: "自動緊急煞車、車道維持、主動式巡航等協助駕駛的功能；駕駛人仍須全程監看並負責。"
definition: "ADAS（先進駕駛輔助系統）是協助人類安全駕駛的各種功能，例如自動緊急煞車（AEB）、主動式定速巡航（ACC）、車道置中、盲點偵測與停車輔助。依 SAE J3016 分級，ADAS 落在 Level 0 到 Level 2：只發出警示或瞬間介入（如 AEB）的功能屬 Level 0；持續控制轉向或速度其中之一為 Level 1；同時控制兩者為 Level 2。無論哪一級，駕駛人都必須持續監看路況、隨時接手，不能把它當成自動駕駛。ADAS 已大量裝在量產車上，靠相機、毫米波雷達與車用 SoC 執行即時影像辨識；例如 Mobileye 的 EyeQ 系列晶片截至 2025 年累計出貨已超過 2 億顆。隨著各國把 AEB 等功能納入新車法規或安全評等，ADAS 持續推升車用 AI 晶片與感測器的需求，也是車廠邁向更高等級自駕的基礎。"
example: "高速公路上開啟主動式巡航與車道置中，車子會自己跟車、維持在車道中間，但你的手仍要放在方向盤上、眼睛要看路。"
