term: "AI PC"
zh: "AI 個人電腦"
en: "AI PC"
aliases:
  - "AI 電腦"
  - "AI 筆電"
  - "Copilot+ PC"
  - "AI Laptop"
category: robotics
level: 1
short: "內建 NPU、能在本機執行生成式 AI 功能的個人電腦，例如微軟定義的 Copilot+ PC。"
definition: "AI PC 泛指在 CPU、GPU 之外另外內建 NPU，能在本機執行生成式 AI 與其他 AI 功能的筆電或桌機。最具代表性的規格是微軟（Microsoft）在 2024 年 5 月發表的 Copilot+ PC：要求 NPU 算力達每秒 40 兆次運算（40 TOPS）以上，首批機種採用高通 Snapdragon X 系列（NPU 為 45 TOPS），之後擴及超微（AMD）Ryzen AI 300 與英特爾（Intel）Core Ultra 200V 系列，華碩（ASUS）、宏碁（Acer）等台灣品牌也推出對應機種。在本機執行 AI 的好處是回應快、資料不必上傳、離線也能用，但較大的模型仍要靠雲端。對產業鏈而言，AI PC 讓 PC 處理器的競爭從 CPU 效能延伸到 NPU 算力與省電表現，業界也期待它帶動新一波換機需求。"
example: "在飛機上沒有網路，筆電仍能即時產生會議字幕、幫照片去背，靠的就是機器裡的 NPU。"
