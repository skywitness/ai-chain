term: "重電"
zh: "重電設備"
en: "Heavy Electrical Equipment"
aliases:
  - "重電設備"
  - "重電產業"
  - "重電股"
  - "輸配電設備"
  - "Heavy Electrical"
  - "T&D Equipment"
category: energy
level: 2
short: "台灣產業慣用語，指變壓器、氣體絕緣開關、配電盤等高電壓、大容量的電力設備，是電網與資料中心的骨幹。"
definition: "「重電」是台灣產業與投資圈的慣用說法，泛指高電壓、大容量的發電、輸電與配電設備，例如電力變壓器、氣體絕緣開關設備（GIS）、斷路器、配電盤與電力電纜。台灣代表廠商包括華城、士電、中興電、亞力等。需求主要來自兩股力量：一是國內電網更新，台電在 2022 年推出「強化電網韌性建設計畫」，以「分散、強固、防衛」為主軸，10 年投入約新台幣 5,645 億元；二是美國電網汰換與 AI 資料中心擴建造成設備短缺，美國國家實驗室（NLR）2026 年的報告指出，美國超過 80% 的大型電力變壓器需求靠進口滿足，交期已從 12–18 個月拉長到 30–36 個月。重電設備多為客製化、產能擴充慢，因此成為 AI 電力供應鏈中的關鍵環節。"
example: "如果把電網比喻成高速公路，重電設備就是交流道、收費站與號誌系統；路再寬，少了這些設備，車（電）也開不進城裡。"
