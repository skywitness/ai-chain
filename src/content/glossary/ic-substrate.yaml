term: "IC 載板"
zh: "IC 載板"
en: "IC Substrate"
aliases:
  - "載板"
  - "封裝基板"
  - "IC Substrate"
  - "Package Substrate"
  - "FC-BGA 載板"
category: "packaging"
level: 2
short: "晶片與主機板之間的多層精密電路板，把晶片上又小又密的接點逐層轉接到主機板。"
definition: "IC 載板是封裝的「底座」：晶粒或中介層焊在它上面，它再以錫球接到主機板。晶片端的接點非常密集，主機板線路則粗得多，載板要用多層細線路把訊號、電源與接地逐層「扇出」，同時提供機械支撐與散熱路徑。依材料主要分為 ABF 載板（用於 CPU、GPU 等高階覆晶封裝 FC-BGA）與 BT 載板（常見於記憶體與行動裝置晶片）。AI 晶片封裝面積大、層數多，對載板的平整度、良率與產能要求更高。以欣興電子（Unimicron）公開的 FC-BGA 規格為例，封裝尺寸可達 110 × 110 毫米、線寬與線距 8 微米、凸塊間距可細到 90 微米、增層結構最高 10/n/10，並標示可用於 2.5D 與 Chiplet 封裝及 AI 伺服器。"
example: "像大樓的轉換層：上面是密密麻麻的小房間（晶片接點），下面是寬敞的停車場（主機板），中間要靠好幾層管線重新配置才接得起來。"
