  - "L0–L5"
  - "Levels of Driving Automation"
category: robotics
level: 2
short: "SAE J3016 把自動駕駛分成 Level 0 到 5 共六級，關鍵在於當下由人還是系統負責駕駛。"
definition: "自駕等級最常引用美國汽車工程師學會（SAE International）的 J3016 標準，2021 年版也以 ISO/SAE PAS 22736 名義發布。它依「持續執行駕駛任務的是人還是系統」分成六級：Level 0 無自動化；Level 1 駕駛輔助（只控制轉向或速度其一）；Level 2 部分自動化（同時控制兩者，但人類仍須監看）；Level 3 條件式自動化（系統在特定條件下負責駕駛，人類須在系統要求時接手）；Level 4 高度自動化（在限定的運行範圍內完全不需要人類）；Level 5 完全自動化（任何道路與條件皆可）。分級描述的是「當下啟用的功能」而非整台車，市場上常見的「L2+」並不是標準中的正式等級。從 Level 3 開始，駕駛責任由人轉移到系統，直接影響車廠的法律責任、保險，以及所需的感測器與運算晶片規格。"
example: "Level 2 像是有副駕駛幫你扶方向盤，但你得一直盯著路；Level 4 則像搭一班沒有司機的接駁車，只要它還在路線範圍內，你可以安心滑手機。"
