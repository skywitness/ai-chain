term: "IDM"
zh: "整合元件製造商"
en: "Integrated Device Manufacturer"
aliases:
  - "整合元件製造商"
  - "Integrated Device Manufacturer"
  - "垂直整合半導體廠"
category: "semiconductor"
level: 1
short: "從設計、製造到銷售都自己來的半導體公司，例如英特爾、三星、德州儀器。"
definition: "整合元件製造商（IDM）指從晶片設計、晶圓製造到產品銷售都在公司內完成的半導體公司，代表業者有英特爾、三星、德州儀器（TI）、英飛凌等。1980 年代以前，半導體產業幾乎都是這種垂直整合模式；之後晶圓代工與無晶圓廠設計公司的分工興起，IDM 的界線也變得模糊，例如英特爾除了製造自家處理器，也以英特爾晶圓代工（Intel Foundry）替外部客戶生產，三星則同時經營記憶體與晶圓代工。在 AI 鏈中，HBM 等記憶體主要由 SK 海力士、三星、美光這類 IDM 自行設計與製造，它們的產能規劃直接影響 AI 加速器的出貨。"
example: "IDM 像自己種麥、自己磨粉、自己開店賣麵包的烘焙坊；無晶圓廠公司則只研發配方，把麵包交給代工廠烤。"
