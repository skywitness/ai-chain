term: "供應鏈"
zh: "產業供應鏈"
en: "Supply Chain"
aliases:
  - "產業鏈"
  - "供應網路"
  - "AI 供應鏈"
  - "AI 產業鏈"
  - "Value Chain"
category: "cloud-business"
level: 1
short: "從原料、晶片、伺服器到雲端與應用，把一項產品從無到有、層層串起、環環相扣的企業網路。"
definition: "供應鏈是指一項產品從原料、零組件、製造、組裝到送達最終使用者，沿途所有企業與流程組成的網路。AI 的供應鏈特別長：最底層是電力與半導體設備材料，接著是晶圓代工與先進封裝、記憶體、晶片設計與 AI 晶片，再到網通、伺服器組裝與資料中心，最後才是雲端、基礎模型與各種應用；本站把它整理成 5 層、14 個環節。整條鏈的產出取決於最緊的瓶頸，例如先進封裝產能、HBM 或電力不足時，即使其他環節都準備好，整體出貨仍會受限。台灣企業集中在晶圓代工、封裝測試與伺服器組裝等硬體環節，這也是本站從台灣視角追蹤供應鏈的原因。"
example: "像一碗牛肉麵：需要牧場、種小麥的農夫、製麵廠、運輸業者和麵店，任何一環斷貨，客人就吃不到麵。"
