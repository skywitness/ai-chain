term: "WUE"
zh: "用水效率"
en: "Water Usage Effectiveness"
aliases:
  - "用水效率"
  - "水資源使用效率"
  - "Water Usage Effectiveness"
  - "WUE 值"
category: datacenter
level: 3
short: >-
  資料中心每用 1 度 IT 電力所消耗的水量（公升／kWh），用來衡量散熱用水的效率。
definition: >-
  WUE 由綠色網格（The Green Grid）於 2011 年提出，後納入 ISO/IEC 30134-9:2022 標準，計算方式是「資料中心全年用水量（公升）÷ IT 設備用電量（kWh）」，單位為 L/kWh，數值越低越省水。採用蒸發式冷卻的機房，WUE 可能高達約 2.5 L/kWh；氣冷或封閉迴路設計則可接近 0。微軟表示，其資料中心 2024 財年的平均 WUE 為 0.30 L/kWh，比 2021 年的 0.49 改善 39%；並自 2024 年 8 月起，新設計的資料中心改採冷卻零耗水方案，以晶片級封閉迴路液冷取代蒸發冷卻，預估每座每年可省下超過 1.25 億公升的水，首批機房 2027 年底起陸續上線。WUE 與 PUE 常需要取捨：蒸發冷卻較省電但耗水，乾式冷卻省水但通常較耗電。在缺水地區興建 AI 資料中心時，WUE 是取得許可與社區支持的重要指標。
example: >-
  WUE 0.3 L/kWh 代表每用 1 度電跑運算，大約消耗 300 毫升的水，比一罐 330 毫升的易開罐飲料略少。
related: [pue, liquid-cooling, datacenter, cdu]
