category: "semiconductor"
level: 1
short: "只做晶片設計與銷售、把製造外包給晶圓代工廠的公司，輝達、超微、聯發科都是。"
definition: "無晶圓廠（Fabless）公司專注於晶片設計、軟體與銷售，不自建昂貴的晶圓廠，而是把製造交給台積電等晶圓代工廠，封裝測試再交給封測廠。這種模式在 1980 年代隨晶圓代工出現而興起，大幅降低了資本支出門檻，讓公司能把資源集中在研發與產品。今天多數 AI 晶片公司都採無晶圓廠模式：輝達的 Blackwell GPU 以台積電客製化的 4NP 製程生產，超微（AMD）、博通（Broadcom）、高通（Qualcomm）與台灣的聯發科也是代表。代價是產能與先進製程的取得受代工廠與封裝產能左右，AI 需求暴增時就會出現搶產能的情形。"
example: "無晶圓廠公司像只負責設計的服裝品牌，把版型交給成衣廠生產，自己專心做設計、行銷與通路。"
