term: "REIT"
zh: "不動產投資信託"
en: "Real Estate Investment Trust"
aliases:
  - "不動產投資信託"
  - "REITs"
  - "Real Estate Investment Trust"
  - "資料中心 REIT"
  - "Data Center REIT"
category: "cloud-business"
level: 3
short: "集合投資人資金持有收租型不動產，並把大部分收益配發給股東的公司或信託；資料中心也是熱門標的。"
definition: "REIT（不動產投資信託）讓一般投資人能間接持有大型收租不動產。依美國證券交易委員會（SEC）的說明，REIT 每年至少要把 90% 的應稅所得以股利發放，總資產至少 75% 須為不動產與現金，總收入至少 75% 須來自租金、房貸利息等不動產相關來源；符合條件者可將發放的股利自公司應稅所得中扣除。資料中心 REIT 如 Equinix、Digital Realty 向雲端業者與企業出租機房空間、電力與冷卻，是 AI 算力落地的實體基礎之一。由於大部分盈餘都要配發出去，REIT 擴建主要靠增資與發債，也會與私募資本合資開發。台灣也有依《不動產證券化條例》發行的 REIT。"
example: "像大家一起出錢買下一棟辦公大樓收租，租金扣掉管理費後大部分按出資比例分給每個人。"
