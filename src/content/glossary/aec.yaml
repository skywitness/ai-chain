term: "AEC"
zh: "主動式電纜"
en: "Active Electrical Cable"
aliases:
  - "主動式電纜"
  - "主動式銅纜"
  - "主動電纜"
  - "有源電纜"
  - "Active Electrical Cable"
  - "Active Copper Cable"
category: networking
level: 3
short: "在銅纜兩端接頭內建訊號處理晶片的高速線材，比被動銅纜傳得更遠，是短距連線的熱門選擇。"
definition: "AEC（主動式電纜）是在銅纜兩端接頭內建 Retimer 或 DSP 晶片的高速線材。速度提升到每通道 100G、200G 後，不含晶片的被動銅纜（DAC）能可靠傳輸的距離越來越短；AEC 靠晶片重整訊號來延長距離，例如 Credo 的 800G AEC 最長可達 7 公尺，足以支援 GPU 叢集中主機到交換器的完整連線。相較 DAC，AEC 線徑更細、更輕、彎曲半徑更小，Credo 稱體積最多可減少 75%；相較光纖方案，則省去雷射與光學元件。Credo 表示 AEC 由其發明，旗下產品涵蓋 100G 至 1.6T；Astera Labs 等晶片商也提供用於 AEC 的訊號處理模組。在 AI 叢集中，AEC 常用於伺服器到同機櫃或鄰近機櫃交換器的短距離連線。"
example: "被動銅纜像普通的長延長線，越長訊號越弱；AEC 則像在延長線兩頭各加了一個訊號整理器，讓高速訊號走得更遠依然清楚。"
