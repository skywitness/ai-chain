term: "稠密模型"
zh: "稠密模型"
en: "Dense Model"
aliases:
  - "稠密模型"
  - "Dense Model"
  - "密集模型"
  - "Dense Transformer"
category: llm
level: 3
short: "處理每一個 Token 時都會用到全部參數的模型，與只啟用部分專家的 MoE 相對。"
definition: "稠密模型是指每個 Token 經過模型時，所有參數都參與運算的架構，傳統 Transformer 多屬此類。例如 Meta 在 2024 年 7 月發表的 Llama 3.1 405B，就是擁有 4,050 億參數的稠密 Transformer。稠密模型的總參數等於啟用參數，結構單純、訓練與部署行為較好預測；缺點是模型越大，每個 Token 的運算量就等比例增加。隨著 MoE 普及，越來越多前沿模型改採稀疏架構，但稠密設計仍常見於中小型模型。比較兩類模型時，要分開看總參數（決定記憶體需求）與啟用參數（決定運算量）。"
example: "稠密模型像全班每位同學都要寫每一題；MoE 則是每一題只派最擅長的兩三位同學作答。"
