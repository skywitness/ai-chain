term: "Colocation"
zh: "主機代管"
en: "Colocation"
aliases:
  - "主機代管"
  - "機房代管"
  - "託管資料中心"
  - "Colo"
  - "Carrier Hotel"
  - "零售型託管"
  - "批發型託管"
category: datacenter
level: 2
short: >-
  業者蓋好機房並提供電力、散熱、網路與保全，客戶租空間放自己的伺服器。
definition: >-
  Colocation（主機代管）是一種資料中心商業模式：業者負責建築、供電、散熱、實體保全與網路互連，客戶自行購買並管理伺服器，以機櫃、籠位（cage）或整間機房為單位承租，費用通常依空間與用電容量計算。零售型託管服務眾多企業客戶，強調與電信商、雲端業者之間的互連；批發型則把整棟或整區機房長期租給超大規模雲端業者等大客戶。代表業者包括 Equinix 與 Digital Realty 等資料中心不動產投資信託（REIT），其中 Equinix 截至 2026 年 6 月底，在全球 77 個市場共有 282 座資料中心（含合資的 xScale 機房）。AI 熱潮下，雲端業者、新雲與 AI 公司除了自建機房，也大量承租託管業者已接好電力的機房容量，使「有電、可液冷的機房」成為稀缺資源。
example: >-
  就像租用有水電與保全的倉儲空間：倉庫業者負責建築、電力與門禁，你只要把自己的貨物（伺服器）搬進去。
