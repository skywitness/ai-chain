term: "推論時運算"
zh: "推論時運算"
en: "Test-time Compute"
aliases:
  - "測試時運算"
  - "推論時擴展"
  - "思考時間"
  - "Inference-time Compute"
  - "Test-time Scaling"
category: inference
level: 2
short: >-
  讓模型在回答時多花運算「多想一下」，例如先寫推理步驟或產生多個答案再挑選，以換取更高準確度。
definition: >-
  過去提升模型能力主要靠訓練時投入更多算力與資料；推論時運算則是在回答階段多投入運算，例如讓推理模型先產生很長的思考過程、取樣多個答案再投票，或用驗證模型搜尋較好的解法。加州大學柏克萊分校與 Google DeepMind 研究者 2024 年的論文發現，依題目難度動態分配推論運算，效率可比 best-of-N 基準高 4 倍以上；在總運算量相同的比較中，部分題目上還能勝過大 14 倍的模型。DeepSeek-R1 論文（2026 年 1 月修訂版）中，R1-Zero 在 AIME 2024 的平均單次答對率（pass@1）為 77.9%，改用多數決投票後提高到 86.7%。代價是每次回答消耗的 token 大增：推論算力需求不再只隨使用人數成長，也隨「思考長度」成長，推升了對推論晶片與資料中心的需求。
example: >-
  像考試遇到難題時，多花幾分鐘在草稿紙上演算、驗算，答對機率就提高；代價是交卷時間變長、用掉更多草稿紙。
related: [reasoning-model, chain-of-thought, scaling-laws, rlvr, inference]
learnMore: [reasoning-models, scaling-laws]
