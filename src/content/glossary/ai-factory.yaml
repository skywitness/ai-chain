term: "AI 工廠"
zh: "AI 工廠"
en: "AI Factory"
aliases:
  - "人工智慧工廠"
  - "AI Factories"
  - "AI 超級工廠"
category: datacenter
level: 1
short: >-
  專為 AI 訓練與推論打造的資料中心：投入資料與電力，產出 Token 與智慧服務。
definition: >-
  「AI 工廠」是輝達（NVIDIA）大力推廣的說法，指專門為 AI 工作負載最佳化的資料中心：從資料匯入、訓練、微調到大量推論，整個 AI 生命週期都在一套整合好的 GPU、CPU、網路、儲存與散熱系統中完成。NVIDIA 的定義強調，它的主要產品是「智慧」，並以 Token 吞吐量來衡量。與承載各種通用運算的傳統資料中心不同，AI 工廠講究推論效能與每瓦效能，常見配置是液冷、高密度機櫃與高速互連；NVIDIA 指出，AI 機櫃的功率已從數十 kW 走向遠超過 100 kW。這個框架把資料中心從「成本中心」重新定義為「生產 Token 的產線」，也是雲端業者、新雲與主權 AI 計畫大舉投資的背景。
example: >-
  傳統工廠把鋼鐵變成汽車；AI 工廠則把電力與資料變成 Token，再透過聊天機器人、程式助理等服務賣給使用者。
related: [datacenter, token, inference, liquid-cooling, sovereign-ai]
learnMore: [data-centers-101, training-vs-inference-economics]
segments: [datacenter-infra, cloud-neocloud]
