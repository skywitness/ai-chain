# 名詞：參數（parameter）· 分類 ai-basics · 資料基準日 2026-10-06
term: "參數"
zh: "模型參數"
en: "Model Parameter"
aliases:
  - "Parameters"
  - "Weights"
  - "權重"
  - "參數量"
  - "模型參數"
category: "ai-basics"
level: 1
short: "模型在訓練中學到、用來儲存知識的數值（主要是權重）。參數愈多通常愈強，也愈耗記憶體與算力。"
definition: "參數是模型內部可被訓練調整的數值，主要是神經元之間連線的權重與偏差值，模型學到的一切都存在其中；模型名稱裡的「405B」就是指有 4,050 億（405 billion）個參數。例如 Meta 的 Llama 3.1 405B 以 15.6 兆個 Token 預訓練；DeepSeek-V3 採混合專家（MoE）架構，總參數 6,710 億，但每個 Token 只啟用其中 370 億。參數量直接牽動硬體需求：若以 BF16 格式（每個參數 2 位元組）存放，4,050 億個參數光權重就約 810 GB，遠超過單顆輝達（NVIDIA）H100 GPU 的 80 GB HBM3 記憶體，必須切分到多顆 GPU 上。這是 AI 帶動 HBM 與高速互連需求的關鍵原因之一。"
example: "把模型想成一台有幾千億個旋鈕的混音器，訓練就是一點一點轉動每個旋鈕，直到輸出的答案最好；這些旋鈕最後停留的位置就是參數。"
