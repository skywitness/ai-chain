term: "探針卡"
zh: "探針卡"
en: "Probe Card"
aliases:
  - "Probe Card"
  - "晶圓探針卡"
  - "MEMS 探針卡"
  - "DUT Board"
category: "packaging"
level: 3
short: "晶圓測試時壓在晶片接點上的「針床」，把測試機的訊號送進晶圓上每一顆尚未切割的晶粒。"
definition: "探針卡是晶圓測試時連接自動測試設備（ATE）與晶圓的介面：它是一塊裝有大量金屬探針的電路板，裝在針測機（prober）上，讓探針精準接觸每顆晶粒的接點或凸塊，在切割、封裝前先篩掉壞品。以 DRAM 與快閃記憶體為例，被測接點通常是邊長 40 到 90 微米的鋁墊，其他晶片則可能是銅柱或錫凸塊。由於探針排列必須對應每款晶片的接點位置，探針卡等於一款晶片一張的客製連接器，新產品或製程微縮時通常都要重新製作。AI 晶片與 HBM 接點更密、腳數更多，而且多顆晶粒封裝在一起前必須先確認都是良品，對探針卡的密度、精度與高速訊號能力要求更高。主要業者包括美國 FormFactor、台灣旺矽（MPI）與中華精測等。"
example: "像一把為特定鎖量身打造的「萬針鑰匙」：每根針都要剛好碰到晶片上對應的接點，換一款晶片就得重做一把。"
