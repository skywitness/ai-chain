term: "PCB"
zh: "印刷電路板"
en: "Printed Circuit Board"
aliases:
  - "印刷電路板"
  - "電路板"
  - "多層板"
  - "Printed Circuit Board"
  - "PWB"
category: hardware
level: 2
short: "承載並連接晶片與電子元件、布滿銅線路的板子；AI 伺服器需要層數更多、訊號損耗更低的高階 PCB。"
definition: "PCB 是由絕緣基材與多層銅箔線路疊合而成的板子，晶片、記憶體、電源元件與連接器焊在上面，彼此透過銅線路串接。它以銅箔基板（CCL）為原料，經鑽孔、電鍍、蝕刻與壓合等製程製成，最常見的基材是玻纖環氧樹脂 FR-4。AI 伺服器把 PCB 推向高階：GPU 模組板、交換器板與主機板要傳輸極高速的訊號，必須使用層數更多、線路更細、損耗更低的材料，技術門檻與單價都隨之提高。市調機構 Mordor Intelligence 估計 2024 年全球裸板市場約 803 億美元，但各機構的統計口徑不同，數字僅供參考。台灣是全球 PCB 重鎮：金像電以伺服器與交換器用的高層數板為主力，臻鼎、華通、健鼎等也在擴大 AI 伺服器用板的比重。"
example: "PCB 像城市的道路系統：晶片是建築物，銅線路是道路。AI 伺服器的資料流量像尖峰時段的高速公路，需要更多層的立體交流道（層數）和更平順的路面（低損耗材料），車流才不會塞住或掉速。"
