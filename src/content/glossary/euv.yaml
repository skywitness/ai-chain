term: "EUV"
zh: "極紫外光微影"
en: "Extreme Ultraviolet Lithography"
aliases:
  - "極紫外光"
  - "EUV 微影"
  - "EUV lithography"
  - "EUVL"
  - "EUV 曝光機"
category: "semiconductor"
level: 1
short: "用波長 13.5 奈米極紫外光印製電路的微影技術，是 7 奈米以下製程的關鍵，由 ASML 獨家供應。"
definition: "EUV 微影使用波長僅 13.5 奈米的極紫外光，比 DUV 常用的 193 奈米短得多，因此能以較少步驟印出更細的圖形。光源是以二氧化碳雷射每秒最多 5 萬次轟擊錫滴所產生；由於 EUV 光幾乎會被所有物質（包括空氣）吸收，整條光路必須處於高真空，並改用多層反射鏡而非透鏡。ASML 的 NXE 系列數值孔徑為 0.33、解析度 13 奈米，ASML 表示晶片廠用它印製 7、5、3 奈米等節點最複雜的關鍵圖層，其餘圖層仍多用 DUV。這項技術為 ASML 獨有，該公司表示曾在 17 年間投入超過 60 億歐元研發。台積電表示，2019 年第二季量產的 N7+ 是業界第一個商用 EUV 製程，如今先進 AI 晶片都仰賴 EUV 製造。"
example: "如果 DUV 是用粗頭麥克筆寫字，EUV 就像換成極細的針筆；只是這支筆非常昂貴，只用在最需要精細的幾層。"
