term: "自由現金流"
zh: "自由現金流量"
en: "Free Cash Flow"
aliases:
  - "自由現金流量"
  - "FCF"
  - "Free Cash Flow"
category: "cloud-business"
level: 2
short: "營業活動賺進的現金扣掉資本支出後剩下的錢，可用來配息、買回庫藏股或還債。"
definition: "自由現金流 = 營業活動現金流量 − 資本支出。損益表上的獲利包含折舊等非現金項目，自由現金流則直接看公司實際多出多少現金。AI 基礎建設投資讓不少雲端業者的自由現金流明顯轉弱：Amazon 截至 2026 年第二季的近四季營業現金流 1,614 億美元，但購置不動產與設備淨額達 1,690 億美元，自由現金流為流出 76 億美元，一年前還是流入 182 億美元；Oracle 2027 會計年度第一季（2026 年 6–8 月）單季資本支出 285 億美元，自由現金流約負 54 億美元。自由現金流為負時，擴產就得仰賴發債、SPV 或 GPU 擔保融資等外部資金。"
example: "月薪 5 萬元、生活開銷 3 萬元，本來每月可存 2 萬元；若這個月買了一台 3 萬元的機車，自由現金流就變成負 1 萬元。"
