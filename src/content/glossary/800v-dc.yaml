term: "800V 直流"
zh: "800V 高壓直流供電"
en: "800 VDC Power Architecture"
aliases:
  - "800V 高壓直流"
  - "800V HVDC"
  - "800 VDC"
  - "高壓直流供電"
  - "±400V 直流"
category: datacenter
level: 3
short: >-
  NVIDIA 推動的新一代機房供電架構，把 800V 直流電直接送進機櫃，以支援 1 MW 等級的 AI 機櫃。
definition: >-
  800V 直流是 NVIDIA 在 2025 年 5 月提出的資料中心供電架構。傳統做法是把中壓交流電降到 415V 交流，經 UPS、PDU 送進機櫃，再由櫃內電源架轉成 54V 直流；但當單櫃功率走向 MW 等級，54V 需要極大電流，1 MW 機櫃光是銅匯流排就可能重達 200 公斤，電源架也會吃掉大量機櫃空間。新架構在設施端就把電力轉成 800V 直流送到機櫃，再於 GPU 附近降為 12V。NVIDIA 宣稱，與 415V 交流相比，同尺寸導體可多傳 85% 的電力、銅用量減少 45%；端到端效率比 54V 系統最多提升 5%，總持有成本最多降低 30%，並將隨 2027 年 Kyber 機櫃全面量產。首批合作夥伴包括台達電（Delta）、光寶（Lite-On）等電源廠，以及伊頓（Eaton）、施耐德電機（Schneider Electric）與 Vertiv；Google 等業者也推動 ±400V 直流的類似方案。
example: >-
  電壓從 54V 提高到 800V，大約高出 15 倍；同樣的功率只需要約 1/15 的電流，電線就能細得多，發熱損耗也少得多，就像用高壓電網長距離輸電的道理。
