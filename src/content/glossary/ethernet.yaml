term: "乙太網路"
zh: "乙太網路"
en: "Ethernet"
aliases:
  - "Ethernet"
  - "乙太網"
  - "以太網"
  - "IEEE 802.3"
  - "GbE"
category: networking
level: 1
short: "全球最普及的有線網路標準，從家裡的網路線到 AI 資料中心的 800G 交換器，用的都是它。"
definition: "乙太網路是由 IEEE 802.3 工作小組制定的有線網路標準，1973 年誕生於全錄（Xerox）帕羅奧多研究中心，最初速度僅每秒 2.94 Mb，1983 年成為 IEEE 802.3 標準。它規格開放、多家供應商競爭、設備與人才都充足，因此成本相對低廉。速度一路提升，800 Gb/s 標準已於 2024 年 2 月核准，支援 1.6 Tb/s 與每通道 200 Gb/s 的 IEEE P802.3dj 原訂 2026 年完成，截至 2026 年 10 月仍在制定中。過去超級電腦與 AI 叢集的後端網路常用 InfiniBand，如今輝達（NVIDIA）Spectrum-X、博通（Broadcom）Tomahawk 系列與超乙太網路聯盟都在強化乙太網路的 AI 效能，使它成為 Scale-out 網路的主要選項之一，並開始延伸到 Scale-up 互連。"
example: "家裡電腦插的網路線（RJ45 接頭）跑的就是乙太網路；AI 資料中心用的是同一個協定家族，只是單一連接埠速度快了數百倍，而且多半改走光纖。"
