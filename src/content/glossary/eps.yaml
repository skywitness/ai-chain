term: "EPS"
zh: "每股盈餘"
en: "Earnings per Share"
aliases:
  - "每股盈餘"
  - "每股稅後盈餘"
  - "稀釋每股盈餘"
  - "Earnings per Share"
  - "Diluted EPS"
category: "cloud-business"
level: 2
short: "公司稅後淨利除以流通在外股數，代表每一股賺了多少錢，是計算本益比的基礎。"
definition: "EPS（每股盈餘）= 歸屬母公司的稅後淨利 ÷ 加權平均流通在外股數。若把員工認股權、可轉換公司債等未來可能增加的股數也算進去，得到的是稀釋每股盈餘，數字通常較保守。EPS 讓不同規模的公司能以「每股」比較獲利，也是本益比（股價 ÷ EPS）的分母。例如台積電 2026 年第二季稀釋每股盈餘新台幣 27.25 元（每單位 ADR 為 4.31 美元），年增 77.4%；同期營收年增 36.0%，獲利成長快於營收，反映利潤率提升帶來的營運槓桿。美國公司常另外公布排除股票酬勞等項目的非 GAAP EPS，比較時要確認口徑一致。"
example: "一家公司今年賺了 1,000 萬元、共有 100 萬股，EPS 就是每股 10 元。"
