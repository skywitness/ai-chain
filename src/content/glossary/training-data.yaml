category: "ai-basics"
level: 1
short: "用來教 AI 的資料，例如網路文章、書籍、程式碼、圖片與標註好的範例；資料的量與品質決定模型上限。"
definition: "訓練資料是模型學習所用的範例集合。傳統機器學習會把資料分成訓練集、驗證集與測試集，三者不應重疊，以免模型「偷看答案」。大型語言模型的預訓練資料以 Token 計算，規模極大：Meta 表示 Llama 3 以超過 15 兆個來自公開來源的 Token 預訓練，資料量是 Llama 2 的 7 倍，程式碼多了 4 倍。資料也可能成為瓶頸：研究機構 Epoch AI 在 2024 年估計，經品質與重複使用調整後，人類公開文字可供訓練的有效存量約 300 兆個 Token（90% 信賴區間為 100 兆至 1,000 兆）；若趨勢持續，可能在 2026 至 2032 年間被用盡。因此資料授權、資料標註與合成資料，已成為 AI 產業鏈中愈來愈受重視的獨立環節。"
example: "教小孩認識水果時給他看的上百張蘋果、香蕉照片，就是他的「訓練資料」；如果照片裡全是紅蘋果，他可能就認不出青蘋果。"
