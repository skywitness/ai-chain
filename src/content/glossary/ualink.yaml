term: "UALink"
zh: "加速器開放互連標準"
en: "Ultra Accelerator Link"
aliases:
  - "Ultra Accelerator Link"
  - "UALink 200G"
  - "UALink 聯盟"
  - "UALink Consortium"
category: networking
level: 2
short: "由超微、Google、微軟等業者組成聯盟制定的開放 Scale-up 互連標準，常被視為 NVLink 的開放替代方案。"
definition: "UALink（Ultra Accelerator Link）是讓不同廠商的 AI 加速器在同一個 Scale-up 網域中互相連接的開放標準，由 2024 年 10 月正式成立的 UALink 聯盟制定，董事會成員包括阿里巴巴、超微（AMD）、蘋果（Apple）、Astera Labs、AWS、思科（Cisco）、Google、HPE、英特爾（Intel）、Meta、微軟與 Synopsys。2025 年 4 月發布的 UALink 200G 1.0 規格，每條通道 200G，可在單一運算 Pod 中連接最多 1,024 顆加速器，並支援直接讀寫記憶體的 load/store 語意。2026 年 4 月再發布 2.0 通用規格，加入網路內運算（In-Network Compute），並另訂小晶片（Chiplet）與管理規格。它的意義在於讓雲端業者自研 ASIC 與非輝達 GPU 也能組成大型整櫃系統，降低對單一供應商的依賴。"
example: "如果 NVLink 是某個品牌手機專用的快充接頭，UALink 就像大家一起制定的 USB-C：任何廠商的加速器只要符合規格，就能接在一起。"
