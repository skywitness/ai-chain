term: "預訓練"
zh: "預訓練"
en: "Pre-training"
aliases:
  - "預先訓練"
  - "Pretraining"
  - "Pre-train"
category: training
level: 2
short: "大型語言模型的第一階段：讀遍海量文字，靠「猜下一個 Token」學會語言與世界知識。"
definition: "預訓練是大型語言模型的第一個、也是最耗算力的階段：模型讀取從網路、書籍、程式碼等收集而來的海量文字，反覆練習預測下一個 Token，藉此學到文法、事實知識與基本推理能力，產出「基礎模型」。規模成長非常快：2020 年的 GPT-3（1,750 億參數）訓練了 3,000 億個 Token；2024 年 Meta 的 Llama 3 405B 則在 15.6 兆個 Token 上訓練，運算量約 3.8×10²⁵ 次浮點運算，是前代 Llama 2 最大版本的近 50 倍。預訓練的規模決定了 GPU 叢集、HBM 與資料中心的採購量，是 AI 資本支出的核心驅動力之一。"
example: "像一個人進入職場前先讀完整座圖書館：還不懂得怎麼回答客人的問題，但已經累積了大量常識與語感。"
