term: "LPU"
zh: "語言處理單元"
en: "Language Processing Unit"
aliases:
  - "語言處理單元"
  - "Groq LPU"
  - "Language Processing Unit"
category: hardware
level: 3
short: "Groq 設計的推論專用晶片，把模型放在晶片內的 SRAM，以極低延遲快速產生 Token。"
definition: "LPU 是 Groq 為大型語言模型推論設計的處理器。GPU 把模型權重放在晶片外的 HBM，LPU 則主要使用晶片內的 SRAM：Groq 在 2025 年的說明中指出，其晶片內 SRAM 頻寬可達每秒 80 TB 以上，而當時 GPU 外接 HBM 約為每秒 8 TB。LPU 也採取「決定性」設計，由軟體事先排定每個時脈週期要做的事，讓執行時間完全可預測，適合需要穩定低延遲的即時應用。代價是單顆晶片的記憶體容量很小，執行大模型時必須串接大量晶片。2025 年 12 月 24 日，Groq 與輝達簽訂非獨家的推論技術授權協議，創辦人 Jonathan Ross 與總裁 Sunny Madra 等成員加入輝達，Groq 則繼續獨立營運。輝達 2026 年 8 月宣布，旗下推論加速器 Groq 3 LPX 已全面量產，顯示推論專用架構已被 GPU 大廠納入產品線。"
example: "GPU 像每次都要跑去倉庫（HBM）拿食材的廚師；LPU 把食材全部擺在手邊的料理台（SRAM）上，出菜特別快，但料理台空間有限，做大菜就得找很多廚師排成生產線合作。"
