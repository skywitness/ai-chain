term: "世界模型"
zh: "世界模型"
en: "World Model"
aliases:
  - "World Model"
  - "World Foundation Model"
  - "WFM"
  - "世界基礎模型"
category: robotics
level: 2
short: "AI 在內部建立的「世界模擬器」，能預測採取某個動作後，環境接下來會怎麼變化。"
definition: "世界模型是學習環境運作規律、能預測「如果採取某個動作，接下來會發生什麼」的模型。2018 年 Ha 與 Schmidhuber 的論文〈World Models〉示範了代理人可以在模型「想像」出來的環境中訓練，再把學到的策略帶回真實環境。近年的世界模型多以大量影片訓練，能生成符合物理規律的影片或可互動的場景，用途包括為機器人與自駕車產生合成訓練資料、在模擬中評估策略，以及讓機器人在行動前先「預演」結果。輝達（NVIDIA）在 2025 年 1 月發表 Cosmos 世界基礎模型平台並以開放模型授權釋出，其配套的資料處理流程可在 Blackwell 平台上以 14 天處理並標註 2,000 萬小時的影片（純 CPU 流程需三年以上）。世界模型同時吃下龐大的影片資料與訓練算力，是實體 AI 與影片生成模型的交會點。"
example: "就像人在接球前，腦中會先預想球的落點；世界模型讓機器人在真正伸手之前，先在「腦內」把接下來幾秒的畫面跑一遍。"
