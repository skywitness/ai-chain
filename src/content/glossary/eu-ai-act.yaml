term: "歐盟 AI 法"
zh: "歐盟人工智慧法"
en: "EU AI Act"
aliases:
  - "歐盟人工智慧法"
  - "歐盟 AI 法案"
  - "人工智慧法案"
  - "EU AI Act"
  - "AI Act"
  - "Regulation (EU) 2024/1689"
category: "policy"
level: 2
short: "歐盟依風險高低分級管理 AI 的法律，違反禁止規定最高可罰全球年營業額 7%。"
definition: "歐盟《人工智慧法》（Regulation (EU) 2024/1689）於 2024 年 8 月 1 日生效，依風險把 AI 分為不可接受（禁止）、高風險、有限風險（透明義務）與最低風險，另對通用目的 AI（GPAI）模型設專門規定。禁止行為與 AI 素養義務自 2025 年 2 月 2 日起適用，GPAI 義務自 2025 年 8 月 2 日起適用，原定 2026 年 8 月 2 日起全面適用；但「AI Omnibus」修正已於 2026 年 7 月 27 日生效，因此 2026 年 8 月 2 日起適用的是透明義務等多數規定，生物辨識、就業、教育等高風險領域的規定延到 2027 年 12 月 2 日，嵌入電梯、玩具等產品的系統則延到 2028 年 8 月 2 日。違反禁止規定最高可罰 3,500 萬歐元或全球年營業額 7%（取較高者）。只要在歐盟市場提供服務就受規範，因此美國與中國的模型公司都必須準備技術文件、模型評測與風險管理措施。"
example: "就像食品依風險分級管理：一般零食標示成分即可，嬰兒奶粉要嚴格檢驗，有毒物質直接禁售。AI 法對聊天機器人要求告知「你正在和 AI 對話」，對招募或醫療用途的 AI 則要求更嚴格的審查。"
