term: "HVDC"
zh: "高壓直流輸電"
en: "High-Voltage Direct Current"
aliases:
  - "高壓直流輸電"
  - "高壓直流"
  - "直流輸電"
  - "特高壓直流"
  - "UHVDC"
  - "HVDC Transmission"
category: energy
level: 3
short: "以數十萬伏特直流電長距離輸送電力的技術，損耗比交流低；資料中心內的 800 V 直流配電也常被稱為 HVDC。"
definition: "一般電網以交流電輸送，HVDC 則在線路兩端設置換流站，先把交流轉成直流，以數十萬伏特的高壓送出，到另一端再轉回交流。直流線路沒有集膚效應，也不必傳送無效功率，長距離輸送時損耗較低：依維基百科整理的資料，HVDC 每 1,000 公里損耗約 3.5%，比同電壓交流線路（約 6.7%）少約一半；它也適合長距離海底電纜，以及連接頻率不同或不同步的電網。目前最長的是中國準東—皖南 ±1,100 kV 特高壓直流線，長度超過 3,000 公里。由於換流站設備昂貴，通常只有長距離或海纜才符合經濟效益。在 AI 領域，這個詞另有一層用法：輝達（NVIDIA）推動資料中心改用 800 V 直流配電，業界常稱為 800V HVDC，目的是減少交直流轉換次數與銅用量；它的電壓遠低於電網 HVDC，屬於機房內的配電架構。"
example: "HVDC 像城際高鐵：兩端的車站（換流站）蓋起來很貴，但跑長途又快又省；如果只是短程通勤，一般公車（交流電網）反而比較省錢。"
