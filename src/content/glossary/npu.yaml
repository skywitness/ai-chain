term: "NPU"
zh: "神經網路處理器"
en: "Neural Processing Unit"
aliases:
  - "Neural Processing Unit"
  - "神經處理單元"
  - "AI 引擎"
  - "Neural Engine"
category: robotics
level: 1
short: "專門執行神經網路運算的處理器，常內建在手機與筆電晶片裡，跑 AI 比 CPU、GPU 更省電。"
definition: "NPU（神經網路處理器）是專為深度學習中大量矩陣乘法與卷積運算設計的加速器，通常和 CPU、GPU 整合在同一顆 SoC 裡。執行即時翻譯、影像處理、語音辨識或小型語言模型時，它比 CPU、GPU 更省電，是手機與筆電能「在本機跑 AI」的關鍵。NPU 效能常以 TOPS（每秒兆次運算）表示，微軟（Microsoft）就把「NPU 達 40 TOPS 以上」訂為 Copilot+ PC 的門檻。許多 NPU 只支援 INT8 等低位元整數運算，因此模型通常要先量化才能放到 NPU 上執行。蘋果（Apple）、高通（Qualcomm）、聯發科（MediaTek）、英特爾（Intel）、超微（AMD）與三星（Samsung）都在自家晶片中整合 NPU，讓終端 AI 晶片成為與資料中心 GPU 並行的另一條戰線。"
example: "如果 CPU 是什麼都會的通才、GPU 是擅長大量平行計算的工廠，NPU 就是只做神經網路運算的專業產線，同樣的工作耗電少很多。"
