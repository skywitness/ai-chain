term: "3D NAND"
zh: "立體堆疊 NAND 快閃記憶體"
en: "3D NAND"
aliases:
  - "V-NAND"
  - "3D NAND Flash"
  - "立體 NAND"
  - "4D NAND"
  - "BiCS Flash"
category: "memory"
level: 3
short: "把 NAND 記憶單元像蓋大樓一樣垂直堆疊上百層，以提高容量、降低每位元成本的技術。"
definition: "平面 NAND 微縮到約 16 奈米後就難以再縮小，業界改為把記憶單元垂直堆疊：先交替沉積數百層導電層與絕緣層，再蝕刻出貫穿各層的深孔，在孔壁形成電荷捕捉層，每一層就是一層記憶單元。東芝於 2007 年發表這個概念，三星在 2013 年率先量產 24 層產品。此後各家競相堆高層數，SK 海力士在 2026 年 8 月首度公開開發中的第十代 375 層 4D NAND，並計劃於 2027 年初量產以它製成的企業級 SSD。層數越多，對高深寬比蝕刻與薄膜沉積的要求越高，因此 3D NAND 的擴產與升級，也直接帶動蝕刻、沉積等半導體設備的需求。"
example: "土地（晶片面積）有限時，與其把房間越隔越小，不如往上蓋高樓；3D NAND 就是記憶單元的摩天大樓。"
