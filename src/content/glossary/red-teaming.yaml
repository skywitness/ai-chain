term: "紅隊演練"
zh: "紅隊演練"
en: "Red Teaming"
aliases:
  - "紅隊測試"
  - "紅隊"
  - "Red Teaming"
  - "Red Team"
  - "對抗性測試"
  - "Adversarial Testing"
category: "policy"
level: 2
short: "扮演攻擊者，刻意找出 AI 模型可能被濫用或出錯的地方，以便在上線前修補。"
definition: "紅隊演練源自軍事與資安領域：由一組人扮演對手，主動攻擊自家系統來找出弱點。美國 NIST 的資安詞彙把紅隊定義為「經授權並有組織地模擬潛在對手攻擊或利用能力」的團隊。在 AI 領域，紅隊會設法讓模型產生有害內容、繞過安全限制或洩漏資料，也會測試模型是否具備協助製作生化武器、發動網路攻擊等危險能力；常見做法結合內部團隊、外部專家與自動化攻擊工具。歐盟 AI 法第 55 條要求具系統性風險的通用目的 AI 模型提供者，依標準化流程進行模型評估，並執行與記錄對抗性測試。紅隊演練因此成為前沿模型發布前的必要步驟與成本，模型公司也常在模型說明文件中揭露紅隊測試的結果。"
example: "就像銀行聘請「白帽駭客」試著闖進自己的系統，AI 公司也會請人想盡辦法誘導模型說出不該說的話，再據此強化防護。"
