term: "Tensor Core"
zh: "張量核心"
en: "Tensor Core"
aliases:
  - "張量核心"
  - "Tensor 核心"
  - "Tensor Cores"
category: hardware
level: 2
short: "輝達 GPU 內專門做矩陣乘加的硬體單元，處理深度學習運算比一般 GPU 核心快得多。"
definition: "Tensor Core 是輝達 GPU 中專門執行「矩陣乘加」（相乘後再累加）的硬體單元。一般 GPU 核心一次處理一個數字，Tensor Core 則一次處理一小塊矩陣，因此在深度學習這類以矩陣乘法為主的工作上快得多。它在 2017 年發表的 Volta V100 首度登場，單顆 GPU 有 640 個，每個的基本動作是把兩個 4×4 的 FP16 矩陣相乘再加上第三個矩陣，使 V100 的張量算力達 125 TFLOPS。之後每一代都加入更低的精度，Blackwell 的第五代 Tensor Core 已支援 FP4、FP6、FP8 等格式。如今 AI 晶片規格表上的算力，大多來自這類矩陣單元；超微 GPU 的 Matrix Core 與 Google TPU 的 MXU 也是功能相近的矩陣單元，只是名稱不同。"
example: "一般核心像一次只算一題的計算機；Tensor Core 像一次蓋好整張乘法表的印章，一壓就完成 16 格的計算。"
