term: "薄膜沉積"
zh: "薄膜沉積"
en: "Thin-film Deposition"
aliases:
  - "Deposition"
  - "Thin film deposition"
  - "沉積"
  - "CVD"
  - "PVD"
  - "ALD"
  - "化學氣相沉積"
  - "原子層沉積"
category: "semiconductor"
level: 2
short: "在晶圓表面鋪上極薄材料（絕緣層、金屬導線等）的製程，與微影、蝕刻反覆搭配進行。"
definition: "薄膜沉積是在晶圓表面加上一層極薄材料的製程，用來形成絕緣層、導電層、阻障層與金屬導線。常見方法包括化學氣相沉積（CVD）、物理氣相沉積（PVD，例如濺鍍）、原子層沉積（ALD，一次只長幾層原子，能均勻覆蓋複雜的立體結構），以及用電化學沉積（ECD）長出連接元件的銅導線。晶片製造可以看成「沉積、微影、蝕刻」的反覆循環，一顆先進晶片要堆疊數十層材料。GAA 電晶體、背面供電與 3D NAND 等新結構都需要更多、更精準的沉積步驟，主要設備商有應用材料、科林研發、東京威力科創與 ASM 國際（ASM International）。"
example: "沉積像在蛋糕上一層層抹奶油與果醬：每層都要又薄又均勻，之後再用微影與蝕刻把多餘的部分切掉。"
