term: "營收"
zh: "營業收入"
en: "Revenue"
aliases:
  - "營業收入"
  - "營業額"
  - "銷貨收入"
  - "Revenue"
  - "Net Revenue"
  - "Sales"
  - "Top Line"
category: "cloud-business"
level: 1
short: "公司賣產品或提供服務所收到的總金額，尚未扣除任何成本，是觀察成長最直接的指標。"
definition: "營收（營業收入）是損益表的第一行，英文常稱為 top line。依會計準則，營收在公司交付商品或提供服務、履行對客戶的義務時認列，而不是收到現金時，因此預收款或多年期合約要隨履約進度分期認列。營收只代表規模、不代表賺錢，還要搭配毛利率、營業利益率與淨利一起看。在 AI 產業鏈中，晶片與硬體供應商的營收最能直接反映需求強弱：台積電 2026 年第二季合併營收新台幣 1 兆 2,703.8 億元，年增 36.0%、季增 12.0%，以美元計為 402 億美元。"
example: "麵店一天賣出 300 碗、每碗 150 元，營收就是 4 萬 5,000 元，還沒扣掉牛肉、房租與人事成本。"
