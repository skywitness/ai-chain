term: "對齊"
zh: "AI 對齊"
en: "AI Alignment"
aliases:
  - "價值對齊"
  - "模型對齊"
  - "Alignment"
category: training
level: 2
short: "讓 AI 的行為符合人類的意圖與價值：有幫助、誠實，而且不造成傷害。"
definition: "對齊是指讓 AI 系統的目標與行為符合設計者、使用者的意圖及社會價值。OpenAI 的 InstructGPT 論文指出，單純把模型做大並不會讓它更懂得遵循使用者意圖，模型仍可能產生不實、有害或沒有幫助的內容，因此需要 RLHF 等對齊訓練。Anthropic 提出的 Constitutional AI 則以一份書面原則，讓 AI 自我批評與修正；在「無害性」訓練上，改用 AI 回饋取代人工標註有害內容（RLAIF）。隨著模型開始能自主操作電腦、執行多步驟的 Agent 任務，對齊與安全評估已成為前沿實驗室、監管機關與企業導入 AI 時的核心議題。"
example: "像訓練一位能力極強的新員工：光是聰明還不夠，還要確保他理解公司真正要的是什麼，不會為了衝業績而走捷徑或說謊。"
