term: "注意力機制"
zh: "注意力機制"
en: "Attention Mechanism"
aliases:
  - "注意力機制"
  - "Attention"
  - "Attention Mechanism"
  - "Self-Attention"
  - "自注意力"
  - "多頭注意力"
category: llm
level: 2
short: "讓模型處理每個字時，自動判斷句中哪些其他字最相關、該分配多少「注意力」的機制。"
definition: "注意力機制讓模型在處理每個 Token 時，計算它與序列中其他 Token 的相關程度，再依權重整合資訊。Transformer 的「自注意力」會把每個 Token 轉成查詢（Q）、鍵（K）、值（V）三組向量，以 Q 與 K 的內積（再依向量維度縮放）經 softmax 得到權重，再用這些權重加總各 Token 的 V。注意力最早在 2014 年被用於神經機器翻譯，2017 年成為 Transformer 的核心。標準注意力的運算量與記憶體需求隨序列長度呈平方成長，是長上下文的主要瓶頸，因此催生 FlashAttention、稀疏注意力與 KV Cache 管理等技術，也讓 GPU 記憶體頻寬與 HBM 容量更加關鍵。"
example: "讀到「小明把書還給圖書館，因為它已經逾期」時，模型要知道「它」指的是書而不是圖書館；注意力機制就是幫模型找出這種對應關係。"
