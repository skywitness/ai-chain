term: "變壓器"
zh: "電力變壓器"
en: "Power Transformer"
aliases:
  - "電力變壓器"
  - "大型電力變壓器"
  - "升壓變壓器"
  - "降壓變壓器"
  - "LPT"
  - "Large Power Transformer"
category: energy
level: 1
short: "利用電磁感應升高或降低交流電壓的設備；從電廠到資料中心都少不了它，近年交期大幅拉長。"
definition: "變壓器由鐵心與線圈組成，利用電磁感應改變交流電的電壓：電廠先升壓，以降低長距離輸電的損耗，再由變電所逐級降壓。進到資料中心後，電力公司送來的中壓電（例如 35 kV）還要再降到 415 V 等低壓，才能送進 UPS 與機櫃。大型電力變壓器（LPT）多為客製化產品，需要取向性電工鋼片（GOES）、銅導體、套管與有載分接頭切換器等材料與零件。美國國家實驗室（NLR）2026 年 5 月的報告彙整既有資料指出：美國超過 80% 的 LPT 需求靠進口滿足；一般 LPT 從下單到交貨的時間由 12–18 個月拉長到 30–36 個月，超高壓機種可達 60 個月；2025 年價格約比 2019 年高 50%–70%。電網更新與 AI 資料中心同時搶貨，讓變壓器成為 AI 電力供應鏈最常被點名的瓶頸之一。"
example: "變壓器像水管系統的加壓站與減壓閥：長途輸送時加壓以減少損耗，進到家裡前再降到安全好用的水壓。"
