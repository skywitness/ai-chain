term: "Token 計價"
zh: "以 Token 計價"
en: "Per-token Pricing"
aliases:
  - "Token 計費"
  - "按 Token 收費"
  - "每百萬 Token 價格"
  - "用量計價"
  - "$/MTok"
  - "Usage-based Pricing"
category: "cloud-business"
level: 1
short: "模型 API 依處理的 Token 數量收費，通常以每百萬 Token 多少美元報價，輸出比輸入貴。"
definition: "生成式 AI 的 API 多半依 Token 用量計價，分別報出「輸入」與「輸出」每百萬 Token（MTok）的價格。輸出通常較貴，因為模型必須逐一生成每個 Token，佔用 GPU 的時間較長。以 Anthropic 官方定價為例，Claude Haiku 4.5 輸入每百萬 Token 1 美元、輸出 5 美元，提示快取命中的部分每百萬 Token 只收 0.1 美元（基本輸入價的十分之一），改用批次處理則輸入與輸出都打五折。同一段文字會切成多少 Token，取決於模型的分詞器與語言：Anthropic 文件指出，較早的 Claude 模型 1 個 Token 約相當於 3.5 個英文字元，Claude 4.7 以後改用的新分詞器，同一段文字約多出 30% 的 Token。因此比較不同模型的費用時，不能只看每百萬 Token 的單價。Token 單價直接影響 AI 應用的毛利，也把推論端的 GPU 與電力成本連到營收，是理解 AI 商業模式的關鍵。"
example: "以 Claude Haiku 4.5 的牌價試算：處理 1 萬張客服單，每張讀入約 3,000 個 Token、回覆約 500 個 Token，輸入成本 30 美元、輸出 25 美元，合計約 55 美元；改用批次處理約 27.5 美元。"
