term: "CoWoS-L"
zh: "局部矽互連 CoWoS"
en: "CoWoS-L (Local Silicon Interconnect)"
aliases:
  - "CoWoS Local Silicon Interconnect"
  - "局部矽互連"
  - "局部矽橋 CoWoS"
  - "CoWoS-L 封裝"
category: "packaging"
level: 3
short: "CoWoS 的大尺寸版本：以重布線層中介層搭配嵌入的小塊矽橋，取代整片矽中介層，做出更大的 AI 封裝。"
definition: "CoWoS-L 是台積電為超大型 AI 與高效能運算晶片推出的 CoWoS 版本。原本的 CoWoS-S 使用整片矽中介層，最大約 3.3 倍光罩尺寸；再放大下去，整片矽中介層的成本與良率都會吃緊，台積電建議更大的設計改用 CoWoS-L 或 CoWoS-R。CoWoS-L 以重布線層（RDL）中介層為主體，只在晶粒之間需要超高密度連線的位置嵌入小塊「局部矽互連」（LSI）晶片，以多層、線寬不到 1 微米的銅線連接 SoC 與 SoC、SoC 與 HBM，並可內嵌深溝槽電容（eDTC）穩定供電；同一種 LSI 還能在多款產品重複使用。台積電首款 3.5 倍光罩尺寸的 CoWoS-L 自 2024 年量產，此後持續放大中介層；台積電 2026 年 4 月表示已在生產 5.5 倍光罩尺寸的 CoWoS，並規劃 2028 年量產可整合約 20 組 HBM 的 14 倍光罩版本。"
example: "與其買一整塊昂貴的大理石當桌面（整片矽中介層），不如用便宜的木板做桌面，只在最需要精密的接縫處鑲上小塊大理石（局部矽橋）。"
