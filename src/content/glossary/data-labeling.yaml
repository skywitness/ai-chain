term: "資料標註"
zh: "資料標註"
en: "Data Labeling"
aliases:
  - "資料標記"
  - "人工標註"
  - "Data Annotation"
  - "Labeling"
category: training
level: 1
short: "由人替資料加上正確答案或評分，例如框出照片裡的車、替兩個回答排優劣，供模型學習。"
definition: "資料標註是由人（或人機協作）替原始資料加上「標籤」，例如圖片中物體的框線、語音的逐字稿，或替模型的兩個回答排出好壞。監督式學習與大型語言模型的後訓練都仰賴這類資料：OpenAI 訓練 InstructGPT 時，就聘請約 40 名標註人員撰寫示範答案並替模型輸出排序。隨著模型變強，標註工作從大量簡單任務，逐步轉向需要律師、醫師、工程師等專家參與的高單價任務，也撐起 Scale AI 等資料供應商：依 Scale AI 公告，2025 年 6 月 Meta 的新投資對該公司的估值逾 290 億美元。"
example: "自駕車公司請人在大量街景照片中框出行人、機車與紅綠燈，模型才能學會「看懂」路況。"
