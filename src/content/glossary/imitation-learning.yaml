term: "模仿學習"
zh: "模仿學習"
en: "Imitation Learning"
aliases:
  - "Imitation Learning"
  - "示範學習"
  - "Learning from Demonstration"
  - "行為複製"
  - "Behavior Cloning"
category: robotics
level: 2
short: "讓機器人觀察人類示範的動作並加以模仿，藉此學會新技能的訓練方法。"
definition: "模仿學習是讓模型從專家示範中學習「在什麼狀況下該做什麼動作」的方法。最基本的形式稱為行為複製（Behavior Cloning），把示範中的「觀察→動作」配對當成監督式學習的題目與答案。在機器人領域，示範資料通常由人類透過遙控操作設備、動作捕捉手套或 VR 裝置操控機器人蒐集而來。2023 年發表的 ACT（Action Chunking with Transformers）研究顯示，低成本的雙臂機器人只靠約 10 分鐘的示範，就能以 80%–90% 的成功率完成打開半透明醬料杯、插入電池等精細任務。模仿學習的瓶頸在於示範資料昂貴、難以涵蓋所有情況，因此業界常把它和強化學習、模擬訓練及 VLA 預訓練結合；如何大量蒐集機器人示範資料，也成為實體 AI 發展的關鍵課題與新興生意。"
example: "就像學徒站在老師傅旁邊看他炒菜，再照著做一次；機器人則是看人類遙控它完成摺衣服的過程，學會下次自己摺。"
