term: "CPO"
zh: "共同封裝光學"
en: "Co-Packaged Optics"
aliases:
  - "共同封裝光學"
  - "共封裝光學"
  - "Co-Packaged Optics"
  - "光電共封裝"
  - "Spectrum-X Photonics"
category: networking
level: 2
short: "把光學引擎直接封裝在交換器或運算晶片旁邊，取代可插拔光模組，以降低耗電與訊號損耗。"
definition: "CPO（共同封裝光學）是把負責光電轉換的光學引擎，和交換器晶片等主晶片放進同一個封裝裡，取代插在設備面板上的可插拔光模組。傳統做法中，電訊號要從晶片穿過主機板走線，才抵達面板上的光模組，速度越高損耗越大，需要耗電的 DSP 來補償；CPO 大幅縮短電訊號的路徑，因此能明顯省電。輝達（NVIDIA）2025 年 3 月發表 Spectrum-X 與 Quantum-X 矽光子交換器，官方稱每埠 1.6 Tb/s、能源效率提升 3.5 倍、所需雷射減少為四分之一，當時預計 Quantum-X 版本於 2025 年稍晚、Spectrum-X 版本於 2026 年上市。博通（Broadcom）已推出 Tomahawk 4、5 的 CPO 版本，Tomahawk 6 同樣提供 CPO 選項。CPO 的挑戰包括維修方式改變、封裝良率與供應鏈重整，也牽動光模組業者的長期角色。"
example: "傳統可插拔光模組像把插座裝在房子外牆，電要先繞一大段路才到；CPO 則是把插座直接做進電器裡，路徑短、損耗也少。"
