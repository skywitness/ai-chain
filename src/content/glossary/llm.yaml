category: llm
level: 1
short: "用海量文字訓練、能理解與生成文字的大型神經網路，是 ChatGPT、Claude、Gemini 背後的核心技術。"
definition: "大型語言模型（LLM）是以 Transformer 架構為主、用網路文章、書籍與程式碼等海量文字預訓練的神經網路，核心任務是根據前文預測下一個 Token；規模夠大之後，就能翻譯、摘要、寫程式與推理。2020 年 OpenAI 發表的 GPT-3 已有 1,750 億個參數，比先前任何非稀疏語言模型大 10 倍。LLM 是 AI 產業鏈最主要的需求來源之一：訓練與推論消耗大量 GPU、HBM 與電力，模型 API 與 AI 應用則是雲端業者與軟體公司把算力變現的主要方式。"
example: "手機輸入法的「下一個字建議」只看前面幾個字；LLM 像讀過整座圖書館的超級版本，能根據整段對話接著寫出完整回答。"
