term: "InfiniBand"
zh: "InfiniBand 高效能網路"
en: "InfiniBand"
aliases:
  - "IB"
  - "IB 網路"
  - "無限頻寬"
  - "Quantum InfiniBand"
  - "Quantum-X800"
category: networking
level: 2
short: "專為超級電腦與 AI 叢集設計的低延遲網路，原生支援 RDMA，目前主要由輝達供應。"
definition: "InfiniBand 是 1999 年由兩套競爭的 I/O 規格合併而成的高效能網路標準，由 InfiniBand 貿易協會（IBTA）推廣。它從設計之初就把 RDMA 與可靠傳輸內建在協定裡，延遲低、CPU 負擔小，因此長期是超級電腦與 AI 訓練叢集的熱門選擇，2014 年至 2016 年 6 月間曾是 TOP500 超級電腦最常用的互連技術。主要供應商 Mellanox 是最後一家獨立的 InfiniBand 廠商，輝達（NVIDIA）於 2019 年 3 月宣布收購，2020 年 4 月完成，交易金額約 70 億美元；2024 年推出的 XDR 世代每個連接埠可達 800 Gb/s，下一代 GDR 規劃達 1.6 Tb/s。由於供應高度集中在輝達，超乙太網路聯盟等陣營則押注經 AI 最佳化的乙太網路，兩條路線的消長是 AI 網路的重要觀察點。"
example: "InfiniBand 像專為賽車打造的封閉賽道，速度快、規則嚴謹，但主要由一家廠商經營；乙太網路則像全國公路網，車多、選擇多、成本也較低。"
