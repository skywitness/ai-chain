term: "工業機器人"
zh: "工業機器人"
en: "Industrial Robot"
aliases:
  - "Industrial Robot"
  - "機械手臂"
  - "機器手臂"
  - "Robot Arm"
  - "產業用機器人"
category: robotics
level: 1
short: "在工廠裡負責焊接、搬運、組裝等重複性工作的可程式化機械手臂。"
definition: "依 ISO 8373 的定義，工業機器人是「可自動控制、可重新編程、多用途，且可在三個以上軸向編程」的操作機，常見於汽車、電子與金屬加工產線，負責焊接、噴塗、搬運與組裝。國際機器人聯合會（IFR）統計，2025 年全球新裝機超過 60 萬台，運作中的總數年增 9%，創下 500 萬台的新高；其中中國裝機 35.4 萬台，佔全球 59%。傳統工業機器人多半依照固定程式重複動作，換線時需要工程師重新教導；加入機器視覺與 AI 模型後，可以處理位置不固定的零件與少量多樣的產線，這正是實體 AI 與工業機器人的交會點。它也是諧波減速機、伺服馬達等精密零組件的主要用戶。"
example: "汽車工廠裡沿著產線一字排開、火花四濺地焊接車身的橘色手臂，就是最典型的工業機器人。"
