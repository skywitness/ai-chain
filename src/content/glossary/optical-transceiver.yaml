term: "光收發模組"
zh: "光收發模組"
en: "Optical Transceiver"
aliases:
  - "光模組"
  - "光收發器"
  - "光通訊模組"
  - "Optical Module"
  - "Transceiver"
  - "可插拔光模組"
  - "Pluggable Optics"
category: networking
level: 1
short: "插在交換器或網卡上，負責把電訊號轉成光訊號（以及反向轉換）的小模組，AI 叢集用量極大。"
definition: "光收發模組負責電與光之間的轉換：發射端用雷射把電訊號變成光訊號送進光纖，接收端再用光偵測器把光轉回電訊號。它通常做成可熱插拔的標準外型，例如 OSFP 與 QSFP-DD。依 OSFP 多源協議（MSA），一個 OSFP 模組有 8 條電氣通道，每通道 100 Gb/s 時是 800G，每通道 200 Gb/s 時就是 1.6T。AI 叢集裡每顆 GPU 都要透過網卡與多層交換器相連，光模組用量隨 GPU 數量快速增加，也是網路耗電的重要來源，因此業界發展出省掉 DSP 的 LPO，以及把光學元件移進交換器封裝的 CPO。輝達（NVIDIA）列出的可插拔光模組合作夥伴包括中際旭創（Innolight）、新易盛（Eoptolink）、Coherent 與 Fabrinet。"
example: "光模組像同時兼任翻譯的轉接頭：伺服器說的是「電」的語言，光纖只聽得懂「光」，光模組在兩端即時翻譯。"
