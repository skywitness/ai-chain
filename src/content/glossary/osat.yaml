term: "OSAT"
zh: "專業封測代工"
en: "Outsourced Semiconductor Assembly and Test"
aliases:
  - "封測代工"
  - "委外封測"
  - "專業封測廠"
  - "SATS"
  - "Outsourced Semiconductor Assembly and Test"
category: "packaging"
level: 2
short: "專門替其他公司的晶片做封裝與測試的代工業者，例如日月光、艾克爾（Amkor）與京元電。"
definition: "OSAT 指不自己設計晶片、也不做前段晶圓製造，專門承接封裝與測試訂單的代工業者，角色好比晶圓代工之於前段製程。IC 設計公司、晶圓代工廠甚至 IDM 都會把部分後段工序委外給 OSAT，以節省設備投資並彈性調度產能。全球最大的 OSAT 是台灣的日月光投控（旗下含日月光、矽品與電子代工服務廠環旭），2025 年合併營收約新台幣 6,454 億元（含環旭的電子代工營收）；其他主要業者包括美國艾克爾（Amkor）、中國長電科技，以及台灣的力成與以測試為主的京元電。AI 晶片大量採用先進封裝後，晶圓代工廠（例如台積電的 CoWoS）也跨入封裝，與 OSAT 形成既分工又競爭的關係，OSAT 則積極投資先進封裝與測試產能。"
example: "就像許多品牌把產品交給專業的包裝與品管工廠處理，自己專心做研發和行銷。"
