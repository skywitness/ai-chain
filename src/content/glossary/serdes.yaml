term: "SerDes"
zh: "串列器／解串器"
en: "Serializer/Deserializer"
aliases:
  - "Serializer/Deserializer"
  - "串列器／解串器"
  - "串列解串器"
  - "高速 SerDes"
  - "224G SerDes"
category: networking
level: 3
short: "把晶片內的平行資料轉成一條高速序列訊號送出、在接收端再還原的電路，是所有高速互連的基礎。"
definition: "SerDes 是一對功能電路：發送端的串列器把晶片內部多條較慢的平行資料，合併成一條極高速的序列訊號送出；接收端的解串器再把它拆回平行資料，常見設計還會從訊號中還原內嵌的時脈。這樣能大幅減少晶片腳位與走線數量。乙太網路、PCIe、NVLink、UALink 底層都靠 SerDes 傳輸，每條通道的速度決定連接埠頻寬：例如 OSFP 光模組以 8 條 100G 通道組成 800G、8 條 200G 通道組成 1.6T；博通（Broadcom）Tomahawk 6 交換器晶片可用 200G SerDes，或 1,024 條 100G SerDes 的版本，達到 102.4 Tb/s 總容量。速度越高，銅線能傳的距離越短、功耗也越高，因此 SerDes 設計能力是交換器晶片、AI 加速器與矽智財業者的核心競爭力，也連帶影響 Retimer、AEC、LPO 與 CPO 的需求。"
example: "就像把一整排並肩走的人改成排成一列快跑通過窄門：門（腳位）只要一個，但每個人都得跑得非常快，到了對面再重新排成一排。"
