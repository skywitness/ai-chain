term: "HDD"
zh: "傳統硬碟"
en: "Hard Disk Drive"
aliases:
  - "硬碟"
  - "機械硬碟"
  - "Hard Drive"
  - "Hard Disk"
category: "memory"
level: 1
short: "用高速旋轉的磁碟片記錄資料的傳統硬碟，速度較慢但每 TB 成本低，仍是雲端大量資料的主力。"
definition: "HDD 以塗有磁性材料的碟片高速旋轉，再由機械臂上的磁頭讀寫資料，斷電後資料仍保存。因為要等碟片轉到定位，存取延遲遠高於 SSD，但每位元成本低，因此資料中心仍用 HDD 存放大量較少存取的「冷資料」與備份；以 EB 計算的伺服器儲存出貨量仍以 HDD 為主。經過長年整併，市場主要由希捷（Seagate）、威騰（Western Digital）與東芝（Toshiba）三家供應。熱輔助磁記錄（HAMR）技術於 2024 年初開始商用，到 2025 年單顆硬碟容量已達 36 TB。AI 帶動資料量暴增後，據報導威騰 2026 年的硬碟供應在 2 月前就已被企業客戶預訂一空。"
example: "HDD 像郊區的大倉庫，東西放得多又便宜，但每次取貨都要等堆高機開過去；SSD 則像伸手可及的貨架。"
