term: "CXL"
zh: "運算快速連結"
en: "Compute Express Link"
aliases:
  - "Compute Express Link"
  - "CXL 記憶體"
  - "CXL 3.0"
  - "CXL 4.0"
  - "記憶體池化"
category: "memory"
level: 3
short: "建立在 PCIe 之上的開放互連標準，讓 CPU 以快取一致的方式擴充、共享更多記憶體。"
definition: "CXL 是由英特爾主導開發、2019 年成立產業聯盟推動的開放互連標準，沿用 PCIe 的實體層與電氣介面，再加上 CXL.io、CXL.cache 與 CXL.mem 三種協定，讓 CPU、加速器與記憶體擴充裝置共享一致的記憶體空間。對資料中心而言，CXL 最大的用途是突破 CPU 記憶體通道與插槽數的限制：可以插上 CXL 記憶體擴充模組增加容量，或透過 CXL 交換器把記憶體「池化」給多台伺服器共用，減少閒置浪費。規格已從 1.0（2019 年，基於 PCIe 5.0）演進到 3.x（基於 PCIe 6.0），最新的 CXL 4.0 再把傳輸速率由 64 GT/s 加倍到 128 GT/s。AI 推論與資料庫等吃記憶體的應用增加，使 CXL 記憶體成為記憶體與連接晶片業者的新產品線。"
example: "就像辦公室共用的會議室：與其每個部門各自蓋一間常常閒置的會議室，不如大家共用一個可預約的會議室池。"
