term: "TCO"
zh: "總擁有成本"
en: "Total Cost of Ownership"
aliases:
  - "總擁有成本"
  - "總持有成本"
  - "全生命週期成本"
  - "Total Cost of Ownership"
category: "cloud-business"
level: 2
short: "把設備從購買、安裝、用電、散熱、維運到汰換的全部成本加總，比較方案時不只看售價。"
definition: "總擁有成本（TCO）是評估一項設備或服務在整個使用期間所有直接與間接成本的方法，由 Gartner 在 1987 年推廣。以 AI 伺服器為例，TCO 包括 GPU 與伺服器購置、網路設備、機房空間、數年的電費與散熱、維運人力、軟體授權與融資利息，再扣掉期末殘值。比較自建與租用時，可以對照雲端價格，例如 Lambda 公開的 8 卡 H100 隨需價格為每顆 GPU 每小時 3.99 美元，換算一台 8 卡伺服器全年不停機約 28 萬美元。TCO 也是 AI 晶片競爭的核心：自研 ASIC 或新一代 GPU 常強調「每瓦效能」與「每個 Token 的成本」，因為電力與散熱是整個使用年限都要持續支付的成本。"
example: "買車不只看車價，還要算油錢、保險、保養、停車費，以及幾年後二手車能賣多少錢。"
