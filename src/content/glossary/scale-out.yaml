term: "Scale-out"
zh: "水平擴展"
en: "Scale-out"
aliases:
  - "水平擴展"
  - "橫向擴展"
  - "向外擴展"
  - "Scale Out"
  - "Scale-out 網路"
  - "後端網路"
  - "Back-end Network"
category: networking
level: 2
short: "用網卡、交換器與光模組把成千上萬台 GPU 伺服器串成大叢集，主流技術是乙太網路與 InfiniBand。"
definition: "Scale-out 是把許多台伺服器或機櫃，透過網卡、交換器與光模組組成的網路相連，靠增加「台數」來擴大叢集。AI 訓練用的後端網路通常讓每顆 GPU 搭配一張專屬高速網卡，例如輝達（NVIDIA）的 BlueField-3 SuperNIC 為 400 Gb/s、ConnectX-8 為 800 Gb/s、ConnectX-9 達 1.6 Tb/s。它的頻寬低於機櫃內的 Scale-up 網路，但可以延伸到數萬甚至十萬顆以上的 GPU：博通（Broadcom）表示，以 Tomahawk 6 建構兩層網路即可連接超過 10 萬顆 XPU。主要技術路線是 InfiniBand 與經過 AI 最佳化的乙太網路（例如 Spectrum-X、超乙太網路），並大量依賴 RDMA 降低延遲。資料平行訓練時跨伺服器的梯度同步（All-Reduce），主要就跑在這層網路上。"
example: "Scale-up 是把一座工廠越蓋越大；Scale-out 則是蓋很多座工廠，再用高速公路把它們連起來一起生產。"
