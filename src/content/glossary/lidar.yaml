term: "光達"
zh: "光達"
en: "Light Detection and Ranging"
aliases:
  - "LiDAR"
  - "Lidar"
  - "雷射雷達"
  - "激光雷達"
  - "光學雷達"
category: robotics
level: 1
short: "發射雷射脈衝測量距離、建立 3D 點雲的感測器，是自駕車與機器人的「眼睛」之一。"
definition: "光達（LiDAR）發射雷射脈衝，量測光線打到物體再反射回來所需的時間（飛行時間），換算成距離，再把大量測距點組成立體的「點雲」。它長期用於航空測繪，例如美國國家海洋暨大氣總署（NOAA）以飛機搭載光達繪製地形與海岸線；近年成為自駕車、Robotaxi 與機器人的關鍵感測器。相機擅長辨識顏色與文字，光達則能直接提供精確距離，而且自己發光，夜間也能運作。中國光達大廠禾賽（Hesai）2026 年上半年出貨約 110 萬顆、年增 100.8%，其中機器人用光達 26.1 萬顆、年增 165.3%，顯示需求正從汽車擴散到各類機器人。另一方面，特斯拉（Tesla）主張只用相機的純視覺路線，光達與純視覺之爭仍在持續。"
example: "像蝙蝠用回聲判斷距離，只是把聲音換成大量看不見的雷射光，掃過一圈就畫出周圍環境的 3D 地圖。"
