term: "GAA"
zh: "環繞式閘極電晶體"
en: "Gate-All-Around Transistor"
aliases:
  - "環繞式閘極"
  - "GAAFET"
  - "Nanosheet"
  - "奈米片電晶體"
  - "MBCFET"
  - "RibbonFET"
category: "semiconductor"
level: 2
short: "閘極從四面完整包住通道的新一代電晶體，台積電 2 奈米、三星 3 奈米起採用，接替 FinFET。"
definition: "GAA（環繞式閘極）電晶體把通道做成數片水平堆疊的奈米片（nanosheet），閘極從上下左右四面完整包覆，比 FinFET 的三面包覆更能抑制漏電，還能調整奈米片寬度，在效能與功耗之間取得更好的平衡。三星（Samsung）於 2022 年 6 月以 3 奈米 GAA（稱為 MBCFET）開始初期生產，宣稱相較 5 奈米功耗最多降低 45%、效能提升 23%；台積電 N2 是其第一代奈米片電晶體製程，已於 2025 年第四季量產；英特爾的版本稱為 RibbonFET，已用於量產中的 Intel 18A 製程。AI 加速器對每瓦效能極為敏感，GAA 是 2026 年以後新一代 AI 晶片的重要製程基礎。"
example: "FinFET 是用手從三面握住水管，GAA 則是把水管拆成幾條扁平細管、用整隻手完整握住，控制力更強、漏水更少。"
