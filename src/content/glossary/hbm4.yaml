term: "HBM4"
zh: "第六代高頻寬記憶體"
en: "High Bandwidth Memory 4"
aliases:
  - "HBM 4"
  - "第六代 HBM"
  - "JESD270-4"
  - "HBM4E"
category: "memory"
level: 2
short: "2025 年定案的第六代 HBM 標準，介面加寬到 2,048 位元；標準規格單疊頻寬約 2 TB/s，實際產品已更快。"
definition: "HBM4 是 JEDEC 於 2025 年 4 月公布的高頻寬記憶體標準（JESD270-4），也就是第六代 HBM。它把每疊介面從 HBM3E 的 1,024 位元加倍到 2,048 位元，獨立通道由 HBM3 的 16 個增為 32 個，在每腳位 8 Gb/s 下單疊頻寬可達 2 TB/s；堆疊高度 4 到 16 層，單疊最大容量 64 GB。另一大變化是最底層的基底晶粒開始改用晶圓代工的先進邏輯製程，例如三星 HBM4 與 HBM4E 都採用自家晶圓代工的 4 奈米基底晶粒，記憶體廠與代工廠的合作因此更緊密。實際產品的速度已超越標準：三星於 2026 年 2 月推出並量產出貨的 HBM4，在系統封裝測試中達每腳位 11.7 Gbps；2026 年 5 月送樣的 12 層 HBM4E，穩定腳位速度 14 Gbps（最高可達 16 Gbps），單疊頻寬最高 3.6 TB/s。"
example: "如果 HBM3E 是 1,024 線道的高速公路，HBM4 就是把路面直接拓寬一倍，即使每條車道車速不變，總車流量也大增。"
