term: "電晶體"
zh: "電晶體"
en: "Transistor"
aliases:
  - "Transistor"
  - "MOSFET"
  - "場效電晶體"
  - "金氧半場效電晶體"
category: "semiconductor"
level: 1
short: "用電壓控制電流開關的微小元件，是所有數位晶片最基本的建構單元。"
definition: "電晶體是一種用小訊號控制大電流的半導體元件，在數位晶片中扮演「開關」：導通代表 1、關閉代表 0，大量電晶體組合起來就能做加法、乘法與記憶。第一個電晶體於 1947 年在美國貝爾實驗室誕生；今天晶片中最主要的是 MOSFET（金氧半場效電晶體）。AI 運算需要大量矩陣乘法，電晶體越多、越省電，晶片能做的運算就越多，例如輝達資料中心用的 Blackwell GPU 合計有 2,080 億個電晶體。為了在更小的尺寸下維持控制力、減少漏電，電晶體結構也從平面式演進到 FinFET，再到 GAA（環繞式閘極），未來還有 CFET。"
example: "電晶體像水管上的電動閥門，閘極電壓就是控制閥門的手；一顆 AI 晶片裡有上千億個這樣的閥門同時快速開關。"
