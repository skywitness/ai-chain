term: "嵌入向量"
zh: "嵌入向量"
en: "Embedding"
aliases:
  - "嵌入向量"
  - "嵌入"
  - "向量表示"
  - "Embeddings"
  - "詞向量"
  - "Word Embedding"
category: llm
level: 2
short: "把文字、圖片等資料轉成一串數字（向量），意思相近的內容在向量空間中的距離也相近。"
definition: "嵌入向量是把 Token、句子、文件或圖片轉成固定長度的數字陣列，讓電腦能用距離或夾角衡量語意相似度。2013 年的 word2vec 研究顯示，不到一天就能從 16 億字的語料學到高品質詞向量；今日的嵌入模型則能把整段文字轉成向量，例如 OpenAI 的 text-embedding-3-small 預設輸出 1,536 維，text-embedding-3-large 預設 3,072 維，兩者都可依需求縮短維度。嵌入是語意搜尋、推薦系統與 RAG 的基礎，大量向量需要專門的向量資料庫儲存與檢索，形成資料基礎設施中的一個市場。"
example: "像在地圖上標座標：「貓」和「狗」的位置很近，「貓」和「股票」則相距很遠，電腦就能用距離判斷意思是否相近。"
