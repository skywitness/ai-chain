term: "可解釋性"
zh: "模型可解釋性"
en: "Interpretability"
aliases:
  - "模型可解釋性"
  - "機制可解釋性"
  - "可解釋 AI"
  - "Interpretability"
  - "Mechanistic Interpretability"
  - "Explainable AI"
  - "XAI"
category: "policy"
level: 3
short: "研究 AI 模型內部如何運作、為什麼做出某個判斷，讓「黑盒子」變得可以檢查。"
definition: "可解釋性研究的目標是理解神經網路內部的運算，回答「模型為什麼這樣回答」。傳統方法著重找出影響判斷的輸入特徵；近年興起的「機制可解釋性」（mechanistic interpretability）則試圖把模型內部的數值還原成人類看得懂的概念與電路。一大難點是單一神經元常同時對應多種概念。Anthropic 在 2024 年 5 月 21 日發表的研究中，用稀疏自編碼器（SAE）從 Claude 3 Sonnet 的中間層抽取特徵，最大的版本約有 3,400 萬個特徵，其中包括對應「金門大橋」的特徵，人為放大這個特徵就能改變模型的行為。對產業鏈而言，可解釋性可用來偵測欺騙、偏誤與危險能力，支援安全評估與法規要求的「透明與可解釋」，也是金融、醫療等高風險領域採用 AI 的重要前提。"
example: "就像醫生不只看病人有沒有發燒，還會用 X 光與核磁共振看身體內部；可解釋性研究就是在幫 AI 模型照「X 光」。"
