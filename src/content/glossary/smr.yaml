term: "SMR"
zh: "小型模組化反應爐"
en: "Small Modular Reactor"
aliases:
  - "小型模組化反應爐"
  - "小型模組化核反應爐"
  - "小型模組反應器"
  - "Small Modular Reactors"
  - "SMRs"
category: energy
level: 2
short: "單機約 300 MW 以下、以工廠預製模組建造的核反應爐；科技大廠把它視為未來資料中心的低碳電源。"
definition: "SMR 是小型模組化反應爐。世界核能協會（WNA）的定義是：單機發電量一般在 300 MWe 以下、採模組化設計並在工廠預製的核反應爐；相較之下，傳統大型機組單機約 1,000 MWe 以上。設計理念是以工廠系列化生產取代現場客製施工，藉此縮短工期、降低單次投資風險，也能依用電需求逐步加裝模組。科技業已提前預購：Google 在 2024 年 10 月與 Kairos Power 簽約，目標 2030 年讓首座 SMR 上線，2035 年前合計提供最多 500 MW。不過 WNA 也指出，目前只有少數 SMR 已在運轉或興建中，另有超過 100 種設計處於不同開發階段；首批機組能否如期、如預算完工，是 SMR 能否真正支撐 AI 用電的最大變數。"
example: "傳統核電廠像在工地一磚一瓦蓋起來的大樓；SMR 比較像組合屋，主要模組在工廠做好，再運到現場組裝。"
