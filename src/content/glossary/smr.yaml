  notes: "查核：WNA 定義（300 MWe 以下、工廠預製）、大型機組約 1,000 MWe 以上，以及 Google 與 Kairos 協議（2024-10-14、2030 年首座、2035 年前最多 500 MW）皆對照原文。修正：WNA 現稱有超過 100 種 SMR 設計在開發，原文「數十種」已更正；「像造飛機一樣批量生產」改為較精確的「工廠系列化生產」。"
