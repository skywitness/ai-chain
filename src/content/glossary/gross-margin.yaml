term: "毛利率"
zh: "營業毛利率"
en: "Gross Margin"
aliases:
  - "營業毛利率"
  - "毛利"
  - "Gross Margin"
  - "Gross Profit Margin"
  - "GM"
category: "cloud-business"
level: 1
short: "營收扣掉直接生產成本後剩下的比例，反映產品本身有多賺錢與定價能力的強弱。"
definition: "毛利率 =（營收 − 營業成本）÷ 營收。營業成本包含原料、製造人工與工廠折舊等生產成本，還沒扣掉研發、行銷與管理費用。毛利率高通常代表產品有技術門檻或定價能力，偏低則多半代表競爭激烈，或屬於代工組裝性質。AI 熱潮下，掌握先進製程與先進封裝的業者毛利率明顯走高：台積電 2026 年第二季毛利率 67.7%，並預估第三季為 65%–67%。對 AI 軟體與 SaaS 公司來說，推論算力是主要營業成本，模型的 Token 價格與 GPU 使用效率會直接影響毛利率。"
example: "一杯手搖飲賣 60 元，茶葉、牛奶和杯子等材料成本 20 元，毛利 40 元，毛利率約 67%。"
