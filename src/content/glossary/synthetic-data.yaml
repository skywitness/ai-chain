term: "合成資料"
zh: "合成資料"
en: "Synthetic Data"
aliases:
  - "模型生成資料"
  - "人造資料"
  - "Synthetic Dataset"
category: training
level: 2
short: "由 AI 模型或程式產生、而不是直接從真實世界蒐集的訓練資料，用來補足人工資料的不足。"
definition: "合成資料是由模型、模擬器或程式規則產生的訓練資料，例如讓強模型出題並作答、把教科書內容改寫成練習題，或在模擬環境中產生機器人與自駕車的感測資料。它能降低人工標註成本，並補足稀缺領域的資料。微軟的 phi-1 只有 13 億參數，訓練資料除了約 60 億個從網路篩選的「教科書等級」Token，還包含約 10 億個由 GPT-3.5 生成的教科書與練習題 Token，在 HumanEval 程式測驗達到 50.6%；NVIDIA 的 Nemotron-4 340B 在對齊階段使用的資料，超過 98% 是合成的。若缺乏篩選與驗證，生成資料中的錯誤與偏誤也可能被模型一併學進去。"
example: "像補習班老師用 AI 一口氣出幾千道數學練習題並附上詳解，再挑出答案正確的題目給學生練習。"
