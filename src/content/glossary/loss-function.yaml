# 名詞：損失函數（loss-function）· 分類 ai-basics · 資料基準日 2026-10-06
term: "損失函數"
zh: "損失函數"
en: "Loss Function"
aliases:
  - "Loss Function"
  - "Loss"
  - "損失"
  - "成本函數"
  - "Cost Function"
category: "ai-basics"
level: 2
short: "衡量模型「答錯多少」的公式，輸出一個數字；訓練的目標就是把這個數字壓到最低。"
definition: "損失函數用一個數字衡量模型預測與正確答案的差距：預測愈好，損失愈低，而訓練的目標通常就是把損失降到最小。不同任務使用不同的損失函數，例如迴歸問題常用均方誤差，分類問題常用交叉熵。大型語言模型預訓練時，損失就是預測「下一個 Token」的交叉熵。OpenAI 研究人員在 2020 年的縮放定律論文中發現，這個損失會隨模型參數量、資料量與訓練算力呈冪律下降，趨勢橫跨超過七個數量級。這項規律讓企業能用小規模實驗預估大模型的表現，成為大規模投入算力的重要依據。"
example: "射飛鏢時，每一鏢離靶心的距離就像損失；練習的目的，就是讓平均距離愈來愈小。"
