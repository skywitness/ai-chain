term: "MFU"
zh: "模型 FLOPs 使用率"
en: "Model FLOPs Utilization"
aliases:
  - "模型 FLOPs 使用率"
  - "模型浮點運算使用率"
  - "Model FLOPS Utilization"
category: training
level: 3
short: "訓練時真正用在模型計算上的運算量，佔晶片理論峰值的比例；用來衡量昂貴算力有沒有被浪費。"
definition: "MFU 由 Google 在 2022 年的 PaLM 論文中提出：以實際觀察到的訓練吞吐量（每秒處理的 Token 數）換算成模型所需的運算量，再除以硬體理論峰值。它只計入前向與反向傳播必要的運算，不含重算等額外開銷，因此能公平比較不同系統。PaLM 540B 在 6,144 顆 TPU v4 上達到 46.2%，當時 GPT-3 約為 21.3%；Meta 訓練 Llama 3 405B 時，BF16 MFU 為 38% 到 43%。換言之，即使頂尖團隊也只用到晶片理論峰值的約四成到近五成，其餘被通訊、記憶體存取與排程等開銷吃掉。MFU 越高，同樣的 GPU 投資就能完成越多訓練。"
example: "假設一列列車最高時速 300 公里，全程平均卻只跑出 120 公里，差距來自停站、加減速與等號誌；MFU 量的就是這個「實際跑出來的比例」。"
