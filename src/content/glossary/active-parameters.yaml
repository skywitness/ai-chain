term: "啟用參數"
zh: "啟用參數量"
en: "Active Parameters"
aliases:
  - "啟用參數"
  - "啟用參數量"
  - "Active Parameters"
  - "Activated Parameters"
  - "激活參數"
category: llm
level: 3
short: "MoE 模型處理每個 Token 時實際參與運算的參數量；決定運算成本，但總參數仍決定記憶體需求。"
definition: "啟用參數是指模型處理單一 Token 時真正參與計算的參數數量。稠密模型的啟用參數等於總參數；MoE 模型則只啟用被選中的專家。例如 DeepSeek-V3 總參數 6,710 億、每個 Token 啟用 370 億；OpenAI 的開放權重模型 gpt-oss-120b 總參數約 1,170 億、啟用約 51 億。啟用參數大致決定每個 Token 的運算量（FLOPs）與生成速度，總參數則決定存放權重所需的記憶體：gpt-oss-120b 經 MXFP4 量化後可放進單張 80GB GPU。比較模型成本時兩個數字都要看，這也是 MoE 讓 HBM 容量與互連頻寬更重要的原因。"
example: "像一間有 100 位員工的公司，每件案子只派 5 個人處理：人事成本看這 5 人的工時（運算量），但辦公室仍要容納全部 100 人（記憶體）。"
