term: "端到端自駕"
zh: "端到端自動駕駛"
en: "End-to-End Autonomous Driving"
aliases:
  - "End-to-End Driving"
  - "E2E 自駕"
  - "端到端"
  - "AV2.0"
category: robotics
level: 3
short: "用可整體訓練的神經網路，從感測器畫面直接學出駕駛決策，取代分模組的人工規則。"
definition: "端到端自駕是把傳統自駕系統中分開設計的「感知、預測、規劃」模組，改由一個（或少數幾個）可整體訓練的神經網路完成，從相機等感測器輸入直接輸出行駛軌跡或控制指令。傳統模組化架構的每一層都有人工定義的介面與規則，誤差會逐層累積；端到端則多半用大量人類駕駛資料進行模仿學習，讓整個系統直接針對最終的駕駛結果最佳化。學術上的代表作是 CVPR 2023 的 UniAD，它在同一個網路中整合感知、預測與規劃；產業界則有特斯拉（Tesla）的 FSD，以及英國 Wayve 主打不依賴高精地圖的 AV2.0 路線。端到端的優點是能隨資料與算力擴展，缺點是可解釋性低、安全驗證困難，也讓自駕競爭轉向比拚車隊資料量與 GPU 訓練叢集的規模。"
example: "傳統做法像一條分工明確的流水線，每站各自依規則交接；端到端則像培養一位老司機，看過幾百萬段開車影片後，憑整體經驗直接判斷怎麼開。"
