term: "微調"
zh: "微調"
en: "Fine-tuning"
aliases:
  - "模型微調"
  - "Finetuning"
  - "Fine-tune"
category: training
level: 1
short: "拿已經訓練好的模型，用少量特定資料再訓練一下，讓它更擅長某個任務或領域。"
definition: "微調是在已完成預訓練的模型上，用規模小得多、針對特定任務或領域的資料繼續訓練，讓模型學會特定格式、語氣或專業知識，而不必從零開始。完整微調會更新所有參數，成本高；LoRA 等「參數高效」方法則凍結原模型、只訓練少量新增參數：LoRA 論文以 GPT-3 175B 為例，相較以 Adam 完整微調，可訓練參數減少約 1 萬倍，GPU 記憶體需求降為約三分之一。微調讓企業能以開放權重模型打造自己的版本，也是雲端平台、MLOps 工具與模型 API 業者提供的重要服務。"
example: "一位大學剛畢業的通才（預訓練模型），再去上三個月的法律實務課（微調），就能幫事務所看合約，不必重新從小學念起。"
