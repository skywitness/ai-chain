term: "水冷板"
zh: "冷板式直接液冷"
en: "Direct-to-Chip Cold Plate"
aliases:
  - "冷板"
  - "液冷板"
  - "水冷頭"
  - "冷板式液冷"
  - "直接液冷"
  - "Cold Plate"
  - "DLC"
  - "Direct Liquid Cooling"
category: datacenter
level: 2
short: >-
  貼在 GPU 等晶片上的金屬板，內部流道讓冷卻液直接帶走晶片的熱，是 AI 伺服器主流的液冷方式。
definition: >-
  冷板式直接液冷（Direct-to-Chip）是把內部有細微流道的金屬冷板直接貼在 GPU、CPU 等高功耗晶片上，冷卻液流過冷板吸熱後，經分歧管（manifold）與軟管送到 CDU，再把熱交給機房的設施水迴路。與浸沒式相比，冷板式沿用既有的機櫃與伺服器外形，維修方式也接近傳統伺服器，因此成為大型 AI 機櫃的主流液冷方案。Google 指出，液冷伺服器以小巧的冷板取代龐大的散熱鰭片，體積約只有氣冷伺服器的一半，讓 TPU v3 的晶片密度比氣冷的上一代倍增。冷板通常只覆蓋最熱的晶片，其他元件可能仍需風扇輔助，形成液氣混合的散熱設計；而冷板流道越細、晶片越熱，就需要越高的供液壓力，例如 Google 規格的 CDU 提供 80 PSI 來驅動高效能冷板。
example: >-
  就像在發燒的額頭貼上一塊會循環冰水的退熱貼：熱直接被流過的冷水帶走，而不是拿電風扇對著整個人吹。
