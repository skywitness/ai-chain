term: "記憶體超級循環"
zh: "記憶體超級循環"
en: "Memory Supercycle"
aliases:
  - "Memory Supercycle"
  - "記憶體超循環"
  - "記憶體超級週期"
  - "Supercycle"
category: "memory"
level: 2
short: "AI 需求推動記憶體價格與廠商獲利大漲、漲勢遠超一般景氣循環的現象，2025–2026 年最明顯。"
definition: "記憶體產業向來景氣循環劇烈：缺貨時漲價、廠商擴產，供過於求後價格又崩跌。「超級循環」是市場與分析師的說法、並無嚴格定義，泛指需求出現結構性跳升，使漲價期比一般循環更長、幅度更大。這一輪由 AI 帶動：HBM 佔用大量先進 DRAM 產能，AI 伺服器所需的 DRAM 與企業級 SSD 又同步暴增，一般 DRAM 與 NAND 因而全面吃緊。TrendForce 統計，2026 年第二季全球 DRAM 產業營收約 1,547 億美元，季增 59.5%；美光 2026 財年（截至 2026 年 9 月 3 日）營收 1,331.9 億美元，約為前一年的 3.6 倍，第四季 GAAP 毛利率達 86.8%。新產能何時開出、AI 需求能否延續，是判斷循環何時反轉的關鍵。"
example: "像颱風過後的菜價：一般漲價幾週就回落，但若連續好幾季都有新的大買家（AI 資料中心）搶貨，價格就會長期維持在高檔。"
