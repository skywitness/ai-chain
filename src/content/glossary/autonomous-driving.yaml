term: "自動駕駛"
zh: "自動駕駛"
en: "Autonomous Driving"
aliases:
  - "自駕"
  - "自駕車"
  - "無人駕駛"
  - "Self-Driving"
  - "Autonomous Vehicle"
  - "AV"
category: robotics
level: 1
short: "由電腦系統取代人類操控方向盤、油門與煞車，自行完成駕駛工作的技術。"
definition: "自動駕駛指車輛由感測器（相機、雷達、光達）、運算晶片與軟體共同完成「感知、預測、規劃、控制」的駕駛工作。業界通常以 SAE J3016（同時以 ISO/SAE PAS 22736 發布）的 Level 0 到 Level 5 區分：Level 1–2 屬駕駛輔助，人類仍須全程監看；Level 3 起，系統在特定條件下負責駕駛；Level 4 可在限定區域內完全無人；Level 5 則是任何道路與條件都能自駕。對 AI 產業鏈而言，自駕車是資料量最大的實體 AI 應用之一：車隊在路上蒐集影像，回到資料中心用 GPU 叢集訓練模型，再部署到車上的推論晶片，因此同時帶動雲端訓練算力、車用 SoC 與光達等感測器的需求。"
example: "就像把一位不會累的司機裝進車裡：它用相機與光達看路，用晶片在一瞬間判斷該加速、轉彎還是煞車。"
