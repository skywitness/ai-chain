term: "NAND Flash"
zh: "NAND 快閃記憶體"
en: "NAND Flash Memory"
aliases:
  - "NAND"
  - "快閃記憶體"
  - "Flash"
  - "NAND 型快閃記憶體"
category: "memory"
level: 1
short: "斷電後資料也不會消失的儲存晶片，是 SSD、手機儲存空間與記憶卡的核心。"
definition: "NAND Flash 是一種非揮發性記憶體，把電荷困在記憶單元的浮閘或電荷捕捉層中，斷電後資料依然保存。它以「頁」為單位讀寫、以較大的「區塊」為單位抹除，速度比 DRAM 慢，但每位元成本低得多，因此用於 SSD、手機儲存與記憶卡。現代 NAND 已改為立體堆疊（3D NAND），並以 TLC、QLC 等「一格存多個位元」的方式提高密度。在 AI 產業鏈中，訓練資料集、模型檢查點與向量資料庫常存放在 NAND 製成的企業級 SSD 上；TrendForce 預估 2026 年第四季 NAND Flash 合約價將再季增 15–20%。"
example: "如果 DRAM 是工作檯，NAND Flash 就是檔案櫃：放得多、斷電也不會忘，但拿取比較慢。"
