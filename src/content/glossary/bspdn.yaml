term: "背面供電"
zh: "背面供電網路"
en: "Backside Power Delivery Network"
aliases:
  - "BSPDN"
  - "Backside power delivery"
  - "BPD"
  - "背面電軌"
  - "Super Power Rail"
  - "PowerVia"
category: "semiconductor"
level: 3
short: "把供電線路移到晶圓背面、正面專門走訊號的新架構，可減少電壓損失並提高密度，英特爾 18A、台積電 A16 採用。"
definition: "傳統晶片的供電線路與訊號線都擠在電晶體上方（正面）的金屬層中，彼此爭搶空間，電流經過層層細線也會造成電壓下降（IR drop）。背面供電把供電網路移到晶圓背面，正面金屬層全部留給訊號，可同時改善供電效率、效能與邏輯密度。台積電 A16 結合奈米片電晶體與背面電軌（Super Power Rail），公司 2024 年公布的目標是相較 N2P 在相同電壓下速度提升 8–10%、相同速度下功耗降低 15–20%、晶片密度最高提升 1.10 倍，主要鎖定資料中心等高效能運算產品。台積電 2025 年年報表示 A16 排定 2026 年下半年量產，但 2026 年 4 月有媒體報導量產延至 2027 年。台積電另預告第二代背面供電製程 A12，鎖定 AI 與高效能運算，預計 2029 年投產。英特爾的版本稱為 PowerVia，已用於量產中的 Intel 18A 製程。"
example: "就像把大樓的水電管線從走廊天花板移到地下室：走廊（正面）空出來專給人潮（訊號）通行，水電（供電）也能走更粗、更直接的管路。"
