term: "GPU"
zh: "圖形處理器"
en: "Graphics Processing Unit"
aliases:
  - "圖形處理器"
  - "繪圖處理器"
  - "繪圖晶片"
  - "GPGPU"
  - "Graphics Processing Unit"
category: hardware
level: 1
short: "原本用來繪製畫面的晶片，內含上萬個小核心可同時計算，是訓練與執行 AI 模型的主力硬體。"
definition: "GPU 原本專為電腦繪圖設計：畫面上數百萬個像素可以分頭同時計算，所以 GPU 內建數千到上萬個簡單的運算核心。神經網路最主要的運算是大規模矩陣乘法，同樣能拆成許多小份平行處理，GPU 因此成為 AI 訓練與推論的主力。以輝達（NVIDIA）H100（SXM 版）為例，單顆就有 16,896 個 FP32 運算核心。GPU 也是 AI 產業鏈中產值最集中的環節之一：輝達 FY2027 第二季（截至 2026 年 7 月 26 日）資料中心營收（含運算與網通產品）890 億美元、年增 117%，並牽動台積電先進製程、CoWoS 封裝與 HBM 記憶體的需求。"
example: "一張 4K 畫面約有 830 萬個像素。CPU 像幾位數學教授逐一計算，GPU 則像上萬名小學生每人負責一小格、同時開工，總速度快得多。AI 的矩陣運算也是這種「人多好辦事」的工作。"
