term: "雲端運算"
zh: "雲端運算"
en: "Cloud Computing"
aliases:
  - "雲端"
  - "雲端服務"
  - "公有雲"
  - "Cloud"
  - "IaaS"
  - "PaaS"
category: "cloud-business"
level: 1
short: "透過網路隨需租用運算、儲存與軟體，用多少付多少，不必自己買伺服器、蓋機房。"
definition: "美國國家標準暨技術研究院（NIST）在 SP 800-145 中將雲端運算定義為：透過網路隨需存取一個可設定的共享運算資源池（網路、伺服器、儲存、應用程式與服務），並能以最少的管理工作快速配置與釋放。它包含 5 項基本特性、3 種服務模式（IaaS、PaaS、SaaS）與 4 種部署模式（公有雲、私有雲、社群雲、混合雲）。對 AI 產業鏈而言，雲端是多數企業取得 GPU 算力與模型的主要管道，雲端業者也是 AI 晶片與伺服器最大的買家之一。以 Amazon 的 AWS 為例，2026 年第二季營收 422 億美元，年增 37%。"
example: "就像用電：不必自己蓋發電廠，插上插座、依用電度數付費即可。"
