category: "ai-basics"
level: 2
short: "把兩張數字表格相乘的運算，是神經網路計算量的主體，也是 GPU 與 AI 晶片最主要的加速對象。"
definition: "矩陣乘法是把兩個矩陣相乘、得到新矩陣的運算：結果中的每個數字，都是一列與一欄的對應元素相乘後再相加。若兩個矩陣的尺寸分別為 M×K 與 K×N，就需要 2 × M × N × K 次浮點運算。輝達的技術文件指出，通用矩陣乘法（GEMM）是神經網路中全連接層、卷積層與循環層等許多運算的基本組成；Transformer 的注意力與前饋層同樣以它為主。運算規模極為龐大：Meta 的 Llama 3.1 405B 預訓練共用了 3.8 × 10²⁵ 次浮點運算，動用最多約 1.6 萬顆 H100。這種規則、可高度平行的運算，正是 GPU、TPU 與各種 AI ASIC 能以專用電路（例如 Tensor Core、脈動陣列）大幅加速的原因。"
example: "計算全班每位同學的總成績：把「學生 × 科目分數」表格乘上「科目 × 配分權重」表格，一次就得到所有人的加權總分。"
