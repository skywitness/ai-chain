term: "FinFET"
zh: "鰭式場效電晶體"
en: "Fin Field-Effect Transistor"
aliases:
  - "鰭式電晶體"
  - "Tri-Gate"
  - "3D 電晶體"
  - "FinFET transistor"
category: "semiconductor"
level: 2
short: "通道像魚鰭般立起、閘極從三面包覆的電晶體結構，是 22 奈米到 3 奈米世代的主流。"
definition: "FinFET 把電晶體的通道做成像魚鰭一樣立起來的薄片，讓閘極從左、右、上三面包住通道，比傳統平面電晶體更能控制電流、減少漏電，讓製程得以在 20 奈米以下繼續微縮。它的前身是日立研究員 Digh Hisamoto 於 1989 年做出的 DELTA 電晶體，1998–1999 年再由 Hisamoto 與胡正明（Chenming Hu）等人在美國柏克萊加州大學發展成 FinFET；英特爾於 2011 年發表 22 奈米「Tri-Gate」電晶體、2012 年起出貨，率先商用化；台積電 2013 年開始 16 奈米 FinFET 風險試產，並在 2022 年量產的 3 奈米（N3）把 FinFET 推到極致。目前主流 AI GPU 仍採用 FinFET 世代的製程，例如以台積電客製化 4NP 製程生產的輝達 Blackwell；下一代則轉向 GAA。"
example: "平面電晶體像只從上方按住水管來控制水流，FinFET 則把水管立起來、用手從三面握住，控制得更牢、漏水更少。"
