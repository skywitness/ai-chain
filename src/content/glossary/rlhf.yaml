term: "RLHF"
zh: "人類回饋強化學習"
en: "Reinforcement Learning from Human Feedback"
aliases:
  - "人類回饋強化學習"
  - "基於人類回饋的強化學習"
  - "RL from Human Feedback"
category: training
level: 2
short: "請人替模型的多個回答排優劣，訓練出「評分模型」，再用強化學習讓模型朝高分方向調整。"
definition: "RLHF 一般分三步：先以 SFT 取得初始模型；再請標註人員比較同一問題的多個回答並排序，用這些偏好資料訓練「獎勵模型」；最後以 PPO 等強化學習方法，讓模型產生能拿高分的回答，同時限制它不要偏離原模型太遠。現代 RLHF 的做法可追溯到 2017 年 OpenAI 與 DeepMind 的合作研究，當時只需對不到 1% 的互動給予人類回饋；2022 年 InstructGPT 將它用於語言模型後，成為 ChatGPT 等聊天助理的關鍵技術。RLHF 讓模型更有幫助、減少有害輸出，但需要大量人工偏好資料，流程也較複雜，後來才出現 DPO 等簡化方法。"
example: "像美食評審試吃兩道菜後說「這道比較好」，廚師累積大量評語後，逐漸摸清評審口味，做出更受歡迎的菜。"
