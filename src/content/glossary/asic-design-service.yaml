term: "ASIC 設計服務"
zh: "ASIC 設計服務"
en: "ASIC Design Service"
aliases:
  - "ASIC Design Service"
  - "客製化晶片設計服務"
  - "IC 設計服務"
  - "Design service"
  - "Turnkey ASIC"
category: "semiconductor"
level: 2
short: "替客戶把客製化晶片從規格或電路設計一路做到量產的服務，雲端業者自研 AI 晶片常仰賴它。"
definition: "ASIC（特殊應用積體電路）設計服務公司替客戶把客製化晶片「做出來」。依客戶交付的程度，可以從規格與架構開始（spec-in）、從邏輯電路網表接手（netlist-in），或只接手完成的布局資料（GDS-in），負責實體設計、驗證、測試設計，並與晶圓代工廠及封測廠對接，最後管理量產與供應鏈（turnkey）。收入通常分為前期的委託設計費（NRE）與量產後的晶片銷售，例如創意（GUC）就把營收分為「NRE 與 IP」及「Turnkey」（代客量產）兩類。雲端業者與 AI 新創自研加速器時，常借重這類夥伴在先進製程、HBM 介面與 CoWoS 等先進封裝上的經驗。台灣的創意（GUC）與世芯（Alchip）是代表，博通（Broadcom）、邁威爾（Marvell）與聯發科也提供客製化 AI 晶片服務。"
example: "就像建商替企業蓋總部：企業提出需求與設計概念，建商負責細部設計、找營造廠施工、驗收交屋，業主不必自己養一整支工程團隊。"
