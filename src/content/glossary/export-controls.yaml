term: "出口管制"
zh: "出口管制"
en: "Export Controls"
aliases:
  - "晶片出口管制"
  - "晶片禁令"
  - "Export Controls"
  - "EAR"
  - "出口管理條例"
category: "policy"
level: 1
short: "政府以國安為由，限制特定技術或產品賣給某些國家或對象；美國對中國的 AI 晶片管制最具代表性。"
definition: "出口管制是政府以國家安全為由，限制特定貨品、軟體或技術出口到特定國家、機構或用途的制度。美國由商務部工業與安全局（BIS）依《出口管理條例》（EAR）執行。2022 年 10 月 7 日，BIS 首度針對先進運算晶片、含這類晶片的電腦產品，以及半導體製造設備，對中國實施大規模管制，並限制美國人員支援中國的先進晶片生產；之後規則多次擴大。管制也可能鬆動：2026 年 1 月 15 日起，NVIDIA H200 及同級或較低階晶片出口中國，從推定拒絕改為個案審查，但出口商須證明美國供貨充足、不排擠美國客戶的代工產能，且產品須在美國接受獨立第三方測試。出口管制直接影響 GPU 廠的中國營收、設備商訂單，以及中國自主晶片的發展速度，是 AI 產業鏈最重要的地緣政治變數之一。"
example: "就像某些精密零件不能隨便賣給可能拿去造武器的人，美國規定最先進的 AI GPU 要賣到中國，必須先取得美國政府的許可。"
