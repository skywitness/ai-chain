term: "蝕刻"
zh: "蝕刻"
en: "Etching"
aliases:
  - "Etching"
  - "Etch"
  - "乾蝕刻"
  - "濕蝕刻"
  - "電漿蝕刻"
  - "Plasma etch"
  - "刻蝕"
category: "semiconductor"
level: 2
short: "依照光阻留下的圖形，用電漿或化學溶液去除不需要的材料，把圖案「刻」進晶圓。"
definition: "蝕刻是在微影之後，把沒有光阻保護的材料去除，讓圖形真正轉移到晶圓上的薄膜或矽中。蝕刻可分為使用化學溶液的濕蝕刻，以及使用電漿的乾蝕刻；先進製程主要採用反應性離子蝕刻（RIE），必要時以原子層蝕刻（ALE）一次只移除幾層原子。蝕刻還要做出又深又窄的高深寬比結構，例如先進封裝與 HBM 堆疊所需的矽穿孔（TSV）。隨著電晶體從 FinFET 走向 GAA、記憶體走向 3D 堆疊，蝕刻步驟與精準度要求持續提高，設備需求也隨之增加。主要設備商包括科林研發（Lam Research）、東京威力科創（TEL）與應用材料（Applied Materials）。"
example: "蝕刻像在木板上貼好模板後噴砂：模板（光阻）蓋住的地方保留，露出的地方被磨掉，圖案就刻進木板。"
