term: "RDMA"
zh: "遠端直接記憶體存取"
en: "Remote Direct Memory Access"
aliases:
  - "遠端直接記憶體存取"
  - "Remote Direct Memory Access"
  - "RoCE"
  - "RoCEv2"
  - "GPUDirect RDMA"
  - "iWARP"
category: networking
level: 3
short: "讓一台電腦直接讀寫另一台電腦的記憶體、不必經過雙方 CPU 與作業系統的技術，可大幅降低延遲。"
definition: "RDMA 讓網卡直接把資料從一台機器的記憶體搬到另一台機器的記憶體，過程不經過雙方的作業系統，也不需要 CPU 參與複製，因此能做到零拷貝、低延遲與高吞吐量。常見實作有三種：InfiniBand 原生支援 RDMA；RoCE（RDMA over Converged Ethernet）讓 RDMA 跑在乙太網路上；iWARP 則以 TCP/IP 作為傳輸層。AI 叢集更進一步使用輝達（NVIDIA）的 GPUDirect RDMA，讓網卡透過 PCIe 直接讀寫 GPU 記憶體，連主機記憶體都不必經過。分散式訓練的每一步都要在 GPU 之間交換大量梯度與中間結果，沒有 RDMA 的話，CPU 會成為瓶頸、GPU 只能空等。超乙太網路聯盟 1.0 規格的重點之一，就是替乙太網路打造更現代化的 RDMA 傳輸。"
example: "一般網路傳資料像寄掛號，要經過雙方公司的收發室（作業系統）簽收、登記、轉交；RDMA 則像拿到對方倉庫的鑰匙，直接把貨放上指定貨架。"
