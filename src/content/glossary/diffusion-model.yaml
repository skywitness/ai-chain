# 名詞：擴散模型（diffusion-model）· 分類 ai-basics · 資料基準日 2026-10-06
term: "擴散模型"
zh: "擴散模型"
en: "Diffusion Model"
aliases:
  - "Diffusion Model"
  - "Diffusion"
  - "DDPM"
  - "潛在擴散模型"
category: "ai-basics"
level: 2
short: "先學會把圖片一步步加噪變成雜訊，再反過來從雜訊一步步「還原」出全新圖片的生成模型。"
definition: "擴散模型是一種生成模型：訓練時把真實資料（例如圖片）逐步加入雜訊直到變成純雜訊，讓神經網路學會每一步如何「去噪」；生成時則從隨機雜訊出發反覆去噪，最後得到一張全新的圖片。2020 年的 DDPM 論文讓它在 CIFAR-10 無條件生成上取得當時最佳的 FID 分數 3.17（愈低愈好）。之後的潛在擴散模型改在壓縮過的「潛在空間」中運算，大幅降低成本，並成為公開權重的 Stable Diffusion 的基礎：其 U-Net 約 8.6 億個參數、文字編碼器約 1.23 億個參數，可在 10 GB 以上顯示記憶體的 GPU 上執行。由於生成需要多次去噪迭代，擴散模型的推論算力消耗相當可觀，並已延伸到影片等其他生成任務。"
example: "像修復一張被雨水打糊的老照片：先學會「糊掉的照片原本大概長什麼樣」，再從一片模糊開始，一步步修出清晰的畫面。"
