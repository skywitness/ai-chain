term: "基礎模型"
zh: "基礎模型"
en: "Foundation Model"
aliases:
  - "基礎模型"
  - "基座模型"
  - "Foundation Model"
  - "Foundation Models"
category: llm
level: 1
short: "用大量通用資料預訓練、可再調整成各種應用的大型模型，例如 GPT、Claude、Gemini、Llama。"
definition: "「基礎模型」一詞由史丹佛大學研究團隊在 2021 年的報告中提出，指以大規模、廣泛的資料訓練，並能透過微調或提示詞應用到多種不同任務的模型，例如 BERT、GPT-3 與 DALL-E。報告也提醒，基礎模型的缺陷會被所有建立在它之上的應用繼承。在產業鏈中，訓練基礎模型需要大量 GPU 與資金，即使以效率著稱的 DeepSeek-V3，官方公布的正式訓練也用了約 278.8 萬個 H800 GPU 小時（不含先前的研究與消融實驗），因此開發集中在少數實驗室與雲端巨頭；多數公司則透過 API、雲端平台或開放權重模型，在基礎模型上開發產品。"
example: "像一位受過完整通識教育的新人：先學會廣泛的知識，再依職務接受短期訓練，就能勝任客服、寫程式或法務助理等不同工作。"
