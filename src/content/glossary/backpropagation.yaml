category: "ai-basics"
level: 2
short: "訓練神經網路的關鍵方法：從輸出端往回推算，每個權重該為錯誤負多少責任、該怎麼調整。"
definition: "反向傳播是神經網路計算梯度的方法，也是梯度下降能用在深層網路上的關鍵。訓練的每一步分兩段：前向傳遞讓資料流過網路，得出預測並算出損失；反向傳遞再運用微積分的連鎖律，從輸出層一路往回，算出每個權重對損失的影響（梯度），交給最佳化器更新。這套方法因 Rumelhart、Hinton 與 Williams 在 1986 年發表於《Nature》的論文而廣為人知。它對硬體需求影響很大：依 OpenAI 縮放定律論文的估算，反向傳遞的運算量約為前向的兩倍，因此訓練時每個 Token 約需「6 × 參數量」次浮點運算，約是推論的三倍；訓練時還得暫存前向的中間結果，使訓練比推論更吃記憶體。"
example: "團隊專案出錯後的檢討會：從最終成果往回追，逐一釐清每個環節對錯誤的影響有多大，下次各自修正多少。"
