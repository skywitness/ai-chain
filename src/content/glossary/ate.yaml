term: "ATE"
zh: "自動測試設備"
en: "Automatic Test Equipment"
aliases:
  - "自動測試設備"
  - "測試機"
  - "半導體測試機"
  - "Automated Test Equipment"
  - "Tester"
category: "packaging"
level: 2
short: "由電腦控制、自動對晶片輸入訊號並判斷好壞的測試機台，晶圓測試與成品測試都靠它。"
definition: "ATE 是半導體測試的核心機台：在晶圓製造完成後的「晶圓測試」（搭配探針卡與針測機），以及封裝後的「最終測試」（搭配分類機與測試座）中，對每顆晶片施加電訊號、量測回應，判斷功能、速度與功耗是否合格，並把缺陷資料回饋給設計與製程以提升良率。AI 晶片電晶體多、介面複雜，又常把多顆晶粒與 HBM 封在一起，封裝後才發現壞品的損失極大，因此測試需求隨之增加。主要供應商包括日本愛德萬測試（Advantest）與美國泰瑞達（Teradyne）；愛德萬 FY2025 財年（2025 年 4 月至 2026 年 3 月）營收約 1.13 兆日圓，約為兩年前 FY2023 財年（約 4,865 億日圓）的 2.3 倍。"
example: "像汽車出廠前的全套檢驗站：自動踩油門、轉方向盤、量煞車距離，幾秒內判定合格與否，不合格的直接拉到一旁。"
