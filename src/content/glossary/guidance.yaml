category: "cloud-business"
level: 2
short: "公司預告下一季或全年營收、毛利率等數字的預期範圍，市場常拿實際結果與財測比較。"
definition: "財測（Guidance）是公司管理層在財報或法說會上，對未來一季或全年營運提出的預估，通常以區間表示，並附上匯率等假設。例如台積電在 2026 年 7 月 16 日預估第三季營收 446–458 億美元、毛利率 65%–67%、營業利益率 56%–58%，假設 1 美元兌新台幣 32 元；以中間值計算，約比第二季的 402 億美元成長 12%。雲端業者則常給出全年資本支出展望，例如 Meta 預估 2026 年為 1,300–1,450 億美元，是晶片與伺服器供應商評估訂單的重要依據。財測不是保證，公司可能上修或下修；市場反應常取決於實際結果與財測、分析師預期之間的落差。"
example: "像氣象預報給的降雨機率區間：不保證一定準，但能讓大家提早準備，之後也會依新資訊修正。"
