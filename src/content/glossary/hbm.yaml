term: "HBM"
zh: "高頻寬記憶體"
en: "High Bandwidth Memory"
aliases:
  - "高頻寬記憶體"
  - "High-Bandwidth Memory"
  - "HBM3E"
  - "堆疊式 DRAM"
category: "memory"
level: 2
short: "把多層 DRAM 垂直堆疊、緊貼 GPU 擺放的記憶體，提供每秒 TB 級頻寬，是 AI 晶片的關鍵零件。"
definition: "HBM 把多層 DRAM 晶粒（目前常見 8 到 16 層）以矽穿孔（TSV）垂直堆疊在基底晶粒上，再透過 CoWoS 等先進封裝放在 GPU 或 AI ASIC 旁邊。它以極寬的介面（HBM3E 每疊 1,024 位元、HBM4 加倍到 2,048 位元）換取遠高於一般 DRAM 的頻寬，而且更省電。大型模型的運算常受限於資料搬得夠不夠快，因此 HBM 的容量與頻寬直接決定 AI 晶片能跑多快。HBM 主要由 SK 海力士、三星與美光供應；生產同樣位元數需耗用更多晶圓（美光指出 HBM 與 DDR5 的晶圓換算約為 3 比 1），因而排擠一般 DRAM 產能。TrendForce 預估，受供給持續吃緊與價格較高的 HBM4 比重提升帶動，2027 年 HBM 混合平均售價將年增 121%。"
example: "一般 DRAM 像一條雙線道，HBM 則是在 GPU 家門口直接蓋了上千線道的高速公路，資料可以一次大量湧入。"
