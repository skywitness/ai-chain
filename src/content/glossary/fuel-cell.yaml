term: "燃料電池"
zh: "燃料電池"
en: "Fuel Cell"
aliases:
  - "固態氧化物燃料電池"
  - "SOFC"
  - "Solid Oxide Fuel Cell"
  - "Fuel Cells"
category: energy
level: 2
short: "不經燃燒、以電化學反應把天然氣或氫氣直接轉成電的裝置，可模組化快速部署在資料中心旁供電。"
definition: "燃料電池讓燃料（氫氣，或經重組的天然氣）與空氣中的氧在電極上進行電化學反應，直接產生電力，過程不需要燃燒，也能像積木一樣堆疊擴充容量。資料中心目前較常見的是固態氧化物燃料電池（SOFC），通常在約 600–1,000°C 的高溫下運作，天然氣等燃料可在電池內部重組後直接使用。代表廠商 Bloom Energy 與甲骨文（Oracle）在 2026 年 4 月擴大合作：Oracle 計畫採購最多 2.8 GW 的燃料電池，其中 1.2 GW 已簽約並開始部署；Bloom 也表示，先前曾在 55 天內為 Oracle 交付一套完整運轉的系統。燃料電池因此成為電網供電趕不上時的「表後」快速電源；不過若以天然氣為燃料，過程仍會排放二氧化碳，並非零碳。"
example: "一般電池的電用完就沒了；燃料電池比較像一台持續加油的發電機，只要持續供應天然氣或氫氣，就能不停產生電，而且裡面沒有火焰。"
