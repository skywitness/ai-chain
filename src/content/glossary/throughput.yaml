term: "吞吐量"
zh: "吞吐量"
en: "Throughput"
aliases:
  - "產出量"
  - "每秒 token 數"
  - "Tokens per Second"
  - "TPS"
  - "Requests per Second"
category: inference
level: 2
short: >-
  系統每秒能產生多少 token 或完成多少請求，決定一台伺服器能同時服務多少使用者。
definition: >-
  吞吐量衡量整個推論系統在單位時間內的總產出，常用「每秒輸出 token 數」（TPS）或「每秒完成請求數」（RPS）表示；NVIDIA 的評測文件就以所有同時請求的輸出 token 總數，除以整段測試時間來計算 TPS。對雲端與新雲業者而言，同一台 GPU 伺服器的吞吐量越高，每百萬 token 的成本就越低，直接影響 API 定價與毛利。吞吐量與延遲需要取捨：加大批次能提高吞吐量，但個別使用者可能等更久，因此業界常看「在延遲限制內能達到的吞吐量」。例如 vLLM 論文顯示，在相同延遲水準下，它的吞吐量比當時的 FasterTransformer 與 Orca 高 2–4 倍。
example: >-
  像高速公路：延遲是一台車從甲地開到乙地要多久，吞吐量則是每小時總共能通過多少台車。
related: [latency, batching, token-pricing, tco, inference]
learnMore: [training-vs-inference-economics, inference-optimization]
