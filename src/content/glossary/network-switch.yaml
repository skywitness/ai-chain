term: "交換器"
zh: "網路交換器"
en: "Network Switch"
aliases:
  - "Switch"
  - "網路交換器"
  - "交換機"
  - "Ethernet Switch"
  - "交換器晶片"
  - "Switch ASIC"
category: networking
level: 1
short: "把資料封包從一個連接埠轉送到正確目的地的網路設備，是 AI 叢集串連大量 GPU 的樞紐。"
definition: "交換器是一台有許多連接埠的網路設備，它讀取每個資料封包上的目的位址，再轉送到對應的連接埠，讓大量伺服器可以互相溝通。交換器的核心是一顆交換器晶片（Switch ASIC），它的總交換容量決定能撐起多大的叢集：博通（Broadcom）2025 年 6 月開始出貨的 Tomahawk 6，單晶片達 102.4 Tb/s，是當時市面上乙太網路交換器的兩倍；官方表示以兩層網路、每條連線 200 Gb/s，就能連接超過 10 萬顆 XPU。AI 叢集通常把交換器分成葉層、脊層等多層堆疊，GPU 越多，需要的交換器、光模組與線材就越多，因此交換器出貨是觀察 AI 網通需求的重要指標。主要業者包括晶片端的博通、輝達（NVIDIA），以及系統端的 Arista、思科（Cisco）與台灣的智邦（Accton）。"
example: "交換器像郵局的分揀中心：每個包裹（封包）都寫著地址，分揀機看一眼就把它送往正確的出口，而不是廣播給所有人。"
