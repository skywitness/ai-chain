term: "人形機器人"
zh: "人形機器人"
en: "Humanoid Robot"
aliases:
  - "Humanoid"
  - "Humanoid Robot"
  - "類人機器人"
  - "雙足機器人"
category: robotics
level: 1
short: "外型模仿人類、有軀幹與雙臂（多半還有雙腿）的機器人，目標是在為人類設計的環境裡工作。"
definition: "人形機器人是外型與關節配置模仿人體的機器人，通常有頭部、軀幹與雙臂，下半身則是雙足或輪式底盤。它的好處是能直接使用為人類設計的工廠、倉庫、樓梯與工具，不必大幅改造環境；難處在於平衡控制、靈巧操作、續航與成本。一台人形機器人由數十個致動器（馬達、減速機與編碼器）、感測器、電池與運算晶片組成。以宇樹（Unitree）G1 為例，標準版有 23 個自由度、含電池重約 35 公斤，官網標示售價 1.35 萬美元起。波士頓動力（Boston Dynamics）則在 2024 年 4 月讓液壓版 Atlas 退役、改推全電動的新版 Atlas，並宣布先與現代汽車（Hyundai）合作，在其汽車製造場域測試應用。人形機器人若能量產，將帶動精密減速機、無框馬達、光達與邊緣 AI 晶片等零組件需求，也需要 VLA 等機器人基礎模型作為「大腦」。"
example: "與其為每種工作設計專用機器，不如做一個「通用員工」：它能走進現有產線、用人類的工具，換一項任務只要重新教它，而不是重建整條產線。"
