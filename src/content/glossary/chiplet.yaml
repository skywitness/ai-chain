term: "Chiplet"
zh: "小晶片"
en: "Chiplet"
aliases:
  - "小晶片"
  - "晶粒化設計"
  - "多晶粒設計"
  - "Chiplets"
  - "Multi-die Design"
category: "packaging"
level: 2
short: "把一顆大晶片拆成數個功能較單純的小晶粒，分別製造後再用先進封裝組回一體的設計方式。"
definition: "Chiplet 設計不再把所有功能塞進單一大晶粒，而是拆成運算、快取、I/O 等多個小晶粒，各自選用最合適的製程，再以 2.5D 或 3D 先進封裝連成一個系統。好處包括：小晶粒良率較高、組裝前可先測試挑出已知良好晶粒（Known Good Die）、同一晶粒可在多款產品重複使用與混搭；代價是晶粒之間需要高頻寬、低功耗的互連介面，封裝也更複雜。對 AI 晶片而言，單一晶粒受光罩尺寸限制，Chiplet 是繼續放大運算規模的主要路徑，例如輝達（NVIDIA）Blackwell 架構 GPU 由兩顆達光罩極限的晶粒，以每秒 10 TB 的晶片間互連組成單一 GPU。業界也推動 UCIe 等開放標準，讓不同公司的小晶粒能夠互通。"
example: "像樂高積木：不必把整座城堡一次鑄成一大塊，而是分別做好塔樓、城牆、城門，再依需求拼起來；某一塊做壞了，只要換那一塊就好。"
