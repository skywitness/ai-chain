term: "稀疏注意力"
zh: "稀疏注意力"
en: "Sparse Attention"
aliases:
  - "稀疏注意力"
  - "Sparse Attention"
  - "稀疏注意力機制"
  - "Sparse Transformer"
  - "DSA"
  - "DeepSeek Sparse Attention"
category: llm
level: 3
short: "只讓每個 Token 關注部分重要的 Token 而不是全部，以降低長上下文的運算與記憶體成本。"
definition: "稀疏注意力是指每個 Token 只與挑選出的部分 Token 計算注意力，而不是與序列中所有 Token 兩兩計算，藉此降低標準注意力隨序列長度平方成長的成本。OpenAI 在 2019 年提出的 Sparse Transformer，把複雜度降到 O(n√n)，可處理數萬步長的序列；DeepSeek 於 2025 年 9 月 29 日推出採用 DeepSeek Sparse Attention（DSA）的實驗模型 V3.2-Exp，表示對輸出品質影響很小，並同步宣布 API 價格調降超過 50%。隨著上下文視窗持續擴大，稀疏注意力成為降低推論成本的重要方向，也影響 AI 晶片與推論軟體的最佳化重點。"
example: "開長會時不必記下每個人說的每句話，只抓與自己議題相關的段落和最近幾分鐘的討論，就能大幅節省筆記量。"
