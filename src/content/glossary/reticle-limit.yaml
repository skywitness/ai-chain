term: "光罩尺寸極限"
zh: "光罩尺寸極限"
en: "Reticle Limit"
aliases:
  - "Reticle limit"
  - "光罩極限"
  - "Reticle size"
  - "曝光場極限"
category: "semiconductor"
level: 3
short: "微影機單次曝光能印出的最大面積，約 26 × 33 毫米（858 平方毫米），限制了單顆晶粒的大小。"
definition: "光罩尺寸極限是微影機單次曝光可投影到晶圓上的最大範圍。標準曝光場為 26 × 33 毫米，約 858 平方毫米，單顆晶粒基本上不能超過這個面積。AI GPU 為了塞進更多運算單元，晶粒早已逼近此極限：輝達表示，其資料中心用的 Blackwell GPU 由兩顆達光罩極限的晶粒組成，以每秒 10 TB 的晶片間連結合為一顆 GPU。High-NA EUV 的單次曝光範圍只有標準的一半，未來單顆大晶粒會更難做。因此業界轉向小晶片（chiplet）與先進封裝，例如台積電 CoWoS 把多顆運算晶粒與 HBM 放在一片面積超過光罩極限的大型中介層上，藉此突破單顆晶粒的面積限制；台積電 2026 年 4 月表示，可整合約 10 顆大型運算晶粒與 20 組 HBM、達 14 倍光罩尺寸的 CoWoS 預計 2028 年投產。"
example: "光罩尺寸極限就像影印機的最大紙張尺寸：要印比 A3 還大的海報，只能分成幾張印再拼起來；晶片太大時，也只能拆成幾顆晶粒再封裝在一起。"
