term: "GRPO"
zh: "群組相對策略最佳化"
en: "Group Relative Policy Optimization"
aliases:
  - "群組相對策略最佳化"
  - "群組相對策略優化"
  - "Group Relative Policy Optimisation"
category: training
level: 3
short: "DeepSeek 提出的強化學習方法：同一題讓模型答好幾次，以整組平均分當基準，省掉價值模型。"
definition: "GRPO 是 DeepSeek 在 2024 年 DeepSeekMath 論文中提出、由 PPO 改良而來的強化學習方法。PPO 需要一個與主模型差不多大的「價值模型」來估計基準分數，記憶體與運算負擔都很重；GRPO 則讓模型對同一題生成一組答案，以這組答案的平均獎勵作為基準，高於平均的答案被強化、低於平均的被抑制，因此不再需要價值模型。DeepSeekMath-Instruct 7B 經 GRPO 訓練後，MATH 測驗由 46.8% 提升到 51.7%。2025 年初的 DeepSeek-R1 也以 GRPO 作為強化學習框架，讓這個方法在推理模型訓練中廣受關注。"
example: "像老師不另外請評審，而是讓學生把同一題寫五次，算出五份答案的平均分；高於平均的寫法多練、低於平均的少用。"
