term: "IPO"
zh: "首次公開發行"
en: "Initial Public Offering"
aliases:
  - "首次公開發行"
  - "首次公開募股"
  - "掛牌上市"
  - "上市"
  - "上櫃"
  - "Initial Public Offering"
category: "cloud-business"
level: 1
short: "公司第一次公開發售股票並在交易所掛牌，藉此募集資金，也讓早期股東有機會變現。"
definition: "IPO 是私人公司首次向大眾發行股票並掛牌交易的過程：公司委託承銷商，向主管機關申報並公開揭露財務與風險的文件（在美國是向 SEC 提交 S-1 登記文件，內含公開說明書），再與投資人議定價格發行。上市後必須定期公布財報，外界才看得到營收、虧損與負債等細節。對資本密集的 AI 基礎建設業者而言，IPO 是重要的融資管道。例如新雲業者 CoreWeave 於 2025 年 3 月 27 日以每股 40 美元定價，發行 3,750 萬股（其中 91 萬股由既有股東出售），發行總額約 15 億美元，隔日在 Nasdaq 以代號 CRWV 掛牌。在台灣，公司可選擇在證交所上市或在櫃買中心上櫃。"
example: "像一家人氣小吃店決定開放大家入股：從此帳本要公開，股東也能自由買賣手上的股份。"
