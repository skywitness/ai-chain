term: "深度偽造"
zh: "深度偽造"
en: "Deepfake"
aliases:
  - "深偽"
  - "Deepfake"
  - "Deep Fake"
  - "AI 換臉"
  - "深偽影片"
category: "policy"
level: 1
short: "用 AI 生成或竄改的假影像、影片或聲音，讓人誤以為真人說了或做了某件事。"
definition: "深度偽造（Deepfake）由「深度學習」與「偽造」組合而成，指用 AI 生成或修改的影像、影片或音訊，能逼真模仿真人的臉孔與聲音。這個詞源自 2017 年底一位 Reddit 使用者的帳號名稱；隨著生成式 AI 普及，製作門檻大幅降低。主要風險包括詐騙、名譽侵害、非自願色情內容與選舉假訊息，例如英國工程顧問公司 Arup 在 2024 年因深度偽造詐騙損失約 2,500 萬美元。法規也隨之跟進：歐盟 AI 法第 50 條要求部署者揭露深度偽造內容，相關透明義務自 2026 年 8 月 2 日起適用；AI Omnibus 修正另規定，2026 年 12 月 2 日起禁止生成非自願性私密深偽內容或兒少性剝削內容的 AI 系統。這股需求也帶動 AI 浮水印、內容來源驗證與偽造偵測工具等新市場。"
example: "接到「老闆」的視訊電話要你緊急匯款，畫面和聲音都像本人，其實可能是深度偽造；這也是企業開始要求大額轉帳必須另行確認身分的原因。"
