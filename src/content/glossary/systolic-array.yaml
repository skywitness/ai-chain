term: "脈動陣列"
zh: "脈動陣列"
en: "Systolic Array"
aliases:
  - "脈動陣列架構"
  - "Systolic Array"
  - "MXU"
  - "矩陣乘法單元"
category: hardware
level: 3
short: "大量小運算單元排成棋盤狀、資料像心跳般一拍拍往前傳的電路設計，是 TPU 等 AI 晶片做矩陣乘法的核心。"
definition: "脈動陣列由許多相同的處理單元排成二維網格，每個單元只做「相乘再累加」，算完就把資料傳給相鄰單元。資料像心臟搏動般一拍一拍流過整個陣列，同一筆數字會被許多單元重複使用，不必每次都回到記憶體讀取，因此能以很少的記憶體存取完成大量矩陣運算，既省電又省頻寬。這個概念由孔祥重（H. T. Kung）與 Charles Leiserson 在 1979 年發表，數十年後在 AI 時代大放異彩：Google 第一代 TPU 的矩陣乘法單元就是脈動陣列，擁有 65,536 個 8 位元乘加單元（256 × 256），峰值達每秒 92 兆次運算。AWS 第一代 Trainium 與 Inferentia2 所用的 NeuronCore-v2，其張量引擎同樣以脈動陣列為基礎。"
example: "想像 16 × 16 個學生排成方陣傳紙條：每個人把左邊和上面傳來的兩個數字相乘，加進自己的小計，再把數字往右、往下傳。老師只要從邊緣不斷送入數字，整個方陣就同時在計算。"
