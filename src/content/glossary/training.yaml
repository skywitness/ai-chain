term: "訓練"
zh: "模型訓練"
en: "Training"
aliases:
  - "AI 訓練"
  - "Model Training"
  - "Training Run"
category: training
level: 1
short: "用大量資料反覆調整模型內部的參數，讓它從「亂猜」變成「會做」的過程。"
definition: "訓練是讓 AI 模型從資料中學習的過程：模型先對輸入做出預測，再用損失函數衡量錯得多離譜，接著透過反向傳播與梯度下降微調內部動輒數十億、甚至數千億以上的參數，如此一再重複。大型語言模型的訓練通常分成「預訓練」與「後訓練」兩段。訓練是 AI 產業鏈中最耗算力的工作之一：Meta 的 Llama 3 405B 在最多 16,384 顆 H100 GPU 上，以 15.6 兆個 Token 完成預訓練，總運算量約 3.8×10²⁵ 次浮點運算。這類需求直接帶動 GPU、HBM、高速網路與資料中心電力的投資。"
example: "就像學生大量做練習題、對答案、訂正錯誤，題目越多、越好，考試就越穩；差別在於大型模型的一次「練習」，可能要動用上萬顆 GPU 連續運轉好幾週。"
