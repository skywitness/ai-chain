term: "GPU 擔保融資"
zh: "以 GPU 為擔保品的融資"
en: "GPU-backed Loan"
aliases:
  - "GPU 抵押貸款"
  - "GPU 抵押債"
  - "GPU 擔保貸款"
  - "GPU-backed Financing"
  - "GPU-backed Debt"
  - "DDTL"
category: "cloud-business"
level: 3
short: "以 GPU 伺服器和客戶長約當擔保品向金融機構借錢、再買更多 GPU，是新雲擴產的重要資金來源。"
definition: "GPU 擔保融資的常見結構是：業者設立專責子公司購買 GPU，並與客戶簽訂算力合約，貸款人取得 GPU 設備與合約現金流的擔保權，資金則隨 GPU 交貨分批動用（延遲提款定期貸款，DDTL）。CoreWeave 在 2024 年 5 月取得由 Blackstone 與 Magnetar 領銜的 75 億美元債務融資；2026 年 3 月又完成 85 億美元的 DDTL，以子公司 CoreWeave Compute Acquisition Co. VIII 的幾乎全部資產作擔保，背後是一份已簽約的 AI 企業客戶合約；這筆貸款取得穆迪 A3 與 DBRS A（low）評等，浮動利率部分為 SOFR 加 2.25%、固定利率部分約 5.9%，CoreWeave 稱這是首筆取得投資等級評等的 GPU 擔保融資。主要風險在於 GPU 會隨新世代推出而快速貶值，若客戶違約，擔保品價值可能不足以清償。"
example: "像計程車行拿車子和企業包車合約向銀行抵押貸款，再買更多車；但車子越開越舊，萬一包車客戶跑了，車子可能賣不到足夠的錢還債。"
