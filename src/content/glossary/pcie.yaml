term: "PCIe"
zh: "高速周邊元件互連"
en: "Peripheral Component Interconnect Express"
aliases:
  - "PCI Express"
  - "PCI-E"
  - "PCIe Gen6"
  - "PCIe 6.0"
  - "PCIe 7.0"
category: networking
level: 2
short: "伺服器內部連接 CPU、GPU、網卡與 SSD 的標準高速匯流排，近年大約每三年傳輸率翻倍。"
definition: "PCIe（PCI Express）是由 PCI-SIG 制定的高速序列匯流排標準，伺服器裡的 CPU 與 GPU、網卡、SSD 等裝置大多透過它相連。PCIe 以通道（lane）為單位，x16 代表 16 條通道並列。近年每一代傳輸率約翻倍：PCIe 5.0（2019 年）為 32 GT/s；6.0（2022 年）為 64 GT/s，並改用 PAM4 調變，實際產品到 2025 年才上市；7.0 規格於 2025 年 6 月發布，達 128 GT/s，x16 單向約 242 GB/s；8.0 預計 2028 年推出，目標 256 GT/s。在 AI 伺服器中，PCIe 是 CPU 與 GPU、網卡之間的主要通道，但頻寬遠不及 NVLink，所以 GPU 彼此之間改走專屬互連。訊號速度越快，可傳輸距離越短，主機板上就需要更多 Retimer 晶片；要連接更多 GPU、網卡與 SSD 時，還會再加上 PCIe 交換器。"
example: "PCIe 通道像高速公路的車道：x16 就是 16 線道，每升級一代，就等於把每條車道的速限提高一倍。"
