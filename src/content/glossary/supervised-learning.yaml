# 名詞：監督式學習（supervised-learning）· 分類 ai-basics · 資料基準日 2026-10-06
term: "監督式學習"
zh: "監督式學習"
en: "Supervised Learning"
aliases:
  - "Supervised Learning"
  - "監督學習"
  - "有監督學習"
category: "ai-basics"
level: 1
short: "用「題目＋標準答案」配對的資料訓練模型，讓它學會從輸入推出正確輸出，例如辨識圖片中的物體。"
definition: "監督式學習是用帶有標籤（正確答案）的資料訓練模型的方法：每筆資料都包含輸入與對應答案，模型反覆比較自己的預測與答案的差距，再調整參數縮小誤差。Google 把它比喻成透過大量「題目與解答」學習一門科目，學會之後就能回答沒見過的新題目。經典案例是 ImageNet 影像分類：2012 年的 AlexNet 用約 130 萬張已標註圖片，學會分辨 1,000 個類別。到了大型語言模型時代，對話助理在預訓練之後進行的監督式微調（SFT）也屬於這一類。由於標籤多半需要人工製作，監督式學習也帶動了資料標註這個勞力與專業密集的產業。"
example: "給模型看 10 萬張已標好「貓」或「狗」的照片，訓練完成後丟給它一張新照片，它就能回答是貓還是狗。"
