term: "基底晶粒"
zh: "HBM 基底晶粒"
en: "Base Die"
aliases:
  - "Base Die"
  - "Logic Die"
  - "邏輯基底晶粒"
  - "HBM 邏輯晶粒"
category: "memory"
level: 3
short: "HBM 堆疊最底層負責與 GPU 溝通的邏輯晶片，從 HBM4 起改用晶圓代工的先進邏輯製程。"
definition: "每一疊 HBM 都由多層 DRAM 晶粒加上最底部的一顆基底晶粒組成。基底晶粒本身不存資料，而是負責與處理器之間的訊號介面、緩衝與測試等邏輯功能，把上方 DRAM 的資料經由中介層送到 GPU。過去它多由記憶體廠以 DRAM 製程自製；到了 HBM4，介面加寬到 2,048 位元、功能更複雜，業界開始改用晶圓代工的先進邏輯製程，例如 SK 海力士自 HBM4 起採用台積電先進邏輯製程製作基底晶粒，這也讓依客戶需求設計的「客製化 HBM」成為可能。TrendForce 指出，每疊 HBM 都需要一顆基底晶粒，其成本不會隨 DRAM 層數等比例下降，因此預估 2027 年 8 層 HBM 的每 Gb 價格將比 12 層高約 10–20%。"
example: "基底晶粒像大樓一樓的大廳與管理室：樓上住戶（DRAM 層）的進出都要經過它，大廳設計得好，整棟樓的動線才順暢。"
