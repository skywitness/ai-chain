term: "LPO"
zh: "線性驅動可插拔光學"
en: "Linear Pluggable Optics"
aliases:
  - "線性驅動可插拔光學"
  - "線性可插拔光模組"
  - "Linear Pluggable Optics"
  - "LPO 光模組"
  - "LPO MSA"
category: networking
level: 3
short: "拿掉光模組裡耗電的 DSP 晶片，改由交換器或網卡晶片直接驅動的可插拔光模組，更省電、延遲更低。"
definition: "LPO（線性驅動可插拔光學）是一種不含 DSP 晶片的可插拔光模組。傳統光模組內建 DSP，負責重整與補償電訊號，但 DSP 本身相當耗電；LPO 改用線性的驅動與接收電路，把訊號補償工作交給交換器或網卡主晶片裡本來就很強的 SerDes，讓整條連線成為一條線性通道。根據 LPO 多源協議（MSA）組織，這種做法能降低功耗、成本與延遲。LPO MSA 於 2024 年 3 月由 12 家業者成立，2025 年 3 月發布每通道 100 Gb/s、最高支援 800G 的單模光纖規格；到 2025 年 9 月成員已超過 50 家，並計畫延伸到每通道 200 Gb/s。代價是對主晶片 SerDes 與電路板走線品質的要求更高，與傳統含 DSP 模組混用也較複雜。它和 CPO 都是為了降低 AI 叢集的光通訊耗電，但 LPO 保留了可插拔、易更換的優點。"
example: "傳統光模組像每台電器都附一顆變壓器；LPO 則直接使用牆上插座已經整理好的電，省下變壓器的耗電與成本，但前提是插座本身品質要夠好。"
