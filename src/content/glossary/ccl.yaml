term: "CCL"
zh: "銅箔基板"
en: "Copper Clad Laminate"
aliases:
  - "銅箔基板"
  - "覆銅板"
  - "銅箔積層板"
  - "高速低損耗材料"
  - "Copper Clad Laminate"
category: hardware
level: 3
short: "PCB 的基礎原料：在玻纖布與樹脂做成的絕緣板上壓合銅箔；AI 伺服器需要訊號損耗極低的高階等級。"
definition: "CCL 是製作印刷電路板的原料：以玻璃纖維布浸漬樹脂作為絕緣層，兩面壓上銅箔，PCB 廠再在上面蝕刻出線路並多層疊合。CCL 的材料決定了訊號在板上傳輸時的損耗，常用「損耗因子」（Df）衡量，數值越低，高速訊號衰減越少。以台光電（EMC）官網產品表為例，一般等級板材在 10 GHz 下的 Df 約 0.015 至 0.027，最低損耗的等級已降到約 0.0013，相差十倍以上。AI 伺服器、GPU 模組板與高速交換器的訊號速率持續提高，必須改用這類低損耗材料，讓 CCL 從傳統的大宗材料變成技術含量高的關鍵零組件。台灣的台光電、台燿、聯茂都是主要供應商。"
example: "如果 PCB 是一棟大樓，CCL 就是預先做好的樓板：樓板材質越好，裡面鋪設的高速「水管」（訊號線）漏水（訊號損耗）就越少。"
