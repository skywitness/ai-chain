term: "授權加挖角"
zh: "授權加挖角交易"
en: "Reverse Acquihire"
aliases:
  - "授權加挖角交易"
  - "反向人才收購"
  - "授權＋人才交易"
  - "Reverse Acquihire"
  - "Acquihire"
  - "License-and-hire"
category: "cloud-business"
level: 2
short: "大公司不直接併購新創，而是付費取得技術授權並延攬創辦人與核心團隊，新創本身仍繼續營運。"
definition: "授權加挖角是 AI 產業近年常見的交易形式：大公司與新創簽訂技術授權，並延攬創辦人與關鍵研發人員，新創保留公司本體，由新的經營團隊繼續營運，往往以授權收入回饋股東。由於通常不轉移公司股權，這種安排也引來外界質疑是否藉此避開反壟斷的併購審查。例如 2024 年 3 月，Inflection AI 共同創辦人 Mustafa Suleyman 與 Karén Simonyan 帶著部分團隊加入 Microsoft，成立 Microsoft AI，據報導 Microsoft 另付約 6.5 億美元取得 Inflection 的技術授權；英國競爭與市場管理局（CMA）事後認定這筆交易構成合併情形，但未造成競爭疑慮。另一例是 2025 年 12 月 24 日，Groq 與輝達（NVIDIA）簽訂非獨家的推論技術授權協議，Groq 創辦人 Jonathan Ross、總裁 Sunny Madra 等人加入輝達，Groq 改由 Simon Edwards 擔任執行長並維持獨立營運，GroqCloud 服務不中斷。"
example: "像大餐廳沒有買下整間人氣小店，而是付費取得招牌菜的食譜，並把主廚請過來；小店仍掛著原招牌，由新店長繼續經營。"
