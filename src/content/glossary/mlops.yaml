term: "MLOps"
zh: "機器學習維運"
en: "Machine Learning Operations"
aliases:
  - "機器學習維運"
  - "機器學習營運"
  - "ML Ops"
  - "LLMOps"
category: training
level: 2
short: "把機器學習模型從實驗帶到正式上線，並持續監控、更新的一整套流程、工具與自動化方法。"
definition: "MLOps 借用軟體業的 DevOps 概念，涵蓋資料蒐集與驗證、實驗追蹤、模型訓練、部署、監控與重新訓練等環節的自動化。Google Cloud 的架構指南指出，真實的機器學習系統中，模型程式碼只佔一小部分，周邊的資料、設定、監控與服務基礎設施才是大宗；並把成熟度分為完全手動的第 0 級，到訓練管線與 CI/CD 都自動化的第 2 級。這個觀點出自 Google 研究人員 2015 年在 NeurIPS 發表的〈機器學習系統中的隱藏技術債〉論文。大型語言模型興起後，相關工具延伸為 LLMOps（提示管理、評測、觀測），是資料平台與開發工具業者競爭的重點領域。"
example: "像一家連鎖餐廳不只要有好食譜（模型），還需要中央廚房、品管、配送與顧客回饋系統，每家分店才能天天穩定出餐。"
