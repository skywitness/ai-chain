term: "玻璃基板"
zh: "玻璃核心基板"
en: "Glass Core Substrate"
aliases:
  - "玻璃核心基板"
  - "玻璃載板"
  - "Glass Substrate"
  - "Glass Core"
  - "TGV 基板"
category: "packaging"
level: 3
short: "以玻璃取代有機樹脂當載板的核心層，更平、更耐熱、線路可以更密，被視為下一代 AI 封裝材料。"
definition: "玻璃基板是把 IC 載板中間的核心層，由傳統的有機材料（玻纖布加樹脂）換成特殊玻璃，再以玻璃通孔（TGV）導通上下線路。英特爾在 2023 年 9 月發表玻璃基板研究時指出，相較於有機基板，玻璃極度平坦、熱與機械穩定性更好、可耐更高溫度，圖形變形可減少 50%，互連密度有機會提高 10 倍，有助於在 2030 年前做到單一封裝 1 兆個電晶體，並計畫在本十年後半推出完整方案。英特爾也指出，有機材料在本十年末將面臨收縮、翹曲與耗電等擴展極限。對 AI 晶片而言，封裝越做越大，有機載板的翹曲與線寬限制越來越明顯，玻璃是可能的接班材料；但玻璃易碎，TGV 鑽孔與金屬化良率、檢測與供應鏈都還在發展，普及時程仍待觀察。"
example: "有機載板像木頭桌面，遇熱會微微翹曲；玻璃基板像大理石桌面，又平又穩，可以在上面畫更細的線而不變形。"
