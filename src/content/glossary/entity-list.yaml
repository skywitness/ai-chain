term: "實體清單"
zh: "實體清單"
en: "Entity List"
aliases:
  - "實體名單"
  - "Entity List"
  - "美國商務部實體清單"
  - "貿易黑名單"
category: "policy"
level: 2
short: "美國商務部列管的外國企業與機構名單，供應商要出貨給名單上的對象，必須先取得許可。"
definition: "實體清單是美國商務部工業與安全局（BIS）依《出口管理條例》（EAR）公布的名單，1997 年首次發布，最初用來防止大規模毀滅性武器擴散。被列入的企業或機構若要取得受 EAR 管轄的貨品、軟體或技術，供應商必須先向美國申請許可。華為（Huawei）在 2019 年 5 月被列入，是最知名的例子；之後許多中國晶片、伺服器與 AI 相關企業也陸續被列入。2025 年 9 月底，BIS 曾規定被名單實體持股 50% 以上的子公司自動適用相同限制，但同年 11 月 10 日起暫停一年，若未再延長，暫停期預定到 2026 年 11 月 9 日為止。對台灣供應鏈而言，客戶一旦被列入，只要出貨的產品受 EAR 管轄（例如含一定比例的美國技術，或適用外國直接產品規則），晶圓代工、封測與伺服器廠就必須先取得許可才能繼續出貨，因此實體清單是接單與客戶風險管理的重要依據。"
example: "就像大樓管理員手上有一份「訪客須經核准」名單：名單上的公司不是完全買不到美國技術，但每筆相關交易都要先向美國政府申請許可，而且不一定會獲准。"
