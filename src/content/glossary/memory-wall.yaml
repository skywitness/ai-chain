term: "記憶體牆"
zh: "記憶體牆"
en: "Memory Wall"
aliases:
  - "Memory Wall"
  - "記憶體瓶頸"
  - "頻寬牆"
category: "memory"
level: 2
short: "處理器算得越來越快，記憶體供應資料的速度卻跟不上，讓晶片常閒置「等資料」的現象。"
definition: "「記憶體牆」一詞出自 Wulf 與 McKee 在 1995 年發表的論文〈Hitting the Memory Wall〉，指處理器速度的成長遠快於記憶體存取速度，最終使整體效能被記憶體拖住。AI 時代這個問題更加明顯：Gholami 等人在 2024 年的論文〈AI and Memory Wall〉統計，過去 20 年伺服器硬體的峰值算力每兩年成長約 3.0 倍，DRAM 頻寬只成長 1.6 倍、互連頻寬 1.4 倍。大型語言模型推論時，每產生一個 Token 都要把大量權重與 KV Cache 從記憶體讀出，GPU 常因等資料而閒置。業界因此競相提升 HBM 頻寬、加大晶片內 SRAM、發展 HBF 與 CXL 等新記憶體層級，並以量化等手法減少要搬運的資料量。"
example: "就像一位手速飛快的廚師，卻只有一個小窗口從倉庫遞食材進來；廚師再快，出菜速度也被窗口卡住。"
