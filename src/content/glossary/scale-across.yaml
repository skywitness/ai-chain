term: "Scale-across"
zh: "跨資料中心擴展"
en: "Scale-across"
aliases:
  - "跨資料中心擴展"
  - "Scale Across"
  - "跨域擴展"
  - "多資料中心訓練"
  - "Spectrum-XGS"
category: networking
level: 3
short: "把相距遙遠的多座資料中心用高速網路串成一座「超級 AI 工廠」，是 Scale-up、Scale-out 之後的第三種擴展。"
definition: "Scale-across 指把分散在不同園區、城市甚至國家的多座資料中心，用長距離高速網路連成單一運算叢集，讓它們共同訓練或服務同一個模型。輝達（NVIDIA）2025 年 8 月在 Hot Chips 發表的 Spectrum-XGS 乙太網路就以此為訴求，官方稱它是 Scale-up 與 Scale-out 之外的「第三支柱」，可依資料中心之間的距離自動調整壅塞控制與延遲管理，讓 NCCL 集合通訊效能接近翻倍，CoreWeave 是首批採用者。博通（Broadcom）同月出貨的 Jericho4 路由晶片也鎖定這個需求，官方稱可在 100 公里以上的距離維持無損 RoCE 傳輸，串連超過 100 萬顆 XPU。背後的驅動力是單一資料中心的電力與空間逐漸逼近上限，業者只好把算力分散到多個地點。最大的挑戰是距離帶來的延遲：光在光纖中每公里約需 5 微秒，距離越遠，GPU 之間的同步越困難，需要搭配更聰明的網路設計與訓練方法。"
example: "就像連鎖餐廳把台北、台中、高雄三間中央廚房連線，一起趕出同一場超大型宴席：每間廚房都很強，但要讓菜色同步上桌，關鍵在調度與運輸。"
