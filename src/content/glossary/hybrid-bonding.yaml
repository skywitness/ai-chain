term: "混合鍵合"
zh: "混合鍵合"
en: "Hybrid Bonding"
aliases:
  - "混合接合"
  - "Hybrid Bonding"
  - "銅對銅直接接合"
  - "Cu-Cu Hybrid Bonding"
  - "無凸塊接合"
category: "packaging"
level: 3
short: "不用焊錫凸塊，直接讓上下兩層晶片的銅接點與絕緣層貼合，做出極密的 3D 堆疊連線。"
definition: "混合鍵合同時接合兩種材料：晶片表面的絕緣介電層彼此貼合密封，裸露的銅接點則直接銅對銅連通，因此稱為「混合」。它取代傳統的焊錫凸塊與微凸塊：依 SK 海力士的技術專文，焊錫凸塊間距約 100 微米、微凸塊約 20 微米，混合鍵合可縮到 1 微米以下。間距越小，同樣面積能放越多 I/O，訊號路徑更短、功耗更低，又省去凸塊與底部填充膠，堆疊更薄、散熱更好。超微（AMD）3D V-Cache 即採用混合鍵合，官方稱互連密度是 2D 小晶片的 200 倍以上、微凸塊 3D 堆疊的 15 倍以上。難點在於表面必須極度潔淨平坦、對準精度極高。做法分為晶圓對晶圓（W2W）與晶粒對晶圓（D2W）：前者已用於影像感測器與快閃記憶體量產，後者則是 HBM 導入的方向。SK 海力士專文預期，HBM 最可能在 HBM4E 或 HBM5、堆疊超過 20 層時全面導入。"
example: "傳統凸塊像用一顆顆錫珠把兩片積木黏起來，中間總有縫隙；混合鍵合則是把兩片磨得極平的積木直接壓合，表面的銅點與絕緣層一起融成一體。"
