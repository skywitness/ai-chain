term: "晶圓代工"
zh: "晶圓代工"
en: "Foundry"
aliases:
  - "Foundry"
  - "Pure-play foundry"
  - "專業晶圓代工"
  - "代工廠"
  - "晶圓代工廠"
category: "semiconductor"
level: 1
short: "不賣自有品牌晶片、專門替客戶製造晶片的商業模式，台積電是開創者與龍頭。"
definition: "晶圓代工是只負責「製造」、不設計也不販售自有品牌晶片的商業模式：客戶把設計好的電路交給代工廠，代工廠在晶圓上把晶片做出來。1987 年成立的台積電（TSMC）開創了專業晶圓代工模式，讓沒有工廠的 IC 設計公司得以興起。台積電表示，2025 年以 305 種製程技術、為 534 家客戶生產 12,682 種產品。輝達、超微（AMD）、博通（Broadcom）以及雲端業者自研的 AI 晶片，多數委託台積電以先進製程與先進封裝生產，例如輝達 Blackwell 採用台積電 4NP 製程，使晶圓代工成為 AI 供應鏈最關鍵的環節之一。其他代工廠包括三星、英特爾晶圓代工（Intel Foundry）、聯電、格芯與中芯國際。"
example: "晶圓代工像專業印刷廠：作家（IC 設計公司）寫好書稿交給印刷廠，印刷廠不出版自己的書，只負責把書印得又快又好。"
