term: "縮放定律"
zh: "縮放定律"
en: "Scaling Laws"
aliases:
  - "規模定律"
  - "擴展定律"
  - "Scaling Law"
  - "Neural Scaling Laws"
category: training
level: 2
short: "經驗規律：模型越大、資料越多、算力越多，表現就會以可預測的幅度穩定提升。"
definition: "縮放定律是指模型表現（通常以損失衡量）會隨參數量、訓練資料量與訓練算力，以冪律（power law）方式穩定改善的經驗規律。OpenAI 在 2020 年的研究發現，部分趨勢可橫跨超過七個數量級；DeepMind 在 2022 年的 Chinchilla 研究則修正了參數與資料的最佳配比。縮放定律讓實驗室能先用小模型預測大模型的表現，再決定要投入多少 GPU 與電力，因此成為大規模 AI 資本支出的重要理論依據。不過它是經驗觀察而非物理定律，資料供給、成本與報酬遞減都可能讓曲線放緩；近年業界也把推論時投入更多運算（測試時運算）視為另一條縮放方向。"
example: "像蓋高樓前先做縮小比例的模型去風洞測試：從小模型的結果，就能推估大模型大概會表現多好。"
