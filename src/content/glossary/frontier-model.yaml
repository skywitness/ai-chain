  - "Frontier Model"
  - "前沿 AI"
  - "Frontier AI"
  - "尖端模型"
category: llm
level: 2
short: "能力位於當前最前端的大型 AI 模型，通常也是訓練成本最高、最受監管關注的一群。"
definition: "前沿模型泛指能力處於當前最先進水準的通用 AI 模型，例如各大實驗室最新一代的旗艦模型，範圍會隨技術進展而移動。2023 年成立的產業組織「前沿模型論壇」（Frontier Model Forum）在認定會員資格時，將「前沿 AI 模型」定義為：在多項常用評測或高風險能力評估上，勝過所有已廣泛部署至少 12 個月之模型的通用模型。法規則常以訓練算力劃線，例如歐盟《AI 法》第 51 條推定訓練運算量超過 10²⁵ 次浮點運算的通用模型具有「高影響力能力」，並據此列為「具系統性風險」的通用 AI 模型。訓練前沿模型需要最大規模的 GPU 叢集與電力，這場競賽是 AI 資本支出的主要驅動力之一。"
example: "像每年的頂級旗艦手機：今年的旗艦就是前沿，兩三年後同等能力會出現在中階機，而新的旗艦又往前推進。"
