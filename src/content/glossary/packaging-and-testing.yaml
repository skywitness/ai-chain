term: "封測"
zh: "封裝與測試"
en: "Packaging and Testing"
aliases:
  - "封裝測試"
  - "半導體封測"
  - "後段製程"
  - "Assembly and Test"
  - "Back-end Process"
category: "packaging"
level: 1
short: "晶片製造的最後兩關：把晶粒裝進保護外殼並接好線路（封裝），再逐顆檢查好壞（測試）。"
definition: "晶圓廠做完的是一整片布滿電路的晶圓，還不能直接裝進電腦。「封裝」把晶圓切成一顆顆晶粒，固定在載板上、接好訊號與電源，再包上外殼保護並協助散熱，最後以接腳或錫球接到電路板；「測試」則在晶圓製造完成後先做「晶圓測試」，封裝後再做「最終測試」，用自動測試設備檢查功能與效能、挑出壞品，並把結果回饋給設計與製程以提升良率。封測過去被視為附加價值較低的「後段」，但 AI 晶片要把 GPU 與多組 HBM 緊密封在一起，先進封裝與更嚴格的測試已成為 AI 晶片供應的關鍵環節。"
example: "像蛋糕店：烤好的大蛋糕（晶圓）要先切塊、裝盒、封膜（封裝），出貨前再逐盒檢查有沒有壓壞（測試）。"
