# 名詞：強化學習（reinforcement-learning）· 分類 ai-basics · 資料基準日 2026-10-06
term: "強化學習"
zh: "強化學習"
en: "Reinforcement Learning"
aliases:
  - "Reinforcement Learning"
  - "RL"
  - "增強學習"
category: "ai-basics"
level: 1
short: "AI 透過不斷嘗試、依結果得到獎勵或懲罰，自己摸索出最好的做法，就像訓練寵物或練習下棋。"
definition: "強化學習讓一個「代理人」在環境中採取行動、依結果取得獎勵訊號，逐步學出讓長期總獎勵最大的策略；它不需要每一步的標準答案，只需要評分規則。DeepMind 的 AlphaGo 先學習人類棋譜，再透過大量自我對弈進行強化學習，2016 年 3 月在首爾以 4 比 1 擊敗圍棋棋士李世乭。如今強化學習是大型語言模型後訓練的核心，從人類回饋強化學習（RLHF）到以可驗證答案作為獎勵的訓練；DeepSeek-R1 論文即顯示，純強化學習就能激發模型的推理能力。由於訓練過程要讓模型反覆生成答案再評分，強化學習也提高了推論（生成）算力在訓練中的比重，並帶動「強化學習環境」這類新的訓練工具需求。"
example: "訓練狗狗坐下：做對了給零食、做錯了沒有獎勵；不需要人一步步示範，狗狗也能從獎勵中學會該怎麼做。"
