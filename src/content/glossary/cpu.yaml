term: "CPU"
zh: "中央處理器"
en: "Central Processing Unit"
aliases:
  - "中央處理器"
  - "處理器"
  - "主處理器"
  - "Host CPU"
  - "Central Processing Unit"
category: hardware
level: 1
short: "電腦的「總指揮」，擅長處理複雜、需要依序執行的工作；在 AI 伺服器中負責調度資料並指揮 GPU。"
definition: "CPU 是電腦的通用處理器，核心數比 GPU 少，但每個核心都很強，擅長分支判斷多、需要依序執行的工作，例如作業系統、資料庫與網頁服務。AI 伺服器的主要算力來自 GPU 等加速器，但仍需要 CPU 擔任「主機」：載入資料、排程工作、處理網路與儲存，以及執行 Agent 呼叫工具時的大量一般程式。高階伺服器 CPU 單顆已有上百個核心，例如超微（AMD）EPYC 9965 有 192 核；輝達 GB200 NVL72 整櫃則以 36 顆 Grace CPU 搭配 72 顆 Blackwell GPU。主流指令集有 x86（英特爾、超微）與 Arm，開放的 RISC-V 是新興選項。"
example: "做一桌年菜時，CPU 像主廚，負責看食譜、決定順序、處理突發狀況；GPU 像一整排備料助手，同時切好幾百份菜。主廚少了助手會很慢，助手少了主廚則不知道該做什麼。"
