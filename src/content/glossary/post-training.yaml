term: "後訓練"
zh: "後訓練"
en: "Post-training"
aliases:
  - "後期訓練"
  - "Posttraining"
  - "Post-train"
category: training
level: 2
short: "預訓練之後的調教階段，用 SFT、偏好最佳化與強化學習，把基礎模型變成好用的助理。"
definition: "後訓練泛指預訓練完成後的各種調整步驟，常見組合包括監督式微調（SFT）、依人類或 AI 偏好進行的最佳化（RLHF、DPO），以及針對數學、程式等可驗證任務的強化學習（RLVR）。它讓只會「接話」的基礎模型學會遵循指令、使用工具、拒絕有害要求，並強化推理能力。後訓練通常反覆進行多輪：Meta 的 Llama 3 就做了六輪，每輪都收集新的偏好標註與 SFT 資料，並從最新模型取樣合成資料。Ai2（艾倫人工智慧研究所）的 Tülu 3 論文也指出，後訓練的資料與配方是最關鍵、卻也最不透明的部分。"
example: "預訓練像讓新人讀完公司所有文件；後訓練則是主管親自示範、批改回覆、訂下行為準則，讓新人真正能上線接待客戶。"
