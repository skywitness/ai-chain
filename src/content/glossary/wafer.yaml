term: "晶圓"
zh: "晶圓"
en: "Wafer"
aliases:
  - "Wafer"
  - "矽晶圓"
  - "Silicon wafer"
  - "12 吋晶圓"
  - "300 mm wafer"
category: "semiconductor"
level: 1
short: "由高純度矽切成的薄圓片，晶片就是在它上面一層層做出來，最後再切成一顆顆晶粒。"
definition: "晶圓是把高純度單晶矽棒切成的薄圓片，表面經過極度平坦的拋光，是製作晶片的「底板」。晶圓廠在上面反覆進行微影、蝕刻、沉積等數百道步驟，完成後再切割成許多晶粒。目前先進製程的主流尺寸是直徑 300 毫米（12 吋），厚度約 775 微米。業界常以「12 吋約當晶圓」衡量產能：台積電（TSMC）表示，2025 年旗下工廠年產能超過 1,700 萬片 12 吋約當晶圓。AI 晶片面積大，一片晶圓能切出的數量少，因此先進製程的晶圓產能，直接決定 AI 晶片能供應多少。"
example: "晶圓就像一張大披薩餅皮，晶片設計是要印上去的圖案；餅皮越大、每塊切得越小，一次能做出的份數就越多。"
