term: "太空資料中心"
zh: "太空資料中心"
en: "Space-based Data Center"
aliases:
  - "軌道資料中心"
  - "太空算力"
  - "Orbital Data Center"
  - "Space Data Center"
  - "Data Centers in Space"
category: datacenter
level: 2
short: >-
  把 AI 晶片送上衛星，在軌道上用太陽能發電、向太空散熱的資料中心構想，目前仍在實驗階段。
definition: >-
  太空資料中心是把運算設備裝在衛星上，利用軌道上幾乎不間斷的日照發電，並以輻射方式把廢熱排向太空，目的是繞開地面資料中心在電力、土地與冷卻用水上的限制。Google 在 2025 年 11 月公布 Project Suncatcher 研究：在合適的軌道上，太陽能板的產能最多可達地面的 8 倍；若發射成本在 2030 年代中期降到每公斤 200 美元以下，發射與營運成本可能與同等地面資料中心的能源成本（以每 kW 每年計）相當。Google 也計畫與 Planet 合作，在 2027 年初前發射兩顆搭載 TPU 的原型衛星。新創 Starcloud 則已在 2025 年 11 月發射搭載 NVIDIA H100 的 Starcloud-1。主要挑戰包括真空中只能靠輻射散熱、宇宙輻射對晶片與記憶體的影響、發射成本、無法現場維修與太空垃圾風險。目前仍屬早期驗證，距離 GW 等級的商用規模還很遠。
example: >-
  就像把太陽能電廠和伺服器一起送上天：電力幾乎全天候不斷，但散熱只能像暖爐一樣靠「發光」把熱輻射出去，壞了也無法派工程師上去換零件。
