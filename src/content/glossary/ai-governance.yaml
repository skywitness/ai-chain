term: "AI 治理"
zh: "AI 治理"
en: "AI Governance"
aliases:
  - "人工智慧治理"
  - "AI 治理框架"
  - "AI Governance"
  - "AI 風險管理"
category: "policy"
level: 1
short: "用法律、標準與企業內部制度，管理 AI 開發與使用風險的整套做法。"
definition: "AI 治理指政府、企業與國際組織用來引導 AI 開發與使用的規則與流程，範圍從法律（例如歐盟 AI 法、台灣《人工智慧基本法》）到技術標準與企業內控。常見的參考框架有兩個：美國國家標準與技術研究院（NIST）在 2023 年 1 月 26 日發布的 AI 風險管理框架（AI RMF 1.0），以治理（Govern）、對應（Map）、衡量（Measure）、管理（Manage）四項功能組織風險管理，2024 年 7 月再推出生成式 AI 專用的補充文件；以及 ISO/IEC 42001:2023，這是 AI 管理系統標準，讓組織用「規劃、執行、檢查、行動」循環建立 AI 政策與流程。對產業鏈而言，治理要求會變成模型文件、風險評估、資料來源紀錄與稽核成本，也決定 AI 產品能否進入金融、醫療、政府等受監理的市場。"
example: "企業導入生成式 AI 客服前，先盤點用途與風險、指定負責人，再建立人工覆核與事故通報流程，這就是公司層級的 AI 治理。"
