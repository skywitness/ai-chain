term: "中介層"
zh: "中介層"
en: "Interposer"
aliases:
  - "Interposer"
  - "矽中介層"
  - "Silicon Interposer"
  - "RDL 中介層"
  - "轉接層"
category: "packaging"
level: 2
short: "墊在晶粒與載板之間的一層超細線路，讓並排的 GPU 與 HBM 以極密的連線互相溝通。"
definition: "中介層是 2.5D 封裝中夾在晶粒與封裝載板之間的轉接層，上面有比一般載板細得多的線路，讓相鄰晶粒以大量高密度連線高速溝通，再把訊號與電源轉接到線距較寬的載板。依材料主要分兩類：以晶圓製程製作、用矽穿孔（TSV）上下導通的矽中介層，以及由聚合物與銅線構成、較有彈性的重布線層（RDL）中介層；台積電（TSMC）CoWoS-R 的 RDL 中介層最小節距為 4 微米（線寬與線距各 2 微米）。矽中介層線路最密，但越大越貴、良率越難顧，台積電 CoWoS-S 的矽中介層最大約 3.3 倍光罩（約 2,700 平方毫米）。AI 晶片越大、HBM 越多，中介層就得越大，這也是 CoWoS-L 改用 RDL 中介層、只在關鍵處嵌入局部矽橋的原因。"
example: "像轉接頭：晶片上的接點又小又密，主機板那端的插孔又大又疏，中介層負責把兩邊對接起來，同時讓並排的晶片彼此直接講話。"
