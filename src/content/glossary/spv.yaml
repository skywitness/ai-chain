term: "SPV"
zh: "特殊目的機構"
en: "Special Purpose Vehicle"
aliases:
  - "特殊目的機構"
  - "特殊目的公司"
  - "特殊目的實體"
  - "SPE"
  - "Special Purpose Vehicle"
  - "Special Purpose Entity"
category: "cloud-business"
level: 3
short: "為單一專案或資產另外成立的獨立法人，用來借錢或引進投資人，並與母公司的風險隔離。"
definition: "特殊目的機構（SPV）是為特定專案設立的獨立公司，資產、負債與現金流都與母公司分開；貸款人主要看專案本身的資產與租約收入，母公司若不具控制權，相關負債也可能不必併入它的資產負債表。AI 資料中心與 GPU 融資大量採用這種結構。例如 2025 年 10 月，Meta 與 Blue Owl 旗下基金合資開發路易斯安那州的 Hyperion 資料中心，Blue Owl 持有 80%、Meta 持有 20%，建築與基礎設施總開發成本約 270 億美元，Blue Owl 端的部分資金來自向 PIMCO 等債券投資人私募發行的債券；Meta 提供建設與物業管理服務，完工後承租整個園區（初始租期 4 年、可續約），並為營運前 16 年提供殘值保證。GPU 融資也常用類似結構，例如 CoreWeave 2026 年 3 月的 85 億美元貸款，就是以子公司 CoreWeave Compute Acquisition Co. VIII 的資產作擔保。SPV 讓巨額投資不必立刻壓在母公司帳上，但租約承諾與殘值保證等潛在義務，需要細讀財報附註。"
example: "像幾位朋友合資另開一家公司專門經營一間民宿：民宿的貸款和盈虧都算在這家新公司，不會直接記在各自的帳上。"
