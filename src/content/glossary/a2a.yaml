term: "A2A"
zh: "Agent 間通訊協定"
en: "Agent2Agent Protocol"
aliases:
  - "Agent2Agent"
  - "Agent2Agent Protocol"
  - "A2A 協定"
  - "Agent 間通訊協定"
category: llm
level: 3
short: "Google 於 2025 年提出的開放協定，讓不同公司、不同框架開發的 AI Agent 能互相發現、分派任務與協作。"
definition: "A2A（Agent2Agent）是 Google 在 2025 年 4 月 9 日發表的開放協定，首發即獲 50 多家技術夥伴支持，用來讓不同廠商、不同框架打造的 AI Agent 互相溝通。每個 Agent 可公開一份「Agent Card」，說明自己的能力與聯繫方式，其他 Agent 讀取後即可協商互動形式並委派任務；協定建立在 HTTP、SSE、JSON-RPC 等既有標準之上。A2A 與 MCP 互補：MCP 把單一 Agent 接上工具與資料，A2A 負責 Agent 與 Agent 之間的協作。2026 年 8 月，A2A 正式以成長階段（Growth Stage）專案加入 Linux 基金會旗下的 Agentic AI Foundation（AAIF），官方表示已獲超過 150 個組織支持。"
example: "像不同旅行社的業務員都用同一套轉單系統：只要看過對方的名片（Agent Card），就能互相轉單、分工完成一趟複雜的旅程。"
