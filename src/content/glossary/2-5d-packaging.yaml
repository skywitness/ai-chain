term: "2.5D 封裝"
zh: "2.5D 封裝"
en: "2.5D Packaging"
aliases:
  - "2.5D IC"
  - "2.5D 整合"
  - "2.5D Integration"
  - "2.5D 先進封裝"
category: "packaging"
level: 2
short: "把多顆晶粒「並排」放在同一片中介層上互連，介於傳統平面封裝與 3D 堆疊之間的封裝方式。"
definition: "2.5D 封裝把邏輯晶粒、HBM 等多顆晶粒並排放在中介層（或內嵌矽橋的基板）上，透過中介層的高密度線路互相連接，再接到封裝載板。之所以叫「2.5D」，是因為晶粒本身沒有上下堆疊（那是 3D），但又比把晶片各自封裝後放在電路板上互連的 2D 方式多了一層密集的中介結構。它能把運算晶粒與記憶體放得非常近，取得遠高於電路板走線的頻寬，又避開 3D 堆疊在散熱與製程上的難度。台積電（TSMC）CoWoS 是代表性的 2.5D 技術，搭載 HBM 的 AI 加速器普遍採用這類封裝。下一步是先用 SoIC 等技術把邏輯晶粒 3D 堆疊，再放進 CoWoS 與 HBM 做 2.5D 整合；SK 海力士也指出，混合鍵合將讓 HBM 有機會從 2.5D 走向完全 3D 的封裝。"
example: "如果 3D 堆疊是蓋高樓，2.5D 就像在同一塊地基上蓋一排緊鄰的平房，房子之間有地下通道相連，走動又快又近。"
