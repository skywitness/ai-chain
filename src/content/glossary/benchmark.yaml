category: llm
level: 1
short: "用一組固定題目衡量 AI 模型能力的標準化測驗，例如 MMLU、GPQA、SWE-bench。"
definition: "Benchmark（基準測試）是用固定題庫與評分規則比較模型能力的方法，涵蓋知識、數學、程式、推理與 Agent 任務等。例如 2020 年發表的 MMLU 涵蓋 57 個科目；到 2025 年初，DeepSeek 公布的對照表中，OpenAI o1（1217 版）與 DeepSeek-R1 在 MMLU 已分別達 91.8% 與 90.8%，逐漸失去鑑別力，業界因此不斷推出更難的新評測。Benchmark 分數是模型公司行銷、企業選型與投資人判斷技術差距的重要依據，但會受評測汙染、提示方式與測試設定影響，解讀時要注意日期與方法。"
example: "像大學學測：同一份考卷讓不同考生作答方便比較；但如果考生事先看過考題，分數就不再可信。"
