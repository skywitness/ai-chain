  - "NVSwitch"
  - "NVLink Fusion"
  - "NVLink 6"
  - "輝達高速互連"
category: networking
level: 2
short: "輝達自家的 GPU 對 GPU 高速互連技術，頻寬遠超 PCIe，是 NVL72 等整櫃系統的關鍵。"
definition: "NVLink 是輝達（NVIDIA）專有的晶片間高速互連。搭配 NVLink Switch 交換晶片後，機櫃內所有 GPU 可以兩兩全速互通，像一顆巨大加速器般運作。第五代 NVLink（Blackwell）每顆 GPU 頻寬為 1,800 GB/s，GB200 NVL72 整櫃總頻寬 130 TB/s；第六代（Vera Rubin）提升到每顆 3,000 GB/s，Vera Rubin NVL72 總頻寬 216 TB/s，官方稱約為 PCIe Gen6 的 12 倍。對 MoE 等需要大量 GPU 互相交換資料的模型，NVLink 能大幅縮短通訊時間，也是輝達整櫃系統的競爭優勢之一。2025 年 5 月輝達在台北國際電腦展發表 NVLink Fusion，讓客戶的客製 ASIC 或 CPU 也能接入 NVLink，首批合作夥伴包括聯發科、Marvell、世芯、Astera Labs 等。"
example: "PCIe 像市區的一般道路，各種裝置都要共用；NVLink 則像 GPU 之間專屬的高架快速道路，而且每兩顆 GPU 之間都有直達車道。"
