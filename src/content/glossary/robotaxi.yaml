term: "Robotaxi"
zh: "無人駕駛計程車"
en: "Robotaxi"
aliases:
  - "無人計程車"
  - "自駕計程車"
  - "Robo-taxi"
  - "Driverless Taxi"
category: robotics
level: 1
short: "車上沒有司機的計程車：乘客用 App 叫車，由 Level 4 自動駕駛系統在限定區域內載客。"
definition: "Robotaxi 是以 Level 4 自動駕駛車隊提供的叫車服務，車上不配置安全駕駛，只在業者劃定並驗證過的營運區域內行駛。美國 Waymo 是規模最大的業者之一：它自行公布的安全分析涵蓋截至 2026 年 6 月底、累計超過 2.7 億英里的全無人行駛，並納入鳳凰城、舊金山、洛杉磯、奧斯汀與亞特蘭大五個主要都會區，結論是涉及受傷的事故比人類駕駛少 82%。其他業者包括特斯拉（Tesla）、亞馬遜（Amazon）旗下的 Zoox，以及中國的百度蘿蔔快跑（Apollo Go）、小馬智行（Pony.ai）與文遠知行（WeRide）。Robotaxi 能否獲利，取決於車輛與感測器成本、遠端協助人力與車隊利用率；它也是車用 AI 晶片、光達與雲端訓練算力的重要需求來源。"
example: "打開 App 叫車，來的是一台車頂裝著旋轉感測器、駕駛座空無一人的電動車，方向盤會自己轉。"
