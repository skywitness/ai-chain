term: "LPDDR"
zh: "低功耗 DRAM"
en: "Low-Power Double Data Rate DRAM"
aliases:
  - "LPDDR5X"
  - "LPDDR6"
  - "低功耗記憶體"
  - "Mobile DRAM"
  - "行動 DRAM"
category: "memory"
level: 2
short: "為手機與筆電設計的省電型 DRAM，近年也進入 AI 伺服器，擔任 CPU 的主記憶體。"
definition: "LPDDR 是 JEDEC 制定的低功耗 DRAM 標準系列，原本為手機、平板與筆電設計，以較低電壓與多種省電模式降低耗電，通道也比一般 DRAM 的 64 位元匯流排窄（16 或 32 位元），通常直接焊在主機板上或與處理器封裝在一起。目前主流為 LPDDR5X，JEDEC 已於 2025 年 7 月公布 LPDDR6 標準。AI 伺服器也開始採用 LPDDR：美光與輝達合作、為 GB300 Grace Blackwell Ultra 超級晶片開發的 SOCAMM 模組就以 LPDDR5X 製成，美光稱其耗電約為標準 DDR5 RDIMM 的三分之一。手機、AI PC 與機器人等邊緣 AI 裝置，同樣仰賴 LPDDR 兼顧頻寬與省電。"
example: "如果一般 DRAM 是家用冷氣，LPDDR 就是變頻省電款：效能夠用，但電費少很多，特別適合靠電池或講究每瓦效能的設備。"
