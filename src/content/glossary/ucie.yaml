term: "UCIe"
zh: "小晶片互連標準"
en: "Universal Chiplet Interconnect Express"
aliases:
  - "Universal Chiplet Interconnect Express"
  - "UCIe 標準"
  - "通用小晶片互連"
  - "UCIe Consortium"
category: "packaging"
level: 3
short: "讓不同公司設計的小晶粒能在同一個封裝裡互相溝通的開放式晶粒對晶粒互連標準。"
definition: "UCIe 是封裝內晶粒對晶粒（die-to-die）連線的開放標準，規範實體層與晶粒間轉接層，並可承載 PCIe、CXL 等既有協定，目標是建立開放的 Chiplet 生態系，讓不同廠商、不同製程的小晶粒能像插擴充卡一樣混搭。UCIe 1.0 於 2022 年 3 月由英特爾、超微、Arm、日月光、Google Cloud、Meta、微軟、高通、三星與台積電共同發表，實體層每通道最高 32 GT/s；輝達與阿里巴巴於同年 8 月加入董事會。2.0 版（2024 年 8 月）加入 3D 封裝與系統管理架構支援，3.0 版（2025 年 8 月）把速率提升到 48 與 64 GT/s。對 AI 產業鏈而言，UCIe 有助於降低自研 ASIC 整合外部 I/O、記憶體或光學小晶粒的門檻，也讓矽智財與封測業者能提供標準化方案。"
example: "像 USB 讓不同品牌的滑鼠、鍵盤都能插上電腦，UCIe 想讓不同公司做的小晶粒，都能用同一套「插頭規格」在封裝裡接在一起。"
