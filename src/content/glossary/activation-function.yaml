# 名詞：激勵函數（activation-function）· 分類 ai-basics · 資料基準日 2026-10-06
term: "激勵函數"
zh: "激勵函數"
en: "Activation Function"
aliases:
  - "Activation Function"
  - "活化函數"
  - "激活函數"
  - "啟動函數"
category: "ai-basics"
level: 2
short: "神經元輸出前的一道「非線性轉換」，讓神經網路能學會複雜的關係，而不只是畫直線。"
definition: "激勵函數作用在神經元的加權總和上，決定要輸出多少訊號。它的關鍵在於「非線性」：若沒有它，不論堆疊多少層，整個網路在數學上都等同一次線性運算，學不出複雜的關係。常見的有 Sigmoid、ReLU（負值歸零、正值照傳）與 GELU；不少大型語言模型改用 SwiGLU 這類加入「閘控」的變體，例如 Meta 的 Llama 3 就採用 SwiGLU。激勵函數的運算量遠小於矩陣乘法，但屬於逐元素運算，速度常受記憶體頻寬限制，因此 AI 晶片的軟體堆疊常把它與前後的運算「融合」成一次執行，以減少資料在記憶體間搬移。"
example: "像水龍頭：水壓（加權總和）不夠時完全不出水，超過門檻才依水壓大小出水，這就是 ReLU 的直覺。"
