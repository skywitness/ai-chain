term: "ABF"
zh: "味之素增層膜載板"
en: "Ajinomoto Build-up Film"
aliases:
  - "味之素增層膜"
  - "ABF 載板"
  - "增層膜"
  - "Ajinomoto Build-up Film"
  - "Build-up Film"
category: "packaging"
level: 2
short: "日本味之素發明的絕緣薄膜，是 CPU、GPU 高階載板一層層疊出細密線路的關鍵材料。"
definition: "ABF 原指日本味之素（Ajinomoto）從胺基酸化學研究延伸開發的絕緣膜，由環氧樹脂、硬化劑與無機微粒填料組成，表面可用雷射加工並直接鍍銅，因此能在載板上一層層「增層」出微米級線路；業界也把用這種材料做成的高階載板稱為 ABF 載板。味之素表示，ABF 在 1990 年代末開始用於個人電腦，1999 年首度獲大型半導體廠採用，此後二十多年一直是市場領導者，幾乎所有高效能 CPU 都選用它。AI GPU 與 ASIC 的封裝尺寸大、線路層數多，對 ABF 載板的面積、層數與良率要求更高，使 ABF 材料與載板產能（日本揖斐電、台灣欣興、南電、景碩等）成為 AI 供應鏈的觀察重點。"
example: "像做千層蛋糕：每鋪一層 ABF 薄膜，就在上面刻出一層銅線路，再鋪下一層，最後疊出多層的立體電路。"
