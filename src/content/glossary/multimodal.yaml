term: "多模態"
zh: "多模態模型"
en: "Multimodal Model"
aliases:
  - "多模態"
  - "多模態模型"
  - "Multimodal"
  - "Multimodal Model"
  - "LMM"
  - "大型多模態模型"
category: llm
level: 1
short: "能同時理解或生成文字、圖片、聲音、影片等多種資料類型的 AI 模型。"
definition: "多模態模型能處理一種以上的資料形式（模態），例如看圖回答問題、即時語音對話、讀取 PDF 中的圖表，或生成圖片與影片。Google 在 2023 年 12 月發表的 Gemini 技術報告，強調模型能跨圖像、音訊、影片與文字進行理解；OpenAI 於 2024 年 5 月推出的 GPT-4o（o 代表 omni）則能處理並生成文字、圖像與音訊。多模態讓 AI 從聊天機器人延伸到文件處理、語音客服、電腦操作與機器人等場景；影像與影片的資料量大，也加重推論時的運算負擔。"
example: "拍下冰箱裡的食材問 AI「今晚能煮什麼」，模型同時看懂照片、再用文字回答，就是多模態的應用。"
