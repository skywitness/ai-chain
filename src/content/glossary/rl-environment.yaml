term: "強化學習環境"
zh: "強化學習環境"
en: "Reinforcement Learning Environment"
aliases:
  - "RL 環境"
  - "訓練環境"
  - "RL Environment"
  - "Gym 環境"
category: training
level: 3
short: "讓模型或 Agent 透過「採取行動、得到回饋」反覆練習的場域，例如遊戲、程式庫或網頁沙盒。"
definition: "強化學習環境定義了 Agent 能觀察到什麼、可以採取哪些行動，以及每個行動之後會得到什麼獎勵。早期以遊戲與機器人模擬為主，OpenAI 在 2016 年推出的 Gym 工具包，替各種環境訂出共同介面，讓研究者能在同一套問題上比較方法。大型語言模型進入 Agent 時代後，環境變成可執行的程式碼庫、瀏覽器或作業系統沙盒：例如 SWE-Gym 收錄 2,438 個真實 Python 專案任務，每題都附可執行環境、單元測試與自然語言描述的需求，用來訓練軟體工程 Agent。環境的多樣性與驗證機制是否可靠，直接決定 RLVR 等方法能教會模型什麼。"
example: "像駕訓班的練習場：有道路、號誌和考官，學員每次操作都能立刻知道對錯；練習場越貼近真實路況，學員上路就越可靠。"
