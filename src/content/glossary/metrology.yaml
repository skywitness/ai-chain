term: "量測與檢測"
zh: "製程量測與檢測"
en: "Metrology and Inspection"
aliases:
  - "Metrology"
  - "Inspection"
  - "製程控制"
  - "Process control"
  - "量測"
  - "檢測"
  - "缺陷檢測"
category: "semiconductor"
level: 2
short: "在製造過程中測量尺寸、厚度、對準並找出缺陷的設備與技術，是晶圓廠提升良率的眼睛。"
definition: "量測與檢測（合稱製程控制）是在晶圓製造各階段檢查「做得對不對」：量測（metrology）測量線寬、薄膜厚度、上下層之間的疊對誤差等數值；檢測（inspection）則在晶圓上搜尋微粒、刮痕或圖形缺陷，再用缺陷複查設備分析成因。先進製程有數百道以上的步驟，任何一步偏差都可能要到最後測試才反映在良率上，因此必須即時監控、及早修正，也能預先剔除缺陷過多的晶圓以節省後續成本。科磊（KLA）是以製程控制為核心業務的主要設備商，ASML 也提供 YieldStar 光學量測與 HMI 電子束檢測。AI 晶片晶粒大、採用最新製程，製程控制對良率爬坡格外重要。"
example: "量測與檢測像產線上的品管員加上定期健康檢查：量尺寸、照 X 光，及早發現問題，才不會整批報廢。"
