term: "TTM"
zh: "近四季合計"
en: "Trailing Twelve Months"
aliases:
  - "近四季"
  - "近十二個月"
  - "過去 12 個月"
  - "LTM"
  - "Last Twelve Months"
  - "Trailing Twelve Months"
category: "cloud-business"
level: 2
short: "把最近四個季度的數字加總，得到最新一整年的數字，可避開季節性並與年度數字比較。"
definition: "TTM（近四季合計，也稱 LTM）是把最近 4 個季度的營收、獲利或現金流加總。公司的會計年度一年只結算一次，季報又有淡旺季，TTM 能每季滾動更新，同時保有一整年的完整性。常見用途包括近四季 EPS（用來計算本益比）、近四季營收與自由現金流。例如 Amazon 公布 2026 年第二季財報時揭露：截至該季的近四季營業現金流 1,614 億美元，年增 33%；購置不動產與設備淨額 1,690 億美元；近四季自由現金流為流出 76 億美元，一年前則是流入 182 億美元，清楚反映 AI 資本支出對現金的影響。"
example: "在 10 月想知道「過去一年」賣了多少，不必等到明年 1 月結帳，把最近四季的數字加起來就好。"
