term: "232 條款"
zh: "232 條款國安關稅調查"
en: "Section 232"
aliases:
  - "232 關稅"
  - "232 調查"
  - "Section 232"
  - "國安關稅"
  - "半導體 232 關稅"
category: "policy"
level: 2
short: "美國依《1962 年貿易擴張法》第 232 條，以國家安全為由對進口品加徵關稅的機制。"
definition: "232 條款指美國《1962 年貿易擴張法》第 232 條，授權商務部調查某項進口品是否威脅國家安全，總統再據以採取關稅等措施。商務部在 2025 年 4 月 1 日啟動對半導體、半導體製造設備與衍生產品的 232 調查，2025 年 12 月 22 日向總統提交報告。總統隨後在 2026 年 1 月 14 日發布公告，自 1 月 15 日起對一小類先進運算晶片及衍生產品加徵 25% 從價關稅，但用於美國資料中心、在美研發、新創、民用工業與公部門等用途可以豁免；公告也表示，在貿易談判結束後的第二階段，可能對半導體課徵範圍更廣的關稅。由於台灣是 AI 晶片與 AI 伺服器的主要出口地，232 關稅的稅率與豁免範圍，會直接影響台灣晶圓代工與伺服器代工廠的成本，以及在美國設廠的決策。"
example: "好比一個國家認為某種零件太依賴進口會影響國安，就對進口品加稅，但對用在國內關鍵建設、或能幫助本地產業的進口品開綠燈。"
