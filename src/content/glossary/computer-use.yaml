category: llm
level: 2
short: "讓 AI 看螢幕截圖、移動滑鼠、點擊與打字，像人一樣直接操作電腦與網頁的 Agent 能力。"
definition: "Computer Use 指 AI 模型透過螢幕截圖理解畫面，再輸出滑鼠移動、點擊與鍵盤輸入等動作，直接操作圖形介面的軟體與網頁，不需要對方提供 API。Anthropic 在 2024 年 10 月 22 日隨新版 Claude 3.5 Sonnet 推出公開測試版，當時在 OSWorld 評測（僅用截圖）得分 14.9%（次佳系統為 7.8%）；OSWorld 包含 369 項真實電腦任務，人類完成率超過 72%。之後 OpenAI 等業者也在 API 中提供類似工具。電腦操作讓 Agent 能處理沒有 API 的舊系統與重複性文書作業，但每一步都要處理影像，推論成本與資安風險（如網頁中的提示注入）也較高。"
example: "像請一位遠端助理用你的電腦處理報帳：他看著螢幕，打開瀏覽器、登入系統、逐欄填表，最後按下送出。"
