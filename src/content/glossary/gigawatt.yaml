term: "GW"
zh: "吉瓦"
en: "Gigawatt"
aliases:
  - "吉瓦"
  - "十億瓦"
  - "百萬瓩"
  - "gigawatt"
  - "GWe"
category: energy
level: 1
short: "功率單位，1 GW 等於 10 億瓦（100 萬瓩），約是一座大型核能機組的發電能力，常用來形容 AI 園區規模。"
definition: "GW（吉瓦）是功率單位：1 GW = 1,000 MW（百萬瓦）= 10 億瓦。台電慣用的「瓩」就是 kW，所以 1 GW 也等於 100 萬瓩。GW 描述的是「同一時間能供應多少電」，若要講累積用電量，要再乘上時間，單位變成 GWh 或 TWh（1 GW 的負載滿載運轉一整年，約用掉 8.76 TWh）。世界核能協會指出，傳統大型核能機組單機約 1,000 MWe 以上，也就是約 1 GW。AI 產業近年習慣用 GW 衡量資料中心與算力合約的規模；輝達（NVIDIA）估算，一座 1 GW 的資料中心若沿用傳統 54 V 直流機櫃供電，光是機櫃匯流排最多就可能用掉 20 萬公斤的銅，這也是輝達推動改用 800 V 直流的原因之一。"
example: "如果把 1 kW 想成一台開到最強的電暖器，1 GW 就相當於 100 萬台電暖器同時開著。"
