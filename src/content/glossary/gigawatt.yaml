  notes: "查核：WNA 大型機組約 1,000 MWe 以上、輝達 54 VDC 機櫃匯流排在 1 GW 資料中心最多需 20 萬公斤銅，皆對照原文；「業界改用 800 V」改為「輝達推動改用」，並補充 GW 與 TWh 的換算例（本站計算：1 GW × 8,760 小時）。"
