term: "BBU"
zh: "備援電池模組"
en: "Battery Backup Unit"
aliases:
  - "備援電池模組"
  - "電池備援單元"
  - "機櫃式電池"
  - "Battery Backup Unit"
  - "BBU Shelf"
category: datacenter
level: 3
short: >-
  裝在機櫃內的鋰電池模組，停電時直接供電給伺服器幾分鐘，可取代或補強機房的集中式 UPS。
definition: >-
  BBU 是把備援電池直接放進機櫃的設計，不同於傳統在機房另設大型集中式 UPS。以開放運算計畫（OCP）的 Open Rack V3 48V BBU 規格（Rev 1.4，2023 年 9 月）為例：每個 BBU 模組使用鋰離子電池，須能以 3 kW 輸出至少 4 分鐘；一個 BBU 電池架放 6 個模組、採 5+1 備援，交流電中斷時直接向機櫃的 48V 母線供電，撐到發電機或其他電源接手。這份規格由 Meta 主筆，台達電也是貢獻者之一。BBU 可減少集中式 UPS 的電力轉換次數與機房空間，並能隨機櫃逐步擴充。隨著 AI 訓練讓 GPU 負載在瞬間大幅起落，NVIDIA 等業者也在供電架構中加入電容與電池儲能來平滑尖峰，備援電池的角色正從「停電時撐住」延伸到「平時穩定供電」。
example: >-
  傳統做法像整棟大樓共用一台大型發電機；BBU 則像每間辦公室各放一顆行動電源，停電時就近供電，某一顆故障也只影響一小區。
