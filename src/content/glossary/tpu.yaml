term: "TPU"
zh: "張量處理器"
en: "Tensor Processing Unit"
aliases:
  - "張量處理器"
  - "張量處理單元"
  - "Google TPU"
  - "Cloud TPU"
  - "Ironwood"
  - "Tensor Processing Unit"
category: hardware
level: 1
short: "Google 自行設計的 AI 專用晶片（ASIC），用於訓練與執行自家模型，也透過 Google Cloud 出租。"
definition: "TPU 是 Google 為神經網路設計的 ASIC，核心是以脈動陣列構成的矩陣乘法單元。第一代自 2015 年起在 Google 資料中心執行推論，內含 65,536 個 8 位元乘加單元。之後歷代陸續加入訓練能力、液冷與大規模互連：第七代 Ironwood 的單晶片效能是第六代 Trillium 的 4 倍，一個 Pod 可串接 9,216 顆液冷晶片，合計 42.5 EFLOPS。Google Cloud 也已列出第八代的 TPU 8t（訓練用，單一 superpod 9,600 顆）與 TPU 8i（後訓練與推論用），標示即將推出。TPU 是輝達 GPU 之外最具代表性的 AI 加速器之一，讓 Google 在自家模型的算力成本上較不受制於外部晶片供應商。"
example: "如果 GPU 是什麼菜都能煮的大廚房，TPU 就像 Google 為自家招牌菜專門設計的生產線：菜色比較固定，但出餐速度與成本都經過極致最佳化。"
