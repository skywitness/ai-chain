term: "HBF"
zh: "高頻寬快閃記憶體"
en: "High Bandwidth Flash"
aliases:
  - "High Bandwidth Flash"
  - "高頻寬快閃"
  - "HBF 記憶體"
category: "memory"
level: 3
short: "把 NAND Flash 像 HBM 一樣堆疊並靠近 GPU 的新記憶體層，容量遠大於 HBM，主攻 AI 推論。"
definition: "HBF 是 Sandisk 與 SK 海力士推動的新一代記憶體技術，概念是把 NAND Flash 晶粒像 HBM 一樣垂直堆疊、底部搭配以邏輯製程製作的基底晶粒，並靠近 GPU 等處理器封裝，成為介於 HBM 與 SSD 之間的新層級：傳輸速度接近 HBM、容量卻大得多，適合處理推論時大量的 KV Cache 等資料。兩家公司在 2025 年 8 月展開標準化合作，2026 年 2 月成立聯盟，並於 2026 年 8 月透過開放運算計畫（OCP）公布首版規格：採 8 層或 16 層 NAND 堆疊、容量最高 512 GB，頻寬分三級約 0.4–3.0 TB/s，並以 UCIe 介面與處理器連接；Google 與 Tenstorrent 也已加入聯盟。"
example: "如果 HBM 是 GPU 旁的小冰箱、SSD 是遠處的大倉庫，HBF 就是在廚房旁加蓋一間大型冷藏室：比冰箱大得多，取用又比倉庫快。"
