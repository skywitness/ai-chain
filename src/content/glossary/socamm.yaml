term: "SOCAMM"
zh: "小型壓縮附加記憶體模組"
en: "Small Outline Compression Attached Memory Module"
aliases:
  - "SOCAMM2"
  - "SOCAMM 模組"
  - "LPDDR 伺服器模組"
category: "memory"
level: 3
short: "把 LPDDR5X 做成可拆換小模組的伺服器記憶體，比傳統 RDIMM 更小、更省電，用於輝達 Vera Rubin 等 AI 平台。"
definition: "SOCAMM 是以低功耗 DRAM（LPDDR5X）製成、以壓接方式固定在主機板上的小型記憶體模組。LPDDR 傳統上直接焊在板上，壞了無法單獨更換；SOCAMM 把它做成可拆換的模組，兼顧 LPDDR 的省電與伺服器需要的維修性與擴充彈性。美光與輝達合作、為 GB300 Grace Blackwell Ultra 超級晶片開發的第一代 SOCAMM，於 2025 年 3 月宣布量產，尺寸 14×90 毫米、約為標準 RDIMM 的三分之一，單條最高 128 GB。第二代 SOCAMM2 用於輝達 Vera Rubin 平台、擔任 Vera CPU 的主記憶體，SK 海力士已展示 96 GB 與 192 GB 的產品。"
example: "過去伺服器用 LPDDR 就像把記憶卡焊死在相機裡，壞了只能整台送修；SOCAMM 則改成可以拔插更換的卡片。"
