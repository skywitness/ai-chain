term: "思維鏈"
zh: "思維鏈"
en: "Chain-of-Thought"
aliases:
  - "思維鏈"
  - "CoT"
  - "Chain of Thought"
  - "思路鏈"
  - "逐步推理"
category: llm
level: 2
short: "讓模型先寫出一步步的中間推理過程再給答案，能明顯提升數學與邏輯題的正確率。"
definition: "思維鏈（CoT）是讓語言模型在回答前先產生一連串中間推理步驟的方法。Google 研究人員在 2022 年的論文中顯示，只要在提示詞中提供 8 個附推理過程的範例，5,400 億參數的 PaLM 模型就在 GSM8K 小學數學應用題達到當時最佳成績；同年另一篇研究發現，只加上一句「Let's think step by step」，InstructGPT 在 MultiArith 的正確率就從 17.7% 提升到 78.7%。後來的推理模型把思維鏈內化到訓練中，用強化學習讓模型自行產生更長的推理過程，每次回答消耗的 Token 與推論算力也隨之增加。"
example: "老師要求「寫出計算過程」而不只寫答案，學生比較不會粗心算錯；思維鏈就是要模型也把過程寫出來。"
