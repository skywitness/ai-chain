term: "L10／L11"
zh: "整機與整櫃組裝"
en: "L10/L11 Rack-level Integration"
aliases:
  - "L10"
  - "L11"
  - "L12"
  - "整機組裝"
  - "整櫃組裝"
  - "機櫃整合"
  - "Rack Integration"
category: hardware
level: 3
short: "伺服器製造的整合層級：L10 是組好、測好、可開機的整台伺服器，L11 是連同網路與線材組裝測試完成的整個機櫃。"
definition: "伺服器產業常用 L1 到 L12 描述代工廠的整合深度：L1 至 L5 是零件、機殼與套件，L6 是把主機板裝進機殼並通電測試的「準系統」，L7 至 L9 依序加裝擴充卡、儲存裝置、CPU 與記憶體，L10 是全部元件組裝完成、通過整機測試並安裝好作業系統、可直接使用的整台伺服器，L11 則把多台伺服器、交換器、線材與電源裝進機櫃，以整櫃為單位測試出貨，L12 再進一步做到多櫃叢集與軟體驗證。各廠對層級的定義略有出入。AI 時代的重點落在 L10 與 L11：NVL72 這類整櫃系統內有大量銅纜與液冷管路，在工廠先整合測試，比在機房現場組裝更快、風險更低。整合層級越高，代工廠承擔的工程與測試工作越多，附加價值也越高；台灣的鴻海、廣達、緯創等 ODM 都積極投入整櫃組裝。"
example: "買廚具時，L6 像拿到骨架已組好、但還沒裝抽屜與門板的櫥櫃；L10 是整件組好、可以直接用的櫥櫃；L11 則是整間廚房的櫥櫃、電器與管線都在工廠裝好，運到現場直接接水接電。"
