term: "先進封裝"
zh: "先進封裝"
en: "Advanced Packaging"
aliases:
  - "先進封裝技術"
  - "高階封裝"
  - "異質整合封裝"
  - "Advanced Packaging"
  - "Heterogeneous Integration"
category: "packaging"
level: 1
short: "用極密的連線把多顆晶粒放進同一個封裝，讓它們像一顆大晶片般高速協作的技術總稱。"
definition: "傳統封裝只是把一顆晶粒包起來接到電路板；先進封裝則借用晶圓級製程，以矽中介層、重布線層、矽穿孔或混合鍵合，把運算晶粒、HBM 記憶體與 I/O 晶粒用極短、極密的線路連在一起，依結構常分為 2.5D（並排）與 3D（堆疊）。它成為 AI 產業鏈焦點，是因為單一晶粒面積受光罩尺寸限制，AI 加速器必須靠封裝「拼」出更大的系統，並讓記憶體盡量貼近運算單元。台積電（TSMC）的 3DFabric 平台涵蓋 CoWoS、InFO 與 SoIC；該公司 2026 年 4 月表示已在生產 5.5 倍光罩尺寸的 CoWoS，並規劃 2028 年量產可整合約 10 顆大型運算晶粒與 20 組 HBM 的 14 倍光罩版本。"
example: "以前是一個人（一顆大晶片）包辦所有工作；先進封裝像把幾位專家安排在同一間辦公室緊鄰而坐，溝通幾乎零距離，合力完成更大的任務。"
