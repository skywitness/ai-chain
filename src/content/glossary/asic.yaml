term: "ASIC"
zh: "特殊應用積體電路"
en: "Application-Specific Integrated Circuit"
aliases:
  - "特殊應用積體電路"
  - "客製化晶片"
  - "專用晶片"
  - "Custom ASIC"
  - "Application-Specific Integrated Circuit"
category: hardware
level: 1
short: "為特定用途量身打造的晶片，效率高但彈性低；Google TPU、AWS Trainium 都屬於 AI ASIC。"
definition: "ASIC 是只為一種或少數用途設計的晶片，和 CPU、GPU 這類通用晶片相對。因為電路只為目標工作而生，在同樣的製程下能做到更高的效能與每瓦效率；代價是開發門檻高，一次性工程費用（NRE）可達數百萬美元以上，用途改變時也無法修改電路，所以只有出貨量夠大的公司才值得投入。在 AI 領域，雲端業者自研的加速器多屬 ASIC。例如 Google 第一代 TPU 自 2015 年起部署於資料中心，論文指出它執行推論的速度平均約為同期 GPU、CPU 的 15 至 30 倍。這類晶片通常由博通、邁威爾（Marvell）或世芯、創意等設計服務公司協助實作，再交由台積電生產。"
example: "通用晶片像現成的西裝，誰都能穿；ASIC 像依身形量身訂做的禮服，穿起來最合身，但做一套要花大錢，身形一變就得重做。"
