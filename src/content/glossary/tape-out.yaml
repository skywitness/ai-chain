term: "Tape-out"
zh: "設計定案"
en: "Tape-out"
aliases:
  - "設計定案"
  - "Tapeout"
  - "投片"
  - "下線"
  - "流片"
category: "semiconductor"
level: 2
short: "晶片設計完成、把最終布局資料交給晶圓廠製作光罩的里程碑，之後才開始真正製造。"
definition: "Tape-out（設計定案）是晶片設計流程的終點、製造流程的起點：設計團隊完成驗證後，把最終的布局圖形資料交給晶圓廠，用來製作光罩。這個名稱源自早年以磁帶傳送這些資料。Tape-out 之後若才發現錯誤，往往必須重做部分或全部光罩，在先進製程上代價高昂，也會拖延上市時程，因此設計團隊會在送出前進行大量模擬與驗證。對 AI 晶片公司而言，tape-out 時程是觀察新一代產品進度的重要訊號；部分 IP 授權方案也以 tape-out 作為收費節點，例如安謀（Arm）的 Flexible Access 方案就在客戶 tape-out 時才收取授權費。"
example: "Tape-out 像出版前把最終稿送印：一旦開機印刷，發現錯字就得重新製版，成本與時間都很可觀。"
