term: "資料中心"
zh: "資料中心"
en: "Data Center"
aliases:
  - "機房"
  - "IDC"
  - "Data Centre"
  - "Datacenter"
  - "DC"
category: datacenter
level: 1
short: >-
  集中放置伺服器、儲存與網路設備，並提供電力、散熱與保全的建築，是 AI 運算實際發生的地方。
definition: >-
  資料中心是集中放置伺服器、儲存設備與網路交換器的建築或園區，同時提供穩定供電（變電站、不斷電系統、備用發電機）、散熱（空調或液冷）、網路連線與實體保全。AI 模型的訓練與推論都在資料中心裡的 GPU 伺服器上進行，它是把晶片變成「算力」的最後一哩。根據國際能源總署（IEA）的估計，2024 年全球資料中心用電約 415 TWh，約佔全球用電的 1.5%，在基準情境下，到 2030 年可能倍增至約 945 TWh（略低於全球用電的 3%）。AI 機房的單櫃用電遠高於傳統機房，帶動電力設備、液冷與電網投資，也讓「能不能取得足夠電力」成為新資料中心選址與擴建的主要限制之一。
example: >-
  可以把資料中心想成「電腦的大型倉庫」：一排排機櫃是貨架，空調與液冷管線負責降溫，變電站和不斷電系統則確保全年無休、不會停電。
