term: "晶圓級晶片"
zh: "晶圓級晶片"
en: "Wafer-Scale Engine"
aliases:
  - "晶圓級引擎"
  - "晶圓級處理器"
  - "WSE"
  - "WSE-3"
  - "Cerebras WSE"
  - "Wafer-Scale Engine"
category: hardware
level: 3
short: "Cerebras 把一整片晶圓做成單一顆晶片，內含 90 萬個 AI 核心與大量 SRAM，主打高速訓練與推論。"
definition: "一般晶片是從一片晶圓上切出許多晶粒，而且單顆晶粒的面積受限於微影設備的光罩尺寸。Cerebras 反其道而行，把整片晶圓上的電路連成單一顆處理器，並以架構設計關閉有瑕疵的區塊、繞道而行來維持良率。2024 年 3 月發表的第三代 WSE-3 以台積電 5 奈米製程製造，面積 46,225 平方毫米，含 4 兆個電晶體、90 萬個 AI 核心與 44 GB 晶片內 SRAM，峰值 AI 算力 125 PFLOPS；官網（2026 年 10 月）主推的 WSE-3 Turbo 峰值達 250 PFLOPS，機櫃級的 CS-4 系統內含 3 顆。由於模型權重與運算都留在同一片矽上，資料不必在晶片之間往返，特別適合需要高速產生 Token 的推論。挑戰在於封裝、供電與散熱都需要特殊設計，供應鏈與一般 GPU 伺服器差異很大。"
example: "一般做法像把一大張披薩切成許多小片分給不同人，大家再互相傳話協調；Cerebras 則是整張披薩不切，讓所有配料留在同一張餅上，溝通最快，但要烤出一整張完美的大披薩，難度也高得多。"
