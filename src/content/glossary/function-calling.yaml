term: "Function Calling"
zh: "函式呼叫"
en: "Function Calling (Tool Use)"
aliases:
  - "函式呼叫"
  - "Function Calling"
  - "Tool Use"
  - "工具使用"
  - "Tool Calling"
  - "工具呼叫"
category: llm
level: 2
short: "讓模型依開發者提供的函式說明，輸出結構化的呼叫參數，再由程式實際執行查詢或動作。"
definition: "Function Calling（又稱 Tool Use、工具呼叫）是讓語言模型與外部系統互動的基本機制：開發者以 JSON Schema 描述可用的函式（例如查天氣、查訂單、送出表單），模型判斷需要時，輸出函式名稱與參數的結構化呼叫；在常見的用戶端工具模式中，由應用程式實際執行，再把結果回傳給模型繼續作答。OpenAI、Anthropic 等主要模型 API 都提供此功能。它是 AI Agent、MCP 與電腦操作代理的底層基礎，讓模型從「只會回答」變成能查資料、操作各種系統的工作流程元件。"
example: "像餐廳點餐：顧客（模型）在點餐單上勾選品項與數量，真正下廚的是廚房（應用程式），做好後再把餐點送回桌上。"
