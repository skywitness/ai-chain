# 記憶體與儲存專題：一般型 DRAM（DDR5／LPDDR／GDDR）。格式見 src/schemas/memory.ts（memoryMarket）。
category: dram
title: "DRAM（DDR5／LPDDR／GDDR）"
asOf: "2026-10-22"
summary: "一般型 DRAM 是伺服器、手機與電腦裡的工作記憶體，規格標準化，價格隨供需大幅擺盪。2025 年下半年起，雲端業者為 AI 推論大量採購伺服器 DRAM，HBM 又吃掉愈來愈多晶圓，三大廠把產能優先給伺服器。合約價在 2025 年第二季止跌回升，第四季起急漲，2026 年第一季單季漲幅約 93–98%。TrendForce 估計 2026 年 DRAM 供給仍比需求少約 1–2%，2027 年缺口還會擴大；美光也預期 2027、2028 年產業供給持續受限。新廠多要到 2027 年下半年才開始有意義的爬坡；長鑫存儲等中國廠商的擴產速度，以及雲端業者能否維持高額資本支出，是觀察供需何時轉向的兩大變數。"
keyPoints:
  - "2026 年第二季全球 DRAM 產業營收 1,547.3 億美元、季增 59.5%（含 HBM）：三星 39.4%、SK海力士 24.9%、美光 23.3%、長鑫存儲 9.5%。"
  - "一般型 DRAM 合約價在 2024 年底到 2025 年初曾下跌，2025 年第四季起急漲，2026 年第一季季增約 93–98%，第四季預估放緩到 10–15%。"
  - "HBM 排擠一般型 DRAM：TrendForce 估 2026 年底 HBM 佔三大廠 DRAM 投片約 22%，卻只貢獻約 9% 位元；2027 年底投片比重升至約 30%。"
  - "TrendForce 估 2026 年 DRAM 供給充足率約 -1% 至 -2%，2027 年缺口擴大；美光預期 2027、2028 年產業位元出貨年增約 20% 出頭，仍供不應求。"
  - "新產能多在 2027 年起才開出：美光愛達荷 ID1 與台灣銅鑼 2027 年年中、SK海力士龍仁一期無塵室 2027 年 2 月、三星平澤 P5 第一座 2028 年。"
  - "Citrini Research 估長鑫存儲 2026 年底月產能約 35 萬片，逼近美光的 37.5 萬片；業界估計 2028 年第四季可達 50–60 萬片。"
  - "高價開始壓抑消費端：TrendForce 預估 2026 年全球手機生產年減 14%、筆電出貨年減 9.4%，輝達也因 LPDRAM 不足把 Vera Rubin 的 SOCAMM 容量減半。"
