technology:
  - { name: "1c（第六代 10 奈米級）DRAM", detail: "SK海力士一般型 DRAM 在 2025 年進入 1c 全面量產，2026 年加速轉進 1c，並把 AI 記憶體產品線擴大到 SOCAMM2、GDDR7 等", status: volume, timing: "2025–2026", src: skh-fy25 }
  - { name: "美光 1γ（1-gamma）DRAM 製程產品", detail: "美光已完成多家客戶對 1γ 製程 8,800 MT/s 伺服器 RDIMM 的驗證，並出貨 6 通道 1γ LPDDR5X、向多個實體 AI 市場送樣 1γ LPDDR6", status: volume, timing: "2026", src: mu-fq4-26 }
  - { name: "美光下一代 DRAM 製程節點", detail: "1γ 已是美光最大的量產節點；下一代 DRAM 節點開發順利，預計 2027 年下半年開始量產", status: roadmap, timing: "2027 下半年", src: mu-remarks-fq4-26 }
  - { name: "High-NA EUV 導入 DRAM 量產", detail: "三星與 ASML 擴大合作，計畫 2028 年前在 DRAM 量產導入 High-NA EUV，以提升解析度、簡化製程，延伸微縮路線圖", status: roadmap, timing: "2028 年前", src: ss-asml }
  - { name: "長鑫第五代製程技術平台", detail: "2026 年 9 月 20 日宣布量產並展出大容量 LPDDR5X；公司提醒良率爬坡需要時間，相關產品尚未形成規模銷售", status: ramping, timing: "2026-09", src: cxmt-5th-gen }
  - { name: "SOCAMM2 伺服器 LPDRAM 模組", detail: "以 LPDDR5X 組成、可插拔的伺服器記憶體模組；SK海力士以 1c 製程生產的 192GB SOCAMM2 於 2026 年 4 月量產，同時全面放量 1c LPDDR6", status: volume, timing: "2026", src: skh-q1-26 }
  - { name: "SOCAMM2 標準（JESD328）", detail: "JEDEC 2025 年 10 月表示標準接近完成，支援 LPDDR5X 最高每腳位 9.6 Gb/s，並加入 SPD 模組識別與遙測", status: volume, timing: "2025–2026", src: jedec-socamm2 }
  - { name: "LPDDR6（JESD209-6）", detail: "JEDEC 2025 年 7 月發布；每顆晶粒 2 個子通道、每子通道 12 條資料線，電壓更低並支援動態電壓頻率調整，目標行動裝置與 AI 應用", status: ramping, timing: "2025–2026", src: jedec-lpddr6 }
  - { name: "DDR5 MRDIMM 第二代", detail: "多工排（multiplexed rank）伺服器模組；JEDEC 2026 年 4 月表示第二代模組標準接近完成，第二代模組設計目標 12,800 MT/s", status: roadmap, timing: "2026–2027", src: jedec-mrdimm }
  - { name: "GDDR7（JESD239）", detail: "JEDEC 2024 年 3 月發布，首個採 PAM3 訊號的 JEDEC DRAM 標準，單顆頻寬最高 192 GB/s、容量 16–32Gb", status: volume, timing: "2024 起", src: jedec-gddr7 }
  - { name: "512GB DDR5 RDIMM", detail: "美光送樣業界首款 512GB 高容量 DDR5 RDIMM，速度最高 9,200 MT/s，因應 AI 伺服器 CPU 端記憶體需求", status: sampling, timing: "2026", src: mu-fq4-26 }
