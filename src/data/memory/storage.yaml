technology:
  - name: HAMR 熱輔助磁記錄（希捷 Mozaic 3+）
    detail: 寫入時用雷射瞬間加熱碟片的極小區域，讓更小的磁區也能穩定記錄。Mozaic 3+（每碟 3TB 以上）已通過所有主要雲端客戶認證並在正式環境運作，HAMR 機種約占希捷近線出貨容量四成
    status: volume
    timing: "2026"
    src: stx-call-q4fy26
  - name: 希捷 Mozaic 4+（單機最高 44TB）
    detail: 第二代 HAMR 平台（每碟約 4TB），正對全球兩大雲端業者爬坡，其他客戶認證中；公司目標 2026 年底 HAMR 出貨容量有一半來自 Mozaic 4
    status: ramping
    timing: "2026–2027"
    src: stx-call-q4fy26
  - name: 希捷 Mozaic 5+（每碟 5TB 以上）
    detail: 下一代 HAMR 平台，公司預定 2027 年底開始送出認證樣品
    status: roadmap
    timing: "2027 年底送認證樣品"
    src: stx-sup-q4fy26
  - name: 威騰 40TB ePMR 與 UltraSMR
    detail: ePMR 在寫入時給磁頭額外能量、UltraSMR 讓磁軌像屋瓦一樣部分重疊；40TB ePMR 機種 2026 年第二季開始出貨，預計 2027 年占近線出貨容量逾五成，44TB HAMR 機種預計 2027 年上半年出貨
    status: ramping
    timing: "2026–2027"
    src: guru-wd-q4fy26
  - name: 威騰 HAMR 與 100TB 路線
    detail: HAMR 硬碟在兩家超大規模客戶認證中，預計 2027 年量產爬坡、2029 年做到 100TB；ePMR 則借用 HAMR 技術延伸到 60TB
    status: sampling
    timing: "2027 爬坡、2029 年 100TB"
    src: wd-innovation-day
  - name: High Bandwidth Drive 與 Dual Pivot
    detail: 容量變大後每 TB 分到的讀寫速度會下降。High Bandwidth Drive 讓多個磁頭同時讀寫，頻寬最高為傳統硬碟 2 倍，已交客戶驗證；加裝第二組獨立致動臂的 Dual Pivot 預計 2028 年推出，兩者合計目標把循序 IO 提高到 4 倍
    status: sampling
    timing: "2026–2028"
    src: wd-innovation-day
  - name: 東芝 65TB 級 HDD
    detail: 據日經報導，東芝新產品單機容量最多提高 40%，目標 2030 年量產 65TB 級硬碟，之後再推 100TB 級
    status: roadmap
    timing: "2030"
    src: tf-toshiba-nikkei
  - name: 高容量 QLC 企業級 SSD
    detail: 每個儲存單元存 4 位元，單顆容量遠超硬碟，例如鎧俠 LC9 系列最大 245.76TB；主要劣勢是每 TB 成本仍明顯高於 HDD
    status: volume
    timing: "2026"
    src: kx-lc9
  - name: KV Cache 分層儲存
    detail: 推論時保存上下文的 KV Cache 會隨使用者數與對話長度膨脹；希捷與 SK海力士的白皮書主張把 KV Cache 分散到記憶體、SSD 與 HDD 各層，保留更多上下文、避免重算，因此也帶動硬碟需求
    status: ramping
    timing: "2026"
    src: stx-call-q4fy26
  - name: KV Cache 專用 SSD
    detail: 美光 7600 PCIe Gen5 與 9650 PCIe Gen6 SSD 已出貨給主要客戶用於 KV Cache，6600 ION SSD 在 FY2026 第四季大量爬坡
    status: volume
    timing: "2026"
    src: micron-fq4-26
  - name: WEKA Augmented Memory Grid
    detail: 以軟體把 GPU 可用記憶體延伸到 NVMe 儲存，讓推論時已算過的 Token 不必重算；2025 年 11 月正式商用，公司稱首個 Token 延遲最多縮短 20 倍
    status: volume
    timing: "2025-11 起"
    src: weka-amg
  - name: HBF 高頻寬快閃記憶體（第一代）
    detail: 把 16 顆 NAND 晶粒像 HBM 一樣堆疊、放在運算晶片旁；第一代單堆疊 512GB、讀取頻寬 1.6TB/s，外形、功耗與高度接近 HBM4，公司稱容量是 HBM 的 8–16 倍、成本相近；第二、三代目標頻寬逾 2TB/s 與 3.2TB/s、容量 1TB 與 1.5TB
    status: roadmap
    timing: "2026–2027"
    src: sndk-hbf-factsheet
  - name: HBF 合作與時程（Sandisk、SK海力士）
    detail: 2025 年 8 月簽署合作備忘錄推動標準化；Sandisk 當時的目標是 2026 年下半年送出首批 HBF 記憶體樣品，並預期 2027 年初會有首批搭載 HBF 的 AI 推論裝置樣品
    status: roadmap
    timing: "2026 下半年送樣、2027 年初裝置"
    src: sndk-hbf-mou
  - name: HBF 第一版 OCP 技術規格
    detail: Sandisk 與 SK海力士在 OCP（開放運算計畫）發布 HBF 第一版技術規格，Google 與 Tenstorrent 也加入推動
    status: roadmap
    timing: "2026-08"
    src: sndk-hbf-spec
  - name: Astera Labs Leo CXL 記憶體控制器
    detail: 透過 CXL 介面替伺服器外接 DRAM、擴充記憶體容量；第一代每顆控制器最多 2TB，已用於 Microsoft Azure M 系列虛擬機。2026 年 9 月發表 Leo X（接在 Scorpio 交換網路上，作為 KV Cache 記憶體層）與 Leo 2（CXL 3.2、PCIe 6），已向雲端客戶送樣
    status: sampling
    timing: "2026-09 發表"
    src: alab-leo-2026
  - name: 三星 CMM-D（CXL 記憶體模組）
    detail: 三星持續生產 CXL 2.0 的 CMM-D 2.0；CXL 3.1 的 CMM-D 3.0 原訂 2026 年 6 月送樣，因英特爾與超微支援 CXL 3.1 的處理器延後而延期，報導指商用推遲到 2027 年
    status: roadmap
    timing: "2027（延後）"
    src: thelec-cmmd
  - name: 瀾起 CXL 記憶體擴充控制晶片（MXC）
    detail: 用於記憶體擴充與池化的 CXL Type 3 控制晶片；2025 年 1 月列入 CXL 2.0 整合商清單，三星與 SK海力士的受測產品都採用，符合 CXL 3.1 的新款 2025 年 9 月推出並向主要客戶送樣
    status: sampling
    timing: "2025–2026"
    src: montage-ar25
  - name: SOCAMM 伺服器 LPDRAM 模組
    detail: 以低功耗 LPDDR 晶片組成、可插拔的伺服器記憶體模組，用來擴充 AI 伺服器 CPU 端的記憶體；美光伺服器 SOCAMM 營收在 FY2026 第四季（2026 年 6–8 月）季增一倍以上
    status: volume
    timing: "2026"
    src: micron-fq4-26
