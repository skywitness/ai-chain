category: storage
title: HDD、儲存系統與新興記憶體
asOf: "2026-10-22"
summary: AI 的訓練資料、模型檢查點與推論產生的內容，大多存放在每 TB 成本最低的近線硬碟（nearline HDD）裡：記憶體與 SSD 負責「快」，硬碟負責「多」。硬碟只剩威騰電子（WD）、希捷（Seagate）與東芝（Toshiba）三家，過去幾年幾乎沒有擴產，AI 需求一來就出現缺貨：2025 年 9 月近線硬碟交期拉長到 52 週以上，希捷表示近線產能大多已分配到 2028 年。廠商不靠多蓋工廠，而是用 HAMR、ePMR 等技術把每片碟片做得更大，希捷預期近線出貨容量每年增加約 25%。介於 HBM 與 SSD 之間的新型記憶體，例如 HBF、CXL 記憶體擴充與 SOCAMM，多數仍在送樣或制定標準的階段。
keyPoints:
  - 近線硬碟仍承擔大型資料中心絕大多數的容量：希捷 2026 年第二季出貨 218 EB，其中約九成進入資料中心。
  - 硬碟只剩三家：TrendForce 預估 2026 年威騰約 48%、希捷約 42%、東芝約 10%；唯一獨立磁頭供應商 TDK 的磁頭事業據報正被競購。
  - 供給靠「每碟更大」而非「多做硬碟」：希捷 FY2026 硬碟台數持平，碟片與磁頭用量增加 15%–20%，HAMR 已占近線出貨容量約四成。
  - 缺貨延續：2025 年 9 月近線硬碟交期拉長到 52 週以上；希捷近線產能大多已分配到 2028 年，威騰與客戶洽談的長約延伸到 2029–2031 年。
  - 價格回升：本站以希捷財報換算，資料中心每 TB 營收一年內約增 11%；威騰稱 2026 年第二季每 TB 混合售價年增近兩成。
  - 擴產集中在零組件與新技術：東芝菲律賓新產線 2026 年 10 月首批出貨，目標 FY2027 年產能接近 FY2025 的兩倍；豪雅決定在越南新建硬碟玻璃基板廠。
  - 新興記憶體仍在早期：HBF 第一代單堆疊 512GB、讀取頻寬 1.6TB/s；三星 CXL 3.1 記憶體模組延到 2027 年，先以 CXL 2.0 產品供貨。
  - SSD 與 HDD 互補：QLC SSD 單顆已達 245.76TB、耗電較低，但成本仍明顯高於硬碟（WD 稱快閃記憶體成本是硬碟的 6–10 倍，日經報導 SSD 價格約為 20 倍）。
