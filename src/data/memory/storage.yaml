editorial:
  status: fact-checked
  author: mem-storage
  checkedBy: mem-storage-check
  checkedOn: "2026-10-22"
  notes: 查核：希捷 10-K（FY2024–FY2026）、Q4FY26 補充財務資料與法說會逐字稿、威騰 10-K 與財報新聞稿、Trendfocus 摘要、TrendForce、Coughlin、豪雅簡報、東芝新聞稿、Sandisk、美光、戴爾、VAST、WEKA、Astera Labs、TheElec 與 Yole 等來源已逐項核對，市占加總與換算值（EB 市占、需求結構、每 TB 營收）均已重算無誤。修正：日經「SSD 約為 HDD 的 20 倍」刪除未見於原文的「NAND 漲價後」，並改標為價格倍數；Coughlin 1,654 EB 改標為 HDD 容量需求；2024 H2「平衡」與 2027、2028「吃緊」標為本站判斷；豪雅玻璃基板營收成長由產能表移到需求表，擴產產品刪除原文未提的「3.5 吋」；東芝擴產改述為「接近兩倍」並註明首批出貨出自東芝新聞稿；威騰組裝地點補上美國。威騰季度出貨 EB、每 TB 價格與成本、UltraSMR 目標仍只有法說會摘要（次要來源）可用。NetApp、HPE、Everpure、鎧俠 LC9 與瀾起的數字沿用本站已查核資料，存取日保留原值。
