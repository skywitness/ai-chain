# 記憶體與儲存專題：NAND Flash 與企業級 SSD。格式見 src/schemas/memory.ts（memoryMarket）。
category: nand
title: "NAND Flash 與企業級 SSD"
asOf: "2026-10-22"
summary: "NAND Flash 是斷電後資料仍會保留的記憶體，做成 SSD 後就是手機、電腦與資料中心存放資料的「倉庫」。2023 年供過於求、原廠大幅減產，2024 年底到 2025 年初價格再度下跌；2025 年下半年起，AI 推論需要大量高容量企業級 SSD，近線硬碟又嚴重缺貨，訂單轉向 QLC SSD，合約價從 2025 年第四季起連續大漲。TrendForce 估計 2026 年 NAND 產值約 2,706 億美元、約為 2025 年的 3.8 倍，全年供給仍比需求少約 4–5%。原廠把資本支出優先給 DRAM 與 HBM，2026 年幾乎只靠製程轉換（堆疊更多層數）擴充位元，日、韓、美原廠的大型新廠多在 2028 年前後才開出；2027 年的供需看法出現分歧，TrendForce 預期下半年轉向寬鬆，美光則認為 2027、2028 年仍供不應求。"
keyPoints:
  - "TrendForce 估全球 NAND 產值 2025 年 711 億美元，2026 年暴增至 2,706 億美元（年增 280.7%），2027 年預估 3,794 億美元。"
  - "2026 年第二季前五大 NAND 品牌營收 688.7 億美元、季增 77%：三星 29.3%、SK海力士集團 18.2%、美光 15.1%、鎧俠 13.6%、晟碟 11.4%。"
  - "企業級 SSD 成為最大應用：Counterpoint 統計 2026 年第二季佔 NAND 位元出貨 48%（一年前 26%），TrendForce 預估 2027 年伺服器佔位元需求 51.1%。"
  - "NAND 合約價 2024 年第四季到 2025 年第一季下跌，2025 年第四季起急漲，2026 年第一季約季增 85–90%，第四季預估放緩到 15–20%。"
  - "2023 至 2025 年原廠多次減產，2026 年幾乎沒有新產能、只靠製程轉換增加位元，TrendForce 估 2026 年供給缺口約 4–5%。"
  - "2027 年看法分歧：TrendForce 預期 2027 下半年供需轉為寬鬆；美光預估 2027、2028 年產業位元出貨年增約 25%，仍供不應求。"
  - "日韓美大型新廠集中在 2028 年後：美光新加坡新廠 2028 下半年開始產出晶圓、SK海力士清州 M17 首座無塵室 2028 年 12 月、鎧俠北上 Fab3 目標 2029 財年。"
  - "長江存儲量產 267 層產品，Counterpoint 統計 2026 年第二季位元出貨市占 14%；據 Reuters 報導，武漢第三廠 2027 年月產能約 5 萬片。"
