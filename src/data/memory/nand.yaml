editorial: { status: fact-checked, author: mem-nand, checkedBy: "mem-nand-check", checkedOn: "2026-10-22", notes: "價格與市占以 TrendForce 公開新聞稿附表為主（附表為圖片，已逐一判讀）；位元供需成長率以美光、SK海力士法說為主。TrendForce 與美光對 2027 年供需看法分歧，balance 兩者並列。查核：逐一比對 TrendForce 產值圖、各季價格表（2024 Q1–2026 Q4）、營收排名與企業級 SSD 排名表、應用別與 QLC 比重圖、鎧俠／威騰稼動率表與 Counterpoint 市占圖；核對美光 FY2025 Q4 與 FY2026 Q4 法說稿、晟碟 FY2026 10-K 附註、鎧俠與 SK海力士新聞稿、美光新加坡新聞稿、慧榮 6-K 及各次要來源。修正：美光 FY2026 Q4 期間標示、大連二廠改依 8 月較新報導（廠房完工、最快 11 月裝機、約 5 萬片）並與 fabs.yaml 一致、長存控股 IPO 為遞件而非已受理、平澤 P5 移除未證實的量產年份並補上整體時程、10.9% 供給成長的成因措辭、2025 年排名表「只列上市公司」的誤植、晶圓價格與新廠時程描述。" }
