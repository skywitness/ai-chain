  - { name: "第 10 代 QLC（332 層）", detail: "鎧俠與晟碟的第 10 代 QLC 位元密度逾 37 Gb/mm²、比第 8 代高約 60%，是業界首款達 4.8 Gb/s 介面的 QLC，鎖定 AI 與雲端的高容量儲存", status: research, timing: "2026 年 8 月發表", src: kx-qlc10 }
  - { name: "332 層與 400 層以上的取捨", detail: "鎧俠認為 400 層以上耗電增加、可靠度面臨挑戰，332 層每 GB 成本約低 10%（EE Times Japan 報導）；日經報導 BiCS10 預計 2027 年量產", status: roadmap, timing: "2027", src: tfn-bics10 }
  - { name: "三星 V10 BV-NAND（400 層以上）", detail: "採晶圓接合與三段堆疊，2026 年 8 月 FMS 發表，記憶體密度比 V9 高約 58%；韓媒報導已量產並供應輝達，三星同時開發 500 層的 V11，量產狀況尚未經三星正式公布", status: sampling, timing: "2026", src: tfn-v10 }
  - { name: "SK海力士 375 層 NAND", detail: "據 The Elec 報導，原規劃 400 層等級、因製造複雜度下修為 375 層，已完成驗證，部分字元線由鎢改為電阻較低的鉬；長期路線圖延伸到 480、604 層", status: roadmap, timing: "據報導 2026 年底量產", src: tfn-sk-roadmap }
  - { name: "美光 G9 與下一代 NAND 節點", detail: "G9 是美光目前產量最大的 NAND 節點，預計成為公司史上量最大的節點；下一代 NAND 節點開發順利", status: volume, timing: "下一代節點 2027 下半年量產", src: mu-remarks-fq4-26 }
  - { name: "長江存儲 Xtacking（267 層）", detail: "以 Xtacking 架構量產 267 層 3D NAND，並推進 300 層以上技術；2026 年下半年計畫把產品組合轉向企業級 SSD", status: volume, timing: "2026", src: cp-nand-2q26 }
  - { name: "245TB 等級 QLC 企業級 SSD", detail: "鎧俠 LC9 以 32 顆 2Tb QLC 晶粒堆疊、單一封裝 8TB，做到 245.76 TB，可取代多顆高耗電硬碟；另有 122.88 TB 版本", status: sampling, timing: "2025 年 7 月送樣", src: kx-lc9 }
  - { name: "群聯 Pascari D206V（245.76 TB）", detail: "群聯推出單碟 245.76 TB 的 U.2 PCIe Gen5 資料中心 SSD，2026 年獲 COMPUTEX Best Choice 金質獎，訴求以更高容量密度降低機櫃空間與耗電", status: sampling, timing: "2026 年 5 月獲 COMPUTEX 金質獎", src: phison-d206v }
  - { name: "PCIe 6.0 企業級 SSD", detail: "鎧俠 CM10 是其首款 PCIe 6.0 企業級 SSD，採第 10 代 TLC，支援 NVIDIA CMX 架構與冷板液冷，循序讀取效能比前代提高約 92%，用於 AI 推論與脈絡快取", status: sampling, timing: "2026 年 7 月發表", src: kx-cm10 }
  - { name: "NAND 控制晶片（慧榮 MonTitan）", detail: "慧榮科技以 6 奈米 PCIe 5.0 邊緣 SSD 控制晶片與 MonTitan 企業級／AI SSD PCIe 5.0 控制晶片切入資料中心，PCIe 6.0 版本開發中；公司預期 2026 年營收年增逾 100%", status: ramping, timing: "PCIe 6.0 開發中", src: simo-q2-26 }
  - { name: "HBF 與儲存級記憶體", detail: "TrendForce 指出 NAND 廠以 HBF（高頻寬快閃記憶體）切入 AI 訓練：晟碟主導結合 HBM 與 HBF 的混合設計，三星與鎧俠則推 XL-Flash、Z-NAND 等儲存級記憶體，作為 HBM 之外較便宜的選擇", status: research, timing: "2025 年起", src: tf-hbf }
