technology:
  - name: JEDEC HBM4 標準
    detail: 介面由 1,024 位元加寬到 2,048 位元，每腳位 8 Gb/s 時每疊頻寬可達 2 TB/s；支援 4 到 16 層堆疊，單疊最大 64GB。
    status: volume
    timing: 2025-04 發布
    src: jedec-hbm4
  - name: 三星 HBM4（1c DRAM＋4 奈米基底晶粒）
    detail: 2026 年 2 月宣布業界首家量產出貨，腳位速度 11.7 Gb/s、最高可達 13 Gb/s，每疊頻寬最高 3.3 TB/s；12 層提供 24–36GB，16 層可達 48GB；預計 2027 年送出客製化 HBM 樣品。
    status: volume
    timing: 2026-02 量產
    src: ss-hbm4
  - name: 美光 HBM4 12 層 36GB 與 16 層 48GB
    detail: 2026 年第一季開始為輝達 Vera Rubin 量產出貨 12 層 36GB，腳位速度逾 11 Gb/s、每疊頻寬逾 2.8 TB/s；已送出 16 層 48GB 樣品，每個 HBM 位置容量多 33%。
    status: volume
    timing: 2026 Q1 量產
    src: mu-hbm4
  - name: SK海力士 HBM4 大量出貨
    detail: 2026 年第二季開始大量出貨 HBM4、下半年擴大量產，公司表示已達客戶要求的速度，並具功耗與成本競爭力。
    status: volume
    timing: 2026 Q2
    src: skh-q2-26
  - name: 三星 HBM4E 12 層 48GB
    detail: 三星 2026 年 5 月送樣，穩定腳位速度 14 Gb/s、最高 16 Gb/s，每疊頻寬最高 3.6 TB/s，並規劃 8 層 32GB 與 16 層 64GB 版本。
    status: sampling
    timing: 2026-05 送樣，量產配合客戶時程
    src: ss-hbm4e
  - name: SK海力士 HBM4E 與 Advanced MR-MUF
    detail: 2026 年 6 月送樣 12 層 HBM4E，腳位速度最高 16 Gb/s、功耗效率提升逾 20%；以 Advanced MR-MUF 堆疊做到 48GB，熱阻降低 17%。
    status: sampling
    timing: 2026-06 送樣
    src: skh-hbm4e
  - name: 邏輯製程基底晶粒
    detail: HBM3E 以前的基底晶粒由記憶體廠自製；SK海力士自 HBM4 起改用台積電邏輯製程，並與 CoWoS 封裝整合，讓基底晶粒能放入更多功能。
    status: volume
    timing: 2026 起
    src: skh-tsmc
  - name: 客製化 HBM（輝達 NV HBM）
    detail: 美光與輝達合作逾一年共同設計客製化 HBM4E，管理層稱是市場上第一個主要的客製化 HBM 產品；HBM4E 的客製版與標準版都改用晶圓代工製程的基底晶粒。
    status: roadmap
    timing: "2027"
    src: mu-q4-26-call
  - name: 8 層與 12 層的取捨
    detail: 因 HBM 供給吃緊、系統成本上升，GPU 與 ASIC 廠 2027 年優先評估 8 層配置；但每疊都需一顆基底晶粒，TrendForce 預估 8 層每 Gb 價格比 12 層高 10–20%。
    status: roadmap
    timing: "2027"
    src: tf-hbm-2027
  - name: 混合鍵合（Hybrid bonding）
    detail: 以銅對銅直接接合晶粒、取代微凸塊，可降低堆疊高度，是更高層數 HBM 的候選技術；TrendForce 指出 2026 年記憶體投資重點轉向製程升級、更高層堆疊與混合鍵合。
    status: research
    timing: 2026 起研發投資
    src: tf-capex-2026
  - name: 長鑫存儲的國產 HBM
    detail: 據韓國媒體報導，長鑫 2025 年向華為送出 HBM3 樣品；韓國業界認為長鑫最快 2027 年才能全面量產 HBM3E，HBM 技術仍落後三星與 SK海力士數個世代。IPO 募資用途包括 HBM 研發與上海新廠。
    status: sampling
    timing: HBM3E 全面量產最快 2027
    src: fnnews-cxmt
  - name: 輝達 Rubin Ultra 與 Feynman 的 HBM 藍圖
    detail: Rubin Ultra 每個封裝含 4 顆運算晶粒、搭載 1TB HBM4E；之後的 Feynman 世代規劃採用晶粒堆疊與客製化 HBM。
    status: roadmap
    timing: 2027–2028
    src: th-nv-roadmap
