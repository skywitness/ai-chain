category: hbm
title: HBM 高頻寬記憶體
asOf: "2026-10-22"
summary: HBM（高頻寬記憶體）是把多層 DRAM 晶粒垂直堆疊、緊貼在 GPU 或 AI 晶片旁的記憶體，決定 AI 加速器一次能搬多少資料。它很耗晶圓：生產同樣的位元，大約要用一般 DDR5 的 3 倍晶圓，所以 HBM 擴產會直接排擠一般 DRAM。美光（Micron）與 SK海力士（SK hynix）在 2025 年底前就談定 2026 年的 HBM 供貨；TrendForce 預估 2027 年 HBM 位元出貨年增 50–60% 仍追不上需求，綜合均價將年增 121%。市占方面，SK海力士仍居第一，但三星（Samsung）的營收市占已從 2025 年第二季的 15% 升到 2026 年第二季的 33%（Counterpoint），HBM4 出貨可望再推升；三家的新廠與封裝廠多要到 2027–2029 年才陸續開出產能。
keyPoints:
  - 生產同樣位元的 HBM 約需 DDR5 的 3 倍晶圓（美光），世代越新倍數越高，擴產 HBM 會直接排擠一般 DRAM。
  - TrendForce 估計 HBM 佔三大廠 DRAM 投片比重將從 2025 年底的 18% 升到 2027 年底的 30%，位元卻只佔 8% 到 13%。
  - 美光 2026 年 HBM 量價已全數談定；TrendForce 預估 2027 年 HBM 位元出貨年增 50–60%，仍不足以滿足需求。
  - HBM 採年度議價，2026 年漲幅落後一般 DRAM；2027 年補漲，TrendForce 預估綜合均價年增 121%。
  - Counterpoint 統計 2026 年第二季 HBM 營收市占：SK海力士 50%（一年前 64%）、三星 33%、美光 18%。
  - 每顆 AI 晶片的 HBM 越裝越多：H100 為 80GB，Vera Rubin 為 288GB，AMD MI455X 達 432GB。
  - SK海力士 M15X 已在 2026 年投產；其餘新產能多在 2027–2029 年開出：SK海力士 P&T7、龍仁與印第安納，三星平澤 P5 與溫陽，美光新加坡、銅鑼、廣島與愛達荷。
  - SK海力士與三星的 HBM4 基底晶粒改用邏輯製程，美光則從 HBM4E 起改用晶圓代工製程；美光與輝達共同設計的 HBM4E，被美光稱為第一個主要的客製化 HBM 產品。
