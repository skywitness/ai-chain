  notes: 產能（千片/月）皆為韓媒引述的業界估計；Counterpoint 與 IDC 的 2026 Q1 市占定義不同，數字略有差異。2024 年 HBM 市場規模查無可公開核對的數字，故未列。查核（2026-10-22）：數字逐筆對照來源；美光 SCA 改為官方講稿的營收口徑，新加坡、廣島、ID1 時程改依美光 2026-09 講稿，溫陽改依牙山市協議時程，2028 年供需改為短缺（美光稱 2027–2028 年比 2026 年更吃緊）。
