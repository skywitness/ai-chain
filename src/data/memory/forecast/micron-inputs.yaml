events:
  - { date: "2018-02-05", title: "上修 FY2018 第二季財測", detail: "非 GAAP 營收財測由 68–72 億美元上修為 72.0–73.5 億美元，EPS 由 2.51–2.65 美元上修為 2.70–2.75 美元（以 12.41 億股計）。", src: "upd-fy2018q2" }
  - { date: "2018-05-21", title: "上修 FY2018 第三季財測", detail: "非 GAAP 營收財測由 72–76 億美元上修為 77–78 億美元，EPS 由 2.76–2.90 美元上修為 3.12–3.16 美元，理由是執行良好與產業狀況健康。", src: "upd-fy2018q3" }
  - { date: "2018-12-18", title: "FY2019 資本支出下修至 90–95 億美元", detail: "需求轉弱，FY2019 資本支出由原計畫下修 12.5 億美元（中值）至 90–95 億美元，前段設備支出年減；並把 2019 曆年 DRAM 位元產出成長由約 20% 降至約 15%。", src: "rm-fy2019q1" }
  - { date: "2018-12-18", title: "1Y DRAM 開始營收出貨、96 層 NAND 出貨", detail: "1X 奈米 DRAM 出貨過半（crossover），1Y 奈米產品開始營收出貨；96 層 3D NAND 開始出貨，NAND 高價值方案占 NAND 位元過半。", src: "rm-fy2019q1" }
  - { date: "2019-03-20", title: "DRAM、NAND 各減少約 5% 投片", detail: "因客戶需求下修，閒置約 5% 的 DRAM 投片，NAND 投片也減少約 5%（主要在舊製程）；FY2019 資本支出再降至約 90 億美元。", src: "rm-fy2019q2" }
  - { date: "2019-06-25", title: "NAND 減產擴大到約 10%", detail: "NAND 投片減少幅度由約 5% 擴大到約 10%，DRAM 維持約 5% 減產，以降低下半年供給成長。", src: "rm-fy2019q3" }
  - { date: "2019-09-26", title: "FY2019 DRAM 每位元成本降幅領先；FY2020 成本降幅放緩", detail: "FY2019 DRAM 每位元成本降幅領先產業並優於內部計畫；預估 FY2020 DRAM 成本降幅放緩到高個位數（high single digits），NAND 因轉換到替換閘極（RG）架構，FY2020 成本幾乎不降。1Z DRAM 在 FY2019 第四季開始量產。", src: "rm-fy2019q4" }
  - { date: "2019-10-17", title: "IMFT 稼動率不足費用", detail: "10-K 揭露 IMFT（3D XPoint）稼動率不足使毛利每季平均減少約 1 億美元（2019 年）與 6,500 萬美元（2018 年），並預估自 FY2020 第一季起增至每季約 1.5 億美元。", src: "f-fy2019q4" }
  - { date: "2020-06-29", title: "128 層第一代替換閘極 NAND 量產", detail: "128 層第一代 RG NAND 在 FY2020 第三季進入量產並開始出貨給客戶，RG 預計在 2020 年底前占 NAND 產出的相當比重；1-alpha DRAM 預計 FY2021 導入。", src: "rm-fy2020q3" }
  - { date: "2020-09-29", title: "FY2021 成本降幅目標", detail: "預估 FY2021 DRAM 成本降幅為中個位數（mid-single-digit），同規格降幅略高；NAND 成本降幅為 10% 出頭到 15% 左右（low to mid-teens）。FY2021 資本支出約 90 億美元，只靠製程轉換、不增加投片來維持位元市占。", src: "rm-fy2020q4" }
  - { date: "2021-01-07", title: "176 層 NAND 量產", detail: "2020 年 11 月初開始量產第二代替換閘極 176 層 NAND；1-alpha DRAM 預計 2021 上半年量產。公司提醒 DDR5 等更複雜介面使每片晶圓位元成長放緩。", src: "rm-fy2021q1" }
  - { date: "2021-03-31", title: "1-alpha DRAM 量產；調整 FY2021 成本降幅", detail: "FY2021 第二季開始量產 1-alpha DRAM；因產品組合變化，FY2021 DRAM 成本降幅將略高於先前的中個位數預估，NAND 則略低於先前的 low to mid-teens 預估。", src: "rm-fy2021q2" }
  - { date: "2021-09-28", title: "FY2022 資本支出 110–120 億美元", detail: "1-alpha DRAM 與 176 層 NAND 持續爬坡，可在 FY2022 帶來不錯的前段成本下降；2022 曆年 DRAM 與 NAND 位元出貨成長預期與產業相當；FY2022 資本支出預估 110–120 億美元。", src: "rm-fy2021q4" }
  - { date: "2022-09-29", title: "232 層 NAND 量產、FY2023 資本支出砍至約 80 億美元", detail: "率先量產 232 層 NAND；1-beta DRAM 預計 2022 年底開始量產。FY2023 資本支出降至約 80 億美元（年減逾 30%，晶圓廠設備近腰斬），並在部分 DRAM 與 NAND 產線降低稼動率；Boise 新 DRAM 廠到 2030 年前投資約 150 億美元。", src: "rm-fy2022q4" }
  - { date: "2022-12-21", title: "DRAM、NAND 投片減少約 20%", detail: "DRAM 與 NAND 投片減少約 20%，減產效果自 FY2023 第三季完整反映；預估減產使 FY2023 銷貨成本增加約 4.6 億美元，多數在下半年。FY2023 資本支出再降到 70–75 億美元。", src: "rm-fy2023q1" }
  - { date: "2022-12-21", title: "1-beta 導入、放慢新製程爬坡；1-gamma 延到 2025", detail: "1-beta DRAM 在 FY2023 第一季導入，位元密度比 1-alpha 高 35% 以上；因需求轉弱放慢 1-beta 與 232 層的爬坡，1-gamma 導入延到 2025 年。扣除稼動率不足影響，FY2023 DRAM 每位元成本仍可健康下降，NAND 則受新加坡能源成本上漲拖累。", src: "rm-fy2023q1" }
  - { date: "2023-03-28", title: "投片減少擴大到約 25%", detail: "DRAM 與 NAND 投片減少約 25%，FY2023 資本支出約 70 億美元（年減逾 40%，晶圓廠設備減逾 50%）；第三季財測假設再提列約 5 億美元存貨跌價，且未計入跌價金額變動的影響。", src: "rm-fy2023q2" }
  - { date: "2023-03-29", title: "存貨跌價 14.3 億美元", detail: "10-Q 揭露 FY2023 第二季因 DRAM、NAND 售價下跌，提列存貨淨變現價值跌價 14.3 億美元，並預估第三季再提列約 5 億美元（實際 4.01 億美元）。跌價後的存貨售出時，後續季度銷貨成本會較低。", src: "f-fy2023q2" }
  - { date: "2023-06-28", title: "投片減少接近 30%", detail: "DRAM 與 NAND 投片減少幅度接近 30%，並預期減產延續到 2024 年。", src: "rm-fy2023q3" }
  - { date: "2023-09-27", title: "閒置設備轉往先進製程，晶圓產能結構性下降", detail: "把減產閒置的設備移去支援先進製程爬坡，因先進製程步驟較多，DRAM 與 NAND 的總晶圓產能因此結構性下降；舊製程稼動率不足延續到 2024 年。", src: "rm-fy2023q4" }
  - { date: "2023-12-20", title: "HBM3E 2024 年初量產；HBM 晶圓消耗是 D5 的兩倍以上", detail: "HBM3E 預計 2024 年初量產，FY2024 HBM 營收數億美元；同樣位元數下 HBM 消耗的晶圓超過 DDR5 的兩倍。FY2024 前段成本降幅預估 DRAM 為中到高個位數、NAND 約 low teens。", src: "rm-fy2024q1" }
  - { date: "2024-03-20", title: "HBM3E 晶圓消耗約為 D5 的 3 倍，2024 年產能售罄", detail: "產業層面 HBM3E 生產同樣位元數需要約 3 倍於 DDR5 的晶圓（同製程），HBM4 的比例更高；美光 2024 年 HBM 已售罄，2025 年供給大多已分配。", src: "rm-fy2024q2" }
  - { date: "2024-06-26", title: "HBM 首季營收逾 1 億美元，2024、2025 年售罄", detail: "FY2024 第三季 HBM3E 營收超過 1 億美元，毛利率高於 DRAM 平均；2024、2025 年 HBM 售罄且多數價格已議定。FY2024 DRAM 前段成本（不含 HBM）降幅預估為高個位數、NAND 約 low teens；FY2025 資本支出約為營收的 35% 上下。", src: "rm-fy2024q3" }
  - { date: "2024-09-25", title: "FY2025 成本降幅目標", detail: "FY2025 DRAM 前段成本（不含 HBM）預估降幅為中到高個位數，NAND 為 low to mid-teens；FY2024 DRAM 前段成本降幅達年初預估上緣，NAND 符合預期。HBM 占產業 DRAM 位元比重預估由 2023 年 1.5% 升到 2025 年約 6%。", src: "rm-fy2024q4" }
  - { date: "2024-12-18", title: "CHIPS 補助與新加坡 HBM 封裝廠；NAND 投片減少 mid-teens", detail: "與美國商務部完成最高 61 億美元的 CHIPS 補助（愛達荷與紐約 DRAM 廠）；在新加坡新建 HBM 先進封裝廠，2027 年起擴充封裝產能；NAND 投片較先前減少約 15%（mid-teens）；FY2025 資本支出約 140 億美元 ± 5 億美元。", src: "rm-fy2025q1" }
  - { date: "2025-03-20", title: "HBM 季營收逾 10 億美元；1-gamma 首批出貨", detail: "HBM 營收季增逾 50%、單季超過 10 億美元；推出第一個使用 EUV 的 1-gamma DRAM 製程並首度出貨 1-gamma DDR5，位元密度比 1-beta 高 30% 以上；HBM 對一般 DRAM 的晶圓交換比（trade ratio）預期在 HBM4 再提高，HBM4E 時將超過 4 比 1。", src: "rm-fy2025q2" }
  - { date: "2025-06-25", title: "美國 2,000 億美元投資計畫、ID1 2027 下半年產出", detail: "宣布在美國約 2,000 億美元的投資計畫（較先前再增加 300 億美元），包括愛達荷第二座 DRAM 廠（ID2）與維吉尼亞 Manassas 廠擴建；ID1 首批晶圓預計 2027 下半年產出。", src: "rm-fy2025q3" }
  - { date: "2025-09-23", title: "HBM 季營收近 20 億美元；FY2025 成本實績", detail: "FY2025 第四季 HBM 營收接近 20 億美元（年化約 80 億美元），HBM 市占可望在 2025 年第三季（曆年季度）達到與 DRAM 整體市占相當的目標；FY2025 DRAM 含 HBM 的全口徑成本只下降低個位數，NAND 全口徑成本下降約 low teens；FY2025 資本支出 138 億美元，FY2026 將更高。", src: "rm-fy2025q4" }
  - { date: "2025-12-17", title: "2026 年 HBM 全部議定、FY2026 資本支出上修到約 200 億美元", detail: "2026 年 HBM（含 HBM4）的價格與數量已全部議定；預估 HBM 市場由 2025 年約 350 億美元成長到 2028 年約 1,000 億美元。1-gamma 將是 2026 年 DRAM 位元成長主力、下半年占位元產出過半；ID1 提前到 2027 年年中產出、紐約首座廠 2026 年初動工；FY2026 資本支出由 180 億美元上修到約 200 億美元。", src: "rm-fy2026q1" }
  - { date: "2026-03-18", title: "首份五年期策略客戶協議、FY2026 資本支出逾 250 億美元", detail: "簽下第一份五年期策略客戶協議（SCA）；G9 NAND 預計 2026 年年中占 NAND 位元過半；新加坡新 NAND 廠動工，2028 下半年產出；FY2026 資本支出預估超過 250 億美元，FY2027 營建類資本支出年增逾 100 億美元。", src: "rm-fy2026q2" }
  - { date: "2026-06-24", title: "預期 DRAM 每位元成本將上升；台灣銅鑼廠 2027 年中出貨", detail: "公司預期需求偏向高效能、高價值產品（每位元成本較高），加上大量新廠產能投產，混合 DRAM 每位元成本將由目前水準上升；HBM4 12-high 爬坡速度是 HBM3E 12-high 的兩倍，HBM4 已出貨逾 10 億美元；新取得的台灣銅鑼廠預計 2027 年中開始有意義出貨；FY2026 資本支出約 270 億美元。", src: "rm-fy2026q3" }
  - { date: "2026-09-30", title: "2027 年 HBM 大多已簽約、策略客戶協議擴大", detail: "2027 年 HBM 位元供給絕大部分已完成協議且價格年增明顯，HBM 與一般 DRAM 的毛利率差距縮小；已簽 26 份策略客戶協議，估占 2030 年前營收逾 35%，其中四分之三有定價框架（多數有價格上下限）。1-gamma DRAM 與 G9 NAND 已是最大量產製程，下一代製程預計 2027 下半年量產。", src: "rm-fy2026q4" }
  - { date: "2026-09-30", title: "新廠時程：日本、台灣、新加坡、美國", detail: "日本 DRAM 擴建廠動土，2028 年底開始產出；台灣銅鑼廠 2027 年中有意義出貨；新加坡 HBM 封裝廠 2027 年初產出、新 NAND 廠 2028 下半年產出；愛達荷 ID1 2027 年中、ID2 2028 年底產出晶圓，紐約首座廠 2030 年產出。公司提醒新廠需數季才逐步放量。", src: "rm-fy2026q4" }
  - { date: "2026-09-30", title: "FY2027 第一季財測", detail: "營收 615 億美元 ± 15 億美元（區間 600–630 億美元）；毛利率 GAAP 約 85.95%、非 GAAP 約 86.25%；營業費用 GAAP 約 23.1 億美元、非 GAAP 約 20.6 億美元；稀釋 EPS GAAP 37.84 ± 1.00 美元、非 GAAP 38.15 ± 1.00 美元（以約 11.5 億股計）。", src: "pr-fy2026q4" }
  - { date: "2026-09-30", title: "FY2027 展望與資本支出", detail: "預期 FY2027 再創新高、每季營收逐季成長；FY2026 第四季認列的獎金多數計入存貨，主要壓低 FY2027 第一季毛利率，之後各季毛利率預期更高、漲價幅度趨緩；FY2027 營業費用約增加 25 億美元；FY2027 第一季資本支出約 115 億美元、上半年約 250 億美元，下半年更高。", src: "rm-fy2026q4" }
