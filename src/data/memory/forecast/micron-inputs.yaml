  notes: "FY2016Q1–FY2026Q4 共 44 季；損益與資產負債數字取自 SEC XBRL，並與 src/content/financials/micron.json（FY2023–FY2026 營收、毛利率、營益率）逐季核對一致。fc-check-micron 查核（2026-10-23）：44 季損益、EPS、股數、存貨、折舊攤銷、資本支出總額與存貨跌價逐筆比對 SEC XBRL（Q4 以全年減前三季），最近 20 季再比對 stockanalysis.com，FY2023–FY2026 再比對 src/content/financials/micron.json；非 GAAP EPS、非 GAAP 毛利率、淨資本支出、財測與第四季 EPS／股數比對各季新聞稿原文；DRAM／NAND 營收比對 10-Q／10-K 的 Revenue by Technology（FY2016–FY2018 用 Micron 投資人網站提供的申報 PDF），位元與 ASP 的文字換算逐季比對講稿、10-Q 與新聞稿；稼動率不足、存貨跌價、HBM 與事件逐條比對原文。修正：補上 FY2018 第四季位元與 ASP（法說會簡報）、FY2018 第四季與 FY2019 第一季財測；FY2020 第四季與 FY2021 第二季補註存貨重分類；修正 4 則事件的敘述。"
