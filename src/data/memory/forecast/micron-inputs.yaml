# 美光（Micron）財報模型的輸入資料：會計季度損益、DRAM／NAND 拆分、位元與 ASP 季變化、稼動率不足、財測與事件。格式見 src/schemas/forecast.ts（companyInputs）。
# 由 fc-data-micron 整理；模型輸出見 micron-model.json（由 scripts/models/micron.ts 產生）。

company: "micron"
currency: "USD"
amountUnit: "million"
periodNote: "美光會計年度為 52 或 53 週，結束於最接近 8 月 31 日的星期四，以結束年份命名；FY2016 為 2015-09-04 至 2016-09-01，FY2026 為 2025-08-29 至 2026-09-03（53 週，第四季 14 週），FY2020 也是 53 週（第四季 14 週），FY2027 第一季為 2026-09-04 至 2026-12-03。金額單位為百萬美元；eps 為 GAAP 稀釋每股盈餘（美元），epsNonGaap 與 grossMarginNonGaap 為公司當季新聞稿的非 GAAP 數字（非 GAAP 毛利率由非 GAAP 毛利金額除以營收計算）；operatingExpenses＝毛利－營業利益（研發、管銷與其他營業收支）；pretaxIncome 為所得稅與權益法投資損益前的稅前淨利，nonOperating＝pretaxIncome－營業利益；netIncome 為歸屬美光股東。capex 為公司公布的淨資本支出（FY2016 第四季至 FY2019 扣除合作夥伴出資，FY2020 起為「Investments in capital expenditures, net」，FY2023 起並扣除政府補助款），extra.資本支出總額為現金流量表的購置不動產廠房設備支出（未扣除任何補助）。dramRevenue／nandRevenue 取自 10-Q／10-K 的 Revenue by Technology；FY2019 起為「MCP 與 SSD 依元件價值拆分」的口徑，FY2016–FY2018 為舊口徑（MCP 全數列入 NAND），兩者不可直接相比。位元與 ASP 季變化（dramBitQoq 等，%）：FY2016–FY2017 第三季為 10-Q 的確切百分比；其餘季度公司只以區間文字描述，換算規則統一如下：flat／flattish／roughly flat／relatively unchanged＝0，slightly／modestly＝1，low-single＝2，mid-single＝5，high（upper）-single＝8，low-teens 與 low double-digit＝12，mid-teens＝15，high-teens＝18，low-20s＝22，mid-20s＝25，high-20s＝28，30 以上依同規則（low-30s＝32、mid-30s＝35、high-30s＝38，low-60s＝62、mid-60s＝65、high-70s＝78、mid-80s＝85），「A-to-B」取兩者平均（例如 low-to-mid-teens＝13.5、mid-to-high-single＝6.5），approximately／roughly X、approached X 與 in the X-percentage range 取 X，over／more than／slightly over X 取 X（下限），下降取負值；原文寫在各季 note。hbmRevenue 只在公司給出數字時填寫，且多為下限或約數（見各季 note）；underutilization 為計入銷貨成本的稼動率不足費用（FY2019–FY2021 為 IMFT／Lehi 3D XPoint 廠，FY2023–FY2024 為減少投片造成的閒置成本）。guidance 為上一季法說會發布、針對本季的非 GAAP 財測（營收中值與區間、毛利率中值、EPS 中值）；FY2018 第二季與第三季取自財測上修新聞稿所列的原始財測（無毛利率），FY2018 第四季與 FY2019 第一季取自法說會簡報，FY2019 第二季至第四季取自法說會講稿，FY2020 第一季起取自新聞稿，FY2018 第一季（含）以前未取得。"
asOf: "2026-10-23"
