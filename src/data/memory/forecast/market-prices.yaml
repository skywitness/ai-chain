    definition: "TrendForce 公布的 DRAM 整體合約價（平均售價）較前一季的變化。2024Q3 起 TrendForce 把一般型（conventional）DRAM 與含 HBM 的混合價分開，本序列 2024Q3 起採一般型、不含 HBM；2024Q2 以前 TrendForce 未區分 HBM（當時 HBM 位元滲透率約 4% 以下），為整體 DRAM。value 採季末或季後估計區間中值，事前預測寫在 note。"
    note: "序列 2016Q2–2026Q4 連續無缺口；2016Q1 TrendForce 未公布整體值，因此從 2016Q2 開始。口徑：2016Q4–2017Q2 TrendForce 以 PC DRAM（標準型）合約價為主要指標，未公布各應用加權值，這三季採 PC DRAM 漲幅，會高估整體漲幅（同期行動 DRAM 漲幅較小）；2016Q3 只有事前預測。2018 年起取自 TrendForce「DRAM ASP」或「Total DRAM」價格表列（可信度高）。含 HBM 的混合價見 dram-incl-hbm-contract-qoq。2024–2026 年各點與記憶體專題 dram.yaml 一致。2027 年：TrendForce 指出 DRAM 2027 年仍吃緊、記憶體合約價大致維持高檔（tf-20260825-13198、tf-20260730-13158），但未公布各季數字預測。"
