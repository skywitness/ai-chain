events:
  - { date: "2016-09-21", title: "依金管會函示重編 2009 年至 2016 年上半年財報", detail: "金管會要求將聯東電子、華威達、永馳等實質關係人納入合併報表，群聯完成重編民國 98 年至 105 年第 2 季財報；重編只影響非控制權益，歸屬母公司淨利不變。本檔 2016 年第一、二季採重編後數字。", src: mi-20160921 }
  - { date: "2019-03-21", title: "2018 年原料價格修正，全年提列存貨跌價損失", detail: "107 年度年報致股東報告書指出，記憶體上游廠商持續擴充產能、供需失衡，產業原料價格迅速修正，使 2018 年獲利微幅滑落；2018 年營業成本含存貨跌價損失 0.95 億元，其中第四季 0.66 億元（董事會於 2019-03-21 通過年度財報）。", src: ar-2018 }
  - { date: "2019-05-10", title: "2019 年第一季存貨大幅增加", detail: "2019 年 3 月底存貨 105.50 億元，較 2018 年底 75.77 億元增加約 39%；其中在製品由 20.01 億元增至 45.71 億元，原料由 42.64 億元增至 48.17 億元。", src: fr-2019 }
  - { date: "2019-12-20", title: "簽訂 2020–2022 年記憶體供貨合約並預付購料款", detail: "群聯公告與某原料供應商簽訂 2020 至 2022 年記憶體供貨合約，數量依未來需求協議、價格依當時市場價格議定，並預付一定美元金額的購料款，目的在穩定長期記憶體貨源。", src: mi-20191220 }
  - { date: "2020-08-13", title: "2020 年第二季提列存貨跌價損失", detail: "2020 年第二季營業成本含存貨跌價損失 3.05 億元，為 2016–2021 年間單季最大；第三季轉為回升利益 0.83 億元。", src: fr-2020 }
  - { date: "2021-07-06", title: "簽署產能支援意向書", detail: "董事會通過與國內某大半導體公司簽署產能支援與合作意向書，群聯須依條件支付款項，以取得營運所需產能。", src: mi-20210706 }
  - { date: "2022-03-04", title: "提高庫存以因應 NAND 產業變化", detail: "4Q21 法說簡報說明，群聯提高庫存以因應 NAND 產業變化，並配合營收成長保持安全庫存水位；2021 年底存貨 194.97 億元（一年前為 101.41 億元）。", src: ir-4q21 }
  - { date: "2022-11-04", title: "2022 年第三季提列存貨跌價損失", detail: "3Q22 法說簡報指出，提列備抵存貨跌價損失使當季毛利率減少約 5 個百分點；當季存貨跌價及呆滯損失 7.37 億元。", src: ir-3q22 }
  - { date: "2023-03-15", title: "2022 年全年存貨跌價損失 17.12 億元", detail: "4Q22 法說簡報：第四季提列存貨跌價損失影響毛利率約 5 個百分點，2022 年全年約 2.8 個百分點；全年存貨跌價及呆滯損失 17.12 億元。", src: ir-4q22 }
  - { date: "2023-05-05", title: "執行長：持有許多低價庫存，價格續跌機率已低", detail: "1Q23 法說會上潘健成表示，群聯擁有許多低價庫存，雖然庫存水位偏高，但 NAND 價格續跌機率已很低、原廠擴大減產的機率上升；並預估第二季毛利率可維持 27–33%。", src: cnyes-20230505 }
  - { date: "2023-11-07", title: "董事會通過預付台灣鎧俠 1.2 億美元", detail: "董事會通過與台灣鎧俠簽署預付款合約，支付 1.2 億美元作為 2024 年供應所需快閃記憶體的預付貨款。", src: ar-2023 }
  - { date: "2023-11-07", title: "法說：NAND 原廠減產，部分產品供貨吃緊", detail: "3Q23 法說簡報指出，NAND 原廠產能限縮、供應有限，第四季部分產品已出現供貨吃緊；研調機構預估 2024 年可能發生供給短缺、NAND 營收可能反轉走升。", src: ir-3q23 }
  - { date: "2024-03-08", title: "2023 年存貨跌價回升提升毛利率", detail: "4Q23 法說簡報：2023 年全年回轉備抵存貨跌價損失提升毛利率約 0.8 個百分點，其中第四季約 1.4 個百分點；全年回升利益 3.79 億元。", src: ir-4q23 }
  - { date: "2024-03-18", title: "於 NVIDIA GTC 2024 推出 aiDAPTIV+ 合作方案", detail: "群聯宣布與華碩、技嘉、MAINGEAR、聯發科合作推出 aiDAPTIV+，以軟體加上專用 SSD 擴充可用記憶體，讓中小企業在地端微調大型語言模型。", src: phison-aidaptiv-gtc }
  - { date: "2024-05-11", title: "執行長：原廠恢復獲利，價格急漲恐抑制需求", detail: "工商時報報導，潘健成表示 NAND 原廠自 2024 年第一季起已恢復正常獲利，短期價格急漲可能抑制終端的儲存容量而形成泡沫；第二季為消費型產品淡季，預期下半年消費型與非消費型產品皆轉強。", src: ctee-20240511 }
  - { date: "2024-05-15", title: "推出 Pascari 企業級 SSD 品牌", detail: "群聯推出企業級與資料中心 SSD 品牌 Pascari，同時發表首款 PCIe Gen5 企業級 SSD X200 系列，產品線轉向高附加價值的企業市場。", src: phison-pascari }
  - { date: "2024-08-14", title: "庫存七成五以上用於非零售市場", detail: "2Q24 法說簡報：截至第二季底，庫存應用於非零售（Non-Retail）市場的比重大於 75%；第二季提列存貨跌價損失影響毛利率約 0.5 個百分點。", src: ir-2q24 }
  - { date: "2024-12-02", title: "處分深圳宏芯宇部分股權", detail: "子公司處分所持深圳宏芯宇部分股份，群聯說明預計處分投資利益約 44 億元（自結稅前數），反映在 2024 年第四季的營業外收入。", src: mi-20241202 }
  - { date: "2025-03-07", title: "2024 年第四季存貨跌價大幅回升", detail: "4Q24 法說簡報：第四季回轉備抵存貨跌價損失影響毛利率約 +4.75 個百分點，第三季為約 −3.37 個百分點，2024 年全年約 +0.11 個百分點。", src: ir-4q24 }
  - { date: "2025-05-21", title: "執行長：NAND 仍缺貨，原廠利潤已逾 35%", detail: "潘健成表示 NAND Flash 市場仍處於缺貨狀態、價格維持高檔，供應商利潤已超過 35%，呼籲供應商毛利合理即可，以免重演 2023 年的情況。", src: technews-20250521 }
  - { date: "2025-08-14", title: "新台幣升值造成匯兌損失", detail: "2Q25 法說簡報：外幣匯兌淨損失影響第二季 EPS 約 −5.70 元；回轉備抵存貨跌價損失提升毛利率約 2.52 個百分點。", src: ir-2q25 }
  - { date: "2025-11-07", title: "執行長：NAND 供需吃緊與漲價將延續多年", detail: "3Q25 法說會報導引述潘健成認為 NAND 供需吃緊與漲價將延續多年，近三個月 1Tb TLC NAND 價格翻倍；第三季毛利率部分來自存貨評價迴轉利益。", src: uanalyze-20251107 }
  - { date: "2026-03-06", title: "法說：AI 推升 NAND 需求，缺貨漲價已是事實", detail: "4Q25 法說簡報指出 AI 驅動的 NAND 需求造成缺貨漲價，短中期內沒有紓緩跡象；第四季備抵存貨跌價損失（主要為期末在製品評價）影響毛利率約 −1.12 個百分點，2025 年全年回轉提升毛利率約 1.0 個百分點。", src: ir-4q25 }
  - { date: "2026-03-06", title: "執行長：目前庫存已超過 500 億元", detail: "4Q25 法說會報導，潘健成表示目前庫存金額已超過 500 億元（2025 年底帳列 356.09 億元），依應用別約為企業級 35%、Embedded ODM 30%、工控 14%、控制晶片 16%、零售 3%、其他 2%；群聯採 design-in、design win 的長期供應模式，產品價格調整較慢。", src: uanalyze-20260306 }
  - { date: "2026-05-08", title: "2026 年第一季營收結構與存貨評價", detail: "1Q26 法說簡報：營收占比為 AI 生態系模組 38%、嵌入式 ODM 模組 25%、工業模組 15%、控制晶片 10%、零售模組 8%、其他 4%；期末在製品評價損失影響毛利率約 −1.50 個百分點；權益法投資利益影響 EPS 約 +10.65 元；庫存以應用於高附加價值市場為大宗。", src: ir-1q26 }
  - { date: "2026-08-13", title: "2026 年第二季營收 678.88 億元、毛利率 65.3%", detail: "2Q26 法說簡報：美元營收 21.50 億美元、季增 65.6%；營收占比為 AI 生態系模組 38%、嵌入式 ODM 模組 33%、工業模組 16%、控制晶片 6%、零售模組 5%、其他 2%；期末在製品評價損失影響毛利率約 −1.10 個百分點；權益法投資利益影響 EPS 約 +14.2 元。", src: ir-2q26 }
  - { date: "2026-08-13", title: "執行長：低成本庫存效益將逐步淡化", detail: "2Q26 法說會報導，潘健成表示第二季獲利成長來自過去低成本 NAND 庫存與產品組合轉向高階市場，但隨著 NAND 價格持續上漲，低成本庫存效益最終會逐步淡化；NAND 供應相當吃緊，2027、2028 年也難以平衡；庫存主要配置在企業級、嵌入式、ODM 與工業市場，零售比重未來數季將持續下降。", src: uanalyze-20260813 }
  - { date: "2026-10-16", title: "2026 年第三季財報法說會訂於 11 月 6 日", detail: "群聯公告受邀參加麥格理證券舉辦的 3Q26 財報公告線上法說會，時間為 2026-11-06 17:00；第三季合併財報的董事會日期截至 2026-10-23 尚未公告。", src: mi-20261016 }
