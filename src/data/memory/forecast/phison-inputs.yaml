  notes: "損益表與資產負債表取自公開資訊觀測站財務報表查詢（2016Q1–2026Q2），月營收取自上櫃公司每月營業收入彙總表；存貨跌價、存貨組成與加權股數逐季讀自財報附註（2016–2020Q2 為掃描影像，經人工判讀並以次年比較欄位與全年數核對）；年報產銷量值與主要供應商取自 106–114 年度年報。與 src/content/financials/phison.json 重疊期間（2024Q3–2026Q2 營收、毛利率、營業利益率與月營收）逐項相符。事實查核（fc-check-phison，2026-10-23）：損益表、存貨與 EPS 共 688 個數字以程式比對公開資訊觀測站 XBRL 財報（另以次年比較欄位複核 621 個），全部相符（僅第四季 EPS 依說明採法說簡報數字）；月營收 129 個月逐月比對公開資訊觀測站彙總表（另以次月與次年欄位複核 245 個），全部相符；存貨組成、跌價金額與正負號、加權股數逐季比對財報附註（2016–2020 年上半年的掃描檔以光學辨識比對），年報產銷量值與主要供應商逐項比對年報；美元營收、存貨評價影響、營收占比與事件逐項比對法說簡報、重大訊息與新聞原文。修正：2019 年第二大供應商並非 Kioxia America（年報代號 C、非鎧俠集團），2016 年 A 廠商關係人說明改為年報原文；新增 2020 年第二、三季美元營收、2022 年起逐季產品別營收、2024 與 2025 年產品別銷售值。"
