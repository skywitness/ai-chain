  notes: "60 個據點。2026-10-23 產能補充（fabcap-merge）：查核並合併韓國、台日美新、中國三份分區調研，逐一開啟原文確認數字、單位、期間、涵蓋範圍與估計者。有月產能的據點由 7 個增為 18 個（韓國 8、中國 6、台灣 3、日本 1）：新增利川 M10＋M14（合計放在 M14）、M16、清州 M11／M12、M15、華城 17 號線、平澤 P4、美光台中＋林口（合計放在台中）、華邦電台中、北上 K2、長鑫合肥與北京；韓國多數單廠數字只有 2021–2022 年（M16 為 2024 年）的媒體估計，年份寫在各廠 note。未採用：平澤 P1 的 2021 年約 29 萬片（之後部分 NAND 產線轉作 DRAM，依 2025 年三星 NAND 產出推算也已偏高，只寫入 note）、廣島的經濟產業省每月 4 萬片（只是受補助產線，未說明是否為淨增）、平澤 P5 完工後約 60 萬片（單一媒體估計、沒有時程）。修正：新增平澤 P2；P1 產品加上 DRAM、P3 加上 NAND；長鑫合肥座標依招股書地址移到蜀山區高劉街道一帶；南亞科 5A 新增產能依 2026-10 法說改為 5 萬片，並更新時程與總投資；美光台中、林口改為擴產中；華邦電台中產品加上 DRAM；長江存儲武漢三廠加上 DRAM；長鑫北京標為估計（地方政府公布，不是公司揭露）；建廠中據點的新增產能標為預測；多筆來源改為原始報導。加總核對：SK海力士 DRAM 已填約 49 萬片，低於 The Elec 的約 55 萬與 Citrini 的 2026 年底 59 萬（韓國單廠數字偏舊）；三星 DRAM 已填約 34.5 萬片，約為全公司 66–72 萬片的一半，P1、P2 與華城其他產線沒有數字；美光台灣兩廠 22 萬片約為 Citrini 37.5 萬片的六成；長鑫 30 萬片介於 ZDNet Korea 的約 25 萬與 Citrini 的 35 萬之間；SK海力士 NAND（清州約 15 萬加大連約 10 萬）與 TrendForce 估計相符。前次查核（2026-10-22，mem-fabs-check）逐一比對各公司 F-1、10-K、新聞稿、公開資訊觀測站重訊與 TrendForce 報導原文。"
