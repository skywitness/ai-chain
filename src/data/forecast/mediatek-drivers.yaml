editorial:
  status: fact-checked
  author: fc2-data-mediatek
  checkedBy: fc2-check-mediatek
  checkedOn: "2026-11-17"
  notes: "2026-11-17 查核（fc2-check-mediatek）：產品線占比、季增率與年增率（2021Q1–2026Q3）逐季與法說簡報表格比對一致（2023Q1 對照逐字稿），並以占比 × 合併營收推算的成長率交叉驗算；公司平均匯率 23 季與簡報損益表逐一一致；聯準會 H.10 季平均 44 季由每日資料重算一致；財測四個序列與 inputs 及簡報一致。IDC 季出貨 21 點逐一對照新聞稿表格：2022Q4 改用 4Q23 新聞稿的修正值 300.6（原為初估 300.3，新增來源 idc-4q23），2Q26 初估數字補上來源 idc-2q26，idc-3q26 與 idc-2q24 的發布日改為新聞稿日期。Counterpoint 年出貨 8 點、聯發科手機與 5G 看法、旗艦與 ASIC 營收說法逐一對照原文一致。2026-11-17 建立（fc2-data-mediatek）：產品線占比與成長率逐季抄自法說簡報（以 PyMuPDF 依座標還原表格欄位，並與逐字稿的文字核對 2025Q2–2026Q3）；IDC 季出貨取自 IDC 新聞稿（idc.com 的 WordPress API 讀取全文），2022Q1 由年增率回推；匯率由聯準會 H.10 每日資料計算並與公司簡報比對。未能以一手來源證實首款 ASIC 客戶身分，故不寫客戶名稱。"
