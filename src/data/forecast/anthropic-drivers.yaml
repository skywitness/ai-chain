      - { period: "2026-05", value: 47000, status: "actual", src: "an-series-h", note: "5 月稍早突破 470 億美元" }
      - { period: "2026-07", value: 65000, status: "estimate", src: "bbg-65b", note: "Bloomberg 引述知情人士：7 月底達 650 億美元；公司未公開證實" }
