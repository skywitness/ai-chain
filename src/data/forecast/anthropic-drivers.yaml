editorial:
  status: "fact-checked"
  author: "fc2-data-anthropic"
  checkedBy: "fc2-check-anthropic"
  checkedOn: "2026-11-18"
  notes: "查核（fc2-check-anthropic，2026-11-18）：所有由財報計算的序列（算力費用、算力效率、銷貨成本與研發占比、銷貨成本以外的算力、訂閱與美國以外占比）都以程式對 anthropic-inputs.yaml 重算，誤差在四捨五入以內；算力效率、客戶數、年化營收定義與 810 億美元、每位員工營收對照上市網站 FWP；季度趨勢、短期算力、合約義務表（第 190 頁）、前五大客戶、雲端市集占比、遞延營收與剩餘履約義務對照招股書影像；年化營收與客戶數的新聞稿點、Bloomberg 報導，以及各模型牌價（定價頁）與上線日（模型生命週期表）逐一重讀原文。修正：降價影響序列改名並說明是抵銷季增、Sonnet 5 上線價原為限時價、G 輪「一打」客戶、TTM 營收 261 億美元與 74% 的口徑；合約義務的「2031 年以後」不是單一年度，移到 note（頁面依期間排序時會排到最前面）。short-term-compute 的「2026H1」是上半年合計，無法拆成單季。原整理說明：招股書數字取自 SEC 上的 FWP（歐洲經濟區公開說明書、日本公開說明書英譯、上市網站）；百分比序列由本檔以招股書金額計算到小數一位。年化營收的 2025-01 至 2026-05 各點與 src/content/financials/anthropic.json 相同。"
