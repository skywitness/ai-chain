events:
  - { date: "2019-01-28", title: "下修 FY2019 第四季財測", detail: "營收財測由 27.0 億美元下修為 22.0 億美元，GAAP 毛利率由 62.3% 降為 55.0%（含約 1.2 億美元超額 DRAM 等零組件費用）；理由是中國等地總體經濟轉弱影響遊戲 GPU 需求，以及資料中心部分交易未在季末成交；虛擬貨幣熱潮後的中階通路庫存去化大致符合預期。", src: "sec-8k-20190128" }
  - { date: "2020-04-27", title: "完成收購 Mellanox", detail: "Mellanox 收購案在 FY2021 第二季首日完成，網路產品自該季起併入資料中心營收；第二季財測預估 Mellanox 約占營收一成出頭。", src: "pr-fy2021q1" }
  - { date: "2021-07-19", title: "1 拆 4 股票分割", detail: "以股票股利方式完成 1 拆 4 分割（基準日 2021-06-21）。本檔 EPS 與股數已依其後的分割一併換算為目前股數基礎。", src: "pr-fy2022q2" }
  - { date: "2022-02-08", title: "終止收購 Arm", detail: "輝達與軟銀因重大監管障礙終止 Arm 股權買賣協議，公司預告在 FY2023 第一季營業費用認列 13.6 億美元費用；實際損益表列 13.53 億美元（pr-fy2023q1）。", src: "pr-fy2022q4" }
  - { date: "2022-08-08", title: "預告 FY2023 第二季營收低於財測", detail: "第二季營收預估約 67.0 億美元，低於 5 月財測 81.0 億美元；遊戲營收 20.4 億美元季減 44%，資料中心 38.1 億美元季增 1%；約 13.2 億美元的存貨與相關準備費用使 GAAP 毛利率降至約 43.7%（初步數字）。", src: "sec-8k-20220808" }
  - { date: "2022-08-26", title: "A100／H100 出口中國須申請許可", detail: "美國政府通知輝達，A100 與即將推出的 H100 及其系統出口中國（含香港）與俄羅斯須取得許可；公司指出第三季約 4 億美元對中國的潛在銷售可能受影響。", src: "sec-8k-20220826" }
  - { date: "2023-05-24", title: "生成式 AI 需求帶動財測大增", detail: "FY2024 第二季營收財測 110 億美元（pr-fy2024q1），較第一季實際的 71.9 億美元高出約五成；財務長評論指出資料中心需求來自大型語言模型與生成式 AI，使用 Hopper 與 Ampere 架構 GPU。", src: "cfo-fy2024q1" }
  - { date: "2023-10-17", title: "美國擴大先進運算晶片出口管制", detail: "新規涵蓋 A100、A800、H100、H800、L40、L40S 與 RTX 4090 等超過性能門檻的產品；公司當時表示預期對近期財務沒有重大影響。", src: "sec-8k-20231017" }
  - { date: "2024-06-07", title: "1 拆 10 股票分割", detail: "基準日 2024-06-06，分割於 2024-06-07 收盤後生效。FY2025 第一季新聞稿的 EPS 為分割前數字，本檔已換算。", src: "pr-fy2025q1" }
  - { date: "2024-08-28", title: "Blackwell 更改光罩以提高良率", detail: "FY2025 第二季寄出 Blackwell 樣品，並更改 GPU 光罩以改善良率；當季存貨與超額採購承諾提列 9.08 億美元，主要來自低良率的 Blackwell 材料；量產預定第四季開始。", src: "cfo-fy2025q2" }
  - { date: "2025-02-26", title: "Blackwell 量產出貨", detail: "FY2025 第四季 Blackwell 架構營收 110 億美元，公司稱是史上最快的產品量產；大型雲端業者約占資料中心營收的 50%。", src: "cfo-fy2025q4" }
  - { date: "2025-04-09", title: "H20 出口中國須申請許可", detail: "美國政府通知 H20 及同等記憶體頻寬或互連頻寬的晶片出口中國（含港澳）與 D:5 國家須取得許可；公司預估 FY2026 第一季將認列至多約 55 億美元相關費用；實際認列 45 億美元，另有 25 億美元 H20 營收無法出貨（cfo-fy2026q1）。", src: "sec-8k-20250409" }
  - { date: "2025-05-28", title: "FY2026 第二季財測反映 H20 損失", detail: "第二季營收財測 450 億美元，已反映約 80 億美元的 H20 營收損失；公司表示將努力在年底把毛利率恢復到約 75%（mid-70s）。", src: "pr-fy2026q1" }
  - { date: "2025-11-19", title: "投入成本上升，力守 FY2027 毛利率", detail: "財務長在法說會表示 FY2027 投入成本上升，但會努力把毛利率維持在約 75%（mid-70s）；地理別營收自 FY2026 第三季起改依客戶總部所在地揭露（tenq-fy2026q3）。", src: "tr-fy2026q3" }
  - { date: "2026-02-25", title: "供應承諾倍增、FY2027 起改變揭露口徑", detail: "FY2026 年底存貨 214 億美元、供應相關承諾 952 億美元，公司表示已預先確保未來數季以上的存貨與產能；自 FY2027 第一季起非 GAAP 數字不再排除股份基礎薪酬；財務長在法說會表示 FY2027 全年毛利率仍約 75%（mid-70s，tr-fy2026q4）。", src: "cfo-fy2026q4" }
  - { date: "2026-05-20", title: "改用新市場平台、Vera Rubin 預定第三季出貨", detail: "FY2027 第一季起市場平台改為資料中心（超大規模、ACIE）與邊緣運算；財務長表示 Vera Rubin 預定下半年自第三季開始量產出貨，今年 CPU 營收能見度近 200 億美元。", src: "tr-fy2027q1" }
  - { date: "2026-08-26", title: "記憶體漲價使毛利率財測下修", detail: "財務長表示記憶體價格漲幅超出預期且明年續漲，第三季毛利率財測 74% ± 0.5 個百分點，預期第四季在 71–72% 觸底、FY2028 約 72–73%（輝達已執行的產品漲價自 FY2028 第一季生效）；初步預期 FY2028 營收年增約 70%，屬供給受限的展望，供給瓶頸至少延續到 FY2028 年底；供應承諾由 1,190 億美元增至 2,790 億美元，主要為記憶體採購。", src: "tr-fy2027q2" }
  - { date: "2026-10-21", title: "與供應鏈夥伴擴充載板、封裝與測試產能", detail: "與 IBIDEN、三星電機、欣興的載板協議三年內合計使產能增為 2.5 倍；艾克爾計畫在 2028 年底前把韓國廠的中介層晶圓（先進封裝）產能增加逾 300%；京元電子在美國建廠，輝達提供 11 億美元產能預付款；矽品目標在 2027 年中把共同封裝光學的光引擎產能提高為 15 倍，2028 年底前再翻倍；輝達預期測試產能 2027 年較 2026 年倍增。", src: "nv-supply-20261021" }
  - { date: "2026-11-08", title: "董事會啟動獨立調查", detail: "董事會表示因媒體報導指稱執行長黃仁勳成為外國情報活動的目標，由獨立董事組成的委員會在外部律師協助下進行調查；董事會表示沒有理由相信國家安全或公司機密遭到洩漏。", src: "nv-board-20261108" }
  - { date: "2026-11-10", title: "獨立董事委任外部律師進行調查", detail: "獨立董事委任前紐約南區代理聯邦檢察官 Joon H. Kim 及其所屬的 Wachtell, Lipton, Rosen & Katz 律師事務所進行獨立調查。", src: "nv-board-20261110" }
  - { date: "2026-11-11", title: "執行長交接", detail: "董事會接受黃仁勳辭去總裁、執行長與董事職務，立即生效；財務長 Colette Kress 擔任代理執行長並續任財務長；Harvey C. Jones 擔任公司首位董事長；董事會將就內外部人選尋找正式執行長（8-K 於 2026-11-12 申報；公司新聞稿見 nv-ceo-20261112）。", src: "sec-8k-20261111" }
  - { date: "2026-11-17", title: "成立國家安全與出口管制監督委員會", detail: "董事會新設常設委員會，負責國家安全政策、出口管制合規與全球貿易風險的董事會層級監督，由董事 Suzanne Nora Johnson 擔任主席，成員包括 Stephen C. Neal 與 John O. Dabiri。", src: "nv-natsec-20261117" }
  - { date: "2026-11-17", title: "FY2027 第三季財報與第四季財測", detail: "第三季營收 1,158 億美元、GAAP 毛利率 74.8%；Vera Rubin NVL72 開始出貨；資料中心 Hopper 對中國出貨 24 億美元；供應承諾增至 3,900 億美元，主要為多年期記憶體採購。第四季（多一週）營收財測 1,300 億美元 ± 3%、毛利率 71.0–72.0%，不含中國資料中心運算營收。", src: "pr-fy2027q3" }
