# 輝達（NVIDIA，NVDA）財報模型的輸入資料：會計季度損益、非 GAAP 毛利率與 EPS、存貨與存貨提列、資本支出、市場平台營收（舊分類與 FY2027 新分類）、供應承諾、每季財測與事件。格式見 src/schemas/forecast.ts（companyInputs）。
# 由 fc2-data-nvidia 整理；雲端業者資本支出、CoWoS 產能、中國營收比重與財測序列等驅動因子在 nvidia-drivers.yaml；記憶體（含 HBM）價格在 src/data/memory/forecast/market-prices.yaml；模型輸出見 nvidia-model.json（由 scripts/models/nvidia.ts 產生）。
company: "nvidia"
currency: "USD"
amountUnit: "million"
periodNote: "輝達會計年度結束於 1 月的最後一個星期日，以結束年份命名（FY2027 為 2026-01-26 至 2027-01-31），一般 52 週，FY2017 起只有 FY2021 與 FY2027 為 53 週（第四季 14 週）；FY(Y+1) 第 n 季約當日曆 Y 年第 n 季延後約一個月（例如 FY2027 第三季為 2026-07-27 至 2026-10-25）。金額單位為百萬美元。FY2017 第一季至 FY2027 第二季的損益（營收、毛利、營業費用、營業利益、稅前淨利、淨利、研發、管銷、所得稅）、存貨、折舊攤銷與股份基礎薪酬取自 SEC XBRL（sec-companyfacts），採最近一次申報（含重編）的數字，第四季以全年值減前三季，現金流量項目以年初累計相減；FY2027 第三季取自 2026-11-17 新聞稿（10-Q 尚未申報）。operatingExpenses 為損益表的營業費用合計（Total operating expenses：研發加管銷，FY2017 第二季另含 0.02 億美元重組及其他費用、FY2023 第一季另含 13.53 億美元收購 Arm 終止費用；研發與管銷分列在 extra.研發費用、extra.管銷費用），grossProfit－operatingExpenses＝operatingIncome；nonOperating＝pretaxIncome－operatingIncome（利息收支、投資損益與其他）；netIncome 為 GAAP 淨利。eps 為 GAAP 稀釋每股盈餘、sharesDiluted 為稀釋加權平均股數（百萬股），兩者都換算為 2024 年 1 拆 10 之後的股數基礎：2021-07-19 前的數字除以（股數乘以）40，2021-07-19 至 2024-06-07 之間的除以 10；EPS 由公司原始兩位小數的數字換算，保留四位小數，早期數值很小是分割換算的結果。第一至第三季 EPS 與股數取自 XBRL，第四季取自該季新聞稿。grossMarginNonGaap 與 epsNonGaap 為各季新聞稿當時公布的非 GAAP 數字（EPS 同樣換算股數基礎）：FY2026 第四季（含）以前的非 GAAP 排除股份基礎薪酬，FY2027 第一季起改為不排除，口徑不同不可直接相比；FY2026 四季依新口徑重編的非 GAAP 毛利率與 EPS 寫在 extra.非GAAP毛利率含股份薪酬、extra.非GAAP_EPS含股份薪酬（hist-nongaap）。capex 為新聞稿自由現金流量調節表的「購置不動產、設備與無形資產」（Purchases related to property and equipment and intangible assets，含無形資產）。inventoryWritedown 為計入銷貨成本的存貨提列（XBRL InventoryWriteDown，FY2023 第二季起；第四季以全年減前三季，FY2026 第四季與 FY2027 第一季的原始值以十億美元四捨五入；FY2023 第一、四季無法拆出），extra.存貨與超額採購承諾提列為 10-Q 內文的「存貨與超額採購承諾提列」總額（含採購承諾，只填有單季數字的季度）。市場平台營收（extra）：FY2017–FY2026 為舊分類 資料中心營收、遊戲營收、專業視覺化營收、車用營收、OEM與其他營收（季營收趨勢表 rev-*，五項相加等於營收）；FY2027 第一季起公司改為 資料中心（超大規模營收、ACIE營收＝AI 雲、產業與企業）與 邊緣運算營收（PC、遊戲機、工作站、車用、機器人等），並把 FY2025 第一季以後重編為新分類（rev-fy2027q3，已反映 FY2027 第二季一家客戶由 ACIE 改列超大規模），所以遊戲、專業視覺化、車用只到 FY2026，新分類只從 FY2025 開始，兩套並存；資料中心營收在兩套分類中相同、FY2017 至今連續。資料中心運算營收與資料中心網路營收為 10-Q 的分項（FY2024–FY2026，FY2027 第一季為 CFO 評論的十億美元約數，之後未再揭露）。extra.供應與產能承諾為期末尚未履行的存貨採購與供應、產能承諾：FY2022 第一季（含）以前只有存貨採購義務，FY2022 第二季起加入長期供應與產能義務，FY2026 第三季起為「製造生產、長期供應與產能及相關承諾」（2026 年起公司以「供應承諾」稱之）；都不含雲端服務合約、其他非存貨採購義務與投資承諾；FY2026 第二季公司只揭露含非存貨義務的總額，因此空白。extra.雲端服務合約承諾為多年期雲端服務合約承諾。guidance 為上一季新聞稿對本季的財測：revenue 為營收中值，revenueLow／revenueHigh 為中值 ± 2%（FY2027 第四季為 ± 3%），grossMargin 為 GAAP 毛利率中值（區間一般為 ± 0.5 個百分點，寫在 extra.財測毛利率下緣／上緣），basis 標 GAAP；非 GAAP 毛利率、GAAP 與非 GAAP 營業費用財測寫在 extra.財測非GAAP毛利率、財測GAAP營業費用、財測非GAAP營業費用。FY2027 第四季財測（營收 1,300 億美元 ± 3%、毛利率 71.0–72.0%、GAAP 營業費用約 110 億美元，含多出的一週）沒有對應的已公布季度，寫在 events 2026-11-17 與 nvidia-drivers.yaml 的 guidance-revenue、guidance-gross-margin 序列。"
