editorial:
  status: "fact-checked"
  author: "fc2-data-nvidia"
  checkedBy: "fc2-check-nvidia"
  checkedOn: "2026-11-18"
  notes: "2026-11-18 整理（fc2-data-nvidia）：雲端業者資本支出以程式讀取五家公司的 SEC XBRL companyfacts，單季值由年初累計相減，並抽查 2026 年第三季 Alphabet 513.55、亞馬遜 772.59 億美元，與媒體整理的財報數字（uao-capex-20261101：514、773 億美元）一致；Meta 年度數字為購置支出加融資租賃本金，依 Meta 自己的資本支出口徑計算。中國營收逐一讀取 10-Q／10-K 的地理別營收表（依座標還原表格），帳單地址口徑三個季度加總與九個月累計值的差異在 1 百萬美元以內。CoWoS 產能、輝達占比與 2026 年以後的雲端資本支出展望都是外部估計或媒體報導，已標 estimate／forecast 與發布者。 2026-11-18 查核（fc2-check-nvidia）：五家雲端業者 185 個單季資本支出以程式重新由 SEC XBRL companyfacts 推算並逐點比對，最近 20 季另與 stockanalysis.com 現金流量表比對（100 點）；五家加總、年度值等於四季加總、Meta 年度購置加融資租賃本金都重算一致；發現 Meta 2020 與 2022 年第四季因只有全年值被重編、前三季未重編，使重編差額全部落在第四季（4,661 與 8,798），已改回原始口徑 4,613 與 9,043，五家合計同步改為 29,657 與 41,939。中國營收（帳單地址與總部口徑）抽查 10-Q／10-K 原文 20 個以上季度並重算占比；CoWoS 產能、輝達占比與高盛估計逐一對照 TrendForce 原文；Alphabet、Meta、亞馬遜 2026 年資本支出財測對照 MarketBeat、Meta 8-K 附件與 UAO 原文；財測序列與 nvidia-inputs.yaml 一致並對照各季新聞稿重新解析的數字；新興 AI 雲容量與前五大雲端業者資本支出預期對照法說會逐字稿。"
