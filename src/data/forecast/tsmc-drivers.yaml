editorial:
  status: "fact-checked"
  author: "fc2-data-tsmc"
  checkedBy: "fc2-check-tsmc"
  checkedOn: "2026-11-17"
  notes: "查核（fc2-check-tsmc，2026-11-17）：以程式解析重新下載的 43 份管理報告表格（PDF 文字座標），製程、平台與地區比重共 731 點全部與當季欄一致，地區別與 2018 年平台別另與次年同季報表的比較欄一致（重編值與 note 所記的首次公布值都核對過）；晶圓出貨 43 點、美元資本支出 43 點、美元營收 43 點、平均匯率 43 點與管理報告和財務報表一致；先進製程比重 23 點與財報新聞稿一致；財測序列（匯率假設 44 點、毛利率 44 點、營業利益率 44 點、美元營收 38 點）與新聞稿一致；年度序列與事件型序列逐條對照逐字稿與新聞稿原文。修正：2016Q1 美元資本支出改用當季管理報告的 1,151 百萬美元（原為之後報告四捨五入的 1,150）；折舊年增率序列的定義改為「最後一次說法」以符合 2023 年取 10 月下修值的做法；新製程稀釋序列補上公司對 10 奈米（2017 年下半年 2–3 個百分點，tr-2017q2）的說法；note 引用但 sources 缺少的逐字稿（tr-2017q2、tr-2022q4、tr-2023q1、tr-2024q2、tr-2025q1、tr-2025q2、tr-2026q1）補進 sources，tr-2024q2 的兩項說法（資本預算 300–320 億美元、營收成長略高於中 20%）已核對原文；2020 年第二、三季逐字稿的發行者更正為 FactSet CallStreet。原始整理說明：季度序列取自 2016Q1–2026Q3 各季管理報告（製程、平台、地區、晶圓出貨、美元資本支出）、財務報表（美元營收、平均匯率）與財報新聞稿（財測、先進製程比重）；晶圓出貨、匯率與美元營收已與下一季、次年同季報表的比較欄核對一致；平台別比重的當季欄與後續比較欄一致，地區別比重 2016–2019 年有少數重編（以最新數字為準）。2026Q2–Q3 的製程與平台比重與 src/content/financials/tsmc.json 一致。年度序列是公司在法說會的文字說法（附換算規則與原文），不是實際值。"
