# 聯發科（2454）財報模型的輸入資料：季財報（含每季財測）、月營收、事件。格式見 src/schemas/forecast.ts（companyInputs）；驅動因子（產品線營收占比、手機出貨、匯率、財測序列、ASIC 營收目標）在 mediatek-drivers.yaml。
# 金額單位：新台幣百萬元（財報原始單位為千元，保留到小數 3 位）；EPS 單位：元。
company: mediatek
currency: TWD
amountUnit: million
periodNote: "日曆季度（第一季為 1–3 月），TIFRS 合併報表（公開資訊觀測站合併綜合損益表與資產負債表）；第四季的損益流量為全年數減前三季累計，第四季 EPS 為全年基本 EPS 減前三季累計基本 EPS。grossProfit 為「營業毛利（毛損）淨額」；operatingExpenses 為營業費用合計（推銷、管理、研發與預期信用減損）；nonOperating 為營業外收入及支出合計（利息收入＋其他收入＋其他利益及損失－財務成本＋權益法投資損益；2019Q4（含）以前財報未單獨列示利息收入，併入其他收入；2020Q1 採 2020 年第二季起追溯重分類後的金額）；netIncome 為歸屬母公司業主淨利（公司新聞稿的 Net income 含非控制權益，列於 extra）；eps 為基本每股盈餘。guidance 為上一季法說會發布、針對本季的財測：營收區間（新台幣，公司以「億元」或「billion」表示，換算為百萬元）與中值、毛利率中值（區間一律為 ±1.5 個百分點）；營業費用率中值（區間 ±2 個百分點）與財測假設匯率列在 extra。2016Q1–2020Q2 的財測取自公開資訊觀測站的中文法說簡報（英文簡報未列），2020Q3 起取自英文法說簡報，2023Q2 取自 1Q23 法說逐字稿。extra 的「平均匯率（公司簡報）」為法說簡報揭露的當季美元兌新台幣平均匯率（2021Q1 起）。"
