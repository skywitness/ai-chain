events:
  - { date: "2021-07-27", title: "2021 年 5G 手機逾 5 億支", detail: "公司估計 2021 年全球 5G 智慧型手機超過 5 億支、為 2020 年的兩倍以上；首款 5G 旗艦晶片（台積電 4 奈米）按計畫在 2021 年底推出，公司持續將產品線擴展到旗艦市場。", src: "ir-2q21-call" }
  - { date: "2021-10-26", title: "5G 滲透率與首款旗艦晶片", detail: "公司估計 2021 年全球 5G 滲透率在 30% 後段（high-30s），2022 年將超過 50%；首款 5G 旗艦晶片已獲所有中國主要品牌採用，營收將於 2021 年底開始、2022 年第一季起放量，旗艦是聯發科的新市場。", src: "ir-3q21-call" }
  - { date: "2022-01-27", title: "天璣 9000 獲中國主要品牌採用", detail: "首款旗艦晶片天璣 9000 已獲所有中國主要手機品牌採用，首款機種預計 3 月上市；公司預期 2022 年 5G 滲透率由 30% 後段升至逾 50%，約 7 億支。", src: "ir-4q21-call" }
  - { date: "2022-04-27", title: "下修 2022 年手機市場看法", detail: "全球智慧型手機需求轉弱，公司改估 2022 年出貨約 13.5 億支、年增持平（先前為低個位數成長）；5G 滲透率 50% 的看法不變，約 6.6–6.8 億支。", src: "ir-1q22-call" }
  - { date: "2022-07-29", title: "2022 年手機出貨下修至 12–12.7 億支", detail: "因市場不確定性，公司再將 2022 年全球智慧型手機出貨估計下修至 12–12.7 億支；5G 手機約 6 億支、年增約 20%。", src: "ir-2q22-call" }
  - { date: "2022-10-28", title: "供應鏈庫存調整，第四季財測季減 16–24%", detail: "公司表示供應鏈仍在庫存調整週期，智慧型手機需求受客戶去化庫存影響；第四季營收財測 1,080–1,194 億元，季減 16%–24%，毛利率 48.5% ± 1.5 個百分點。", src: "ir-3q22-call" }
  - { date: "2023-02-03", title: "2023 年 5G 滲透率看法", detail: "公司預期 2023 年全球智慧型手機出貨小幅衰退，5G 滲透率由 2022 年的 40% 後段升至 50% 中段。", src: "ir-4q22-call" }
  - { date: "2023-04-28", title: "手機業務季減 20%，2023 年手機出貨約 11 億支", detail: "第一季手機營收季減 20%、占營收 46%，原因是消費需求疲弱與客戶更積極的庫存調整；公司估計 2023 年全球手機出貨降至約 11 億支，並表示不以殺價搶市占為策略。", src: "ir-1q23-call" }
  - { date: "2024-01-31", title: "2023 年旗艦營收成長 70%、逾 10 億美元", detail: "旗艦晶片營收 2023 年成長約 70%、超過 10 億美元（天璣 9300 採全大核架構）；公司預期 2024 年全球手機出貨低個位數成長至約 12 億支，5G 滲透率由 50% 後段升至 60% 前段。", src: "ir-4q23-call" }
  - { date: "2024-04-26", title: "一次性成本迴轉墊高毛利率", detail: "第一季毛利率 52.4%，含一次性成本迴轉（主要為過去確保產能的成本）約 4.5 個百分點，排除後約 47.9%；公司重申全年毛利率目標（排除一次性項目）為 47% ± 1 個百分點。", src: "ir-1q24-call" }
  - { date: "2025-02-07", title: "2024 年旗艦營收倍增至約 20 億美元", detail: "旗艦晶片營收 2024 年倍增至約 20 億美元；公司預期 2025 年全球手機出貨成長幅度與 2024 年相近，5G 滲透率由 60% 中段升至 60% 後段；第一季有部分產品因全球關稅不確定性而提前拉貨。", src: "ir-4q24-call" }
  - { date: "2025-04-30", title: "關稅不確定性", detail: "公司表示關稅情勢使全球市場不確定性升高，正密切監控庫存；直接來自美國的營收約占總營收 10%，直接衝擊有限，但會關注對其他市場經濟的間接影響。", src: "ir-1q25-call" }
  - { date: "2025-07-30", title: "2025 年旗艦目標 30 億美元，資料中心 ASIC 2026 年起貢獻", detail: "公司預期 2025 年旗艦手機晶片營收達 30 億美元（年增逾 40%）、連網業務逾 30 億美元、運算業務（平板、Chromebook 與 GB10）約 10 億美元（年增逾 80%）；企業級 ASIC 與車用各有逾 400 億美元的中長期營收潛在市場，資料中心 ASIC 等主要成長計畫的營收預期 2026 年開始放量。", src: "ir-2q25-call" }
  - { date: "2025-07-30", title: "新台幣升值對營收與毛利率的影響", detail: "第二季平均匯率約 30.9 元，較第一季的 32.9 元升值約 6.1%；公司說明新台幣每升值 1%，毛利率約減少 0.2 個百分點、營業利益率約減少 0.25 個百分點。第三季營收財測假設匯率 29 元，匯率差異對新台幣營收財測的影響約 6%；以美元計第三季營收財測為 44.9–48.3 億美元（季減 1%–8%）。第二季毛利率 49.1% 含與先前長期供貨協議（LTA）有關的一次性項目，貢獻約 1.9 個百分點。", src: "ir-2q25-call" }
  - { date: "2025-10-31", title: "雲端 ASIC：2026 年 10 億美元、2027 年數十億美元", detail: "首款 AI 加速器 ASIC 進度符合預期，公司預期 2026 年雲端 ASIC 營收 10 億美元、2027 年數十億美元，後續更複雜的專案預計 2028 年起貢獻；第三季天璣 9500 需求優於預期，實際匯率約 30 元優於財測假設的 29 元（公司說明新台幣每升值 1%，新台幣營收約減少 1%）。", src: "ir-3q25-call" }
  - { date: "2026-02-04", title: "記憶體與物料成本上升將壓抑 2026 年手機需求", detail: "2025 年營收 5,960 億元（年增 12.3%）、191 億美元（年增 15.6%）；手機業務逾 100 億美元，其中旗艦 30 億美元。公司表示記憶體與物料成本上升將使 2026 年手機終端需求受影響，第一季手機營收將明顯季減；供應鏈成本上升，公司將調整售價並依獲利分配產能；重申 2026 年資料中心 ASIC 營收超過 10 億美元、2027 年數十億美元。", src: "ir-4q25-call" }
  - { date: "2026-02-26", title: "IDC：2026 年手機出貨將衰退 12.9%", detail: "IDC 預測 2026 年全球智慧型手機出貨年減 12.9% 至約 11 億支，主因記憶體短缺推升成本，以低階機種為主的 Android 品牌受衝擊最大（第三方估計）。", src: "idc-2026-02" }
  - { date: "2026-04-30", title: "公司估計 2026 年手機出貨衰退約 15%", detail: "公司表示資源集中於資料中心推高手機成本，客戶漲價並轉向高階機種，預估 2026 年全球智慧型手機出貨衰退約 15%；第二季手機營收將再季減。AI 加速器 ASIC 預期第四季貢獻約 20 億美元，2027 年依已取得的產能可達數十億美元；智慧邊緣平台（不含資料中心 ASIC）2026 年可望成長雙位數，部分來自電視晶片反映 DRAM 成本而提高的平均售價。全年營收目標為以美元計年增中至高個位數，全年毛利率維持在當季財測區間內。", src: "ir-1q26-call" }
  - { date: "2026-07-31", title: "2027 年 AI ASIC 市場 800 億美元，市占目標 15–20%", detail: "公司預期 2026 年資料中心營收超過 20 億美元，2027 年可服務市場（SAM）800 億美元，市占目標由 10–15% 上調至 15–20%；第二款 AI 加速器 ASIC 預計 2028 年量產。2026 年手機出貨衰退約 15% 的看法不變，公司正調漲售價反映供應鏈成本；董事會核准 50 億美元的融資額度。全年營收目標改為原目標區間（以美元計年增中至高個位數）的上緣，即高個位數成長。", src: "ir-2q26-call" }
  - { date: "2026-08-26", title: "IDC：2026 年手機出貨衰退 16.7%、平均售價漲 27.6%", detail: "IDC 下修 2026 年全球手機出貨為年減 16.7%、略高於 10 億支，平均售價上漲 27.6% 至 581 美元，較上一季預測的年減 13.9% 更差；NAND 與 DRAM 成本年增逾 300%。兩天後的 2Q26 最終值新聞稿（2026-08-28，見 idc-promo）指出記憶體成本已占低階機種物料成本逾 65%（第三方估計）。", src: "idc-2026-08" }
  - { date: "2026-09-15", title: "發表 2 奈米旗艦晶片天璣 9600 Pro", detail: "聯發科發表首款 2 奈米旗艦手機晶片天璣 9600 Pro（另有 9600M），首批搭載的手機預計在第三季上市。", src: "mtk-pr-9600pro" }
  - { date: "2026-10-14", title: "IDC：第三季手機出貨年減 22%", detail: "IDC 初估 2026 年第三季全球智慧型手機出貨 2.553 億支、年減 22.0%，為單季最大跌幅；記憶體成本較去年上漲約 350%，IDC 預期市場到 2027 年仍受壓抑，復甦最快延至 2028 年（第三方估計）。", src: "idc-3q26" }
  - { date: "2026-10-30", title: "第四季 ASIC 約 25 億美元、2027 年目標約 160 億美元", detail: "首款 AI 加速器 ASIC 已於 9 月開始初期出貨，公司預期第四季營收約 25 億美元，2027 年達營收目標區間上緣、約 160 億美元（約占 AI 加速器 ASIC 市場 20%）；第二款預計 2028 年第一季量產，並已有第二家資料中心客戶、2028 年起貢獻。公司完成 39 億美元海外可轉換公司債發行，輝達（NVIDIA）與 Alphabet 參與認購。客戶名稱公司未公開。", src: "ir-3q26-call" }
  - { date: "2026-10-30", title: "第四季財測：營收季增 25–32%，毛利率下修 1 個百分點", detail: "第四季營收財測 2,101–2,218 億元（季增 25%–32%、年增 40%–48%，假設匯率 31.7 元），毛利率 45% ± 1.5 個百分點，營業費用率 26% ± 2 個百分點。公司說明資料中心業務毛利率目前低於公司平均，因此毛利率財測調低 1 個百分點，並已調整售價反映供應鏈成本；全年營收成長將超過先前以美元計高個位數的目標。", src: "ir-3q26-call" }
  - { date: "2026-10-30", title: "第三季存貨大增", detail: "第三季期末存貨 1,535 億元（上季 984 億元），存貨周轉天數 127 天（上季 102 天、去年同期 68 天）；營業活動淨現金流出 42.56 億元。", src: "ir-3q26-pr" }
