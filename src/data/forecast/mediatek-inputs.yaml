  notes: "2026-11-17 查核（fc2-check-mediatek）：以程式重抓公開資訊觀測站 t164sb04 全部 43 季（第四季以全年數比對四季加總）逐科目比對到千元，835 項中只有 2020 年業外組成因 2020Q1 未採追溯重分類而不一致，已改用重分類後金額（合計不變）；第四季 EPS 以全年減前三季累計 EPS 重算 10 年全數一致。另以每季法說簡報損益表與資產負債表（2016Q1–2020Q1 用中文版）比對 571 項與存貨 42 季（另重抓 t164sb03 核對 43 季存貨到千元，全數一致），僅 2022Q4 EPS 與公司公布的 11.66 元差 0.02 元（計算方式不同，已加註）；2021Q4 起營收、毛利、營業利益、淨利與 stockanalysis 80 項一致；月營收與 Yahoo 60 個月、本站 24 個月、公開資訊觀測站 9 個月份頁（含年初至今累計）一致。財測 43 季的營收區間、毛利率、營業費用率與假設匯率逐一與簡報文字比對（210 項）一致。事件 25 則逐則對照逐字稿與新聞稿：修正 4 則措辭（2021-07-27、2021-10-26、2025-07-30、2026-07-31），IDC 16.7% 預測改為首次發布日 2026-08-26 並新增來源 idc-2026-08，IDC 3Q26 新聞稿日期改為 2026-10-14。2026-11-17 建立（fc2-data-mediatek）：2016Q1–2026Q3 共 43 季損益與存貨逐季取自公開資訊觀測站 t164sb04／t164sb03（第四季以全年減前三季），各季加總關係（毛利－營業費用＝營業利益、營業利益＋業外＝稅前、業外與費用的組成）逐季驗算無誤；2022Q3 起的營收、毛利率、營益率與 src/content/financials/mediatek.json 逐季核對一致，2026Q1–Q3 另與法說簡報及新聞稿核對。月營收 130 個月取自公開資訊觀測站月營收彙總表，與 Yahoo 股市及本站月營收一致，且每季三個月加總等於季報營收。財測 2016Q1–2026Q4 共 44 季逐季抄自法說簡報（2016Q1–2020Q2 用中文版）。網站提供的檔案有兩處放錯：2023Q1 的簡報實為 2024Q1 簡報、2023Q3 的逐字稿實為 2024Q3 逐字稿，已改用其他文件。"
