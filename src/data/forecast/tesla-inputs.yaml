editorial:
  status: "fact-checked"
  author: "fc2-data-tesla"
  checkedBy: "fc2-check-tesla"
  checkedOn: "2026-11-17"
  notes: "2026-11-17 查核（fc2-check-tesla）：以程式重抓 SEC XBRL company facts（data.sec.gov），43 季的營收、毛利、營業費用、營業利益、稅前淨利、歸屬普通股股東淨利、研發、銷管、銷貨成本合計、存貨、資本支出、稀釋 EPS 與股數（依 1／3／15 倍分割換算）逐季比對，全數在四捨五入 1 百萬美元以內一致；2016–2018 年折舊攤銷與 2016–2020 年汽車租賃營收另比對 XBRL。以 PyMuPDF 依座標還原 2020Q3–2025Q2 共 14 份季度簡報的損益表、財務摘要、營運摘要與現金流量表，逐格比對各季標示的來源簡報（758 格），2016–2019 年分項比對 10-Q／10-K 損益表（R4 頁）與股東信，2025Q3–2026Q3 比對 2026 年第三季簡報原文，全數一致。修正：2019Q4（-12）、2021Q1（-101）、2021Q2（23）、2021Q3（51）、2025Q1（94）漏填 extra.重組及其他費用（原本研發＋銷管≠營業費用）；2017、2018 年度註記改正；2026-10-21 與 2026-01-28 事件依簡報原文修正措辭（SI 研發、FSD 訂閱口徑）。research/fin/tesla.json（stockanalysis）與本檔的營業利益差異大多來自該站把重組及其他費用移出營業利益（2024Q2、2025Q4 等季另有無法對應的差異），該站 2026Q3 毛利 6,280 也與 SEC XBRL 及公司簡報的 5,494 不符，本檔不採用該站數字。2018Q4 部分分項（租賃 250、能源 371、銷管 667、租賃成本 128）採 2018 年第四季股東信千元數字四捨五入，與 2019 年第四季簡報的百萬元數字差 1。建立時（fc2-data-tesla）：2016Q1–2026Q3 共 43 季。損益數字逐季與 SEC XBRL（sec-companyfacts）核對，差異都在四捨五入的 1 百萬美元以內；營收與成本分項逐季檢查加總（汽車銷售＋積分＋租賃＝汽車營收、三個分部合計＝總營收、營收－成本＝毛利、毛利－營業費用＝營業利益）。2022Q3–2026Q2 的營收、毛利率與營業利益率另與 src/content/financials/tesla.json（已查核）核對一致。research/fin/tesla.json（stockanalysis，2026-11-13 擷取）的部分季度毛利與營業利益與公司數字不同（例如 2026Q3 毛利 6,280、營業利益 1,504，公司為 5,494 與 718；2025Q3 營業利益 1,862，公司為 1,624），本檔一律採用公司文件與 SEC XBRL。"
