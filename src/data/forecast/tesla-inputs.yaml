events:
  - { date: "2016-11-21", title: "完成併購 SolarCity", detail: "併入太陽能公司 SolarCity，能源發電與儲能營收自此包含太陽能系統；公司分為汽車、能源發電與儲能兩個營運部門。2016Q4 能源營收由前一季的 23 跳升到 131 百萬美元。", src: "sec-2017q1-note1" }
  - { date: "2017-02-22", title: "預告 Model 3 於 7 月開始少量生產", detail: "2016 年第四季股東信預估 2017 上半年 Model S／X 交車 47,000–50,000 輛，Model 3 預計 7 月開始少量生產，並在量產前投入 20–25 億美元資本支出。", src: "letter-q4-2016" }
  - { date: "2019-10-23", title: "Model 3 成為交車主力", detail: "2019 年第三季 Model 3 交車 79,703 輛、Model S／X 17,483 輛；Model 3 交車占比由 2018Q3 的 67% 升到 82%，汽車毛利率由 2019Q2 的 18.9% 回升到 22.8%。", src: "letter-q3-2019" }
  - { date: "2021-01-27", title: "上海廠開始生產 Model Y，Fremont 改裝 Model S／X 產線", detail: "上海超級工廠 2020 年 12 月開始生產 Model Y；Fremont 工廠為新款 Model S／X 改裝產線（2021Q1 Model S／X 產量為 0）。公司說明 2020 年第四季平均售價年減 11%，原因是產品組合轉向 Model 3／Y，以及中國製 Model 3 與 Model S／X 降價。", src: "deck-q4-2020" }
  - { date: "2022-01-26", title: "供應鏈成為主要限制", detail: "公司表示自家工廠已連續數季低於產能運轉，供應鏈是主要限制，可能延續整個 2022 年；原物料、大宗商品、物流與加急成本上升拉低獲利。", src: "deck-q4-2021" }
  - { date: "2023-01-25", title: "FSD Beta 廣泛釋出，一次認列 3.24 億美元", detail: "2022Q4 因 FSD Beta 在美國與加拿大廣泛釋出，於汽車銷售認列 3.24 億美元 FSD 營收，另有近 10 億美元遞延營收將隨時間認列；公司提到利率上升與「車價通縮」，2023 年目標約 180 萬輛。", src: "deck-q4-2022" }
  - { date: "2023-04-19", title: "多款車型在各地區降價", detail: "2023 年第一季在多個地區調降多款車型售價，公司表示營業利益率下降幅度「可控」，未來定價可能上調或下調；營收年增但平均售價（不含匯率）年減。", src: "deck-q1-2023" }
  - { date: "2023-07-19", title: "降價後營業利益率約 10%", detail: "第一季與第二季初的降價之後，第二季營業利益率仍約 10%；每輛車成本下降，包含原物料成本降低與美國《降低通膨法案》（IRA）生產抵減。", src: "deck-q2-2023" }
  - { date: "2023-10-18", title: "每輛車銷貨成本降至約 37,500 美元", detail: "第三季每輛車銷貨成本（汽車銷售成本 ÷ 非租賃交車）約 37,500 美元；平均售價因降價與產品組合下滑；Cybertruck 預計 2023 年 11 月開始交車。", src: "deck-q3-2023" }
  - { date: "2024-01-24", title: "處於兩波成長之間，2024 年交車成長可能明顯放緩", detail: "公司表示 2024 年車輛成長率可能明顯低於 2023 年，團隊正準備下一代車款；儲能部署與能源營收成長預計快於汽車業務。Cybertruck 已開始生產並交付首批客戶。", src: "deck-q4-2023" }
  - { date: "2024-04-23", title: "加速推出含平價車款的新車", detail: "公司把新車款（含較平價車款）提前到 2025 下半年之前推出，沿用現有產線，成本下降幅度會小於原先預期；現有產能接近 300 萬輛。FSD 營收因 Autopark 功能釋出而年增。", src: "deck-q1-2024" }
  - { date: "2024-07-23", title: "監管積分創新高、FSD 降價", detail: "第二季監管積分營收 8.90 億美元創新高，公司說明其他車廠仍未達排放規定；北美 FSD（Supervised）降價並提供免費試用；本季重組費用 6.22 億美元；AI 基礎設施資本支出 6 億美元。", src: "deck-q2-2024" }
  - { date: "2024-10-23", title: "預估 2024 年交車小幅成長、儲能部署倍增", detail: "公司預估 2024 年交車小幅成長、儲能部署年增超過一倍；本季 FSD 營收因 Cybertruck 與 Actually Smart Summon 功能釋出而增加。", src: "deck-q3-2024" }
  - { date: "2025-01-29", title: "每輛車銷貨成本降到 35,000 美元以下", detail: "第四季每輛車銷貨成本降到 35,000 美元以下的歷史低點，主因原物料成本下降；公司預期 2025 年汽車業務回到成長、儲能部署年增至少 50%；新款 Model Y 上市，平價車款預計 2025 上半年生產，Cybercab 預計 2026 年量產。", src: "deck-q4-2024" }
  - { date: "2025-04-22", title: "關稅與貿易政策不確定，暫緩 2025 年展望", detail: "公司表示難以衡量貿易政策對供應鏈、成本與需求的影響，對能源業務的影響相對較大，將在第二季簡報再檢視 2025 年展望；平均售價因產品組合與銷售優惠下滑；推出符合 IRA 規定的 4680 電池，使 Cybertruck 適用 7,500 美元消費者抵減。", src: "deck-q1-2025" }
  - { date: "2025-07-23", title: "Robotaxi 在奧斯汀上線、平價車款試產", detail: "6 月在奧斯汀推出 Robotaxi 服務（有安全員隨車）；6 月試產較平價車款，量產排在 2025 下半年；Semi 與 Cybercab 預計 2026 年量產。關稅增加每輛車成本，監管積分營收年減。展望未提供交車成長數字。", src: "deck-q2-2025" }
  - { date: "2025-10-22", title: "美國電動車抵減到期，推出 Standard 車款", detail: "美國聯邦電動車租稅抵減已到期，公司 10 月推出 Model 3 Standard（36,990 美元起）與 Model Y Standard（39,990 美元起）。Cybercab、Semi 與 Megapack 3 預計 2026 年量產；關稅與固定成本分攤使每輛車成本上升；監管積分營收 4.17 億美元（前一年同季 7.39 億美元）。", src: "ex-q3-2025" }
  - { date: "2025-12-09", title: "BNEF：電池包均價降到每 kWh 108 美元", detail: "BloombergNEF 年度調查（第三方估計）：2025 年鋰電池包平均價格年減 8% 至每 kWh 108 美元，儲能用電池包降 45% 至 70 美元，電動車電池包 99 美元；BNEF 預期 2026 年續降。", src: "bnef-2025" }
  - { date: "2026-01-28", title: "FSD 改為只提供訂閱", detail: "公司宣布 FSD（Supervised）停售一次買斷、改為只提供月訂閱；有效 FSD 訂閱數 110 萬（年增 38%；公司口徑含一次買斷與月訂閱、不含免費試用）；奧斯汀開始在部分 Robotaxi 行程移除安全員；Cybercab 預計 2026 上半年開始爬坡，Optimus 第三代預計 2026 年底前開始生產；同意投資 xAI 約 20 億美元；關稅與固定成本分攤使每輛車成本上升。", src: "ex-q4-2025" }
  - { date: "2026-04-22", title: "電池包產能成為交車成長瓶頸", detail: "公司表示電池包產能是全球車輛增產的限制；第一季汽車與能源有保固及關稅相關的一次性利益，材料成本下降使每輛車成本降低；監管積分營收 3.80 億美元（前一年同季 5.95 億美元）；FSD 訂閱 128 萬；Fremont 的 Model S／X 產線將改為 Optimus 產線。", src: "ex-q1-2026" }
  - { date: "2026-07-22", title: "Cybercab 在德州開始生產，Model S／X 產線停用", detail: "Cybercab 在德州超級工廠開始生產；Fremont 的 Model S／X 產線停用並改建 Optimus 產線；進口關稅降低使每輛車成本下降，但能源業務因供應商電芯問題提列保固費用；監管積分營收降到 1.46 億美元；FSD 訂閱 148 萬、北美新車搭載率超過 55%；公司提到德州晶圓廠要確保邏輯晶片與記憶體晶片的長期供應（未提記憶體成本影響）。", src: "ex-q2-2026" }
  - { date: "2026-09-29", title: "公司彙整第三季交車共識 461,974 輛", detail: "特斯拉投資人關係網站公布 24 位分析師的第三季交車共識 461,974 輛、儲能部署 15.9 GWh，2026 全年交車共識 1,767,255 輛（第三方估計，公司不背書）。實際第三季交車 486,532 輛、儲能 13.7 GWh。", src: "consensus-q3-2026" }
  - { date: "2026-10-21", title: "Semi 與 Optimus 開始生產，監管積分降到 1.13 億美元", detail: "Cybercab 9 月 3 日起在奧斯汀載客；Semi 在內華達量產線開始生產，Optimus 在 Fremont 開始生產；德州 Megafactory 開始生產（規劃 50 GWh）。能源營收部分受關稅相關的客戶退款影響；監管積分營收 1.13 億美元（前一年同季 4.17 億美元）；營業費用增加來自公司稱為 SI（超級智慧）的研發與其他研發專案、股份基礎給付（含 2025 年執行長績效獎酬）與銷管費用；公司計畫年底前把 SI 訓練運算擴大到 400 MW。展望仍無數字財測。", src: "ex-q3-2026" }
