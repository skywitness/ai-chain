# 特斯拉（Tesla）財報模型的輸入資料：季損益、營收與成本分項、監管積分、存貨、折舊攤銷、資本支出、事件。格式見 src/schemas/forecast.ts（companyInputs）。
# 由 fc2-data-tesla 整理；交車、生產、儲能部署等驅動因子在 tesla-drivers.yaml；模型輸出見 tesla-model.json（由 scripts/models/tesla.ts 產生）。

company: "tesla"
currency: "USD"
amountUnit: "million"
periodNote: "特斯拉會計年度與日曆年相同，季度為日曆季度（2026Q3＝2026-07-01 至 2026-09-30）。金額單位為百萬美元（US GAAP）。revenue、grossProfit、operatingExpenses、operatingIncome、pretaxIncome、netIncome（歸屬普通股股東）以公司當季文件為準，並與 SEC XBRL（sec-companyfacts）逐季核對，差異都在四捨五入的 1 百萬美元以內；2016Q1–2019Q3 取自 10-Q／10-K 損益表（SEC 互動式報表 R 頁）與當時的股東信（2016Q4 以 2017 年 10-K 的 2016 全年減前三季累計求得）；2019Q4–2025Q2 取自各季簡報（Update）的損益表，同一季出現在多份簡報時採用最新一份（含重編）；2025Q3–2026Q3 取自 2026 年第三季簡報（ex-q3-2026）。nonOperating＝pretaxIncome－operatingIncome（利息收支、匯兌與其他，2024 年起含數位資產公允價值變動）。2024 年第四季公司採用加密資產公允價值會計（ASU 2023-08）並自 2024-01-01 追溯，2024 年各季淨利、EPS 為重編後數字（例如 2024Q1 淨利 1,390，原公布 1,129）。2023Q4 淨利含遞延所得稅資產評價準備迴轉約 59 億美元的一次性利益。eps 為 GAAP 稀釋每股盈餘、sharesDiluted 為稀釋加權平均股數（百萬股），一律換算為 2022 年 8 月 3 比 1 分割後的股數基礎：2020 年 8 月 5 比 1 分割前公布的數字除以 15（股數乘以 15），2020 年 8 月至 2022 年 8 月間公布的數字除以 3（股數乘以 3）；原始數字寫在各季 note。inventory 為期末存貨（SEC XBRL InventoryNet）；depreciation 為現金流量表的「折舊、攤銷與減損」（2016–2018 年 10-Q 只有「折舊與攤銷」）；capex 為現金流量表的資本支出（SEC XBRL PaymentsToAcquirePropertyPlantAndEquipment，取最新申報值；公司自 2025 年第一季起把太陽能系統購置併入資本支出並重編 2024 年，2023 年以前不含太陽能系統購置，每季差額多在數千萬美元以內）。extra 的鍵：汽車營收＝汽車銷售＋監管積分＋汽車租賃；汽車銷售營收不含監管積分與租賃（2021Q3 以前公司把積分列在汽車銷售內，本表已扣除；2016Q1–2018Q2 積分金額未逐季揭露，故不填）；監管積分營收為公司揭露的全部監管積分（含 ZEV、溫室氣體與 CAFE 積分，2018Q3 起）；汽車銷售成本、汽車租賃成本、能源營業成本、服務及其他營業成本取自損益表；汽車毛利率＝（汽車營收－汽車營業成本）÷ 汽車營收；汽車毛利率不含積分＝（汽車毛利－監管積分）÷（汽車營收－監管積分），與公司非 GAAP 定義相同；能源毛利率、服務及其他毛利率同理（%，四捨五入到 0.1）。2016 年起的「服務及其他」為 2017 年 10-Q 重分類後的口徑；2016 年 11 月 21 日併購 SolarCity 前的能源營收只含儲能。特斯拉不提供營收、毛利率或 EPS 財測，因此 guidance 欄位全部留空；公司對交車量、儲能部署的定性說法寫在 events。"
