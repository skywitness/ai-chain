editorial:
  status: "fact-checked"
  author: "fc2-data-tesla"
  checkedBy: "fc2-check-tesla"
  checkedOn: "2026-11-17"
  notes: "2026-11-17 模型審查（fc2-model-review-tesla）：2027 年交車與儲能部署的全年共識改用 2026-09-29 公布的數字（consensus-q3-2026-dtc：約 192 萬輛、76.0 GWh），原本 6 月公布的數字（1,824,568 輛、79.8 GWh）寫在 note；6 月的 2027 年數字是在 2026 年共識上修之前公布的。2026-11-17 查核（fc2-check-tesla）：2019Q3–2025Q2 的分車款生產與交車、租賃交車、庫存天數、儲能部署與監管積分，逐格比對各點標示的季度簡報（以 PyMuPDF 依座標還原表格）；2018Q3–2019Q3 比對 2019 年第三季股東信與 2019Q4、2020Q1、2020Q2 簡報；2016Q3–Q4 比對 2016 年第四季股東信；2016Q1–2018Q2 比對維基百科表格；2025Q3–2026Q3（含 FSD 訂閱數）比對 2026 年第三季簡報原文；2017、2018 年儲能與 2016–2018 年監管積分比對股東信與 2020 年第四季簡報年度摘要；分析師共識 13 個數字逐一比對三篇轉載報導。每輛車售價與成本由 tesla-inputs.yaml 重算一致（差 2 美元以內；2018Q4、2019Q1 用千元數字，差 6 美元以內）；交車與產量的分車款加總等於總數。修正：庫存天數 2019Q2、2019Q3 改用較新簡報的重編數字 19 與 18（新增來源 ex-q2-2020、deck-q3-2020）；儲能部署與 FSD 訂閱數的定義依原文改正（MWh 改 GWh 的時點、Active FSD Subscriptions 含一次買斷）；共識的註記補上各歷史數字的出處。建立時（fc2-data-tesla）：交車、生產、租賃、庫存天數與儲能部署 2018Q3 起取自公司股東信與季度簡報的營運摘要（同一季取最新一份），2016Q1–2018Q2 交車與產量取自維基百科彙整的產銷新聞稿數字（2016Q3–Q4 以股東信核對）；2025Q3–2026Q3 取自 2026 年第三季簡報，並與維基百科表格核對一致。每輛車售價與成本為本站推算（status: estimate），其中成本推算值與公司公布的 2023Q3、2024Q4 數字一致。分析師共識為特斯拉公司彙整、經媒體轉載的第三方估計。"
