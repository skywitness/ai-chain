events:
  - { date: "2025-03-28", title: "xAI 以全股票併購 X Holdings", detail: "X（前 Twitter）併入 xAI；因與 SpaceX 同受馬斯克控制，SpaceX 的財報追溯合併 X 與 xAI 的歷史數字，AI 部門營收因此包含 X 的廣告與訂閱收入。", src: "sec-424b4" }
  - { date: "2025-09-07", title: "簽約收購 EchoStar 頻譜", detail: "與 EchoStar 簽訂頻譜執照購買協議（AWS-4 與 H-Block 共 50 MHz，2025-11 再加入最多 15 MHz 的 AWS-3），供 Starlink Mobile 直連手機服務使用；FCC 在 2026-05-12 核准，執照 5 月 22 日先移轉至信託，待後續完成收購。", src: "sec-10q-q3-2026" }
  - { date: "2026-02-02", title: "SpaceX 併購 xAI", detail: "以全股票併購 xAI，屬共同控制下的合併，財報追溯合併；自 2026 年第一季起改為太空、連網、AI 三個營運部門。", src: "sec-424b4" }
  - { date: "2026-05-06", title: "與 Anthropic 簽訂雲端服務合約", detail: "招股書：2026 年 5 月與 Anthropic 簽訂雲端服務合約，Anthropic 使用 Colossus 與 Colossus II 約 32.5 萬顆 NVIDIA GPU 的算力，每月付費 12.5 億美元至 2029 年 5 月，5、6 月爬坡期間費用較低；最初三個月後任一方可提前 90 天通知終止。日期為雙方公布合作的日期（Tech Wire Asia 2026-05-08 報導）。", src: "sec-424b4" }
  - { date: "2026-05-22", title: "Starship 第 12 次試飛（首次 V3）", detail: "新一代 Starship V3 與 Super Heavy 首飛，屬次軌道試飛；上層級部署 20 顆模擬衛星與 2 顆改裝的 Starlink 衛星（測試 V3 硬體）後在印度洋受控濺落，助推器回收失敗。", src: "wiki-starship-launches" }
  - { date: "2026-06-05", title: "Google 簽約使用 SpaceX 算力", detail: "Google 自 2026 年 10 月至 2029 年 6 月每月支付 9.2 億美元，使用約 11 萬顆 NVIDIA GPU 與相關運算設備，9 月前爬坡期間費用較低；若 SpaceX 未在 9 月底前交付約定的 GPU，Google 可終止或按比例減費；2026 年底後任一方可提前 90 天通知終止。", src: "sec-fwp-google" }
  - { date: "2026-06-12", title: "於 Nasdaq 掛牌（代號 SPCX）", detail: "每股發行價 135 美元，在 Nasdaq Global Select Market 與 Nasdaq Texas 掛牌；6 月 15 日完成發行共 638,888,888 股 A 類普通股（含超額配售），淨募資約 857 億美元（第二季財報新聞稿）。", src: "sec-8k-ipo" }
  - { date: "2026-06-26", title: "發行 250 億美元投資等級公司債", detail: "分五個年期（2031–2056 年到期），年利率 5.35%–6.65%，加權平均 5.855%。", src: "pr-q2-2026" }
  - { date: "2026-07-24", title: "Starship 第 13 次試飛", detail: "部署 20 顆量產型 Starlink V3 衛星；第二季財報新聞稿（pr-q2-2026）另指出本次示範了太空中重新點燃 Raptor 引擎。", src: "wiki-starship-launches" }
  - { date: "2026-08-04", title: "首份季報與年底 1,000 億美元年化營收目標", detail: "第二季營收 78.1 億美元、年增 92%。財務長表示第三季初已再簽約 67 億美元、為期六個月、10 月起爬坡的雲端服務營收，加上 Cursor，可望在 2026 年 12 月達到 1,000 億美元的年化營收（以 12 月單月營收計）；年底算力預估超過 2 GW；下兩季資本支出與第二季（183.7 億美元）相近。", src: "tr-q2-2026" }
  - { date: "2026-08-14", title: "完成併購 Cursor", detail: "隱含股權價值 600 億美元；GAAP 收購對價 425 億美元，另有 234 億美元的股權獎酬歸屬於併購後服務，會在員工後續服務期間陸續認列為股份基礎給付。8 月 14 日至 9 月底 Cursor 貢獻營收 6.08 億美元。", src: "pr-q3-2026" }
  - { date: "2026-09-28", title: "Starship 第 14 次飛行首度進入軌道", detail: "第一次進入軌道，部署 26 顆可運作的 Starlink V3 衛星；第三季財報新聞稿（pr-q3-2026）稱新增下行容量約為一次 Falcon 9 Starlink 發射的 10 倍。", src: "wiki-starship-launches" }
  - { date: "2026-10-08", title: "簽約收購 800 MHz 頻譜", detail: "取得全美最多 14 MHz 成對的 800 MHz 低頻段頻譜執照，推進 Starlink Mobile 直連手機策略，預計 2027 上半年完成。", src: "pr-q3-2026" }
  - { date: "2026-10-20", title: "第三季財報與第四季、2027 年第一季財測", detail: "第三季營收 145.8 億美元、年增 161%。財務長預估第四季資本支出 350–400 億美元，第四季整體毛利率回到與第二季（55.3%）相近的水準（第三季有一次性利益與客戶組合因素），2027 年第一季營收 330–370 億美元；重申 12 月年化營收 1,000 億美元目標；算力 10 月底接近 2 GW、年底 2.5–3 GW；算力租賃價格略高於先前所說每瓦 30–50 美元區間的上緣，新部署回收期不到一年。未完成合約 630 億美元，約 420 億美元預計一年內認列。", src: "tr-q3-2026" }
  - { date: "2026-10-20", title: "馬斯克：2027 年再增加 10 GW 算力", detail: "馬斯克表示有把握在 2027 年再增加 10 GW 算力，年底合計約 13 GW，並以增加 20 GW 電力與冷卻為目標；每月可上線約 20 萬顆 GB300，2027 年以 Vera Rubin 為主。這是執行長的口頭目標，不是正式財測。", src: "tr-q3-2026" }
  - { date: "2026-10-20", title: "成立特別委員會評估與 Tesla 合併", detail: "SpaceX 與 Tesla 的董事會各自成立特別委員會，評估兩家公司的潛在合併；尚未做出任何決定，也不保證會達成協議。", src: "sec-10q-q3-2026" }
  - { date: "2026-10-24", title: "與 Apollo 簽訂約 400 億美元的 GPU 融資租賃承諾", detail: "由 Apollo 管理的實體購入 GPU 機櫃與相關設備再出租給 SpaceX，分批交貨、每批租期約 5–5.25 年，本金合計約 400 億美元，租約預計年底前簽訂、2027 上半年起租。本站說明：以融資租賃取得的設備不計入現金流量表的購置不動產廠房設備支出，可能使帳上資本支出低於實際算力投資。", src: "sec-8k-apollo" }
  - { date: "2026-11-13", title: "Starship 第 15 次飛行首度以發射塔接住上層級", detail: "部署 26 顆 Starlink 衛星，上層級飛行約 22 小時後返回星際基地由發射塔接住，是 Starship 上層級首次被接住；助推器因燃料不足改在外海濺落。", src: "wiki-starship-launches" }
