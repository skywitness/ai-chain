  notes: "合併損益逐季比對 SEC XBRL（sec-companyfacts）與兩份財報新聞稿；部門數字三個部門相加等於合併數（每季營收、營業損益、資本支出、折舊、銷貨成本都已驗算）；2025Q4 以全年減前九個月推算，與招股書全年數一致；與 src/content/financials/spacex.json 的 2025Q1、2025Q2、2026Q1、2026Q2 營收、毛利率、營業利益、淨利、資本支出與部門營收逐項一致（該檔 2026Q1 淨利 −4,276 為合併淨利，本檔同）。新增 2025Q3、2025Q4、2026Q3。2024 年以前沒有單季資料，只有 2023–2025 年度數。查核（fc2-check-spacex，2026-11-17）：以 research/tmp 腳本逐項比對 732 個數值，來源為 SEC XBRL（兩份 10-Q）、招股書與第三季 8-K 的 EDGAR Online 表格擷取、第二季新聞稿上半年欄與 10-Q 營運指標表，結果全部吻合；2025Q4 以招股書全年減前九個月重算一致。修正：Anthropic 事件日期改為公布日 2026-05-06；Google 合約改引一手 FWP；IPO 價格改引 8-K；Starship 第 12、14 次飛行、Cursor 股權獎酬認列期間、EchoStar 執照移轉、800 MHz 說法依原文修正；periodNote 中 2025Q1 推算方式的說明更正。"
