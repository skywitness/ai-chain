periodNote: "會計年度與曆年相同，季度為日曆季度（2025Q1＝2025-01-01 至 2025-03-31）。SpaceX 在 2026-06-12 於 Nasdaq 與 Nasdaq Texas 掛牌（代號 SPCX），上市前是私人公司，招股書（sec-424b4）只揭露 2023–2025 年度與 2025、2026 年第一季財報，沒有 2024 年以前的單季數字，因此季資料只有 2025Q1–2026Q3 共 7 季。2026-02-02 併購 xAI（xAI 在 2025-03-28 併入 X Holdings）屬共同控制下的合併，所有期間都追溯合併 xAI 與 X（前 Twitter）。季度數字的取得方式：2025Q2、2026Q2 取自第二季財報新聞稿與 10-Q；2025Q3、2026Q3 取自第三季財報新聞稿與 10-Q；2026Q1 取自招股書（與第二季新聞稿的比較欄一致）；2025Q1 的部門數字以第二季新聞稿的上半年數減第二季推算（若改用第三季新聞稿的前九個月數減第二、三季，消費者、企業與政府、廣告、AI 解決方案、連網營業利益、太空與 AI 調整後 EBITDA 等幾項會差 100–200 萬美元；招股書原列連網 2,475、AI 727，差 100 萬美元屬四捨五入或重分類），合併損益與招股書相同；2025Q4 以招股書的 2025 全年減第三季 10-Q 的前九個月推算。各季相加與年度或前九個月的公布數可能因各份報告四捨五入或小幅重分類相差 100–200 萬美元（例如 2025 年資本支出四季相加 20,736，年度公布 20,737）。金額單位為百萬美元。grossProfit＝營收－銷貨成本（cost of revenue）；operatingExpenses＝研發＋管銷＋重組費用＋減損；operatingIncome 為 GAAP 營業損益（已扣股份基礎給付、重組與減損）；nonOperating＝利息收入－利息費用＋其他收支淨額，等於 pretaxIncome－operatingIncome；netIncome 為合併淨利（2026Q1 歸屬普通股股東的淨損另含特別股視同股利 6.71 億美元，見 extra）；eps 為 GAAP 稀釋每股盈餘（美元），sharesDiluted 為稀釋加權平均股數（百萬股）；depreciation 為折舊攤銷（調整後 EBITDA 調節表）；capex 為現金流量表的購置不動產廠房設備支出，等於公司「Capex」表；inventory 為期末存貨（2025 年前三季資產負債表未揭露）。extra（百萬美元，另註明者除外）：三個部門的營收、營業損益、調整後 EBITDA（非 GAAP）、資本支出、折舊攤銷與銷貨成本；營收細項（發射服務、發射與開發、消費者、企業與政府、廣告、AI 解決方案與基礎設施）；研發、管銷、重組、減損、股份基礎給付；利息費用（正值）、利息收入、其他收支淨額、所得稅（負值為所得稅利益）；營業活動現金流（第二至四季為年初至今累計值相減）；不動產廠房設備淨額（期末）。AI 部門自 2026 年第三季起改稱 SI（Super Intelligence）部門，範圍不變（pr-q3-2026 Note 2）；本檔沿用「AI部門」鍵名。Stock Analysis 的營業利益（sa-q）排除併購相關股份基礎給付與重組費用，與本檔的 GAAP 口徑不同。"
