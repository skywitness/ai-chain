editorial:
  status: "fact-checked"
  author: "fc2-data-tsmc"
  checkedBy: "fc2-check-tsmc"
  checkedOn: "2026-11-17"
  notes: "查核（fc2-check-tsmc，2026-11-17）：以程式重新下載台積電投資人關係網站的 43 份財務報表、43 份管理報告、44 份財報新聞稿、23 份逐字稿與歷史月營收試算表逐項比對：43 季的損益、EPS、股數、存貨、折舊攤銷、資本支出、研發與管銷、其他營業收支、所得稅、美元營收與平均匯率全部與財務報表一致；2016Q1–2026Q4 共 44 季的財測（營收區間、匯率假設、毛利率、營業利益率與發布日）與新聞稿一致；130 個月營收與公司試算表一致，2021-11 起的 60 個月另與 Yahoo 股市一致；20 季營收與毛利和 stockanalysis.com 一致（第四季淨利、每股盈餘與 2022Q1、2025Q1、2025Q4 營業利益的差異來自該站以全年減前三季推算，以公司報表為準）；內部勾稽（毛利－營業費用＝營業利益、營業利益＋業外＝稅前、稅前－所得稅≈淨利、淨利÷股數＝EPS、美元營收×匯率＝營收、財測中值與區間、新台幣財測＝美元財測×匯率假設）全部通過；各季毛利率說明與管理報告一致；事件逐條對照逐字稿或新聞稿。修正：4 則事件原本寫入引用來源發布時尚未公布的後續季度數字（10、7、5、3 奈米首次貢獻營收的事件），改為只寫該來源的內容，10 奈米事件改引逐字稿 tr-2017q2；2020 年第二、三季逐字稿的發行者更正為 FactSet CallStreet。已知現象：2025Q3 起折舊攤銷由 1,880.6 億元降至 1,627.9 億元，財務報表與 stockanalysis.com 一致，但管理報告與逐字稿未說明原因。原始整理說明：2016Q1–2026Q3 共 43 季，全部取自台積電投資人關係網站各季法說資料（財務報表、管理報告、財報新聞稿、逐字稿），以 2026-11-17 讀取的 PDF 擷取。每季的損益、存貨、折舊攤銷與資本支出都以下一季與次年同季報表的比較欄交叉核對（43 季完全一致），季營收與月營收加總一致（差異 ≤3 百萬元），美元營收與平均匯率與管理報告摘要表一致；2022Q4–2026Q3 的營收、毛利率與營業利益率與 src/content/financials/tsmc.json 逐季一致（月營收差異來自公司月營收檔取整到百萬元，小於 1 百萬元）。stockanalysis.com（research/fin/tsmc.json）的部分第四季數字與 2022Q1、2025Q1 營業利益與公司報表不同（第四季由全年減前三季推算、口徑不同），一律以公司報表為準。"
