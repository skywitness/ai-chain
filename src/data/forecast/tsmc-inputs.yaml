events:
  - { date: "2017-07-13", title: "匯率對毛利率的敏感度約 0.4 個百分點", detail: "財務長說明營收幾乎全以美元計價，新台幣兌美元每變動 1%，毛利率約變動 0.4 個百分點，實際幅度依製程而異；新台幣營收則幾乎同比例變動。", src: "tr-2017q2" }
  - { date: "2017-07-13", title: "10 奈米開始貢獻營收", detail: "10 奈米在 2017 年第二季首次貢獻晶圓營收 1%；第三季開始大量生產，財務長預估 10 奈米放量將使 2017 年下半年毛利率被稀釋約 2–3 個百分點（第三季的影響已含在財測中）。", src: "tr-2017q2" }
  - { date: "2017-07-13", title: "營收財測改以美元公布", detail: "自 2017 年第三季的財測起，營收財測由新台幣區間改為美元區間（第三季 81.2–82.2 億美元），毛利率與營業利益率財測另附匯率假設（1 美元兌 30.3 元）。", src: "er-2017q2" }
  - { date: "2018-07-19", title: "7 奈米量產稀釋毛利率", detail: "公司預估 7 奈米約占第三季晶圓營收 10%，稀釋毛利率略高於 1 個百分點；第四季占比超過 20%，稀釋約 2.5 個百分點。", src: "tr-2018q2" }
  - { date: "2018-10-18", title: "7 奈米開始貢獻營收、電腦病毒事件", detail: "7 奈米在 2018 年第三季首次貢獻晶圓營收 11%；管理報告說明當季較有利的匯率被 8 月 3 日電腦病毒事件的影響抵銷，毛利率季減 0.4 個百分點至 47.4%。", src: "mr-2018q3" }
  - { date: "2019-04-18", title: "光阻劑原料瑕疵事件", detail: "2019 年第一季毛利率降至 41.3%，管理報告說明主因產能利用率下降與光阻劑原料瑕疵事件。", src: "mr-2019q1" }
  - { date: "2020-04-16", title: "5 奈米下半年稀釋 2–3 個百分點", detail: "財務長預估 5 奈米快速放量將使 2020 年下半年毛利率被稀釋約 2–3 個百分點。", src: "tr-2020q1" }
  - { date: "2020-07-16", title: "美國出口管制新規、資本支出上調", detail: "公司在法說會說明美國商務部 2020-05-15 公布的出口管制新規；預估第四季 5 奈米稀釋毛利率約 2–3 個百分點；2020 年資本支出上調為 160–170 億美元。", src: "tr-2020q2" }
  - { date: "2020-10-15", title: "5 奈米開始貢獻營收、停止出貨給華為", detail: "5 奈米在 2020 年第三季首次貢獻晶圓營收 8%，公司預估 5 奈米約占 2020 年全年晶圓營收 8%；公司預估 2021 年全年 5 奈米稀釋毛利率約 2–3 個百分點；依美國規定，9 月中以後不再出貨給華為，第四季財測不含華為。", src: "tr-2020q3" }
  - { date: "2021-04-15", title: "2021 年資本支出上調至約 300 億美元", detail: "因先進與特殊製程需求增加，2021 年資本支出由 250–280 億美元上調至約 300 億美元。", src: "tr-2021q1" }
  - { date: "2021-10-14", title: "第四季財測含捐贈疫苗費用", detail: "2021 年第四季營業利益率財測已含捐贈疫苗相關費用，約影響營業利益率 1 個百分點。", src: "er-2021q3" }
  - { date: "2022-01-13", title: "長期毛利率目標 53% 以上", detail: "財務長表示訂價維持策略性、並持續改善成本，長期毛利率 53% 以上可以達成，景氣循環中的股東權益報酬率可達 25% 以上。", src: "tr-2021q4" }
  - { date: "2022-10-13", title: "2022 年資本支出下修至約 360 億美元", detail: "因短期不確定性，2022 年資本支出由 400–440 億美元的下緣再下修至約 360 億美元。", src: "tr-2022q3" }
  - { date: "2023-01-12", title: "匯率貢獻毛利率 1.4 個百分點、折舊將增約 30%", detail: "2022 年第四季毛利率季增 1.8 個百分點，其中約 1.4 個百分點來自新台幣貶值（平均匯率由 30.32 到 31.39）；預估 2023 年折舊費用年增約 30%，主要來自 3 奈米量產。", src: "tr-2022q4" }
  - { date: "2023-04-20", title: "台灣電價再漲 17%", detail: "繼 2022 年下半年電價上漲 15% 後，台積電在台灣的電價自 2023-04-01 再漲 17%，預估影響第二季毛利率約 0.6 個百分點、全年約 0.5 個百分點；公司預估 2023 年營收以美元計將衰退低到中個位數百分比。", src: "tr-2023q1" }
  - { date: "2023-07-20", title: "3 奈米稀釋與伺服器 AI 處理器占比約 6%", detail: "預估 3 奈米量產將稀釋第三季毛利率 2–3 個百分點、第四季 3–4 個百分點；伺服器 AI 處理器（GPU、AI 加速器與 CPU）約占營收 6%，預估未來五年年複合成長接近 50%；公司會後更正 CoWoS 產能 2024 年將較 2023 年倍增。", src: "tr-2023q2" }
  - { date: "2023-10-19", title: "3 奈米開始貢獻營收", detail: "3 奈米在 2023 年第三季首次貢獻晶圓營收 6%（5 奈米 37%、7 奈米 16%），7 奈米及以下先進製程合計 59%。", src: "mr-2023q3" }
  - { date: "2024-01-18", title: "2024 年 3 奈米稀釋 3–4 個百分點", detail: "預估 3 奈米全年稀釋毛利率約 3–4 個百分點，下半年把部分 5 奈米機台轉為支援 3 奈米，另稀釋約 1–2 個百分點；2024 年折舊預估年增近 30%；2024 年營收以美元計預估成長低到中 20%。", src: "tr-2023q4" }
  - { date: "2024-04-18", title: "4 月 3 日地震與電價再漲 25%", detail: "4 月 3 日地震影響第二季毛利率；台灣電價自 2024-04-01 再漲 25%，預估影響第二季毛利率 0.7–0.8 個百分點、下半年 0.6–0.7 個百分點；伺服器 AI 處理器營收預估 2024 年增加一倍以上、占營收低雙位數百分比。", src: "tr-2024q1" }
  - { date: "2024-10-17", title: "伺服器 AI 處理器營收預估成長為三倍以上", detail: "公司預估伺服器 AI 處理器營收 2024 年成長為三倍以上、占營收中雙位數百分比（約 15%）；2024 年營收以美元計預估成長接近 30%；資本支出預估略高於 300 億美元。", src: "tr-2024q3" }
  - { date: "2025-01-16", title: "美國、日本新廠量產與海外廠稀釋 2–3%", detail: "亞利桑那第一座晶圓廠 2024 年第四季以 N4 製程進入量產，熊本第一座特殊製程廠 2024 年底量產；預估 2025 年海外廠稀釋毛利率 2–3 個百分點（第一季低於 1 個百分點），電價等通膨成本至少 1 個百分點，2 奈米量產準備與 5 奈米轉 3 奈米合計約 1 個百分點；2025 年資本預算 380–420 億美元，折舊預估年增高個位數百分比。", src: "tr-2024q4" }
  - { date: "2025-01-16", title: "AI 加速器占 2024 年營收接近 15%", detail: "AI 加速器（資料中心訓練與推論用的 AI GPU、AI ASIC 與 HBM 控制器）營收 2024 年成長三倍以上、占總營收接近中雙位數百分比，預估 2025 年再倍增，2024–2029 年複合成長接近 40% 中段；公司整體營收 2024–2029 年複合成長接近 20%（美元）；先進封裝與測試 2024 年占營收逾 8%。", src: "tr-2024q4" }
  - { date: "2025-04-17", title: "美國追加 1,000 億美元投資、海外廠稀釋說法", detail: "公司宣布在亞利桑那追加 1,000 億美元投資；預估海外廠在未來五年對毛利率的稀釋初期每年 2–3 個百分點、後期擴大到 3–4 個百分點；1 月 21 日地震影響第一季毛利率約 0.6 個百分點；關稅政策有不確定性，但客戶行為尚未改變；2025 年目標 CoWoS 產能再倍增。", src: "tr-2025q1" }
  - { date: "2025-07-17", title: "新台幣大幅升值", detail: "約 75% 的銷貨成本以新台幣計價；新台幣每升值 1%，新台幣營收約減少 1%、毛利率約減少 0.4 個百分點。第二季新台幣較財測假設升值約 4.4%，使毛利率減少約 1.8 個百分點；第三季財測假設 1 美元兌 29 元，預估再使毛利率減少約 2.6 個百分點。亞利桑那廠在第二季開始稀釋毛利率略高於 1 個百分點；2025 年營收以美元計預估成長約 30%。", src: "tr-2025q2" }
  - { date: "2025-10-16", title: "2025 年海外廠稀釋下修為 1–2%", detail: "因整體規模較大，預估 2025 年下半年海外廠稀釋接近 2 個百分點，全年 1–2 個百分點（先前 2–3）；2025 年資本支出收斂為 400–420 億美元；2025 年營收以美元計預估成長接近中 30%。", src: "tr-2025q3" }
  - { date: "2026-01-15", title: "2 奈米量產、2026 年稀釋 2–3%", detail: "2 奈米 2025 年第四季在新竹與高雄進入量產，預估 2026 年下半年開始稀釋毛利率、全年 2–3 個百分點；A16 與 N2P 預定 2026 年下半年量產；3 奈米毛利率預估 2026 年內越過公司平均；2026 年資本預算 520–560 億美元，折舊預估年增高雙位數百分比（約 18%）；2025 年實際資本支出 409 億美元。", src: "tr-2025q4" }
  - { date: "2026-01-15", title: "長期毛利率目標上調至 56% 以上", detail: "公司預估長期（含景氣循環）毛利率 56% 以上、股東權益報酬率高 20% 區間；訂價策略為策略性而非投機性；AI 加速器占 2025 年營收高雙位數百分比，2024–2029 年複合成長上調為 50% 中高段；整體營收 2024–2029 年複合成長接近 25%（美元）；2026 年營收以美元計預估成長接近 30%；2025 年有效稅率 16%，2026 年預估 17–18%；先進封裝 2025 年占營收略高於 10%。", src: "tr-2025q4" }
  - { date: "2026-04-16", title: "中東情勢與 3 奈米毛利率越過平均", detail: "中東情勢可能推升部分化學品與氣體價格，對獲利的影響尚無法量化；3 奈米毛利率預估在 2026 年下半年越過公司平均；2026 年資本支出預估在 520–560 億美元區間上緣；2026 年營收以美元計預估成長超過 30%；第二季因未分配盈餘加徵所得稅，稅率約 20%，全年 17–18%。", src: "tr-2026q1" }
  - { date: "2026-07-16", title: "2 奈米開始貢獻營收、資本預算上調至 600–640 億美元", detail: "2 奈米在 2026 年第二季占晶圓營收 3%；預估 2 奈米快速放量使下半年毛利率被稀釋約 3–4 個百分點；2026 年資本預算上調為 600–640 億美元；2026 年營收以美元計預估成長略高於 40%；管理報告（mr-2026q2）說明第二季業外收益含處分與評價世界先進股票利益 632.0 億元，其他營業收入含 2024 年地震保險理賠。", src: "tr-2026q2" }
  - { date: "2026-10-15", title: "第四季財測與 2027 年展望", detail: "第四季營收財測 523–543 億美元（匯率假設 31.8，毛利率 65–67%，營業利益率 56.5–58.5%），毛利率中值較第三季低 0.4 個百分點，主因 2 奈米持續放量與海外廠稀釋；2026 年海外廠稀釋接近 2 個百分點，未來幾年擴大到 3–4 個百分點；2026 年營收以美元計預估成長約 44%；資本預算維持 600–640 億美元。", src: "tr-2026q3" }
  - { date: "2026-10-15", title: "產能擴充：2 奈米產能 2027 年倍增以上", detail: "2 奈米家族年產能預估 2027 年增加一倍以上；A14 預定 2027 年風險試產、2028 年量產；台南新 3 奈米廠 2027 年上半年量產，另一座 3 奈米廠 2028 年上半年量產；亞利桑那第二座廠 2027 年第三季量產；日本第二座廠改用 3 奈米、2028 年量產；消費性與價格敏感市場受零組件漲價影響，公司對 2027 年規劃審慎；AI 加速器定義不含代理式 AI 用的 CPU。", src: "tr-2026q3" }
  - { date: "2026-11-10", title: "2026 年 10 月營收創單月新高", detail: "2026 年 10 月合併營收新台幣 5,868.9 億元，月增 14.7%、年增 59.7%，為第四季第一個月的已知數字。", src: "tsmc-monthly" }
