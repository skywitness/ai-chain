# 台積電（TSMC，2330／TSM）財報模型的輸入資料：日曆季度損益（新台幣百萬元）、美元營收與平均匯率、每季財測（營收、匯率假設、毛利率、營業利益率）、月營收與事件。格式見 src/schemas/forecast.ts（companyInputs）。
# 由 fc2-data-tsmc 整理；製程別、平台別、晶圓出貨、匯率與公司說法等驅動因子在 tsmc-drivers.yaml；模型輸出見 tsmc-model.json（由 scripts/models/tsmc.ts 產生）。
