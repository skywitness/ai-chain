periodNote: "日曆季度（第一季為 1–3 月），TIFRS 合併報表，金額單位為新台幣百萬元。2016 年第一季至 2026 年第三季的損益、每股盈餘、股數、存貨、折舊攤銷與資本支出全部取自台積電每季法說會發布的合併財務報表（fs-*，單季三個月欄位；第四季也有單季欄位，不需以全年減前三季），並以下一季與次年同季報表的比較欄逐筆交叉核對，43 季完全一致；月營收加總與季營收的差異在 3 百萬元以內。grossProfit 為營業毛利；operatingExpenses＝grossProfit－operatingIncome，即研發費用加管理及銷售費用再減去「其他營業收入及支出」淨額，使 grossProfit－operatingExpenses＝operatingIncome（與群聯、美光檔案同一口徑）；台積電自己定義的營業費用（研發加管銷，法說會的「營業費用占營收比」用這個）放在 extra.研發與管銷費用，研發費用、管銷費用、其他營業收支（正值為收入）也分列在 extra。nonOperating 為營業外收入及支出合計（含採權益法認列的關聯企業損益、利息收支與其他利益及損失），pretaxIncome＝operatingIncome＋nonOperating；netIncome 為歸屬母公司業主淨利；eps 為稀釋每股盈餘（新台幣元），sharesDiluted 為稀釋加權平均股數（百萬股），台積電沒有股票分割，1 單位 ADR＝5 股普通股。inventory 為期末存貨；depreciation 為現金流量表的折舊及攤銷；capex 為現金流量表「取得不動產、廠房及設備」的現金支出（新台幣），公司以美元公布的季度資本支出放在 tsmc-drivers.yaml 的 capex-usd。extra.所得稅費用為正值；公司在第二季認列未分配盈餘加徵所得稅，2016–2019 年與 2024–2026 年的第二季有效稅率明顯較高（17–23%，其他季度多為 10–17%）。extra.美元營收（百萬美元）與 extra.平均匯率（新台幣／美元）取自同一份財務報表：美元營收是以當季加權平均匯率換算的金額，與管理報告的「Net Revenue (US$ billions)」一致。guidance 為上一季法說會對本季的財測：2016 年第一季至 2017 年第二季公司以新台幣公布營收區間，guidance.revenue 為新台幣中值；2017 年第三季起營收改以美元公布，guidance.revenue／revenueLow／revenueHigh 是美元財測乘以公司匯率假設換算的新台幣金額（公司未給新台幣營收財測），美元原值放在 extra.財測營收美元中值／下緣／上緣（百萬美元）。guidance.grossMargin 為毛利率區間中值，區間寫在 extra.財測毛利率下緣／上緣；營業利益率財測寫在 extra.財測營益率中值／下緣／上緣；匯率假設寫在 extra.財測匯率。2026 年第四季的財測（營收 523–543 億美元、匯率 31.8、毛利率 65–67%、營業利益率 56.5–58.5%）沒有對應的已公布季度，寫在 events 2026-10-15 與 tsmc-drivers.yaml 的財測序列。各季 note 摘要管理報告對毛利率變動原因的說明（mr-*）。"
