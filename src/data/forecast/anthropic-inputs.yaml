periodNote: "會計年度與曆年相同，季度為日曆季度（2025Q1＝2025-01-01 至 2025-03-31）。Anthropic, PBC 在 2026-10-26 公開遞交 S-1，截至 2026-11-18 尚未訂價掛牌（預計在 Nasdaq 以代號 ANT 交易），沒有 10-Q，也沒有公司財測。季資料只有招股書揭露的 2025Q1–2026Q3 共 7 季，2024 年以前只有 2023、2024 年度數。數字取自公司依 2026-11-10 初步招股書（S-1/A 第 2 號）提交的自由撰寫公開說明書（FWP）：季度損益表（依性質分類）與調整後營業利益、調整後淨利的單季調節表取自 sec-fwp-eea 第 5.10–5.11 節；功能別營業費用（附註 8：銷貨成本、研發、銷售與行銷、一般及管理）、營收拆分（附註 2：用量計費與訂閱、美國與美國以外）與現金流量表取自 sec-fwp-japan 所附的 2023–2025 年度與 2025、2026 年前九個月財報，以及 2026 年上半年期中財報；單季數以「上半年減第二季」「前九個月減上半年」「全年減前九個月」推算，各季相加都與公布的累計數一致。2026-11-17 的 S-1/A 第 3 號主文件超過 10 MB，本檔未能直接讀取，無法排除其中有數字修正。金額單位為百萬美元。損益表主表依性質分類（算力與基礎設施、人事、Bartz 和解、銷售行銷與通路合作、其他營運與管理），沒有毛利一欄；本檔的 grossProfit＝營收－功能別「銷貨成本」（附註 8：幾乎全是服務客戶工作負載的算力與基礎設施成本，另含部分人事與分攤費用），operatingExpenses＝研發＋銷售與行銷＋一般及管理＋Bartz 和解（功能別），grossProfit－operatingExpenses＝operatingIncome。模型開發、研究與內部使用的算力計入研發，提供免費使用的算力計入銷售與行銷，因此毛利率遠高於「營收減全部算力費用」的比率（例如 2026Q3 毛利率 85.7%，算力與基礎設施費用卻占營收 58%）。operatingIncome 為 GAAP 營業損益；nonOperating＝利息收入＋可轉換票據、衍生負債與 SAFE 的公允價值變動＋其他收支淨額，等於 pretaxIncome－operatingIncome；netIncome 為 GAAP 淨損，主要來自可轉換票據等工具隨公司估值上升而認列的非現金公允價值變動（2026 年前九個月 943.24 億美元）。上市前沒有單季每股盈餘（年度與前九個月的每股淨損寫在 annual 與 2026Q3 的 note，基本與稀釋相同）。depreciation（折舊攤銷）、capex（購置不動產與設備）與營業活動現金流只填在可由累計數推算的季度（2025Q3、2025Q4、2026Q3），上半年合計寫在第二季的 note；公司的算力至今主要透過雲端業者的安排取得、隨算力到位付款並計入費用，所以資本支出很小，但公司預期自建資料中心與租賃會使資本支出與預付款大幅增加。extra（百萬美元）：依性質分類的五項費用、功能別四項費用、利息收入、公允價值變動、其他收支淨額、所得稅、股份基礎給付、非現金捐贈（員工捐款配捐計畫，以 N 類普通股支付）、調整後營業利益與調整後淨利（公司定義的非 GAAP 指標：營業損益加回股份基礎給付、非現金捐贈與 Bartz 和解；淨利另加回上述公允價值變動與其他金融工具公允價值變動，並扣除稅務影響）、用量計費與訂閱營收、美國與美國以外營收（依客戶帳單地址）。Stock Analysis（sa-q）的單季營收、營業損益與淨損與本檔一致，只用來交叉核對。"
