editorial:
  status: "fact-checked"
  author: "fc2-data-anthropic"
  checkedBy: "fc2-check-anthropic"
  checkedOn: "2026-11-18"
  notes: "查核（fc2-check-anthropic，2026-11-18）：以程式逐季驗算 184 項內部關係（毛利－營業費用＝營業損益、依性質與依功能合計、業外與稅前、稅後淨損、營收拆分、調整後營業利益、季度連續、各季相加＝2025 全年與 2025、2026 年前九個月），全部吻合；7 季營收、營業損益、淨損、稅前率與年度營收、營業損益、淨損、每股淨損、營業與投資與籌資現金流、資本支出、折舊攤銷、所得稅與現金及短期投資，與 Stock Analysis（sa-q）逐筆一致；並重讀 sec-fwp-eea 第 174–181、188–190 頁影像與 sec-fwp-japan 第 397、403–404、413–416、419–420、423–424、433–434、473–480、483–484 頁影像核對每個數字。修正：2025Q4、2026Q3 降價影響的說法（是抵銷季增，不是營收比前一季少）、2026Q1 其他收支淨額的說明（當季只有 Google 的票據購買協議，Amazon 協議在 4 月、超微賣權在 7 月）、信用額度截至 9 月底有 2.05 億美元備用信用狀、FT 報導中雙方是婉拒置評、G 輪「一打」客戶、創辦人 LLC 的 50.1% 投票權是上市後。未讀取 2026-11-17 的 S-1/A 第 3 號（主文件 95 MB），截至 11-18 EDGAR 仍沒有 424B4。原整理說明：單季損益表與調節表取自歐洲經濟區公開說明書 FWP 的頁面影像（第 175、178 頁），功能別費用、營收拆分與現金流量取自日本公開說明書英譯 FWP 所附財報影像（第 403–404、419、434、473、475、477、484 頁），逐季驗算：依性質五項費用相加＝總營業費用、功能別四項（含 Bartz）相加＝總營業費用、營收－總營業費用＝營業損益、營業損益＋業外＝稅前、稅前－所得稅＝淨損、用量計費＋訂閱＝營收、美國＋美國以外＝營收、調整後營業利益與淨利調節，全部吻合；各季相加與前九個月、全年公布數一致。與 src/content/financials/anthropic.json 沒有重疊的季度（該檔只有公司公告的年化營收），其年化營收數值與本檔驅動因子相同。"
