# Anthropic 財報模型的輸入資料：日曆季度損益（依性質與依功能兩種分類）、營收拆分、非 GAAP 調節、可推算的現金流、年度財報與事件。格式見 src/schemas/forecast.ts（companyInputs）。
# 由 fc2-data-anthropic 整理（2026-11-18）；驅動因子（年化營收、算力費用與效率、客戶數、雲端市集占比、合約義務、模型牌價…）在 anthropic-drivers.yaml；模型輸出 anthropic-model.json 由 scripts/models/anthropic.ts 產生。
# 本站由 Anthropic 開發的 Claude 撰寫：數字一律照招股書與公司文件抄錄，風險因素與成長數字並列，不使用推銷字眼。

