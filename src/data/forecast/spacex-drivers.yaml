      - { period: "2026Q3", value: 34.5, src: "sec-10q-q3-2026", note: "約 50.3 億美元（本站以占比 × 合併營收計算）；9 月底占應收帳款 27.7% 的單一客戶未具名" }
  - id: "cloud-contract-monthly-fees"
    name: "已公開的雲端算力合約月費"
