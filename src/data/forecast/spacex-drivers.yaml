editorial:
  status: "fact-checked"
  author: "fc2-data-spacex"
  checkedBy: "fc2-check-spacex"
  checkedOn: "2026-11-17"
  notes: "營運指標取自招股書與兩份財報新聞稿的部門營運資料表，2025Q4 以全年減前九個月推算；Starship 季度次數依維基百科飛行日期歸季，與公司總發射次數減 Falcon 次數一致。財測與目標取自法說會講稿原文；執行長的口頭目標（2027 年 13 GW、每瓦 30–50 美元）不是正式財測，已在 note 註明。查核（fc2-check-spacex，2026-11-17）：發射、酬載、用戶、ARPU、算力、資本支出、未完成合約、客戶占比與財測逐點比對招股書與第三季 8-K 的 EDGAR Online 表格擷取、兩份 10-Q、SEC XBRL 與兩份法說會講稿，全部吻合；Falcon 與 Starship 季度次數改引 10-Q 直接揭露的數字；Google 合約改引一手 FWP；2026Q4 毛利率改標推算；刪去無法以第二來源核對的 Colossus 規模與回收助推器次數。"
