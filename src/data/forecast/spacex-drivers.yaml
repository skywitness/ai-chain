    frequency: "month"
    definition: "公開條款可查的雲端服務合約（Cloud Services Agreements）每月固定費用合計，依合約起始月份列示。只含 Anthropic（每月 12.5 億美元，2026 年 5、6 月爬坡期間費用較低，至 2029 年 5 月；最初三個月後任一方可提前 90 天通知終止）與 Google（每月 9.2 億美元，2026 年 10 月至 2029 年 6 月；2026 年底後任一方可提前 90 天通知終止）；不含第三季初新簽、為期六個月、合計 67 億美元的合約（10 月起爬坡）及第三季的其他新約（客戶未具名）。第二季新簽合約的不可取消期間金額合計 141 億美元（pr-q2-2026）。"
    points:
