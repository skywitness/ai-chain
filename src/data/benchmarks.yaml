# 評測定義。models 的 benchmarks[].benchmark 只能使用這裡的 id。
benchmarks:
  - { id: aa-intelligence-index, name: "Artificial Analysis Intelligence Index", zh: "AA 綜合智慧指數", measures: "多項評測加權的綜合能力指數", scale: "0–100", higherIsBetter: true, url: "https://artificialanalysis.ai/" }
  - { id: lmarena-text, name: "LMArena Text Arena (Elo)", zh: "LMArena 文字競技場", measures: "人類盲測偏好投票的 Elo 分數", scale: "Elo", higherIsBetter: true, url: "https://lmarena.ai/leaderboard" }
  - { id: mmlu-pro, name: "MMLU-Pro", zh: "MMLU-Pro 多領域知識", measures: "14 個學科的多選題知識與推理", scale: "% 正確率", higherIsBetter: true, url: "https://github.com/TIGER-AI-Lab/MMLU-Pro" }
  - { id: gpqa-diamond, name: "GPQA Diamond", zh: "GPQA 研究所程度科學問答", measures: "博士級物理、化學、生物難題", scale: "% 正確率", higherIsBetter: true, url: "https://arxiv.org/abs/2311.12022" }
  - { id: hle, name: "Humanity's Last Exam", zh: "人類最後的考試（HLE）", measures: "跨領域極難專家題目", scale: "% 正確率", higherIsBetter: true, url: "https://lastexam.ai/" }
  - { id: swe-bench-verified, name: "SWE-bench Verified", zh: "SWE-bench Verified 軟體工程", measures: "修復真實 GitHub 專案問題", scale: "% 解決率", higherIsBetter: true, url: "https://www.swebench.com/" }
  - { id: swe-bench-pro, name: "SWE-bench Pro", zh: "SWE-bench Pro 軟體工程（進階）", measures: "較難、較長的真實軟體工程任務", scale: "% 解決率", higherIsBetter: true, url: "https://scale.com/leaderboard/swe_bench_pro_public" }
  - { id: terminal-bench, name: "Terminal-Bench", zh: "Terminal-Bench 終端機任務", measures: "在終端機環境完成多步驟任務", scale: "% 成功率", higherIsBetter: true, url: "https://www.tbench.ai/" }
  - { id: livecodebench, name: "LiveCodeBench", zh: "LiveCodeBench 程式競賽", measures: "持續更新的程式競賽題（降低汙染）", scale: "% pass@1", higherIsBetter: true, url: "https://livecodebench.github.io/" }
  - { id: aime-2025, name: "AIME 2025", zh: "AIME 2025 數學競賽", measures: "美國數學邀請賽題目", scale: "% 正確率", higherIsBetter: true, url: "https://artofproblemsolving.com/wiki/index.php/2025_AIME_I" }
  - { id: arc-agi-2, name: "ARC-AGI-2", zh: "ARC-AGI-2 抽象推理", measures: "新穎視覺抽象推理謎題", scale: "% 正確率", higherIsBetter: true, url: "https://arcprize.org/arc-agi/2/" }
  - { id: mmmu, name: "MMMU", zh: "MMMU 多模態理解", measures: "大學程度圖文多模態題目", scale: "% 正確率", higherIsBetter: true, url: "https://mmmu-benchmark.github.io/" }
  - { id: tau2-bench, name: "tau2-bench", zh: "τ²-bench 工具使用與客服 Agent", measures: "模擬客服情境中的工具呼叫與對話", scale: "% 成功率", higherIsBetter: true, url: "https://github.com/sierra-research/tau2-bench" }
  - { id: osworld, name: "OSWorld", zh: "OSWorld 電腦操作", measures: "在真實作業系統中操作電腦完成任務", scale: "% 成功率", higherIsBetter: true, url: "https://os-world.github.io/" }
  - { id: metr-time-horizon, name: "METR 50% Time Horizon", zh: "METR 任務時間跨度", measures: "模型有 50% 機率完成的人類任務時長", scale: "分鐘", higherIsBetter: true, url: "https://metr.org/" }
  - { id: tmmluplus, name: "TMMLU+", zh: "TMMLU+ 繁中多領域", measures: "台灣繁體中文多學科知識題", scale: "% 正確率", higherIsBetter: true, url: "https://huggingface.co/datasets/ikala/tmmluplus" }
  - { id: aa-text-to-image-elo, name: "Artificial Analysis Text-to-Image Arena", zh: "AA 文生圖競技場", measures: "圖像生成人類偏好 Elo", scale: "Elo", higherIsBetter: true, url: "https://artificialanalysis.ai/text-to-image" }
  - { id: aa-text-to-video-elo, name: "Artificial Analysis Text-to-Video Arena", zh: "AA 文生影片競技場", measures: "影片生成人類偏好 Elo", scale: "Elo", higherIsBetter: true, url: "https://artificialanalysis.ai/text-to-video" }
