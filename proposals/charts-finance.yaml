# Proposals from the charts-finance agent (2026-10-07). None block the build; all work-arounds are in place.
proposals:
  - id: npm-script-fx
    kind: frozen-file-change
    file: package.json
    change: add `"fx": "tsx scripts/fetch-fx.ts"` to "scripts"
    why: >
      architecture.md §1 and §6.1 say src/data/fx/usd-rates.json is generated by `npm run fx`, but package.json has no
      `fx` script. Meanwhile run `npx tsx scripts/fetch-fx.ts` (optionally `--from 2021-01 --to 2026-09`).
  - id: tsconfig-ts6-baseurl
    kind: frozen-file-change
    file: tsconfig.json
    change: add `"ignoreDeprecations": "6.0"` to compilerOptions (or drop `baseUrl`; `paths` resolve relative to tsconfig.json without it)
    why: >
      With typescript ~6.0.3, `npx tsc --noEmit -p tsconfig.json` stops immediately with TS5101 ("Option 'baseUrl' is
      deprecated"), so no file is type-checked. `astro check` is unaffected. Work-around used by this agent:
      research/tmp/charts-finance/tsconfig.check.json (extends the root config with ignoreDeprecations).
  - id: heatmap-diverging-hues
    kind: note
    why: >
      The Taiwan monthly-revenue Heatmap uses --chart-1 (blue, growth) and --chart-2 (orange, decline) for its
      diverging scale instead of --c-pos/--c-neg. Validated with the dataviz palette checker: --c-pos/--c-neg
      (green/red) separate by only ΔE 6.5 (light) and 3.0 (dark) under deuteranopia, which fails for a colour-only
      encoding. The poles are themable per chart via --ch-div-up / --ch-div-down on .ch if the design system prefers
      other tokens.
